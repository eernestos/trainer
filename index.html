<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер Системного Аналитика</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1c1e21;
            --accent-color: #0052cc;
            --secondary-text: #65676b;
            --btn-bg: #e4e6eb;
            --btn-text: #050505;
            --border-color: #e2e8f0;
            --card-back-border: #0052cc;
            --textarea-bg: #f0f2f5;
            --search-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-color: #e4e6eb;
            --accent-color: #4589ff;
            --secondary-text: #b0b3b8;
            --btn-bg: #3a3b3c;
            --btn-text: #e4e6eb;
            --border-color: #3e4042;
            --card-back-border: #4589ff;
            --textarea-bg: #1c1e21;
            --search-bg: #242526;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent-color);
        }

        .theme-toggle {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            transition: all 0.2s;
        }

        /* ПОИСК */
        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--search-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 2px 12px rgba(0, 82, 204, 0.15);
        }

        .filters {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        .utils {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 10px;
        }

        .progress {
            font-size: 13px;
            color: var(--secondary-text);
        }

        .stress-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stress-btn.active {
            background-color: #ff3b30;
            color: white;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
        }

        .card-container {
            width: 100%;
            max-width: 700px;
            height: 520px;
            perspective: 1500px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            border-radius: 20px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        /* КНОПКА ИЗБРАННОГО НА КАРТОЧКЕ */
        .favorite-icon {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 22px;
            color: var(--secondary-text);
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            z-index: 10;
            user-select: none;
        }

        .favorite-icon.is-fav {
            color: #ffcc00;
            transform: scale(1.15);
        }

        .card-front {
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            overflow-y: auto;
        }

        .card-front::after {
            content: "Кликните или нажмите Пробел, чтобы посмотреть ответ";
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 80%;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
            border-top: 5px solid var(--card-back-border);
            justify-content: space-between;
        }

        .answer-scroll-area {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .card-back h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 17px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card-back b { color: var(--text-color); }

        .notes-container {
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .notes-textarea {
            width: 100%;
            height: 55px;
            background-color: var(--textarea-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            box-sizing: border-box;
            resize: none;
            transition: border-color 0.2s;
        }

        .notes-textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .notes-btn {
            align-self: flex-end;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .notes-btn:active { transform: scale(0.95); }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }

        .nav-btn {
            flex: 1;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active { transform: scale(0.97); }
        .nav-btn:disabled { background-color: var(--btn-bg); color: var(--secondary-text); cursor: not-allowed; }

        @media (max-height: 700px) {
            .card-container { height: 420px; }
            .card-front { font-size: 17px; }
            .notes-textarea { height: 45px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Тренажер Аналитика</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Темная</button>
    </div>

    <div class="search-container">
        <input type="text" id="search-bar" class="search-input" placeholder="🔍 Живой поиск по ключевым словам (например: Kafka, REST, ФТ)..." oninput="handleSearch()">
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCategory('all', this)">Все</button>
        <button class="filter-btn" onclick="filterCategory('requirements', this)">Требования</button>
        <button class="filter-btn" onclick="filterCategory('modeling', this)">Моделирование</button>
        <button class="filter-btn" onclick="filterCategory('integrations', this)">Интеграции</button>
        <button class="filter-btn" onclick="filterCategory('favorites', this)" style="border: 1px solid #ffcc00;">⭐ Избранное</button>
    </div>

    <div class="utils">
        <div class="progress" id="progress">Загрузка...</div>
        <button class="stress-btn" id="stress-btn" onclick="toggleStressMode()">⚡ Стресс-тест [S]</button>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="favorite-icon" id="fav-icon-front" onclick="toggleFavorite(event)">➔ ★</div>
                <div id="question-text">Загрузка...</div>
            </div>
            <div class="card-face card-back">
                <div class="favorite-icon" id="fav-icon-back" onclick="toggleFavorite(event)">➔ ★</div>
                <div class="answer-scroll-area" id="answer-text">Загрузка...</div>
                <div class="notes-container" onclick="preventFlip(event)">
                    <textarea class="notes-textarea" id="card-notes" placeholder="Добавьте свои заметки или вопросы по теме здесь..."></textarea>
                    <button class="notes-btn" onclick="saveNote()">Сохранить заметку</button>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="nav-btn" id="prev-btn" onclick="prevCard(event)" disabled>Назад [←]</button>
        <button class="nav-btn" id="next-btn" onclick="nextCard(event)">Вперед [→]</button>
    </div>

    <script>
       const originalCards = [
    // ==========================================
    // БЛОК 1. ТРЕБОВАНИЯ
    // ==========================================
    {
        id: "q1",
        category: "requirements",
        question: "1. Кто такие стейкхолдеры? Кто является стейкхолдерами для тебя? С какими группами заинтересованных лиц общался?",
        answer: "<h3>Стейкхолдеры (Заинтересованные лица)</h3><b>Кто это:</b> Лица, группы или организации, которые могут влиять на проект или на которых влияет сам проект.<br><b>Для меня стейкхолдеры:</b> Бизнес-заказчики, конечные пользователи, PM, архитекторы, разработчики, QA, ИБ и юристы.<br><b>Опыт общения:</b> На практике общался с <i>Бизнес-заказчиками</i> (выявление потребностей, интервью), <i>Разработчиками</i> (обсуждение технической реализации) и <i>Тестировщиками</i> (передача требований, разбор сценариев)."
    },
    {
        id: "q2",
        category: "requirements",
        question: "2. Какие виды требований знаешь? Можешь привести примеры? С какими видами работаешь?",
        answer: "<h3>Виды требований (по BABOK)</h3><b>1. Бизнес-требования:</b> Цели бизнеса (<i>Пример: Увеличить продажи на 20%</i>).<br><b>2. Требования стейкхолдеров:</b> Потребности пользователей (<i>Пример: Выгружать отчет в Excel</i>).<br><b>3. Системные требования:</b> Функциональные (что делает система) и Нефункциональные (свойства системы).<br><b>4. Транзитные:</b> Временные требования для запуска (миграция данных).<br><b>С чем работаю:</b> Перевожу пользовательские требования на язык системных ФТ и НФТ."
    },
    {
        id: "q3",
        category: "requirements",
        question: "3. Что входит в функциональные требования? Приведи примеры.",
        answer: "<h3>Functional Requirements</h3>Описывают поведение системы — её функции, действия и то, как она должна реагировать на входные данные.<br><br><b>Что входит:</b> Описание бизнес-логики, алгоритмы расчетов, сценарии авторизации, правила валидации полей, структура отчетов.<br><b>Примеры:</b><br>• Система должна отправлять email с подтверждением бронирования в течение 1 минуты после оплаты.<br>• При вводе неверного пароля более 3 раз система должна блокировать учетную запись на 15 минут."
    },
    {
        id: "q4",
        category: "requirements",
        question: "4. Что входит в нефункциональные требования? Приведи примеры.",
        answer: "<h3>Non-Functional Requirements</h3>Описывают ограничения, системные характеристики, требования к качеству и окружению системы.<br><br><b>Что входит:</b> Производительность (время отклика), надежность, безопасность (шифрование), юзабилити, масштабируемость.<br><b>Примеры:</b><br>• Время отклика главной страницы сайта при нагрузке 1000 запросов в секунду не должно превышать 1.5 секунды.<br>• Пароли пользователей должны храниться в базе данных в зашифрованном виде с использованием алгоритма BCrypt."
    },
    {
        id: "q5",
        category: "requirements",
        question: "5. В чём отличие функциональных и нефункциональных требований?",
        answer: "<h3>ФТ vs НФТ</h3><b>Главное отличие:</b> Функциональные требования отвечают на вопрос <b>«ЧТО система должна делать?»</b> (конкретная фича, кнопка, функция). Нефункциональные отвечают на вопрос <b>«КАК система должна это делать?»</b> (с какой скоростью, насколько безопасно, стабильно и удобно). Если убрать ФТ, пользователь не сможет выполнить задачу. Если не соблюдать НФТ, функция будет работать слишком медленно или небезопасно."
    },
    {
        id: "q6",
        category: "requirements",
        question: "6. Какая классификация нефункциональных требований? Какие нефункциональные требования описываешь на практике?",
        answer: "<h3>Классификация и практика НФТ</h3>По стандарту ISO 25010 они делятся на: Эффективность производительности (Performance), Надежность (Reliability), Безопасность (Security), Удобство использования (Usability), Совместимость, Сопровождаемость и Переносимость.<br><br><b>На практике я описываю:</b> 1) <i>Производительность</i> (время отклика API); 2) <i>Безопасность</i> (ролевая модель доступа, маскирование персональных данных); 3) <i>Доступность</i> (Uptime системы, например, 99.9%)."
    },
    {
        id: "q7",
        category: "requirements",
        question: "7. Что такое транзитные (переходные) требования?",
        answer: "<h3>Транзитные требования (Transition Requirements)</h3>Это <b>временные</b> требования, необходимые для успешного перевода бизнеса и системы из текущего состояния (As Is) в целевое состояние (To Be). Они теряют актуальность сразу после того, как проект запущен в промышленную эксплуатацию.<br><br><b>Примеры:</b><br>• Написать скрипт для переноса 50 000 учетных записей из старой СУБД в новую базу.<br>• Провести двухдневный тренинг по работе с новым интерфейсом для 15 операторов колл-центра."
    },
    {
        id: "q8",
        category: "requirements",
        question: "8. Какие есть способы (методы) сбора требований? Какие используешь на практике?",
        answer: "<h3>Способы сбора требований</h3><b>Все методы:</b> Интервью, Анкетирование, Воркшопы, Мозговой штурм, Наблюдение (Shadowing), Анализ документации, Анализ интерфейсов конкурентов, Прототипирование, Обратный инжиниринг.<br><br><b>На практике использую:</b> 1) <i>Интервью</i> с ключевыми стейкхолдерами; 2) <i>Анализ нормативных документов</i> или логов текущей системы; 3) <i>Прототипирование</i> (наброски экранов в Figma) для быстрого сбора обратной связи."
    },
    {
        id: "q9",
        category: "requirements",
        question: "9. В каких документах описываются требования? Какие способы описания требований знаешь?",
        answer: "<h3>Документирование требований</h3><b>Основные документы:</b> BRD (Business Requirements Document), PRD (Product Requirements Document), SRS (Software Requirements Specification), ТЗ по ГОСТ (34 или 19), Постановки (задачи) в Jira/Confluence.<br><br><b>Способы описания:</b> Текстовый (естественный язык), Пользовательские истории (User Story), Сценарии использования (Use Case), Таблицы принятия решений, Графические модели и диаграммы (UML, BPMN)."
    },
    {
        id: "q10",
        category: "requirements",
        question: "10. Что такое User story? Можешь привести пример? Применяешь ли на практике?",
        answer: "<h3>User Story (Пользовательская история)</h3>Формат краткого описания фичи со стороны конечного пользователя, ориентированный на бизнес-ценность.<br><b>Шаблон:</b> Как [Роль], я хочу [Действие], чтобы [Ценность].<br><br><b>Пример:</b> <i>Как курьер, я хочу видеть карту с маршрутом в приложении, чтобы доставить заказ вовремя и не заблудиться.</i><br><b>На практике:</b> Активно использую в командах, работающих по гибким методологиям (Scrum), для наполнения бэклога продукта."
    },
    {
        id: "q11",
        category: "requirements",
        question: "11. Какие преимущества использования User story?",
        answer: "<h3>Преимущества User Story</h3>• <b>Фокус на ценности:</b> Блок 'чтобы' заставляет команду думать о реальной пользе фичи, а не просто о написании кода.<br>• <b>Понятность:</b> Написаны простым языком, поэтому служат отличным мостом коммуникации между бизнесом и разработкой.<br>• <b>Гибкость:</b> Не перегружены деталями на раннем этапе, их легко обсуждать, оценивать, передвигать по приоритетам и декомпозировать на задачи."
    },
    {
        id: "q12",
        category: "requirements",
        question: "12. Как понять, что User story написана хорошо? Можешь привести пример?",
        answer: "<h3>Критерии качества User Story</h3>История хорошая, если она соответствует критериям <b>INVEST</b>:<br><b>I</b>ndependent (независимая), <b>N</b>egotiable (обсуждаемая), <b>V</b>aluable (ценная), <b>E</b>stimable (оцениваемая), <b>S</b>mall (компактная), <b>T</b>estable (тестируемая).<br><br>У хорошей истории всегда есть **Acceptance Criteria (Критерии приемки)**. <br><i>Пример критерия:</i> 'Если баланс пользователя отрицательный, кнопка Перевести должна быть заблокирована, а под ней отображаться подсказка'."
    },
    {
        id: "q13",
        category: "requirements",
        question: "13. Что такое Use cases? Как они описываются (с примером)? Применяешь ли на практике?",
        answer: "<h3>Use Case (Сценарий использования)</h3>Детальное пошаговое описание взаимодействия Актера (пользователя или внешней системы) со всей системой для достижения конкретной цели.<br><br><b>Как описывается:</b> Задается Название, Актеры, Предусловия, Основной сценарий (успешный путь по шагам), Альтернативные сценарии (разветвления) и Постусловия.<br><b>Пример:</b> 1. Пользователь вводит номер карты. 2. Система проверяет банк. 3. Пользователь вводит сумму. 4. Система списывает средства. (Альтернатива 3а: Сумма превышает лимит -> Ошибка)."
    },
    {

        answer: "<h3>Использование POST для чтения</h3>Да, технически и архитектурно это возможно и иногда **необходимо**.<br><br><b>Когда стоит использовать POST для получения данных:</b><br>1. <i>Сложные фильтры:</i> Когда параметров фильтрации так много (и они сильно вложенные), что они превышают лимит длины строки URL для метода GET (около 2-8 Кб).<br>2. <i>Безопасность/Конфиденциальность:</i> Когда в параметрах запроса передаются чувствительные данные (например, ПДн, пароли, номера карт). Параметры `GET` логируются провайдерами и веб-серверами, а тело `POST` внутри HTTPS полностью зашифровано."
    },
    {
        id: "q63",
        category: "integrations",
        question: "31. У каких HTTP-методов есть тело запроса (body)? Можно ли реализовать POST-запрос без тела? Можно ли реализовать GET-запрос с телом?",
        answer: "<h3>Тело запроса (Body) в методах</h3>• Тело запроса по спецификации **есть и активно используется** в `POST`, `PUT`, `PATCH`. В `GET`, `DELETE`, `OPTIONS` тела быть не должно.<br>• <b>POST без тела:</b> Можно реализовать (например, триггер команды `POST /api/v1/system/restart`). Это не нарушает спецификацию.<br>• <b>GET с телом:</b> Технически передать можно, но спецификация HTTP этого **не рекомендует**. Большинство прокси-серверов, шлюзов и веб-серверов (Nginx, старые версии) просто проигнорируют или отрежут тело из GET-запроса, что приведет к багам."
    },
    {
        id: "q64",
        category: "integrations",
        question: "32. В каких случаях лучше передавать данные в теле запроса (body), а не в query-параметрах?",
        answer: "<h3>Body vs Query параметры</h3>Передавать данные в теле (`Body`) лучше в следующих сценариях:<br>1. <b>Объем данных:</b> Передается сложная структура данных, иерархический массив или бинарный файл (картинка, PDF), которые невозможно лаконично уложить в плоскую строку `key=value`.<br>2. <b>Защита данных:</b> Данные содержат коммерческую тайну или персональные данные (пароли, сессии). URL пишется в логи браузера и серверов, тело — нет.<br>3. <b>Семантика метода:</b> Вы изменяете/создаете ресурс методами POST/PUT/PATCH, для которых тело является стандартным контейнером данных."
    },
    {
        id: "q65",
        category: "integrations",
        question: "33. Что такое идемпотентность? Почему это важно?",
        answer: "<h3>Идемпотентность в API</h3><b>Идемпотентность</b> — свойство метода API, при котором **повторение одного и того же запроса несколько раз подряд приводит к тому же результату**, что и при одном вызове (состояние системы на сервере меняется только единожды).<br><br><b>Почему это важно:</b> Для стабильности при сбоях сети. Если мобильное приложение списало деньги за заказ, но из-за обрыва связи не получило ответ от сервера, оно может безопасно повторить запрос, зная, что метод идемпотентен и повторного списания денег не произойдет."
    },
    {
        id: "q66",
        category: "integrations",
        question: "34. DELETE — идемпотентный метод?",
        answer: "<h3>Идемпотентность метода DELETE</h3>Да, метод `DELETE` по спецификации HTTP **является идемпотентным**.<br><br>При первом вызове `DELETE /users/42` ресурс удаляется с сервера (состояние изменилось). При втором и последующих вызовах этого же запроса сервер ничего не удалит (так как юзера уже нет). Состояние сервера после 2-го и 10-го вызова идентично состоянию после 1-го вызова. <br><i>Обрати внимание:</i> При этом HTTP-код ответа может отличаться (первый раз `200 OK` или `204 No Content`, а затем `404 Not Found`), но на идемпотентность влияет именно неизменность состояния сервера."
    },
    {
        id: "q67",
        category: "integrations",
        question: "35. Как сделать POST идемпотентным?",
        answer: "<h3>Делаем POST идемпотентным</h3>Сам по себе `POST` неидемпотентен, но его можно сделать таковым на уровне прикладной логики с помощью паттерна **Идемпотентного ключа (Idempotency Key)**.<br><br>Клиент перед отправкой генерирует уникальный UUID запроса и передает его в заголовках (например, `Idempotency-Key: d3b07384...`). Сервер при получении запроса проверяет, выполнялся ли уже ключ с таким UUID. Если да — сервер не выполняет бизнес-логику заново, а мгновенно возвращает кэшированный ответ из базы, который был сгенерирован при первом вызове."
    },
    {
        id: "q68",
        category: "integrations",
        question: "36. Что такое ключи идемпотентности (idempotency key)? Как они работают и как их использовать в API?",
        answer: "<h3>Работа Idempotency Key</h3><b>Как это устроено под капотом (алгоритм для ТЗ):</b><br>1. Клиент генерирует `Idempotency-Key` (UUID) и шлет его в заголовке `POST`-запроса.<br>2. Бэкенд получает запрос и идет в быструю базу (Redis), проверяя наличие ключа.<br>3. <i>Если ключа нет:</i> Бэкенд берет ключ в работу, ставит ему статус 'In Progress', выполняет транзакцию создания, сохраняет итоговый ответ в Redis со временем жизни (TTL, например, 24 часа) и возвращает ответ клиенту.<br>4. <i>Если ключ найден:</i> Бэкенд берет готовый ответ из Redis и сразу отдает клиенту."
    },
    {
        id: "q69",
        category: "integrations",
        question: "37. Что такое кэширование? Зачем это использовать? Где реализуется — на стороне клиента или сервера?",
        answer: "<h3>Кэширование данных</h3><b>Кэширование</b> — сохранение копии данных во временном быстром хранилище для быстрого доступа при повторных запросах.<br><b>Зачем:</b> Разгружает базу данных, экономит трафик, ускоряет время отклика (Latency) для пользователя.<br><b>Где реализуется:</b> На обеих сторонах:<br>• <i>На стороне клиента (браузера):</i> Браузер сохраняет картинки или тяжелые GET-ответы локально, руководствуясь заголовком `Cache-Control`.<br>• <i>На стороне сервера:</i> Бэкенд кэширует частые запросы в Redis/Memcached, чтобы не дергать тяжелую реляционную БД (PostgreSQL) каждую секунду."
    },
    {
        id: "q70",
        category: "integrations",
        question: "38. Знаешь ли, что такое проксирование?",
        answer: "<h3>Проксирование (Proxying)</h3>Процесс, при котором промежуточный сервер (прокси-сервер) выступает в роли посредника между клиентом и целевым сервером.<br><br>Бывает двух видов:<br>• <b>Forward Proxy (Прямой прокси):</b> Защищает и маскирует клиента. Клиент обращается к прокси, а тот запрашивает сайты в интернете от своего имени (используется для обхода блокировок, фильтрации трафика в офисах).<br>• <b>Reverse Proxy (Обратный прокси):</b> Защищает сервер. Стоит перед бэкендом (например, `Nginx`). Принимает запросы из интернета и распределяет их по внутренним серверам приложения, занимаясь балансировкой, кэшированием и SSL-терминацией."
    },
    {
        id: "q71",
        category: "integrations",
        question: "39. Что такое версионирование? Как обеспечить обратную совместимость? В каком случае создаётся новая версия API?",
        answer: "<h3>Версионирование API</h3>• <b>Что это:</b> Управление изменениями в контрактах API (например, через URL: `/api/v1/` и `/api/v2/`).<br>• <b>Обратная совместимость:</b> Свойство, когда обновление бэкенда не ломает старых клиентов (например, мобильные приложения, которые пользователи еще не обновили). Достигается за счет того, что старые поля не удаляются, а новые добавляются как необязательные.<br>• <b>Когда создается новая версия (v2):</b> Когда происходят **мажорные ломающие изменения (Breaking Changes)**: удаление обязательных полей, изменение типов данных (было число, стала строка), радикальное изменение бизнес-логики эндпоинта."
    },

        answer: "<h3>Спецификация OpenAPI и Swagger</h3>• <b>OpenAPI:</b> Единый промышленный стандарт (спецификация, формат) для описания REST API в файлах JSON или YAML.<br>• <b>Swagger:</b> Набор инструментов вокруг OpenAPI. Включает `Swagger UI` (интерактивная веб-страница, где можно увидеть эндпоинты и выполнить тестовый запрос), `Swagger Editor`.<br>• <b>Опыт проектирования:</b> На практике проектирую API методом *Design-First*, описывая контракты методов, параметры, схемы запросов/ответов и коды ошибок в Swagger Editor в формате YAML, после чего отдаю файл разработчикам."

    "answer": "1. Файловый обмен (File Transfer): обмен CSV, XML, JSON через FTP/SFTP для пакетной обработки. 2. Общая БД (Shared Database): прямая работа нескольких приложений с одной БД (минус: сильная связанность). 3. Удаленный вызов процедур (RPC/gRPC): синхронный вызов методов на удаленном сервере с бинарной сериализацией. 4. API (REST/SOAP): взаимодействие на основе веб-служб по протоколу HTTP. 5. Обмен сообщениями (Messaging): асинхронное взаимодействие через брокеры (RabbitMQ, Kafka) для обеспечения слабой связанности."
