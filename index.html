<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер Системного Аналитика</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1c1e21;
            --accent-color: #0052cc;
            --secondary-text: #65676b;
            --btn-bg: #e4e6eb;
            --btn-text: #050505;
            --border-color: #e2e8f0;
            --card-back-border: #0052cc;
            --textarea-bg: #f0f2f5;
            --search-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-color: #e4e6eb;
            --accent-color: #4589ff;
            --secondary-text: #b0b3b8;
            --btn-bg: #3a3b3c;
            --btn-text: #e4e6eb;
            --border-color: #3e4042;
            --card-back-border: #4589ff;
            --textarea-bg: #1c1e21;
            --search-bg: #242526;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent-color);
        }

        .theme-toggle {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            transition: all 0.2s;
        }

        /* ПОИСК */
        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--search-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 2px 12px rgba(0, 82, 204, 0.15);
        }

        .filters {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        .utils {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 10px;
        }

        .progress {
            font-size: 13px;
            color: var(--secondary-text);
        }

        .stress-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stress-btn.active {
            background-color: #ff3b30;
            color: white;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
        }

        .card-container {
            width: 100%;
            max-width: 700px;
            height: 520px;
            perspective: 1500px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            border-radius: 20px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        /* КНОПКА ИЗБРАННОГО НА КАРТОЧКЕ */
        .favorite-icon {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 22px;
            color: var(--secondary-text);
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            z-index: 10;
            user-select: none;
        }

        .favorite-icon.is-fav {
            color: #ffcc00;
            transform: scale(1.15);
        }

        .card-front {
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            overflow-y: auto;
        }

        .card-front::after {
            content: "Кликните или нажмите Пробел, чтобы посмотреть ответ";
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 80%;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
            border-top: 5px solid var(--card-back-border);
            justify-content: space-between;
        }

        .answer-scroll-area {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .card-back h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 17px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card-back b { color: var(--text-color); }

        .notes-container {
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .notes-textarea {
            width: 100%;
            height: 55px;
            background-color: var(--textarea-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            box-sizing: border-box;
            resize: none;
            transition: border-color 0.2s;
        }

        .notes-textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .notes-btn {
            align-self: flex-end;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .notes-btn:active { transform: scale(0.95); }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }

        .nav-btn {
            flex: 1;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active { transform: scale(0.97); }
        .nav-btn:disabled { background-color: var(--btn-bg); color: var(--secondary-text); cursor: not-allowed; }

        @media (max-height: 700px) {
            .card-container { height: 420px; }
            .card-front { font-size: 17px; }
            .notes-textarea { height: 45px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Тренажер Аналитика</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Темная</button>
    </div>

    <div class="search-container">
        <input type="text" id="search-bar" class="search-input" placeholder="🔍 Живой поиск по ключевым словам (например: Kafka, REST, ФТ)..." oninput="handleSearch()">
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCategory('all', this)">Все</button>
        <button class="filter-btn" onclick="filterCategory('requirements', this)">Требования</button>
        <button class="filter-btn" onclick="filterCategory('modeling', this)">Моделирование</button>
        <button class="filter-btn" onclick="filterCategory('integrations', this)">Интеграции</button>
        <button class="filter-btn" onclick="filterCategory('favorites', this)" style="border: 1px solid #ffcc00;">⭐ Избранное</button>
    </div>

    <div class="utils">
        <div class="progress" id="progress">Загрузка...</div>
        <button class="stress-btn" id="stress-btn" onclick="toggleStressMode()">⚡ Стресс-тест [S]</button>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="favorite-icon" id="fav-icon-front" onclick="toggleFavorite(event)">➔ ★</div>
                <div id="question-text">Загрузка...</div>
            </div>
            <div class="card-face card-back">
                <div class="favorite-icon" id="fav-icon-back" onclick="toggleFavorite(event)">➔ ★</div>
                <div class="answer-scroll-area" id="answer-text">Загрузка...</div>
                <div class="notes-container" onclick="preventFlip(event)">
                    <textarea class="notes-textarea" id="card-notes" placeholder="Добавьте свои заметки или вопросы по теме здесь..."></textarea>
                    <button class="notes-btn" onclick="saveNote()">Сохранить заметку</button>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="nav-btn" id="prev-btn" onclick="prevCard(event)" disabled>Назад [←]</button>
        <button class="nav-btn" id="next-btn" onclick="nextCard(event)">Вперед [→]</button>
    </div>

    <script>
        const originalCards = [
            // ТРЕБОВАНИЯ
            {
                id: "q1",
                category: "requirements",
                question: "1. Кто такие стейкхолдеры? Кто является стейкхолдерами для тебя? С какими группами заинтересованных лиц общался?",
                answer: "<h3>Стейкхолдеры (Заинтересованные лица)</h3><b>Кто это:</b> Лица, группы или организации, которые могут влиять на проект или на которых влияет сам проект.<br><b>Для меня стейкхолдеры:</b> Бизнес-заказчики, конечные пользователи, PM, архитекторы, разработчики, QA, ИБ и юристы.<br><b>Опыт общения:</b> На практике общался с <i>Бизнес-заказчиками</i> (выявление потребностей, интервью), <i>Разработчиками</i> (обсуждение технической реализации) и <i>Тестировщиками</i> (передача требований, разбор неоднозначных сценариев)."
            },
            {
                id: "q2",
                category: "requirements",
                question: "2. Какие виды требований знаешь? Можешь привести примеры? С какими видами работаешь?",
                answer: "<h3>Виды требований (по BABOK)</h3><b>1. Бизнес-требования:</b> Цели бизнеса (<i>Пример: Увеличить продажи на 20% за счет мобильного приложения</i>).<br><b>2. Требования стейкхолдеров:</b> Потребности пользователей (<i>Пример: Бухгалтер хочет выгружать отчет в Excel</i>).<br><b>3. Системные требования:</b> Функциональные (что делает система) и Нефункциональные (свойства системы).<br><b>4. Транзитные:</b> Временные требования для запуска (миграция данных).<br><b>С чем работаю:</b> На практике чаще всего перевожу пользовательские требования на язык системных ФТ и НФТ."
            },
            {
                id: "q3",
                category: "requirements",
                question: "3. Что входит в функциональные требования? Приведи примеры.",
                answer: "<h3>Functional Requirements</h3>Описывают поведение системы — её функции, действия и то, как она должна реагировать на входные данные.<br><br><b>Что входит:</b> Описание бизнес-логики, алгоритмы расчетов, сценарии авторизации, правила валидации полей, структура отчетов.<br><b>Примеры:</b><br>• Система должна отправлять email с подтверждением бронирования в течение 1 минуты после оплаты.<br>• При вводе неверного пароля более 3 раз система должна блокировать учетную запись на 15 минут."
            },
            {
                id: "q4",
                category: "requirements",
                question: "4. Что входит в нефункциональные требования? Приведи примеры.",
                answer: "<h3>Non-Functional Requirements</h3>Описывают ограничения, системные характеристики, требования к качеству и окружению системы.<br><br><b>Что входит:</b> Производительность (время отклика), надежность, безопасность (шифрование), юзабилити (адаптивность), масштабируемость.<br><b>Примеры:</b><br>• Время отклика главной страницы сайта при нагрузке 1000 запросов в секунду не должно превышать 1.5 секунды.<br>• Пароли пользователей должны храниться в базе данных в зашифрованном виде с использованием алгоритма BCrypt."
            },
            {
                id: "q5",
                category: "requirements",
                question: "5. В чём отличие функциональных и нефункциональных требований?",
                answer: "<h3>ФТ vs НФТ</h3><b>Главное отличие:</b> Функциональные требования отвечают на вопрос <b>«ЧТО система должна делать?»</b> (конкретная фича, кнопка, функция). Нефункциональные отвечают на вопрос <b>«КАК система должна это делать?»</b> (с какой скоростью, насколько безопасно, стабильно и удобно).<br><br>Если убрать ФТ, пользователь не сможет выполнить задачу. Если не соблюдать НФТ, пользователь сможет запустить функцию, но она будет работать слишком медленно или небезопасно."
            },
            {
                id: "q6",
                category: "requirements",
                question: "6. Какая классификация нефункциональных требований? Какие нефункциональные требования описываешь на практике?",
                answer: "<h3>Классификация и практика НФТ</h3>По стандарту ISO 25010 они делятся на: Эффективность производительности (Performance), Надежность (Reliability), Безопасность (Security), Удобство использования (Usability), Совместимость, Сопровождаемость и Переносимость.<br><br><b>На практике я описываю:</b> 1) <i>Производительность</i> (время отклика API); 2) <i>Безопасность</i> (ролевая модель доступа, маскирование персональных данных); 3) <i>Доступность</i> (Uptime системы, например, 99.9%)."
            },
            {
                id: "q7",
                category: "requirements",
                question: "7. Что такое транзитные (переходные) требования?",
                answer: "<h3>Транзитные требования (Transition Requirements)</h3>Это <b>временные</b> требования, необходимые для успешного перевода бизнеса и системы из текущего состояния (As Is) в целевое состояние (To Be). Они теряют актуальность сразу после того, как проект запущен в промышленную эксплуатацию.<br><br><b>Примеры:</b><br>• Написать скрипт для переноса 50 000 учетных записей из старой СУБД в новую базу.<br>• Провести двухдневный тренинг по работе с новым интерфейсом для 15 операторов колл-центра."
            },
            {
                id: "q8",
                category: "requirements",
                question: "8. Какие есть способы (методы) сбора требований? Какие используешь на практике?",
                answer: "<h3>Способы сбора требований</h3><b>Все методы:</b> Интервью, Анкетирование, Воркшопы (совместные сессии), Мозговой штурм, Наблюдение (Shadowing), Анализ документации, Анализ интерфейсов конкурентов, Прототипирование, Обратный инжиниринг.<br><br><b>На практике использую:</b> 1) <i>Интервью</i> с ключевыми стейкхолдерами; 2) <i>Анализ нормативных документов</i> или логов текущей системы; 3) <i>Прототипирование</i> (наброски экранов) для быстрого сбора обратной связи."
            },
            {
                id: "q9",
                category: "requirements",
                question: "9. В каких документах описываются требования? Какие способы описания требований знаешь?",
                answer: "<h3>Документирование требований</h3><b>Основные документы:</b> BRD (Business Requirements Document), PRD (Product Requirements Document), SRS (Software Requirements Specification), ТЗ по ГОСТ (34 или 19), Постановки (задачи) в Jira/Confluence.<br><br><b>Способы описания:</b> Текстовый (естественный язык), Пользовательские истории (User Story), Сценарии использования (Use Case), Таблицы принятия решений, Графические модели и диаграммы (UML, BPMN)."
            },
            {
                id: "q10",
                category: "requirements",
                question: "10. Что такое User story? Можешь привести пример? Применяешь ли на практике?",
                answer: "<h3>User Story (Пользовательская история)</h3>Формат краткого описания фичи со стороны конечного пользователя, ориентированный на бизнес-ценность.<br><b>Шаблон:</b> Как [Роль], я хочу [Действие], чтобы [Ценность].<br><br><b>Пример:</b> <i>Как курьер, я хочу видеть карту с маршрутом в приложении, чтобы доставить заказ вовремя и не заблудиться.</i><br><b>На практике:</b> Активно использую в командах, работающих по гибким методологиям (Scrum), для наполнения бэклога продукта."
            },
            {
                id: "q11",
                category: "requirements",
                question: "11. Какие преимущества использования User story?",
                answer: "<h3>Преимущества User Story</h3>• <b>Фокус на ценности:</b> Блок 'чтобы' заставляет команду думать о реальной пользе фичи, а не просто о написании кода.<br>• <b>Понятность:</b> Написаны простым языком, поэтому служат отличным мостом коммуникации между бизнесом и разработкой.<br>• <b>Гибкость:</b> Не перегружены деталями на раннем этапе, их легко обсуждать, оценивать, передвигать по приоритетам и декомпозировать на задачи."
            },
            {
                id: "q12",
                category: "requirements",
                question: "12. Как понять, что User story написана хорошо? Можешь привести пример?",
                answer: "<h3>Критерии качества User Story</h3>История хорошая, если она соответствует критериям <b>INVEST</b>:<br><b>I</b>ndependent (независимая), <b>N</b>egotiable (обсуждаемая), <b>V</b>aluable (ценная), <b>E</b>stimable (оцениваемая), <b>S</b>mall (компактная), <b>T</b>estable (тестируемая).<br><br>У хорошей истории всегда есть **Acceptance Criteria (Критерии приемки)**. <br><i>Пример критерия:</i> 'Если баланс пользователя отрицательный, кнопка Перевести должна быть заблокирована, а под ней отображаться подсказка Пополните баланс'."
            },
            {
                id: "q13",
                category: "requirements",
                question: "13. Что такое Use cases? Как они описываются (с примером)? Применяешь ли на практике?",
                answer: "<h3>Use Case (Сценарий использования)</h3>Детальное пошаговое описание взаимодействия Актера (пользователя или внешней системы) со всей системой для достижения конкретной цели.<br><br><b>Как описывается:</b> Задается Название, Актеры, Предусловия, Основной сценарий (успешный путь по шагам), Альтернативные сценарии (разветвления) и Постусловия.<br><b>Пример:</b> 1. Пользователь вводит номер карты. 2. Система проверяет банк. 3. Пользователь вводит сумму. 4. Система списывает средства. (Альтернатива 3а: Сумма превышает лимит -> Система выводит ошибку)."
            },
            {
                id: "q14",
                category: "requirements",
                question: "14. В чём отличие User stories от Use cases?",
                answer: "<h3>User Stories vs Use Cases</h3>• <b>Фокус:</b> User Story отвечает на вопрос <i>«ЗАЧЕМ?»</i> и фиксирует ценность. Use Case отвечает на вопрос <i>«КАК именно?»</i> и фиксирует детальный алгоритм шагов.<br>• <b>Объем:</b> User Story — это верхнеуровневая формулировка в одну строчку. Use Case — это структурированный многостраничный документ или таблица.<br>• <b>Применение:</b> User Story идеальна для Agile/Scrum для быстрого планирования. Use Case применяется для описания сложного системного поведения с кучей проверок."
            },
            {
                id: "q15",
                category: "requirements",
                question: "15. Какие критерии у хороших требований? Как ты понимаешь, что требования хорошие? К тебе пришло требование — по каким критериям будешь его оценивать?",
                answer: "<h3>Критерии оценки требований</h3>Я оцениваю любое поступившее требование по следующим классическим критериям качества:<br>• <b>Полнота:</b> Описаны ли все условия и негативные кейсы?<br>• <b>Ясность (Однозначность):</b> Поймут ли разработчик и QA текст одинаково?<br>• <b>Непротиворечивость:</b> Не спорит ли оно с текущей логикой системы?<br>• <b>Проверяемость (Тестируемость):</b> Сможем ли мы написать тест-кейс?<br>• <b>Актуальность и Реализуемость:</b> Соответствует ли архитектуре и срокам?"
            },
            {
                id: "q16",
                category: "requirements",
                question: "16. В чём отличие верификации требований от валидации?",
                answer: "<h3>Верификация vs Валидация требований</h3>• <b>Верификация (Verification):</b> Проверка требований на внутреннюю корректность. Отвечает на вопрос: <i>«Правильно ли мы описали требования?»</i> (Проверяем ТЗ на отсутствие ошибок, полноту, структуру, соответствие ГОСТ/шаблону).<br>• <b>Валидация (Validation):</b> Проверка требований на соответствие ожиданиям бизнеса. Отвечает на вопрос: <i>«Правильные ли требования мы собрали?»</i> (Проверяем, решит ли этот функционал реальную боль заказчика)."

            {

                answer: "<h3>Артефакты работы аналитика</h3><b>Что я создаю:</b> Бизнес-требования (BRD), Системные спецификации (SRS), Постановки задач (Jira), Диаграммы процессов (BPMN, UML), ER-схемы данных, Спецификации API (Swagger, маппинги).<br><br><b>Кто их использует:</b><br>• <i>Разработчики</i> (архитектура, написание кода по логике).<br>• <i>Тестировщики</i> (составление тест-планов и сценариев проверки).<br>• <i>Бизнес/PM</i> (контроль рамок проекта, согласование итогового решения)."

                answer: "<h3>Шаблон постановки задачи</h3>Моя стандартная постановка задачи в Jira/Confluence состоит из разделов:<br>1. <b>Цель/Бизнес-контекст:</b> Какую задачу решаем.<br>2. <b>Описание логики:</b> Use Case или User Story с критериями приемки.<br>3. <b>Требования к UI/UX:</b> Ссылка на макет Figma + правила поведения экранов.<br>4. <b>Интеграции и Данные:</b> Изменения в БД, контракты API, маппинг полей.<br>5. <b>НФТ:</b> Особые требования к безопасности или нагрузке."

                answer: "<h3>Постановка для Frontend</h3>Необходимо описать все правила валидации, ограничения и динамику интерфейса:<br>• Ссылка на макеты в Figma.<br>• Поведение элементов при наведении, фокусе, клике, состоянии блокировки (Disabled).<br>• Маски полей ввода, валидация данных (email, телефон), тексты ошибок.<br><br><i>Пример:</i> Поле 'Сумма перевода' принимает только цифры. При вводе значения больше 50 000 руб, кнопка 'Перевести' блокируется, под полем выводится красный текст: Превышен лимит разового перевода."

            {

                answer: "<h3>SRS (Спецификация требований к ПО)</h3>Это глобальный технический документ, который полностью и детально описывает весь продукт: от функционала и интеграций до дизайна интерфейсов и требований к железу/инфраструктуре.<br><br><b>Когда применяется:</b> В Waterfall-проектах, при работе с госзаказчиками, в медицине, авиастроении или крупном аутсорсе с фиксированной ценой (Fixed Price).<br><b>На практике:</b> На современных проектах чаще пишу статьи в Confluence, заменяющие SRS."

                answer: "<h3>Назначение UML и BPMN</h3>• <b>BPMN:</b> Фокусируется на бизнес-процессах. Показывает, в каком порядке задачи переходят между отделами или ролями. Понятна топ-менеджменту и бизнесу.<br>• <b>UML:</b> Фокусируется на технической архитектуре программного обеспечения. Показывает, как устроены классы кода, как базы данных общаются с бэкендом, в какой последовательности системы вызывают методы API друг друга. Это инструмент для IT-команды."

                answer: "<h3>Шлюзы в BPMN</h3>Используются для управления ветвлением процесса:<br>• <b>Exclusive (X):</b> Исключающее «ИЛИ». Поток идет строго по одной ветке (например, Кредит одобрен? Да -> путь 1, Нет -> путь 2).<br>• <b>Parallel (+):</b> Параллельное «И». Все исходящие ветки запускаются одновременно.<br>• <b>Inclusive (O):</b> Включающее «ИЛИ». Запускается одна или несколько веток в зависимости от условий.<br>• <b>Event-based:</b> Выбор ветки зависит от того, какое внешнее событие наступит раньше."

            {

                answer: "<h3>Синхронность vs Асинхронность</h3>• <b>Синхронное:</b> Клиент отправляет запрос на сервер и блокирует свою работу, <i>ожидая ответа</i>. Пример: REST API. Если сервер завис, клиент тоже зависнет по тайм-ауту.<br>• <b>Асинхронное:</b> Клиент отправляет сообщение (например, в шину Kafka) и <i>сразу продолжает работать</i>, не дожидаясь обработки. Получатель заберет сообщение из очереди и обработает его в своем темпе."

            {

                answer: "<h3>Архитектурный стиль REST</h3>Стиль проектирования API, использующий стандартные механизмы HTTP. <br><b>Основные принципы:</b><br>• Клиент-Серверная архитектура.<br>• <b>Stateless:</b> Сервер не хранит сессию клиента. Каждый запрос независим.<br>• Кэширование ответов.<br>• Единообразие интерфейса (использование URL как путей к ресурсам и HTTP-методов для управления ими)."

                category: "integrations",
                question: "39. Методы HTTP (GET, POST, PUT, PATCH, DELETE) и Идемпотентность. В чем разница между POST и PUT?",
                answer: "<h3>HTTP-методы и Идемпотентность</h3>• <b>GET:</b> Получение данных. Идемпотентен.<br>• <b>POST:</b> Создание нового ресурса. <i>Неидемпотентен</i> (5 кликов создадут 5 заказов).<br>• <b>PUT:</b> Полная перезапись/замена ресурса. Идемпотентен.<br>• <b>PATCH:</b> Частичное обновление полей объекта.<br>• <b>DELETE:</b> Удаление ресурса. Идемпотентен.<br><b>Разница POST и PUT:</b> POST создает новую сущность каждый раз, а PUT заменяет существующую по конкретного ID (сколько раз ни отправляй — сущность останется одна)."
            },
            {
                id: "q40",
                category: "integrations",
                question: "40. Коды ответов HTTP, Авторизация/Аутентификация и Версионирование API.",
                answer: "<h3>Важная база REST API</h3>• <b>Коды:</b> 2xx (Успех), 3xx (Редирект), 4xx (Ошибка клиента: 400 — неверный JSON, 401 — не залогинен, 404 — не найдено), 5xx (Ошибка сервера, 500).<br>• <b>Аутентификация:</b> Проверка подлинности (ввод пароля). <b>Авторизация:</b> Проверка прав доступа (разрешено ли менеджеру удалять пользователей).<br>• <b>Версионирование:</b> Разделение версий API в URL (`/v1/users` и `/v2/users`), чтобы обновления бэкенда не ломали старые версии мобильных приложений."
            }
        ];

        let flashcards = [...originalCards];
        let currentIndex = 0;
        let isStressMode = false;
        let currentFilter = 'all';
        let searchQuery = '';

        const cardElement = document.getElementById('card');
        const questionElement = document.getElementById('question-text');
        const answerElement = document.getElementById('answer-text');
        const progressElement = document.getElementById('progress');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stressBtn = document.getElementById('stress-btn');
        const notesTextarea = document.getElementById('card-notes');
        const searchBar = document.getElementById('search-bar');

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-btn').textContent = "☀️ Светлая";
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('theme-btn').textContent = "🌙 Темная";
            }
        }

        function toggleTheme() {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                document.getElementById('theme-btn').textContent = "🌙 Темная";
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-btn').textContent = "☀️ Светлая";
            }
        }

        function applyFilterAndOrder() {
            let filtered = [...originalCards];

            // 1. Фильтр по категории / избранному
            if (currentFilter === 'favorites') {
                filtered = filtered.filter(c => localStorage.getItem(`fav_${c.id}`) === 'true');
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(c => c.category === currentFilter);
            }

            // 2. Фильтр по строке поиска
            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(c => c.question.toLowerCase().includes(q) || c.answer.toLowerCase().includes(q));
            }

            // 3. Стресс-тест (Рандом)
            if (isStressMode) {
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
            }

            flashcards = filtered;
            currentIndex = 0;
            updateCard();
        }

        function filterCategory(category, element) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentFilter = category;
            applyFilterAndOrder();
        }

        function handleSearch() {
            searchQuery = searchBar.value;
            applyFilterAndOrder();
        }

        function toggleStressMode() {
            isStressMode = !isStressMode;
            if (isStressMode) {
                stressBtn.classList.add('active');
            } else {
                stressBtn.classList.remove('active');
            }
            applyFilterAndOrder();
        }

        function updateCard() {
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                if (flashcards.length === 0) {
                    questionElement.innerHTML = "Ничего не найдено по вашему запросу";
                    answerElement.innerHTML = "<h3>Пусто</h3>";
                    progressElement.textContent = `Карточек: 0`;
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    notesTextarea.value = "";
                    document.getElementById('fav-icon-front').style.display = 'none';
                    document.getElementById('fav-icon-back').style.display = 'none';
                    return;
                }

                document.getElementById('fav-icon-front').style.display = 'block';
                document.getElementById('fav-icon-back').style.display = 'block';

                questionElement.innerHTML = flashcards[currentIndex].question;
                answerElement.innerHTML = flashcards[currentIndex].answer;
                progressElement.textContent = `Карточка ${currentIndex + 1} из ${flashcards.length}`;
                
                // Заметки
                const currentCardId = flashcards[currentIndex].id;
                const savedNote = localStorage.getItem(`note_${currentCardId}`);
                notesTextarea.value = savedNote ? savedNote : "";

                // Звёздочки избранного
                const isFav = localStorage.getItem(`fav_${currentCardId}`) === 'true';
                const favFront = document.getElementById('fav-icon-front');
                const favBack = document.getElementById('fav-icon-back');
                
                if (isFav) {
                    favFront.classList.add('is-fav');
                    favBack.classList.add('is-fav');
                    favFront.innerHTML = '★';
                    favBack.innerHTML = '★';
                } else {
                    favFront.classList.remove('is-fav');
                    favBack.classList.remove('is-fav');
                    favFront.innerHTML = '☆';
                    favBack.innerHTML = '☆';
                }

                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === flashcards.length - 1);
                
                document.getElementById('answer-text').scrollTop = 0;
            }, 150);
        }

        function flipCard() {
            if (flashcards.length > 0) {
                cardElement.classList.toggle('flipped');
            }
        }

        function preventFlip(event) {
            event.stopPropagation();
        }

        function toggleFavorite(event) {
            event.stopPropagation(); // Чтобы карточка не переворачивалась при клике на звезду
            if (flashcards.length === 0) return;

            const currentCardId = flashcards[currentIndex].id;
            const isFav = localStorage.getItem(`fav_${currentCardId}`) === 'true';
            
            localStorage.setItem(`fav_${currentCardId}`, !isFav);
            updateCard();

            // Если мы находимся в табе избранного и убрали звезду, нужно обновить список
            if (currentFilter === 'favorites') {
                setTimeout(() => { applyFilterAndOrder(); }, 300);
            }
        }

        function saveNote() {
            if (flashcards.length === 0) return;
            const currentCardId = flashcards[currentIndex].id;
            const noteText = notesTextarea.value;
            localStorage.setItem(`note_${currentCardId}`, noteText);
            alert("Заметка сохранена!");
        }

        function nextCard(event) {
            if (event) event.stopPropagation(); 
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard(event) {
            if (event) event.stopPropagation(); 
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // ОБРАБОТКА ГОРЯЧИХ КЛАВИШ
        window.addEventListener('keydown', function(event) {
            // Если фокус в инпуте поиска или заметок — горячие клавиши не должны срабатывать
            if (document.activeElement === searchBar || document.activeElement === notesTextarea) {
                return;
            }

            if (event.code === 'Space') {
                event.preventDefault(); // Предотвращаем скролл страницы пробелом
                flipCard();
            } else if (event.key === 'ArrowRight') {
                nextCard();
            } else if (event.key === 'ArrowLeft') {
                prevCard();
            } else if (event.key === 's' || event.key === 'ы' || event.key === 'S' || event.key === 'Ы') {
                toggleStressMode();
            } else if (event.key === 'f' || event.key === 'а' || event.key === 'F' || event.key === 'А') {
                toggleFavorite(event);
            }
        });

        initTheme();
        updateCard();
    </script>
</body>
</html>
