<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер Системного Аналитика</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1c1e21;
            --accent-color: #0052cc;
            --secondary-text: #65676b;
            --btn-bg: #e4e6eb;
            --btn-text: #050505;
            --border-color: #e2e8f0;
            --card-back-border: #0052cc;
            --textarea-bg: #f0f2f5;
            --search-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-color: #e4e6eb;
            --accent-color: #4589ff;
            --secondary-text: #b0b3b8;
            --btn-bg: #3a3b3c;
            --btn-text: #e4e6eb;
            --border-color: #3e4042;
            --card-back-border: #4589ff;
            --textarea-bg: #1c1e21;
            --search-bg: #242526;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent-color);
        }

        .theme-toggle {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--search-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 2px 12px rgba(0, 82, 204, 0.15);
        }

        .filters {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        .utils {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 10px;
        }

        .progress {
            font-size: 13px;
            color: var(--secondary-text);
        }

        .stress-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stress-btn.active {
            background-color: #ff3b30;
            color: white;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
        }

        .card-container {
            width: 100%;
            max-width: 700px;
            height: 520px;
            perspective: 1500px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            border-radius: 20px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .favorite-icon {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 22px;
            color: var(--secondary-text);
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            z-index: 10;
            user-select: none;
        }

        .favorite-icon.is-fav {
            color: #ffcc00;
            transform: scale(1.15);
        }

        .card-front {
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            overflow-y: auto;
        }

        .card-front::after {
            content: "Кликните или нажмите Пробел, чтобы посмотреть ответ";
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 80%;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
            border-top: 5px solid var(--card-back-border);
            justify-content: space-between;
        }

        .answer-scroll-area {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .card-back h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 17px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card-back b { color: var(--text-color); }

        .notes-container {
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .notes-textarea {
            width: 100%;
            height: 55px;
            background-color: var(--textarea-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            box-sizing: border-box;
            resize: none;
            transition: border-color 0.2s;
        }

        .notes-textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .notes-btn {
            align-self: flex-end;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .notes-btn:active { transform: scale(0.95); }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }

        .nav-btn {
            flex: 1;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active { transform: scale(0.97); }
        .nav-btn:disabled { background-color: var(--btn-bg); color: var(--secondary-text); cursor: not-allowed; }

        @media (max-height: 700px) {
            .card-container { height: 420px; }
            .card-front { font-size: 17px; }
            .notes-textarea { height: 45px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Тренажер Аналитика</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Темная</button>
    </div>

    <div class="search-container">
        <input type="text" id="search-bar" class="search-input" placeholder="🔍 Живой поиск по ключевым словам (например: Kafka, REST, ФТ)..." oninput="handleSearch()">
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCategory('all', this)">Все</button>
        <button class="filter-btn" onclick="filterCategory('requirements', this)">Требования</button>
        <button class="filter-btn" onclick="filterCategory('modeling', this)">Моделирование</button>
        <button class="filter-btn" onclick="filterCategory('integrations', this)">Интеграции</button>
        <button class="filter-btn" onclick="filterCategory('favorites', this)" style="border: 1px solid #ffcc00;">⭐ Избранное</button>
    </div>

    <div class="utils">
        <div class="progress" id="progress">Загрузка...</div>
        <button class="stress-btn" id="stress-btn" onclick="toggleStressMode()">⚡ Стресс-тест [S]</button>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="favorite-icon" id="fav-icon-front" onclick="toggleFavorite(event)">☆</div>
                <div id="question-text">Загрузка...</div>
            </div>
            <div class="card-face card-back">
                <div class="favorite-icon" id="fav-icon-back" onclick="toggleFavorite(event)">☆</div>
                <div class="answer-scroll-area" id="answer-text">Загрузка...</div>
                <div class="notes-container" onclick="preventFlip(event)">
                    <textarea class="notes-textarea" id="card-notes" placeholder="Добавьте свои заметки или вопросы по теме здесь..."></textarea>
                    <button class="notes-btn" onclick="saveNote()">Сохранить заметку</button>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="nav-btn" id="prev-btn" onclick="prevCard(event)" disabled>Назад [←]</button>
        <button class="nav-btn" id="next-btn" onclick="nextCard(event)">Вперед [→]</button>
    </div>

    <script>
        const originalCards = [
            // ==========================================
            // БЛОК 1. ТРЕБОВАНИЯ
            // ==========================================
            {
        id: "q1",
        category: "requirements",
        question: "1. Кто такие стейкхолдеры? Кто является стейкхолдерами для тебя? С какими группами заинтересованных лиц общался?",
        answer: "<h3>Стейкхолдеры (Заинтересованные лица)</h3><b>Кто это:</b> Это любые лица, группы или организации, которые могут оказывать влияние на проект, либо на которых влияет результат проекта. В BABOK это разделяют на внутренних и внешних стейкхолдеров.<br><br><b>Для меня как системного аналитика стейкхолдерами являются:</b><br>1. <b>Бизнес-заказчики и Product Owner:</b> Определяют стратегию, бюджет и бизнес-цели. С ними я согласовываю приоритеты.<br>2. <b>Конечные пользователи:</b> Те, кто будет ежедневно работать с системой. Их 'боли' — главный источник требований.<br>3. <b>Разработчики (Backend/Frontend):</b> Мои ключевые партнеры. Им я передаю ТЗ, с ними обсуждаю техническую реализацию и ограничения.<br>4. <b>Тестировщики (QA):</b> С ними мы вместе разбираем логику, чтобы они могли написать корректные тест-кейсы.<br>5. <b>Архитекторы и DevOps:</b> Консультируюсь с ними по нефункциональным требованиям (масштабирование, безопасность).<br>6. <b>Юристы и служба безопасности (ИБ):</b> Когда требования касаются персональных данных (GDPR, 152-ФЗ).<br><br><b>Мой опыт коммуникации:</b> На прошлом проекте я регулярно проводил интервью с бизнес-заказчиком для уточнения логики расчета зарплаты, участвовал в грумингах с разработчиками, где мы декомпозировали фичи на задачи, и присутствовал на демо-сессиях с QA, где мы валидировали, что реализовано именно то, что заказывали."
    },
    {
        id: "q2",
        category: "requirements",
        question: "2. Какие виды требований знаешь? Можешь привести примеры? С какими видами работаешь?",
        answer: "<h3>Виды требований (Классификация по BABOK и уровню детализации)</h3>Я разделяю требования на 4 уровня, чтобы строить мостик от бизнеса к коду:<br><br>1. <b>Бизнес-требования (Business Requirements):</b> Самый высокий уровень. Отвечают на вопрос 'Зачем мы это делаем?'. Это цели компании, KPI.<br>   <i>Пример:</i> 'Увеличить количество повторных покупок на 15% за счет внедрения системы лояльности'.<br><br>2. <b>Требования стейкхолдеров (Stakeholder Requirements):</b> Потребности конкретных групп. Отвечают на вопрос 'Что нужно пользователю?'.<br>   <i>Пример:</i> 'Менеджер по продажам хочет видеть историю всех коммуникаций с клиентом в одном окне'.<br><br>3. <b>Функциональные требования (Functional Requirements):</b> Конкретные действия системы. Отвечают на вопрос 'Что именно система должна делать?'.<br>   <i>Пример:</i> 'Система должна рассчитывать сумму кэшбэка по формуле: (Сумма чека * % лояльности) / 100'.<br><br>4. <b>Нефункциональные требования (Non-Functional Requirements):</b> Ограничения и атрибуты качества. Отвечают на вопрос 'Как хорошо система должна это делать?'.<br>   <i>Пример:</i> 'Время расчета кэшбэка должно занимать не более 200 мс при нагрузке 500 RPS'.<br><br><b>На практике я работаю со всеми уровнями:</b> Помогаю бизнесу формализовать их потребности в User Stories, а затем детализирую до системных функциональных требований и НФТ для команд разработки и тестирования."
    },
    {
        id: "q3",
        category: "requirements",
        question: "3. Что входит в функциональные требования? Приведи примеры.",
        answer: "<h3>Функциональные требования (ФТ)</h3><b>Что это:</b> Это спецификация поведения системы. Они описывают, какие именно операции, расчеты, бизнес-правила и реакции на ввод данных должна выполнять система.<br><br><b>Что конкретно входит в описание ФТ:</b><br>• <b>Бизнес-логика и алгоритмы:</b> Описание шагов выполнения операции (включая все 'Если' и 'Иначе').<br>• <b>Правила валидации данных:</b> Какие поля обязательны, какие маски ввода, какие форматы допустимы.<br>• <b>Авторизация и роли:</b> Кто имеет право выполнять данную функцию.<br>• <b>Интеграционные сценарии:</b> Какие вызовы API делает система и как обрабатывает ответы.<br>• <b>Отчеты и выгрузки:</b> Какие данные и в каком формате генерируются.<br><br><b>Живой пример из практики (Требование для модуля оплаты):</b><br>'При нажатии кнопки 'Оплатить', система должна: 1) Проверить, что сумма заказа не превышает суточный лимит пользователя. 2) Отправить запрос на шлюз банка-эквайера с параметрами: номер карты, CVV, сумма. 3) Если банк вернул код 200 (Успех), система должна списать товар со склада и отправить email-подтверждение пользователю. 4) Если банк вернул 4xx, система должна показать пользователю текст ошибки из ответа банка.'"
    },
    {
        id: "q4",
        category: "requirements",
        question: "4. Что входит в нефункциональные требования? Приведи примеры.",
        answer: "<h3>Нефункциональные требования (НФТ)</h3><b>Что это:</b> Это требования к качеству, безопасности, производительности и эксплуатационным характеристикам системы. Они описывают не 'что' система делает, а 'как' она это делает и в каких условиях.<br><br><b>Категории НФТ (по стандарту ISO 25010):</b><br>1. <b>Производительность и масштабируемость:</b> Время отклика, пропускная способность (Throughput), нагрузка.<br>2. <b>Безопасность:</b> Шифрование данных, требования к паролям, разграничение доступа.<br>3. <b>Надежность и доступность:</b> Время безотказной работы (Uptime, например, 99.99%), время восстановления после сбоя (RTO).<br>4. <b>Удобство использования (Usability):</b> Интуитивность интерфейса, время выполнения типовых задач пользователем.<br>5. <b>Сопровождаемость:</b> Требования к логированию, мониторингу, легкость внесения изменений.<br><br><b>Примеры НФТ для интернет-магазина:</b><br>• <i>Производительность:</i> 'Страница каталога товаров должна загружаться за < 1 секунды при одновременной работе 1000 пользователей'.<br>• <i>Безопасность:</i> 'Пароли пользователей должны храниться в БД только в захэшированном виде (алгоритм BCrypt)'.<br>• <i>Доступность:</i> 'Система должна быть доступна 24/7, допустимое время простоя не более 15 минут в месяц (SLA 99.97%)'."
    },
    {
        id: "q5",
        category: "requirements",
        question: "5. В чём отличие функциональных и нефункциональных требований?",
        answer: "<h3>Ключевое отличие ФТ от НФТ</h3>Главное отличие лежит в плоскости вопросов: <b>ФТ отвечают на вопрос «ЧТО?»</b>, а <b>НФТ отвечают на вопрос «КАК?»</b>.<br><br><b>Наглядно на примере автомобиля:</b><br>• <i>Функциональное требование:</i> Автомобиль должен разгоняться до 100 км/ч (это конкретная функция, измеряемая характеристика движения).<br>• <i>Нефункциональное требование:</i> Автомобиль должен разгоняться до 100 км/ч за 5 секунд и быть безопасным при столкновении (это ограничение на то, как именно реализована функция разгона, ее качество).<br><br><b>Почему это важно на практике:</b> Если мы опишем только ФТ, разрабы сделают функционал, но он может тормозить, 'падать' под нагрузкой или быть небезопасным. Если мы опишем только НФТ, без ФТ будет непонятно, что именно система должна вычислять. Поэтому я всегда в постановках пишу оба блока."
    },
    {
        id: "q6",
        category: "requirements",
        question: "6. Какая классификация нефункциональных требований? Какие нефункциональные требования описываешь на практике?",
        answer: "<h3>Классификация НФТ и мой практический опыт</h3>В своей работе я использую классификацию из стандарта <b>ISO/IEC 25010</b>, которая делит НФТ на 8 основных характеристик качества:<br>1. <b>Функциональная пригодность</b> (полнота, корректность).<br>2. <b>Эффективность производительности</b> (время отклика, пропускная способность).<br>3. <b>Совместимость</b> (работа с разными ОС и браузерами).<br>4. <b>Удобство использования</b> (эстетика, понятность).<br>5. <b>Надежность</b> (отказоустойчивость, восстанавливаемость).<br>6. <b>Безопасность</b> (конфиденциальность, шифрование).<br>7. <b>Сопровождаемость</b> (модульность, читаемость кода).<br>8. <b>Переносимость</b> (возможность установки в разных средах).<br><br><b>На практике я чаще всего описываю 3 группы:</b><br>• <b>Производительность и масштабируемость:</b> Прописываю SLA (Service Level Agreement) для API, например, 'Время ответа GET /api/v1/orders не более 300 мс при 90-м перцентиле'.<br>• <b>Безопасность:</b> Описываю требования к ролевой модели (RBAC), маскированию ПДн в логах, обязательному использованию HTTPS.<br>• <b>Доступность и надежность:</b> Прописываю требования к резервированию (failover), механизмам ретраев и таймаутов при интеграциях."
    },
    {
        id: "q7",
        category: "requirements",
        question: "7. Что такое транзитные (переходные) требования?",
        answer: "<h3>Транзитные требования (Transition Requirements)</h3><b>Суть:</b> Это временные требования, которые нужны исключительно для того, чтобы обеспечить бесшовный переход от текущего состояния системы/бизнеса (As-Is) к новому целевому состоянию (To-Be). Как только проект запускается в промышленную эксплуатацию, эти требования теряют свою актуальность и могут быть удалены.<br><br><b>Ключевая особенность:</b> Они не являются постоянными функциями системы. Их цель — 'сделать переезд' комфортным для пользователей и данных.<br><br><b>Примеры из моей практики:</b><br>1. <b>Миграция данных:</b> 'Разработать ETL-скрипт для переноса 100 000 заказов из старой базы Access в новую PostgreSQL за 2 часа до запуска'.<br>2. <b>Обучение пользователей:</b> 'Подготовить обучающие материалы и провести 3 вебинара для 50 менеджеров по работе в новом интерфейсе в первую неделю после релиза'.<br>3. <b>Параллельный запуск:</b> 'В течение 2 недель после релиза данные должны дублироваться и в старую, и в новую систему, чтобы иметь возможность отката'."
    },
    {
        id: "q8",
        category: "requirements",
        question: "8. Какие есть способы (методы) сбора требований? Какие используешь на практике?",
        answer: "<h3>Методы сбора требований (Elicitation Techniques)</h3>В арсенале аналитика есть много техник. Я разделяю их на прямые (общение) и непрямые (анализ артефактов).<br><br><b>Основные методы по BABOK:</b> Интервью, Анкетирование (опросы), Воркшопы (групповые сессии), Наблюдение (Shadowing), Анализ документации и регламентов, Прототипирование, Мозговой штурм, Анализ конкурентов.<br><br><b>Какие методы я использую на практике чаще всего:</b><br>1. <b>Интервью (1-на-1):</b> Мой основной инструмент. Я провожу структурированные интервью с ключевыми стейкхолдерами, чтобы выявить их реальные 'боли'.<br>2. <b>Воркшопы (Workshops):</b> Когда нужно быстро согласовать противоречивые мнения нескольких сторон. Например, собираю бизнес, разработку и QA вместе для обсуждения сложного сценария.<br>3. <b>Анализ существующей документации и логов:</b> Если система уже есть, я смотрю, как она работает сейчас — по логам, коду, старой ТЗ.<br>4. <b>Прототипирование (Figma / Balsamiq):</b> Делаю наброски экранов, чтобы быстро показать заказчику, как это будет выглядеть, и получить обратную связь на раннем этапе."
    },
    {
        id: "q9",
        category: "requirements",
        question: "9. В каких документах описываются требования? Какие способы описания требований знаешь?",
        answer: "<h3>Документы и способы описания требований</h3>Формат документа зависит от методологии проекта (Waterfall vs Agile).<br><br><b>Основные артефакты (документы):</b><br>• <b>BRD (Business Requirements Document):</b> Описывает бизнес-цели и задачи верхнеуровнево.<br>• <b>SRS (Software Requirements Specification):</b> Детальный технический документ по ГОСТ или IEEE, описывающий все ФТ и НФТ системы.<br>• <b>User Story Map / Product Backlog:</b> В Agile — это задачи в Jira/Confluence, описанные в виде User Stories.<br>• <b>Техническое задание (ТЗ):</b> Российский аналог SRS, часто используется в аутсорсе.<br><br><b>Способы (форматы) описания требований внутри документов:</b><br>1. <b>Свободный текст (Use Case):</b> Пошаговое описание сценария (Актер -> Система).<br>2. <b>User Story:</b> Короткая формулировка 'Как [роль], я хочу [действие], чтобы [ценность]'.<br>3. <b>Критерии приемки (Acceptance Criteria - Gherkin):</b> Формат 'Дано -> Когда -> Тогда' для автоматизации тестов.<br>4. <b>Таблицы принятия решений (Decision Tables):</b> Для сложной логики с множеством условий.<br>5. <b>Диаграммы (BPMN, UML):</b> Графическое представление процессов и архитектуры."
    },
    {
        id: "q10",
        category: "requirements",
        question: "10. Что такое User story? Можешь привести пример? Применяешь ли на практике?",
        answer: "<h3>Пользовательская история (User Story)</h3><b>Что это:</b> Это самый популярный формат описания требований в Agile. Это короткое, простое описание функции, написанное с точки зрения пользователя, которое фокусируется на бизнес-ценности, а не на технических деталях.<br><br><b>Шаблон (стандарт Connextra):</b><br><i>'Как [Роль пользователя], я хочу [Выполнить действие], чтобы [Получить ценность/выгоду]'</i>.<br><br><b>Пример из моей практики (для банковского приложения):</b><br><i>'Как держатель кредитной карты, я хочу видеть на главном экране кнопку 'Заблокировать карту', чтобы в случае потери я мог мгновенно обезопасить свои средства, не звоня в банк'.</i><br><br><b>На практике я активно применяю User Stories:</b> Я наполняю ими Product Backlog в Jira. Для каждой истории я обязательно добавляю обсуждение (Refinement), где мы с командой проходим по критериям приемки (Acceptance Criteria) и декомпозируем историю на технические подзадачи, если она оказывается слишком крупной (эпик)."
    },
    {
        id: "q11",
        category: "requirements",
        question: "11. Какие преимущества использования User story?",
        answer: "<h3>Ключевые преимущества User Stories</h3>User Stories — это не просто способ написать требование, это инструмент коммуникации. Их главная сила в следующем:<br><br>1. <b>Фокус на ценности (Business Value):</b> Блок 'чтобы...' заставляет команду постоянно думать: 'А зачем мы это делаем? Это реально принесет пользу пользователю?'. Это избавляет от фич, которые 'круто выглядели в ТЗ', но никому не нужны.<br><br>2. <b>Создание диалога (Conversation):</b> Карточка с историей — это не контракт, а приглашение к обсуждению. Вместо того чтобы писать 10-страничное ТЗ, мы пишем 1 предложение и договариваемся о деталях устно на груминге. Это экономит время и снижает риск недопонимания.<br><br>3. <b>Гибкость и приоритизация:</b> Истории легко переставлять местами в бэклоге, легко оценивать в Story Points (сложность) и легко разбивать на более мелкие, если они не влезают в спринт.<br><br>4. <b>Понятность для всех:</b> Они написаны простым языком, поэтому их понимает и бизнес-заказчик, и разработчик."
    },
    {
        id: "q12",
        category: "requirements",
        question: "12. Как понять, что User story написана хорошо? Можешь привести пример?",
        answer: "<h3>Критерии качества хорошей User Story (Модель INVEST)</h3>Чтобы оценить качество истории, я использую акроним <b>INVEST</b> (придуман Биллом Уэйком). Хорошая история должна быть:<br><br><b>I</b> — <b>Independent (Независимая):</b> Ее можно реализовать отдельно от других историй (или хотя бы минимально зависеть).<br><b>N</b> — <b>Negotiable (Обсуждаемая):</b> Это не жесткий контракт, а база для переговоров между PO и командой.<br><b>V</b> — <b>Valuable (Ценная):</b> Она приносит ощутимую ценность пользователю или бизнесу.<br><b>E</b> — <b>Estimable (Оцениваемая):</b> Команда может понять ее сложность и оценить в часах/сторипоинтах.<br><b>S</b> — <b>Small (Компактная):</b> Влезает в один спринт (обычно 1-3 рабочих дня для разработчика).<br><b>T</b> — <b>Testable (Тестируемая):</b> К ней можно написать четкие приемочные тесты.<br><br><b>Пример плохой и хорошей истории:</b><br><i>Плохая:</i> 'Как пользователь, я хочу, чтобы система работала быстрее' (не тестируемо, не ценно, не оцениваемо).<br><i>Хорошая:</i> 'Как оператор колл-центра, я хочу, чтобы карточка клиента открывалась менее чем за 2 секунды, чтобы я не заставлял клиента ждать во время разговора'. (Здесь есть четкий критерий — 2 секунды, ценность — не заставлять клиента ждать, тестируемо)."
    },
    {
        id: "q13",
        category: "requirements",
        question: "13. Что такое Use cases? Как они описываются (с примером)? Применяешь ли на практике?",
        answer: "<h3>Варианты использования (Use Cases)</h3><b>Что это:</b> Это детализированное текстовое описание взаимодействия между Актером (пользователем или внешней системой) и системой для достижения конкретной цели. В отличие от User Story, Use Case фокусируется на пошаговом алгоритме действий.<br><br><b>Структура классического Use Case (по Коберну и Якобсону):</b><br>1. <b>Название и ID.</b><br>2. <b>Актеры:</b> Кто участвует.<br>3. <b>Предусловия:</b> Что должно быть правдой до начала.<br>4. <b>Основной поток (Happy Path):</b> Успешный сценарий по шагам.<br>5. <b>Альтернативные потоки:</b> Отклонения от счастья (ошибки, исключения).<br>6. <b>Постусловия:</b> Состояние системы после завершения.<br><br><b>Пример (Use Case 'Снятие наличных в банкомате'):</b><br>1. <b>Предусловие:</b> Карта вставлена, PIN введен.<br>2. <b>Основной поток:</b><br>   1. Пользователь выбирает 'Снятие наличных'.<br>   2. Система запрашивает сумму.<br>   3. Пользователь вводит сумму.<br>   4. Система проверяет баланс.<br>   5. Система выдает деньги и печатает чек.<br>3. <b>Альтернатива 4а:</b> Баланс меньше запрошенной суммы -> Система показывает ошибку и возвращает к шагу 2.<br><br><b>На практике:</b> Я использую Use Cases для описания сложных бэкенд-сценариев и интеграций, где важна каждая техническая деталь. Для простых интерфейсных фич мне хватает User Stories + Acceptance Criteria."
    },
    {
        id: "q14",
        category: "requirements",
        question: "14. В чём отличие User stories от Use cases?",
        answer: `<h3>User Stories vs Use Cases: Детальное сравнение</h3>Многие путают эти два понятия, но они решают разные задачи и находятся на разных уровнях абстракции. Я провожу границу так:<br><br><b>1. По назначению (Ценность vs Алгоритм):</b><br>• <b>User Story</b> отвечает на вопрос <i>'ЗАЧЕМ мы это делаем?'</i>. Её цель — донести бизнес-ценность.<br>• <b>Use Case</b> отвечает на вопрос <i>'КАК именно это работает?'</i>. Его цель — детализировать алгоритм до уровня, понятного разработчику.<br><br><b>2. По размеру и детализации:</b><br>• <b>User Story</b> — это 1-2 предложения. Это 'карточка' на доске.<br>• <b>Use Case</b> — это структурированный документ или таблица с ветвлениями (альтернативные потоки).<br><br><b>3. По применению в методологиях:</b><br>• <b>User Story</b> — идеально подходит для Agile (Scrum/Kanban).<br>• <b>Use Case</b> — чаще используется в Waterfall или для описания сложных системных интеграций (чтобы ничего не упустить).<br><br><b>Аналогия (Ресторан):</b> User Story — это 'Я как клиент хочу заказать пиццу, чтобы поесть'. Use Case — это детальный регламент работы повара: шаг 1 — взять тесто, шаг 2 — раскатать, шаг 3 — положить сыр...'
    },
    {
        id: "q15",
        category: "requirements",
        question: "15. Какие критерии у хороших требований? Как ты понимаешь, что требования хорошие? К тебе пришло требование — по каким критериям будешь его оценивать?",
        answer: "<h3>Критерии качества требований (Атрибуты качества)</h3>Когда ко мне приходит требование (от бизнеса или от смежной системы), я проверяю его по набору классических критериев, которые приняты в системной инженерии (стандарт IEEE 830).<br><br><b>Чек-лист аналитика (я задаю себе эти вопросы):</b><br>1. <b>Корректность (Correctness):</b> Верно ли требование отражает реальную потребность бизнеса?<br>2. <b>Однозначность (Unambiguous):</b> Может ли разработчик и тестировщик истолковать это требование по-разному? Если да — требование плохое.<br>3. <b>Полнота (Completeness):</b> Описаны ли все условия, все ветвления (if/else), все негативные сценарии (что, если БД упала)?<br>4. <b>Непротиворечивость (Consistent):</b> Не конфликтует ли это требование с другими уже реализованными фичами?<br>5. <b>Атомарность (Atomic):</b> Описана ли одна конкретная функция, а не сборная солянка из пяти фич в одном абзаце?<br>6. <b>Проверяемость (Testable):</b> Могу ли я на основе этого требования написать тест-кейс, который даст однозначный ответ 'Пройден/Не пройден'?<br>7. <b>Реализуемость (Feasible):</b> Сможет ли команда реализовать это в рамках текущего стека и бюджета?<br><br><b>Пример проверки:</b> Если я вижу требование 'Система должна быть быстрой', я сразу отмечаю его как некачественное (нет проверяемости). Я переформулирую его в 'Время отклика системы при 1000 RPS не должно превышать 500 мс'."
    },
    {
        id: "q16",
        category: "requirements",
        question: "16. В чём отличие верификации требований от валидации?",
        answer: "<h3>Верификация vs Валидация требований</h3>Это два краеугольных понятия в тестировании и анализе. Коротко: <b>Верификация — это проверка документации, Валидация — это проверка жизнеспособности идеи.</b><br><br>1. <b>Верификация (Verification):</b> Отвечает на вопрос <i>'Правильно ли мы описали требования?'</i>. Это статический анализ. Мы проверяем сам документ (SRS, ТЗ) на наличие ошибок, на соответствие шаблону, на полноту описания, на соответствие стандартам. Проверяем мысленно.<br>   <i>Пример:</i> Проверить, что в ТЗ на каждый Use Case есть альтернативный сценарий. Проверить, что все требования нумерованы и к ним можно привязать тесты.<br><br>2. <b>Валидация (Validation):</b> Отвечает на вопрос <i>'Правильные ли требования мы собрали?'</i>. Это динамический анализ. Мы проверяем, решит ли этот функционал реальную проблему пользователя. Делается это через демо, прототипы или обсуждения с заказчиком.<br>   <i>Пример:</i> Показать заказчику прототип нового отчета. Заказчик говорит: 'Да, это именно то, что мне нужно'. Значит, требования валидны (соответствуют его ожиданиям). <br><br><b>Метод для запоминания:</b> 'Верификация — 'Мы сделали ТЗ правильно'. Валидация — 'Мы сделали правильное ТЗ'."
    },
    {
        id: "q17",
        category: "requirements",
        question: "17. Что является артефактом работы аналитика? Какие артефакты ты создаёшь? Кто является пользователями этих артефактов?",
        answer: "<h3>Артефакты работы аналитика и их потребители</h3>Артефакт — это любой материальный продукт моей деятельности, который я передаю команде или заказчику.<br><br><b>Какие артефакты я создаю:</b><br>1. <b>Текстовые документы / ТЗ / Постановки задач в Jira:</b> Основной носитель логики.<br>2. <b>Диаграммы (BPMN, UML Sequence, ERD):</b> Визуальное представление процессов и архитектуры.<br>3. <b>Спецификации API (OpenAPI/Swagger):</b> Контракты интеграции для разработчиков.<br>4. <b>Макеты прототипов (Figma / Balsamiq):</b> Для согласования интерфейсов с бизнесом.<br>5. <b>Маппинг-таблицы (Mapping):</b> Таблицы соответствия полей между разными системами.<br>6. <b>Бизнес-правила (Decision Tables):</b> Для сложной алгоритмической логики.<br><br><b>Кто является пользователями (потребителями) этих артефактов:</b><br>• <b>Разработчики (Dev):</b> Используют мои диаграммы и ТЗ как инструкцию для написания кода.<br>• <b>Тестировщики (QA):</b> Используют мои критерии приемки для написания тест-кейсов.<br>• <b>Бизнес-заказчик / PO:</b> Используют мои прототипы и верхнеуровневые диаграммы, чтобы убедиться, что мы делаем то, что нужно.<br>• <b>Архитекторы:</b> Используют мои схемы интеграций для оценки нагрузок."
    },
    {
        id: "q18",
        category: "requirements",
        question: "18. Что должен включать шаблон постановки? Как выглядит твоя постановка?",
        answer: "<h3>Мой шаблон постановки задачи (Шаблон ТЗ)</h3>Я структурирую свои задачи так, чтобы разработчик мог взять их в работу без лишних вопросов, а тестировщик — сразу начать писать тесты. Мой шаблон в Jira/Confluence выглядит так:<br><br><b>1. Контекст и цель (Зачем?):</b> Краткое описание бизнес-проблемы, которую решает задача. 'Сейчас клиенты уходят на этапе оплаты, потому что... Поэтому мы внедряем...'<br><br><b>2. Функциональные требования (Что?):</b> Описание логики работы.<br>   • <i>User Story:</i> 'Как [роль], я хочу...'<br>   • <i>Критерии приемки (AC):</i> Список четких условий (в формате Given-When-Then или просто маркированный список).<br>   • <i>Use Case (если сложно):</i> Пошаговый сценарий.<br><br><b>3. UI/UX требования (Как выглядит?):</b> Ссылка на макет в Figma. Описание поведения элементов: что происходит при наведении, при ошибке валидации, как меняется состояние кнопки.<br><br><b>4. Требования к интеграциям и данным (Бэкенд):</b> Какие API вызываются (метод, URL, тело запроса/ответа). Какие изменения в БД (новые таблицы, поля).<br><br><b>5. Нефункциональные требования (НФТ):</b> Требования к производительности (таймауты), безопасности (кто имеет доступ) и логированию.<br><br><b>6. Критерии приемки для QA (DoD):</b> Что должно быть сделано, чтобы считать задачу закрытой (автотесты написаны, документация обновлена)."
    },
    {
        id: "q19",
        category: "requirements",
        question: "19. Что нужно описать в постановке для пользовательского интерфейса (Frontend)? Приведи пример.",
        answer: "<h3>Постановка для Frontend (UI/UX)</h3>Многие аналитики ошибочно думают, что фронтенд-задача — это просто 'сверстать как на макете'. На самом деле нужно описать поведение. Я всегда добавляю в ТЗ для фронта следующие разделы:<br><br><b>1. Ссылка на макет (Figma) и соответствие дизайн-системе.</b><br><br><b>2. Поведение элементов (Состояния):</b><br>• <i>Default:</i> Как выглядит поле ввода.<br>• <i>Focus:</i> Подсветка при клике.<br>• <i>Error:</i> Как и когда появляется красная рамка и текст ошибки.<br>• <i>Disabled:</i> При каких условиях кнопка становится серой и неактивной.<br>• <i>Loading:</i> Что происходит во время запроса к серверу (спиннер, блокировка экрана).<br><br><b>3. Валидация полей:</b><br>• Какие поля обязательны?<br>• Какие маски ввода (например, для телефона: +7 (999) 999-99-99).<br>• Какие сообщения об ошибках показывать и под какими полями.<br><br><b>4. Бизнес-логика на фронте:</b> Изменение одного поля должно влиять на другие поля без перезагрузки страницы.<br><br><b>Пример из практики:</b> 'На форме 'Оформление заказа': поле 'Сумма' является обязательным, принимает только цифры и не более 2 знаков после запятой. При вводе суммы, превышающей лимит карты (лимит приходит с бэка), кнопка 'Оплатить' должна блокироваться, а под полем появляться текст: 'Превышен суточный лимит'."'
    },

        id: "q20",
        category: "requirements",
        question: "20. Что должно включать описание интеграции?",
        answer: "<h3>Описание интеграции (Backend-to-Backend)</h3>Когда мы интегрируем нашу систему с внешней (или между микросервисами), я оформляю раздел в ТЗ как полноценный контракт. Он должен содержать:<br><br><b>1. Архитектурная схема взаимодействия:</b> Кто инициатор (наша система или внешняя)? Синхронное или асинхронное взаимодействие (REST vs Kafka)?<br><br><b>2. Протокол и формат данных:</b> REST (HTTP/JSON) или SOAP (XML), или gRPC (Protobuf).<br><br><b>3. Спецификация API (Контракт):</b><br>• <b>Метод и URL:</b> Например, POST /api/v1/payment/status<br>• <b>Заголовки (Headers):</b> Content-Type, Authorization (как передаем токен).<br>• <b>Тело запроса (Request Body):</b> JSON-схема с типами данных, обязательностью полей и описанием (маппинг).<br>• <b>Тело ответа (Response Body):</b> Структура успешного ответа (200) и структура ошибок (400, 500).<br><br><b>4. Маппинг данных:</b> Таблица, где написано: 'Поле 'order_id' из нашей системы = поле 'external_id' в системе банка'.<br><br><b>5. Обработка ошибок и исключений:</b> Что делает наша система, если внешняя вернула таймаут? Повторяем запрос (Retry)? Как часто? Что делаем при ошибке 403 (Доступ запрещен)?"

    {
        id: "q21",
        category: "modeling",
        question: "1. Какие нотации моделирования знаешь? Какими владеешь и используешь на практике? Для чего?",
        answer: "<h3>Нотации моделирования в моей практике</h3>Я работаю с тремя основными нотациями, покрывающими разные аспекты проекта:<br><br><b>1. BPMN 2.0 (Business Process Model and Notation):</b> Использую для моделирования бизнес-процессов верхнего уровня. Она понятна бизнес-заказчикам, потому что показывает логику работы организации (кто за что отвечает, в какой последовательности идут шаги). На практике это мой основной инструмент для построения диаграммы As-Is (как сейчас) и To-Be (как будет).<br><br><b>2. UML (Unified Modeling Language):</b> Использую для технического проектирования. Конкретно:<br>   • <i>UML Sequence Diagram:</i> Для описания интеграций (кто, кому и в какой последовательности отправляет запросы).<br>   • <i>UML Use Case Diagram:</i> Для фиксации границ системы и ролей пользователей на старте проекта.<br>   • <i>UML Class/ER Diagram:</i> Для моделирования структуры базы данных.<br><br><b>3. ERD (Entity-Relationship Diagram):</b> Строго для проектирования реляционной БД. Показывает сущности, атрибуты и связи между таблицами.<br><br><b>Почему я не использую IDEF0:</b> Знаю теоретически, но на практике он слишком громоздкий для современных Agile-команд, уступая связке BPMN + UML."

    {
        id: "q22",
        category: "modeling",
        question: "2. Для чего используются UML и BPMN?",
        answer: "<h3>Разница в применении UML и BPMN</h3>Хотя обе нотации визуальные, у них совершенно разная аудитория и задачи:<br><br><b>1. BPMN (Business Process Model and Notation):</b><br>• <b>Для кого:</b> Для бизнес-аналитиков, менеджеров процессов и заказчиков.<br>• <b>Суть:</b> Описывает <b>бизнес-логику и последовательность действий</b> в организации. Показывает, как работают люди и отделы (Swimlanes).<br>• <b>Вопрос, на который отвечает:</b> 'Как устроен бизнес-процесс от начала до конца?'.<br>• <b>Пример:</b> Процесс обработки заказа: от звонка клиента до отгрузки товара со склада.<br><br><b>2. UML (Unified Modeling Language):</b><br>• <b>Для кого:</b> Для системных аналитиков, архитекторов и разработчиков.<br>• <b>Суть:</b> Описывает <b>структуру и поведение программного кода</b>. Показывает, как классы связаны друг с другом, какие методы вызываются, как данные хранятся в объектах.<br>• <b>Вопрос, на который отвечает:</b> 'Как устроен код системы?'.<br>• <b>Пример:</b> Диаграмма классов, описывающая сущности 'Заказ', 'Пользователь', 'Товар' и их методы.<br><br><b>Мой подход:</b> Я начинаю с BPMN (чтобы договориться с бизнесом), а затем детализирую сложные узлы через UML Sequence (чтобы объяснить разработчикам, как вызывать API)."

    {
        id: "q23",
        category: "modeling",
        question: "3. Что такое BPMN? Из каких основных элементов состоит BPMN-диаграмма?",
        answer: "<h3>Основы BPMN 2.0</h3><b>BPMN</b> — это стандарт графической нотации для моделирования бизнес-процессов. Он разработан так, чтобы быть понятным как для бизнес-пользователей, так и для IT-специалистов.<br><br><b>Основные строительные блоки (элементы) BPMN:</b><br><br>1. <b>Flow Objects (Объекты потока) — главные элементы:</b><br>   • <b>События (Events):</b> Кружки. Обозначают, что произошло. Начало (старт), промежуточное (ожидание, таймер), конец (финиш).<br>   • <b>Задачи (Activities/Tasks):</b> Прямоугольники со скругленными углами. Обозначают конкретное действие, которое кто-то выполняет ('Проверить документы', 'Отправить письмо').<br>   • <b>Шлюзы (Gateways):</b> Ромбы. Обозначают ветвления и слияния потоков (if/else, параллельное выполнение).<br><br>2. <b>Connecting Objects (Связи):</b> Стрелки, которые показывают порядок выполнения.<br>   • <i>Сплошная линия со стрелкой:</i> Поток управления (Sequence Flow).<br>   • <i>Пунктирная линия:</i> Поток сообщений (Message Flow) — обмен между разными пулами.<br><br>3. <b>Swimlanes (Дорожки):</b> Контейнеры для группировки задач по исполнителям.<br>   • <b>Пул (Pool):</b> Большой контейнер, обозначающий организацию или систему.<br>   • <b>Дорожка (Lane):</b> Подразделение внутри пула (например, 'Отдел продаж', 'Бухгалтерия').<br><br>4. <b>Артефакты (Artifacts):</b> Аннотации и объекты данных (документы)."
    },
    {
        id: "q24",
        category: "modeling",
        question: "4. Какие есть типы шлюзов (Gateway) в BPMN?",
        answer: "<h3>Типы шлюзов в BPMN</h3>Шлюзы — это ромбы на диаграмме, которые управляют разветвлением и слиянием потоков. На практике я использую 4 основных типа:<br><br><b>1. Исключающий шлюз (Exclusive Gateway - X):</b> Самый частый. Поток идет только ПО ОДНОЙ ветке, условие которой выполнилось первым ('ИЛИ'). Используется для простых развилок: 'Если сумма > 1000 руб., то одобрить, иначе — отклонить'.<br><br><b>2. Параллельный шлюз (Parallel Gateway - +):</b> Запускает ВСЕ ветки одновременно. Используется, когда нужно выполнить несколько независимых действий одновременно ('Отправить письмо клиенту' И 'Зарезервировать товар на складе'). При слиянии ждет завершения всех веток.<br><br><b>3. Включающий шлюз (Inclusive Gateway - O):</b> Активирует ОДНУ ИЛИ НЕСКОЛЬКО веток, если их условия верны. Это как 'ИЛИ' с несколькими вариантами. Например: 'Если клиент VIP -> отправить менеджера; Если заказ срочный -> отправить курьером'. Может выполниться 0, 1 или 2 действия.<br><br><b>4. Шлюз по событию (Event-Based Gateway):</b> Ветвление зависит от того, какое внешнее событие (таймер или сообщение) наступит быстрее. Например: 'Ждем либо ответа от банка, либо таймаута 10 секунд'."
    },
    {
        id: "q25",
        category: "modeling",
        question: "5. Какие есть события (Events) в BPMN?",
        answer: "<h3>События в BPMN (Старт, Промежуточные, Конец)</h3>События в BPMN — это 'триггеры', которые влияют на ход процесса. Они делятся на три типа в зависимости от момента возникновения:<br><br><b>1. Стартовые события (Начало):</b> Инициируют процесс. Изображаются одним тонким кругом.<br>   • <i>Простой старт:</i> Процесс запускается вручную.<br>   • <i>Старт по таймеру:</i> Процесс запускается по расписанию (например, ежедневный отчет в 9:00).<br>   • <i>Старт по сообщению:</i> Процесс запускается при получении внешнего сигнала (например, пришло новое сообщение из очереди).<br><br><b>2. Промежуточные события (Внутри процесса):</b> Происходят во время выполнения. Изображаются двойным тонким кругом. Могут быть 'ловить' (ожидать) или 'бросать' (генерировать).<br>   • <i>Таймер:</i> Установка задержки (например, 'Ждать 5 минут').<br>   • <i>Сообщение:</i> Ожидание ответа от внешней системы.<br>   • <i>Ошибка (Error):</i> Генерация исключения (перехватывается граничным событием).<br><br><b>3. Конечные события (Финиш):</b> Завершают поток. Изображаются кругом с жирной границей.<br>   • <i>Простой конец:</i> Процесс завершен.<br>   • <i>Конец-ошибка:</i> Процесс прерывается из-за ошибки.<br>   • <i>Конец-сигнал:</i> Генерирует сигнал для запуска другого процесса."
    },
    {
        id: "q26",
        category: "modeling",
        question: "6. Какие есть виды диаграмм в UML? Какими пользуешься?",
        answer: "<h3>Виды диаграмм UML и мой набор</h3>Всего в UML 14 типов диаграмм, которые делятся на структурные (статическая архитектура) и поведенческие (динамика). На практике я использую 3-4 типа, которые дают 80% пользы.<br><br><b>Какие UML-диаграммы я использую на проектах:</b><br><br><b>1. Диаграмма последовательности (Sequence Diagram):</b> <b>Самый важный инструмент аналитика.</b> Показывает обмен сообщениями между объектами во времени. Использую для описания интеграций (REST-вызовы) и сложной бэкенд-логики.<br><br><b>2. Диаграмма вариантов использования (Use Case Diagram):</b> Использую на старте проекта, чтобы показать границы системы и кто (какие роли) будет с ней взаимодействовать.<br><br><b>3. Диаграмма классов (Class Diagram):</b> Использую для статического моделирования структуры данных (атрибуты, методы, связи между классами). Часто выступает как альтернатива ERD для ООП-проектов.<br><br><b>4. Диаграмма деятельности (Activity Diagram):</b> Похожа на блок-схему или упрощенный BPMN. Использую, когда нужно показать сложный алгоритм работы одного метода или системы (без привязки к ролям).<br><br><b>Что я не использую:</b> Диаграммы компонентов и развертывания (это больше для архитекторов), диаграммы состояний (редко, обычно хватает таблицы статусов)."
    },
    {
        id: "q27",
        category: "modeling",
        question: "7. Что такое диаграмма последовательности (Sequence Diagram)? Что она описывает и показывает?",
        answer: "<h3>UML Sequence Diagram (Диаграмма последовательности)</h3>Это поведенческая диаграмма UML, которая фокусируется на <b>хронологическом порядке обмена сообщениями</b> между объектами (классами, компонентами, микросервисами).<br><br><b>Что она показывает:</b><br>1. <b>Участников (Lifeline):</b> Объекты/системы, участвующие во взаимодействии. Отображаются в виде вертикальных пунктирных линий.<br>2. <b>Время:</b> Чтение диаграммы идет сверху вниз. Чем ниже стрелка, тем позже происходит действие.<br>3. <b>Сообщения:</b> Стрелки между линиями жизни. Показывают, кто кому отправляет запрос, какие параметры передает и какой ответ ожидает.<br>4. <b>Фокусы управления (Activation Bars):</b> Прямоугольники на линиях жизни, показывающие, что объект в данный момент активен и выполняет логику.<br><br><b>Пример использования:</b> Я рисую Sequence, когда нужно объяснить разработчикам, как именно проходит процесс 'Оплата заказа':<br>1. Frontend -> API Gateway (POST /pay).<br>2. API Gateway -> Payment Service (валидация).<br>3. Payment Service -> Bank API (запрос на списание).<br>4. Bank API -> Payment Service (ответ: Успех).<br>5. Payment Service -> Order Service (обновление статуса заказа).<br>6. Order Service -> Database (сохранение статуса).<br><br>Эта диаграмма сразу показывает, что у нас есть синхронные вызовы и где могут возникнуть задержки."
    },
    {
        id: "q28",
        category: "modeling",
        question: "8. Какие есть элементы синтаксиса в Sequence-диаграмме?",
        answer: "<h3>Основные элементы синтаксиса Sequence Diagram</h3>Чтобы разработчики и архитекторы понимали мои диаграммы, я всегда использую стандартные элементы UML. Вот моя шпаргалка:<br><br><b>1. Участники (Lifeline):</b> Вертикальная пунктирная линия. Наверху — имя объекта/класса. Подписывается в формате: `ИмяОбъекта: Класс`.<br><br><b>2. Синхронное сообщение (Synchronous Call):</b> Сплошная линия с закрашенным треугольником на конце. Отправитель <b>ждет</b> ответа от получателя, блокируя выполнение. (Самый частый тип в REST API).<br><br><b>3. Ответное сообщение (Reply):</b> Пунктирная линия со стрелкой. Возврат данных от получателя к отправителю. Обычно рисуется как возврат из активации.<br><br><b>4. Асинхронное сообщение (Asynchronous Call):</b> Сплошная линия с открытым наконечником (как у стрелки). Отправитель продолжает работу <b>не дожидаясь</b> ответа. (Используется при отправке в Kafka/RabbitMQ).<br><br><b>5. Фрагменты (Combined Fragments):</b> Рамки для управления логикой.<br>   • `alt (Альтернатива)`: if/else. Две области, разделенные пунктирной линией.<br>   • `loop (Цикл)`: Повторение действий.<br>   • `opt (Опционально)`: Блок, который выполняется только при соблюдении условия.<br>   • `par (Параллельно)`: Две последовательности, выполняющиеся параллельно.<br><br><b>6. Активация (Activation Bar):</b> Тонкий прямоугольник на линии жизни, обозначающий период выполнения операции."
    },
    {

        category: "modeling",
        question: "9. Что такое Use Case диаграмма? Какие у неё есть элементы?",
        answer: "<h3>UML Use Case Diagram (Диаграмма вариантов использования)</h3>Это статическая диаграмма, которая показывает, <b>какой функционал</b> система предоставляет внешнему миру и <b>кто</b> (какие роли) этим функционалом пользуется. Она не показывает внутреннюю логику или последовательность шагов — только границы системы и связи ролей с функциями.<br><br><b>Основные элементы Use Case диаграммы:</b><br><br><b>1. Актер (Actor):</b> Фигурка человечка или прямоугольник с надписью. Роль пользователя или внешней системы, которая взаимодействует с системой. <i>Примеры:</i> 'Покупатель', 'Администратор', 'Банк-эквайер'.<br><br><b>2. Use Case (Вариант использования):</b> Овал с названием действия внутри. Конкретная функция системы. <i>Примеры:</i> 'Оформить заказ', 'Войти в систему', 'Оплатить корзину'.<br><br><b>3. Границы системы (System Boundary):</b> Прямоугольник, внутри которого находятся все Use Case'ы, а снаружи — Актеры.<br><br><b>4. Связи (Relationships):</b><br>   • <b>Ассоциация (Association):</b> Сплошная линия между Актером и Use Case'ом (показывает, что актер использует эту функцию).<br>   • `<<include>>` **(Включение):** Пунктирная стрелка со стереотипом. Означает, что один Use Case <b>обязательно</b> включает в себя другой. <i>Пример:</i> 'Оплатить заказ' включает 'Авторизовать пользователя'.<br>   • `<<extend>>` **(Расширение):** Пунктирная стрелка. Означает, что один Use Case расширяет другой в определенных условиях. <i>Пример:</i> 'Внести депозит' расширяет 'Оплатить заказ' (только если выбран способ оплаты 'Бонусный счет').<br>   • <b>Генерализация:</b> Стрелка от дочернего актера к родительскому (например, 'VIP-клиент' наследует права 'Клиента')."
    },
    {
        id: "q30",
        category: "modeling",
        question: "10. Что такое ER-диаграмма? Приходилось ли строить?",
        answer: "<h3>ER-диаграмма (Entity-Relationship Diagram)</h3>Это модель данных, которая используется для проектирования реляционных баз данных. Она показывает, из каких таблиц (сущностей) состоит БД, какие у них поля (атрибуты) и как таблицы связаны между собой (связи).<br><br><b>Из чего состоит ERD:</b><br>1. <b>Сущности (Entity):</b> Прямоугольники. Обозначают таблицы в БД (<i>Например, 'Пользователи', 'Заказы'</i>).<br>2. <b>Атрибуты (Attributes):</b> Список полей внутри сущности, с указанием первичного ключа (PK) и внешних ключей (FK).<br>3. <b>Связи (Relationships):</b> Линии между сущностями с указанием кардинальности (1:1, 1:M, M:M).<br><br><b>Когда я строю ERD на практике:</b><br>1. Когда нужно спроектировать новую фичу, которая требует создания новых таблиц.<br>2. Когда нужно изменить существующую схему (добавить новые поля, изменить типы данных).<br>3. Для документирования текущей структуры БД для команды.<br><br><b>Пример из практики (Для интернет-магазина):</b> Я строю ERD, где есть сущность 'Заказы' (поля: id, user_id, total_sum, status) и сущность 'Товары' (поля: id, name, price). Связь между ними через промежуточную таблицу 'Заказы_Товары' (M:M), чтобы можно было хранить несколько товаров в одном заказе. Передаю эту схему разработчику, чтобы он написал миграцию в PostgreSQL."
    },
    {
        id: "q31",
        category: "modeling",
        question: "11. В чём разница между Class Diagram и ER Diagram?",
        answer: "<h3>Class Diagram vs ERD: Детальное сравнение</h3>Это два вида диаграмм, которые часто путают. Они отвечают за разные слои архитектуры.<br><br><b>1. По назначению:</b><br>• <b>Class Diagram (UML):</b> Относится к <b>миру кода (ООП)</b>. Моделирует структуру программных классов, их атрибуты (поля), методы (функции) и связи (наследование, композиция).<br>• <b>ERD (Entity-Relationship Diagram):</b> Относится к <b>миру данных (СУБД)</b>. Моделирует структуру хранения данных в реляционной базе: таблицы, столбцы, типы данных (VARCHAR, INT) и первичные/внешние ключи.<br><br><b>2. По содержанию:</b><br>• <b>Class Diagram:</b> Содержит методы и операции, которые не хранятся в БД (<i>Пример: метод calculateDiscount()</i>).<br>• <b>ERD:</b> Содержит только чистые данные. Здесь нет методов, только поля и типы данных (<i>Пример: поле 'price' типа NUMERIC(10,2)</i>).<br><br><b>3. По связям:</b><br>• <b>Class Diagram:</b> Связи могут быть агрегацией и композицией (цепочки создания объектов).<br>• <b>ERD:</b> Связи определяются строго через внешние ключи (FK) и кардинальность (один-ко-многим).<br><br><b>Важно:</b> ERD — это отражение 'сырых' данных, Class Diagram — это бизнес-логика над этими данными. Они часто пересекаются, но не являются взаимозаменяемыми."
    }
];

{
    id: "q95",

    question: "1. Что такое клиент-серверная архитектура?",
    answer: `<h3>Клиент-серверная архитектура</h3>
    <p><b>Определение:</b> Это модель распределенного взаимодействия, в которой система делится на две логические части: <b>Клиента</b> (инициатор запросов) и <b>Сервера</b> (исполнитель запросов).</p>
    <p><b>Клиент:</b> Отвечает за пользовательский интерфейс (UI), отправляет запросы на сервер и получает данные для отображения. <i>Примеры:</i> Браузер, мобильное приложение, десктопная программа.</p>
    <p><b>Сервер:</b> Отвечает за бизнес-логику, вычисления, хранение данных и безопасность. Он принимает запросы от клиентов, обрабатывает их и возвращает ответы. <i>Примеры:</i> Веб-сервер (Nginx), Сервер приложений (Tomcat), База данных (PostgreSQL).</p>
    <p><b>Ключевое преимущество:</b> Масштабируемость — мы можем усилить сервер (или добавить несколько серверов), не трогая клиентские приложения, и наоборот.</p>`
},
{
    id: "q96",

    question: "2. Какие есть виды архитектуры / архитектурные паттерны? Какая архитектура у тебя на проекте?",
    answer: `<h3>Виды архитектур и мой проект</h3>
    <p><b>Основные архитектурные стили:</b></p>
    <ul>
        <li><b>Монолит (Monolith):</b> Вся логика, интерфейс и БД собраны в одном развертываемом артефакте (одном .jar/.war файле).</li>
        <li><b>Сервис-ориентированная (SOA):</b> Крупные сервисы, интегрированные через 'умную' шину данных (ESB).</li>
        <li><b>Микросервисная (MSA):</b> Набор мелких независимых сервисов, каждый со своей БД, общающихся через REST или брокеры.</li>
        <li><b>Событийно-ориентированная (EDA):</b> Взаимодействие через асинхронные события (Kafka).</li>
        <li><b>Бессерверная (Serverless):</b> Функции как сервис (AWS Lambda).</li>
    </ul>
    <p><b>На моем текущем проекте:</b> Мы используем <b>микросервисную архитектуру</b>. У нас есть около 10 микросервисов (Заказы, Платежи, Пользователи, Уведомления). Они общаются синхронно через REST API (для операций, требующих мгновенного ответа) и асинхронно через Kafka (для событий, типа 'Заказ создан'). Входная точка для фронтенда — API Gateway (Kong).</p>`
},
{
    id: "q97",
    category: "architecture",
    question: "3. Что такое монолит? Что такое распределённый монолит?",
    answer: `<h3>Монолит и его анти-паттерн</h3>
    <p><b>Монолит (Monolith):</b> Это архитектура, при которой все компоненты приложения (UI, бизнес-логика, доступ к данным) собираются в единый исполняемый файл и развертываются как одно целое. <i>Плюсы:</i> Простота разработки на старте, легкий деплой (один файл), быстрый внутренний вызов методов (без сетевых задержек).</p>
    <p><b>Распределённый монолит (Distributed Monolith):</b> Это <b>антипаттерн</b>. Систему физически разделили на несколько сервисов (деплоят отдельно), но оставили их жестко связанными на уровне логики. Они общаются друг с другом синхронными REST-вызовами, и при каждом изменении нужно деплоить сразу несколько сервисов в правильном порядке. Падение одного сервиса может 'потянуть' за собой всю цепочку.</p>
    <p><b>На практике:</b> Я всегда слежу за тем, чтобы наши микросервисы были слабо связаны (через асинхронные события) и имели четкие границы (Bounded Context).</p>`
},

    question: "4. Что такое микросервисы? В чём заключается независимость микросервисов?",
    answer: `<h3>Микросервисная архитектура (MSA)</h3>
    <p><b>Определение:</b> Это стиль архитектуры, при котором приложение строится как набор небольших автономных сервисов, каждый из которых реализует одну бизнес-способность (например, 'Управление заказами' или 'Аутентификация').</p>

        <li><b>Собственная БД:</b> Каждый микросервис владеет своей базой данных. Другие сервисы могут получить данные только через API этого сервиса (изоляция данных).</li>
        <li><b>Разные стеки технологий:</b> Один сервис может быть написан на Java, другой на Go, третий на Python — это не проблема, пока они общаются по стандартным протоколам (REST/HTTP).</li>
    </ul>`
},
{
    id: "q99",
    category: "architecture",
    question: "5. Чем отличается сервис от микросервиса?",
    answer: `<h3>Сервис vs Микросервис</h3>
    <p>Граница между этими понятиями размыта, но есть концептуальная разница:</p>
    <p><b>Сервис (Service) — в контексте SOA:</b></p>
    <ul>
        <li>Отвечает за <b>масштабную бизнес-функцию</b> (например, 'Управление клиентами' или 'Бухгалтерский учет').</li>
        <li>Может делиться БД с другими сервисами.</li>
        <li>Обычно крупнее по объему кода и функционала.</li>
    </ul>
    <p><b>Микросервис (Microservice) — в контексте MSA:</b></p>
    <ul>
        <li>Отвечает за <b>одну конкретную задачу</b> (Single Responsibility). <i>Пример:</i> Сервис 'Отправка SMS' или 'Генерация QR-кодов'.</li>
        <li><b>Всегда имеет изолированную БД</b> (никто не лезет в его БД напрямую).</li>
        <li>Максимально гранулярен и может быть написан на отдельном языке.</li>
    </ul>
    <p><b>Пример:</b> В SOA у вас будет один крупный сервис 'CRM'. В MSA вы разделите его на микросервисы: 'Управление контактами', 'Управление сделками', 'Управление задачами'.</p>`
},
{
    id: "q100",
    category: "architecture",
    question: "6. В чём отличие монолита и микросервисов? Плюсы/минусы? Когда лучше выбрать монолит и когда стоит уходить от монолита в микросервисы?",
    answer: `<h3>Монолит vs Микросервисы: Битва подходов</h3>
    <p><b>Сравнение:</b></p>
    <ul>
        <li><b>Сложность разработки:</b> Монолит прост в начале (рефакторинг легко делается), микросервисы сложны (нужно управлять сетью, сериализацией, транзакциями).</li>
        <li><b>Масштабирование:</b> Монолит масштабируется только целиком (весь ворох фич), микросервисы — точечно (только нагруженный кусок).</li>
        <li><b>Отказоустойчивость:</b> В монолите ошибка в одном модуле может уронить всё приложение. В микросервисах изоляция сбоев лучше.</li>
        <li><b>Команда:</b> Монолит подходит маленькой команде (до 10 разработчиков), микросервисы — для больших команд, разделенных по доменам.</li>
    </ul>
    <p><b>Когда выбирать монолит (Старт):</b> Для MVP, стартапов, когда бизнес-логика еще не стабильна. Начинать с микросервисов, не имея четких границ, — 'золотая лопата'.</p>
    <p><b>Когда уходить в микросервисы:</b> Когда монолит превращается в 'бога' (размер > 1 млн строк кода), релизы занимают недели, а команда выросла до 30+ человек и постоянно конфликтует в Git.</p>`
},
{
    id: "q101",
    category: "architecture",
    question: "7. В чём преимущества и недостатки микросервисной архитектуры?",
    answer: `<h3>Плюсы и минусы MSA</h3>
    <p><b>Преимущества (Почему мы их любим):</b></p>

        <li><b>Технологическая гибкость:</b> Можно написать новый сервис на Go, если он лучше подходит для высокой нагрузки, оставив старый на Java.</li>
        <li><b>Изоляция сбоев:</b> Если сервис 'Уведомления' упал, это не остановит прием заказов.</li>
        <li><b>Точечное масштабирование:</b> Масштабируем только узкие места.</li>
    </ul>
    <p><b>Недостатки (Цена сложности):</b></p>
    <ul>
        <li><b>Сетевая задержка:</b> Вместо вызова метода (в памяти) вы делаете HTTP-запрос по сети (миллисекунды).</li>
        <li><b>Распределенные транзакции:</b> Обеспечить атомарность (ACID) между двумя сервисами очень сложно. Приходится использовать паттерн Saga.</li>
        <li><b>Мониторинг и отладка:</b> Трассировка запроса, проходящего через 5 сервисов, требует сложных инструментов (Jaeger, Zipkin).</li>
        <li><b>Управление конфигурациями:</b> Нужно управлять настройками десятков сервисов (Consul / Spring Cloud Config).</li>
    </ul>`
