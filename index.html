<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер Системного Аналитика</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg-front: #ffffff;
            --card-bg-back: #ffffff;
            --text-color: #1c1e21;
            --accent-color: #0052cc;
            --secondary-text: #65676b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 5px;
            text-align: center;
            color: var(--accent-color);
        }

        .progress {
            font-size: 13px;
            color: var(--secondary-text);
            margin-bottom: 10px;
        }

        .card-container {
            width: 100%;
            max-width: 700px;
            height: 480px;
            perspective: 1500px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            border-radius: 20px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 35px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .card-front {
            background-color: var(--card-bg-front);
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
        }

        .card-front::after {
            content: "Кликните, чтобы посмотреть ответ";
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-back {
            background-color: var(--card-bg-back);
            transform: rotateY(180deg);
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
            border-top: 5px solid var(--accent-color);
        }

        .card-back h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card-back b { color: #000; }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }

        button {
            flex: 1;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        @media (max-height: 600px) {
            .card-container { height: 350px; }
            .card-front { font-size: 18px; }
        }
    </style>
</head>
<body>

    <h1>Тренажер: Системный Анализ</h1>
    <div class="progress" id="progress">Загрузка...</div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front" id="question-text">Загрузка...</div>
            <div class="card-face card-back" id="answer-text">Загрузка...</div>
        </div>
    </div>

    <div class="controls">
        <button id="prev-btn" onclick="prevCard(event)" disabled>Назад</button>
        <button id="next-btn" onclick="nextCard(event)">Вперед</button>
    </div>

    <script>
        const flashcards = [
            // БЛОК 1: ТРЕБОВАНИЯ И СТЕЙКХОЛДЕРЫ
            {
                question: "1. Кто такие стейкхолдеры? Кто является стейкхолдерами для тебя? С какими группами заинтересованных лиц общался?",
                answer: "<h3>Стейкхолдеры (Заинтересованные лица)</h3><b>Кто это:</b> Лица или группы, которые влияют на проект или на которых влияет сам проект.<br><b>Для меня стейкхолдеры:</b> Заказчики бизнеса, конечные пользователи, разработчики, тестировщики, ИБ-специалисты, менеджер проекта.<br><b>Опыт общения:</b> На практике общался с <i>Бизнес-заказчиками</i> (сбор требований, прояснение болей), <i>Разработчиками/Архитекторами</i> (согласование технической реализуемости) и <i>Тестировщиками</i> (передача требований, разбор тест-кейсов)."
            },
            {
                question: "2. Какие виды требований знаешь? Можешь привести примеры? С какими видами работаешь?",
                answer: "<h3>Виды требований (по BABOK / ISO)</h3><b>1. Бизнес-требования:</b> Глобальные цели бизнеса (<i>Пример: Увеличить прибыль АЗС на 15% за счет автоматизации</i>).<br><b>2. Требования стейкхолдеров (пользовательские):</b> Что нужно пользователю (<i>Пример: Водитель хочет оплачивать бензин картой</i>).<br><b>3. Решения (Решения бывают Функциональные и Нефункциональные):</b> Детали работы системы.<br><b>4. Транзитные (переходные):</b> Нужны временно для запуска.<br><b>С чем работаю на практике:</b> В основном перевожу пользовательские требования на язык системных решений (пишу ФТ и НФТ)."
            },
            {
                question: "3. Что входит в функциональные требования? Приведи примеры.",
                answer: "<h3>Функциональные требования (ФТ)</h3>Описывают поведение системы — что она должна делать в ответ на действия пользователя или события.<br><br><b>Что входит:</b> Описание бизнес-логики, сценарии использования, правила валидации данных, структура отчетов, интеграционные вызовы.<br><b>Примеры:</b><br>• Система должна отправлять чек на email пользователя после успешной оплаты.<br>• При вводе невалидного промокода система должна отображать ошибку: 'Промокод не существует'."
            },
            {
                question: "4. Что входит в нефункциональные требования? Приведи примеры.",
                answer: "<h3>Нефункциональные требования (НФТ)</h3>Описывают свойства, характеристики качества и ограничения системы (атрибуты качества).<br><br><b>Что входит:</b> Производительность, надежность, безопасность, юзабилити, масштабируемость, требования к доступности.<br><b>Примеры:</b><br>• <i>Производительность:</i> Время отклика API на запрос авторизации не должно превышать 500 мс под нагрузкой.<br>• <i>Доступность:</i> Система должна быть доступна 99.9% времени в режиме 24/7."
            },
            {
                question: "5. В чём отличие функциональных и нефункциональных требований?",
                answer: "<h3>Отличие ФТ от НФТ</h3><b>ФТ (Что делает):</b> Это конкретные функции и фичи. Если их убрать, система потеряет смысл (например, приложение такси не ищет машину). Напрямую проверяются бинарно (Да/Нет).<br><br><b>НФТ (Как делает):</b> Это ограничения и рамки качества (скорость, безопасность, дизайн под перчатки). Пронизывают всю архитектуру системы. Напрямую измеряются в метриках (секунды, проценты, градусы)."
            },
            {
                question: "6. Какая классификация нефункциональных требований? Какие нефункциональные требования описываешь на практике?",
                answer: "<h3>Классификация НФТ (ISO 25010)</h3>Основные группы: <b>Product Quality</b> (Performance, Usability, Reliability, Security), <b>Maintainability/Portability</b> (как легко развивать и переносить) и <b>External/Legal Constraints</b> (законы, например, ФЗ-152).<br><br><b>Что описываю на практике:</b> Чаще всего фиксирую <i>Performance</i> (время отклика API, нагрузка), <i>Security</i> (ролевая модель, маскирование данных карт) и <i>Usability</i> (адаптивность под мобилки)."
            },
            {
                question: "7. Что такое транзитные (переходные) требования?",
                answer: "<h3>Транзитные требования (Transition Requirements)</h3>Это <b>временные</b> требования, которые описывают возможности, необходимые для перевода системы из текущего состояния в целевое.<br><br><b>Ключевое свойство:</b> Они теряют актуальность сразу после успешного внедрения новой системы.<br><b>Примеры:</b><br>• Миграция исторических данных клиентов из старой СУБД в новую.<br>• Обучение 20 операторов поддержке пользователей до даты релиза."
            },
            {
                question: "8. Какие есть способы (методы) сбора требований? Какие используешь на практике?",
                answer: "<h3>Способы сбора требований</h3><b>Основные методы:</b> Интервью, Воркшопы (сессии), Мозговой штурм, Опросы/Анкетирование, Наблюдение (Shadowing), Анализ документов, Обратный инжиниринг (изучение старой системы), Прототипирование.<br><br><b>На практике использую:</b> 1) <i>Интервью</i> с бизнес-заказчиком для базовых требований; 2) <i>Анализ документов и API конкурентов</i> для погружения; 3) <i>Прототипирование в Figma</i>, чтобы быстро согласовать логику интерфейса."
            },
            {
                question: "9. В каких документах описываются требования? Какие способы описания требований знаешь?",
                answer: "<h3>Документы и способы описания требований</h3><b>Документы:</b> BRD (Бизнес-требования), PRD (Продуктовые требования), SRS (Техспецификация), ТЗ по ГОСТ (34 или 19), Постановки в Jira/Confluence.<br><br><b>Способы описания:</b> Текстовый (естественный язык), Пользовательские истории (User Story), Сценарии (Use Case), Таблицы принятия решений (Decision Tables), Графические диаграммы (UML Use Case/Sequence/Activity, BPMN)."
            },
            {
                question: "10. Что такое User story? Можешь привести пример? Применяешь ли на практике? Какие преимущества?",
                answer: "<h3>User Story (Пользовательская история)</h3>Краткое описание фичи на языке пользователя, сфокусированное на ценности.<br><b>Формат:</b> Как [Роль], я хочу [Действие], чтобы [Ценность].<br><b>Пример:</b> <i>Как водитель, я хочу сканировать QR-код на колонке, чтобы оплатить заправку в 1 клик.</i><br><b>Преимущества:</b> Понятны всем (и бизнесу, и IT), фокусируют команду на ценности для человека, а не просто на коде, дают гибкость при планировании спринтов."
            },
            {
                question: "11. Как понять, что User story написана хорошо? Критерии INVEST.",
                answer: "<h3>Критерии качества (INVEST)</h3>Используем чек-лист хорошей истории:<br><b>I</b>ndependent (Независимая), <b>N</b>egotiable (Обсуждаемая), <b>V</b>aluable (Ценная), <b>E</b>stimable (Оцениваемая), <b>S</b>mall (Небольшая), <b>T</b>estable (Тестируемая). Также к ней обязательно пишутся <b>Acceptance Criteria (AC)</b> — критерии приемки, по которым тестировщик проверит задачу."
            },
            {
                question: "12. Что такое Use cases? Как они описываются (с примером)? В чем отличие от User stories?",
                answer: "<h3>Use Cases (Прецеденты использования)</h3>Описывают пошаговую последовательность действий Юзера и Системы для достижения цели. Включают предусловия, основной сценарий и альтернативные ветки.<br><b>Отличие от User Story:</b> Story — это краткая цель верхнего уровня (Зачем?), а Use Case — подробная инструкция по шагам (Как именно взаимодействуют юзер и система)."
            },
            {
                question: "13. Критерии хороших требований. По каким критериям будешь оценивать пришедшее требование?",
                answer: "<h3>Критерии качества требований</h3>При оценке проверяю требование на:<br>• <b>Ясность/Однозначность:</b> Исключены ли разные толкования?<br>• <b>Полнота:</b> Описаны ли пограничные и негативные кейсы?<br>• <b>Непротиворечивость:</b> Не ломает ли оно текущую логику?<br>• <b>Тестируемость:</b> Можно ли написать четкий тест?<br>• <b>Реализуемость:</b> Укладываемся ли в технологии и сроки?"
            },
            {
                question: "14. В чём отличие верификации требований от валидации?",
                answer: "<h3>Верификация vs Валидация требований</h3>• <b>Верификация (Verification):</b> Проверка спецификации на соответствие стандартам (тестирование самого ТЗ). Проверяем, правильно ли мы *записали* требования, нет ли логических ошибок.<br>• <b>Валидация (Validation):</b> Проверка требований на соответствие реальным целям бизнеса. Проверяем, то ли мы *собираемся делать* и решит ли эта фича проблему заказчика."
            },
            {
                question: "15. Что является артефактом работы аналитика? Шаблон постановки задачи.",
                answer: "<h3>Артефакты и Постановки</h3><b>Артефакты:</b> ТЗ, User Stories, диаграммы (UML, BPMN), маппинг данных, Swagger-схемы.<br><b>Шаблон постановки задачи в Jira включает:</b><br>1. Бизнес-цель (Зачем?).<br>2. Описание логики (User Story / Use Case).<br>3. Требования к UI (ссылка на Figma + логика полей).<br>4. Технические детали (изменения в БД, контракты API).<br>5. Критерии приемки (AC)."
            },
            {
                question: "16. Что нужно описать в постановке для UI (Frontend) и для Интеграций (Backend)?",
                answer: "<h3>Постановки для Front и Back</h3>• <b>Для Frontend:</b> Состояния элементов (Default, Disabled, Hover), валидацию полей (маски, регулярные выражения), тексты ошибок, поведение анимаций и лоадеров.<br>• <b>Для Интеграций (Backend):</b> Протокол (REST/SOAP/Kafka), метод (GET/POST), URL, структуру Request/Response тела (типы данных), маппинг полей между системами и обработку кодов ошибок (4xx, 5xx)."
            },

            // БЛОК 2: МОДЕЛИРОВАНИЕ ПРОЦЕССОВ И ДАННЫХ
            {
                question: "17. Нотации моделирования (BPMN, UML, ERD). Для чего используются?",
                answer: "<h3>Нотации моделирования</h3>• <b>BPMN 2.0:</b> Описание бизнес-процессов. Показывает хронологию шагов, шлюзы ветвления логики и роли (дорожки). Понятна и бизнесу, и разработке.<br>• <b>UML:</b> Проектирование архитектуры систем (взаимодействие модулей, классов, последовательности вызовов).<br>• <b>ERD (ER-диаграмма):</b> Проектирование баз данных. Показывает таблицы, их атрибуты и связи между ними."
            },
            {
                question: "18. Основные элементы BPMN-диаграммы: Шлюзы (Gateways) и События (Events).",
                answer: "<h3>Элементы BPMN</h3>• <b>Шлюзы:</b> Exclusive (X) — строгий выбор одного пути; Parallel (+) — запуск нескольких задач одновременно; Inclusive (O) — запуск одной или нескольких веток.<br>• <b>События:</b> Стартовые (запуск процесса), Промежуточные (таймеры-ожидания, поимка сообщений) и Конечные (завершение ветки или генерация ошибки)."
            },
            {
                question: "19. Виды диаграмм UML. Что такое Sequence Diagram и Use Case диаграмма?",
                answer: "<h3>Диаграммы UML</h3>• <b>Use Case:</b> Показывает функции системы (овалы) и роли пользователей (актеры). Помогает очертить границы проекта.<br>• <b>Sequence Diagram:</b> Диаграмма последовательности. Показывает обмен сообщениями (запросами/ответами) между системами или объектами во времени. Незаменима при проектировании сложных синхронных интеграций."
            },

            // БЛОК 3: ИНТЕГРАЦИИ И АРХИТЕКТУРА API
            {
                question: "20. Способы интеграций систем. Синхронное и асинхронное взаимодействие.",
                answer: "<h3>Виды интеграций</h3>• <b>Синхронное (REST, SOAP):</b> Отправитель шлет запрос и замирает в ожидании ответа. Если принимающая система лежит — отправитель получит ошибку тайм-аута.<br>• <b>Асинхронное (Kafka, RabbitMQ):</b> Отправитель кидает сообщение в брокер очередей и сразу продолжает свою работу. Получатель заберет сообщение, когда освободится. Системы становятся независимыми."
            },
            {
                question: "21. Форматы данных: JSON vs XML. Что такое XSD схема?",
                answer: "<h3>JSON, XML и XSD</h3>• <b>JSON:</b> Легковесный текстовый формат 'ключ-значение'. Легко читать, минимальный размер, стандарт для REST API.<br>• <b>XML:</b> Формат на базе тегов. Более тяжелый, но поддерживает строгую типизацию.<br>• <b>XSD (XML Schema Definition):</b> Файл-шаблон, который жестко описывает правила для XML (какие теги обязательны, длина строк). Нужен для автоматической валидации структуры данных."
            },
            {
                question: "22. Протокол HTTP. Из чего состоит HTTP-запрос?",
                answer: "<h3>Структура HTTP-запроса</h3>Любой запрос к серверу состоит из трех обязательных частей:<br>1. <b>Стартовая строка (Starting line):</b> Содержит метод (GET, POST и т.д.), URL-адрес ресурса и версию протокола.<br>2. <b>Заголовки (Headers):</b> Служебная метаинформация (тип контента Content-Type, токен авторизации Authorization, данные кэша).<br>3. <b>Тело (Body):</b> Сами передаваемые данные (в формате JSON или XML). У GET-запросов тела обычно нет."
            },
            {
                question: "23. Что такое архитектурный стиль REST? Основные принципы и концепция Stateless.",
                answer: "<h3>Принципы REST API</h3>REST базируется на работе с ресурсами через стандартные методы HTTP. Главный принцип — <b>Stateless (Клиент-Сервер без сохранения состояния)</b>. Сервер не запоминает предыдущие действия юзера. Каждый запрос должен быть изолированным и содержать абсолютно всю информацию для своей обработки (например, токен сессии)."
            },
            {
                question: "24. Методы HTTP, коды ответов, Идемпотентность, Авторизация/Аутентификация и Версионирование.",
                answer: "<h3>Важные концепты HTTP/REST</h3>• <b>Методы:</b> GET (чтение), POST (создание, неидемпотентный), PUT (перезапись объекта), PATCH (частичное обновление), DELETE (удаление).<br>• <b>Идемпотентность:</b> Повторный вызов метода дает тот же результат (GET, PUT, DELETE).<br>• <b>Коды:</b> 2xx (Успех), 4xx (Ошибка клиента, 404), 5xx (Ошибка сервера, 500).<br>• <b>Аутентификация</b> — проверка паспорта (кто ты), <b>Авторизация</b> — проверка прав (куда тебе можно).<br>• <b>Версионирование:</b> Поддержка старых и новых версий API одновременно (например, через URL: `/v1/users` и `/v2/users`)."
            }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('card');
        const questionElement = document.getElementById('question-text');
        const answerElement = document.getElementById('answer-text');
        const progressElement = document.getElementById('progress');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateCard() {
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                questionElement.innerHTML = flashcards[currentIndex].question;
                answerElement.innerHTML = flashcards[currentIndex].answer;
                progressElement.textContent = `Карточка ${currentIndex + 1} из ${flashcards.length}`;
                
                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === flashcards.length - 1);
                
                document.getElementById('answer-text').scrollTop = 0;
            }, 150);
        }

        function flipCard() {
            cardElement.classList.toggle('flipped');
        }

        function nextCard(event) {
            if (event) event.stopPropagation(); 
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard(event) {
            if (event) event.stopPropagation(); 
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        updateCard();
    </script>
