    question: "Что такое CQRS? Когда применяется?",
    answer: `<h3>CQRS (Command Query Responsibility Segregation)</h3>
    <p><b>Определение:</b> Это архитектурный паттерн, который разделяет модели чтения и записи данных в разные объекты (или даже разные базы данных).</p>
    <p><b>Суть паттерна:</b></p>
    <ul>
        <li><b>Command (Команда):</b> Операция, которая изменяет состояние системы (INSERT, UPDATE, DELETE). Работает с моделью записи (Write Model).</li>
        <li><b>Query (Запрос):</b> Операция, которая только читает данные (SELECT). Работает с моделью чтения (Read Model), которая может быть денормализована для быстрых запросов.</li>
    </ul>
    <p><b>Когда я применяю CQRS (на практике):</b></p>
    <ul>
        <li><b>Высоконагруженные системы:</b> Когда запросов на чтение в 100 раз больше, чем на запись (например, каталог товаров). Мы делаем отдельную БД для чтения (реплику) с оптимизированной схемой.</li>
        <li><b>Сложная бизнес-логика:</b> Когда валидация при записи очень сложная, а чтение должно быть молниеносным.</li>
        <li><b>Event Sourcing:</b> CQRS часто используется вместе с Event Sourcing (команды генерируют события, а модель чтения строится на основе этих событий).</li>
    </ul>`
},
{
    id: "q197",
    category: "architecture",
    question: "Что такое Event Sourcing? Подробно.",
    answer: `<h3>Event Sourcing (Хранилище событий) — Детально</h3>
    <p><b>Определение:</b> Это архитектурный паттерн, при котором мы храним не текущее состояние объекта, а <b>все события</b>, которые с ним произошли, как неизменяемый лог (журнал) в хронологическом порядке.</p>
    <p><b>Как это работает на примере банковского счета:</b></p>
    <ul>
        <li><b>Вместо:</b> Хранить одну запись в таблице 'Баланс' (UPDATE баланса при каждой транзакции).</li>
        <li><b>Мы делаем:</b> Храним список событий: 'Счет открыт' (баланс 0), 'Зачислено 1000 руб.' (баланс 1000), 'Списано 200 руб.' (баланс 800).</li>
        <li><b>Текущий баланс</b> вычисляется путем последовательного воспроизведения (Replay) всех событий с начала.</li>
    </ul>
    <p><b>Плюсы Event Sourcing:</b></p>
    <ul>
        <li><b>Полная история аудита:</b> Можно восстановить состояние системы на любой момент времени (аудит).</li>
        <li><b>Отладка и анализ:</b> Легко найти, кто и когда изменил данные.</li>
        <li><b>Пересчет (Replay):</b> Если бизнес-логика изменилась (например, изменилась формула расчета), можно переиграть все события заново и получить новый результат.</li>
    </ul>
    <p><b>Минусы:</b></p>
    <ul>
        <li><b>Сложность реализации:</b> Требует изменения мышления (храним события, а не состояние).</li>
        <li><b>Хранение огромного объема данных:</b> Событий может быть миллиарды.</li>
        <li><b>Сложность удаления данных (GDPR):</b> Из неизменяемого лога нельзя удалить персональные данные.</li>
    </ul>`
},
{
    id: "q198",
    category: "architecture",
    question: "Что такое DDD (Domain-Driven Design)? Подробно.",
    answer: `<h3>DDD (Domain-Driven Design) — Предметно-ориентированное проектирование</h3>
    <p><b>Определение:</b> Это подход к разработке сложного программного обеспечения, при котором основной акцент делается на <b>предметную область (бизнес-логику)</b>, а архитектура кода строится вокруг неё, а не вокруг технических деталей (базы данных, фреймворков).</p>
    <p><b>Ключевые для аналитика паттерны DDD, которые я использую:</b></p>
    <ul>
        <li><b>Единый язык (Ubiquitous Language):</b> Все (бизнес, аналитики, разработчики) говорят на одном языке. Если бизнес говорит 'Сделка', в коде тоже класс называется 'Deal', а не 'Transaction'. Это снижает недопонимание и делает код понятным для бизнеса.</li>
        <li><b>Ограниченный контекст (Bounded Context):</b> Четкая граница, внутри которой термины имеют определенный смысл. <i>Пример:</i> Термин 'Клиент' в контексте 'Кредитный скоринг' (возраст, доход) и 'Клиент' в контексте 'Поддержка' (история обращений) — это два разных контекста, которые должны быть разделены на разные сервисы.</li>
    </ul>
    <p><b>На практике:</b> Я использую DDD для того, чтобы правильно нарезать микросервисы. Мы не режем по технологическому признаку (Frontend/Backend), а режем по бизнес-доменам (Продажи, Склад, Финансы).</p>`
},
{
    id: "q200",
    category: "integrations",
    question: "Что такое WebSocket? Когда его применять? Чем отличается от long polling?",
    answer: `<h3>WebSocket</h3>
    <p><b>Определение:</b> Это полнодуплексный (двунаправленный) протокол связи, который устанавливает <b>постоянное</b> соединение между клиентом и сервером через одно TCP-соединение. В отличие от HTTP, соединение не разрывается после ответа.</p>
    <p><b>Когда я применяю WebSocket:</b></p>
    <ul>
        <li><b>Приложения реального времени:</b> Онлайн-чаты, многопользовательские игры, биржевые котировки, совместное редактирование документов (как в Google Docs).</li>
        <li>Где важна минимальная задержка и двусторонняя передача данных (сервер может сам инициировать отправку данных клиенту).</li>
    </ul>
    <p><b>Отличие WebSocket от Long Polling:</b></p>
    <ul>
        <li><b>Long Polling:</b> Каждый раз открывает новый HTTP-запрос (с тяжелыми заголовками) после получения ответа. Это накладные расходы.</li>
        <li><b>WebSocket:</b> Один раз устанавливает соединение (handshake через HTTP), а затем обменивается легкими фреймами данных без заголовков, что значительно быстрее и экономит трафик.</li>
        <li><b>Направленность:</b> Long Polling — только от сервера к клиенту (клиент инициирует). WebSocket — двусторонний (и клиент, и сервер могут слать данные в любой момент).</li>
    </ul>`
},
{
    id: "q201",
    category: "integrations",
    question: "Что такое gRPC? Когда его применять? Что такое Protobuf и HTTP/2 (чем отличается от HTTP/1.1)?",
    answer: `<h3>gRPC (Google Remote Procedure Call)</h3>
    <p><b>Определение:</b> Это высокопроизводительный RPC-фреймворк, разработанный Google для межсервисного взаимодействия в микросервисных архитектурах.</p>
    <p><b>Ключевые особенности gRPC:</b></p>
    <ul>
        <li><b>Protobuf (Protocol Buffers):</b> Вместо текстового JSON, gRPC использует бинарную сериализацию. Это делает сообщения намного меньше по размеру (до 5 раз) и быстрее для парсинга (до 10 раз).</li>
        <li><b>HTTP/2:</b> gRPC работает поверх HTTP/2, что дает мультиплексирование (много запросов в одном TCP-соединении).</li>
        <li><b>Стриминг:</b> Поддерживает потоковую передачу данных в обе стороны (клиентский, серверный и двунаправленный стриминг).</li>
    </ul>
    <p><b>HTTP/2 vs HTTP/1.1:</b></p>
    <ul>
        <li><b>HTTP/1.1:</b> Одно соединение — один запрос. Заголовки не сжимаются (передаются в открытом виде).</li>
        <li><b>HTTP/2:</b> <b>Мультиплексирование</b> — много запросов в одном TCP-соединении параллельно. Сжатие заголовков (HPACK). Сервер может 'пушить' данные (Server Push).</li>
    </ul>
    <p><b>Когда я применяю gRPC:</b> Для внутреннего общения между микросервисами, где важна высокая производительность и низкая задержка (например, в системах рекомендаций или обработки платежей).</p>`
},
{
    id: "q202",
    category: "integrations",
    question: "Что такое GraphQL? Когда применяют? Плюсы GraphQL относительно REST?",
    answer: `<h3>GraphQL</h3>
    <p><b>Определение:</b> Это язык запросов к API и среда выполнения, которая позволяет клиенту запрашивать <b>именно те данные, которые ему нужны</b>, в одной структуре, а не получать фиксированный набор полей от сервера.</p>
    <p><b>Как работает:</b> Клиент отправляет POST-запрос с текстом запроса (query), в котором указывает, какие поля ему нужны. Сервер возвращает JSON строго с этими полями.</p>
    <p><b>Плюсы относительно REST:</b></p>
    <ul>
        <li><b>Решение проблемы Over-fetching:</b> REST часто отдает больше данных, чем нужно (например, 50 полей, когда нужно 2). GraphQL возвращает только запрошенные поля, экономит трафик мобильного приложения.</li>
        <li><b>Решение проблемы Under-fetching (N+1 проблема):</b> В REST, чтобы получить пользователя и его последние заказы, нужно сделать 2 запроса. В GraphQL это можно сделать за 1 запрос (вложенная структура).</li>
        <li><b>Гибкость:</b> Фронтенд-разработчики могут сами формировать запросы, не дожидаясь, пока бэкендер добавит новый эндпоинт.</li>
    </ul>
    <p><b>Когда я применяю GraphQL:</b> Для сложных приложений с множеством сущностей (соцсети, агрегаторы данных, маркетплейсы), где важна гибкость фронтенда.</p>`
},
{
    id: "q203",
    category: "integrations",
    question: "Что такое файловый обмен? Когда применять? Плюсы и минусы файлового обмена?",
    answer: `<h3>Файловый обмен (File Transfer Integration)</h3>

    <p><b>Когда я применяю файловый обмен:</b></p>
    <ul>
        <li>Для пакетной обработки больших объемов данных (миллионы строк).</li>
        <li>Для обмена справочниками (Номенклатура товаров, Справочник контрагентов), которые обновляются раз в сутки (не требуется Real-time).</li>
        <li>Когда системы находятся в изолированных сетях (DMZ) и нет возможности поднять открытый API.</li>
        <li>В интеграциях с государственными системами (часто требуют выгрузку в XML по регламенту).</li>
    </ul>
    <p><b>Плюсы файлового обмена:</b></p>
    <ul>
        <li><b>Простота реализации:</b> Легко реализовать, не требует сложных протоколов и контрактов.</li>
        <li><b>Производительность:</b> Отлично подходит для передачи терабайтов данных пакетом.</li>
        <li><b>Асинхронность:</b> Системы не зависят от времени работы друг друга (получатель может забрать файл, когда у него есть ресурсы).</li>
    </ul>
    <p><b>Минусы файлового обмена:</b></p>
    <ul>
        <li><b>Нет реального времени (Real-time):</b> Данные попадают в целевую систему с задержкой (обычно раз в сутки или раз в час).</li>
        <li><b>Сложность обработки ошибок:</b> Если одна строка в CSV-файле некорректна, сложно восстановить транзакцию (либо весь файл падает, либо нужно логировать ошибки построчно и отправлять уведомления).</li>
        <li><b>Проблемы конкурентности:</b> Нужно следить, чтобы две системы не пытались одновременно записать в один файл.</li>
    </ul>`

// --- Интеграции: Kafka и RabbitMQ (детальные вопросы, которые могли пропустить) ---
{
    id: "q204",
    category: "integrations",
    question: "Внутреннее устройство Apache Kafka. Что такое offset в Kafka?",
    answer: `<h3>Apache Kafka: Устройство и Offset</h3>
    <p><b>Внутреннее устройство:</b> Kafka — это распределенный лог (commit log). Данные хранятся в <b>Топиках</b>, каждый топик разбит на <b>Партиции</b>. Каждая партиция — это упорядоченная, неизменяемая последовательность сообщений, которые пишутся в конец (append-only).</p>
    <p><b>Что такое Offset (Смещение):</b></p>
    <ul>
        <li>Это уникальный инкрементальный идентификатор (индекс) сообщения внутри конкретной партиции.</li>
        <li>Он начинается с 0 и увеличивается на 1 для каждого нового сообщения.</li>
        <li>Консюмеры читают сообщения, перемещая свой указатель (offset). Сам консюмер хранит свой собственный offset (обычно в топике <code>__consumer_offsets</code>), показывая, какое сообщение он прочитал последним.</li>
    </ul>
    <p><b>Ключевая фишка Kafka:</b> Сообщения <b>НЕ УДАЛЯЮТСЯ</b> после прочтения (в отличие от RabbitMQ). Они хранятся на диске в течение настроенного периода (retention policy, например, 7 дней). Это позволяет перечитать поток данных заново, сбросив offset на более ранний.</p>`
},
{
    id: "q205",
    category: "integrations",
    question: "Может ли несколько consumer-ов читать одну и ту же партицию?",
    answer: `<h3>Consumer Group и партиции в Kafka</h3>
    <p><b>Ответ зависит от принадлежности к Consumer Group:</b></p>
    <p><b>1. Если консюмеры находятся в ОДНОЙ Consumer Group:</b></p>
    <ul>
        <li><b>НЕТ, не может.</b> Партиция может быть закреплена только за <b>одним</b> консюмером внутри группы. Это сделано для <b>гарантии порядка</b> сообщений (сообщения в одной партиции обрабатываются последовательно одним консюмером).</li>
        <li>Если консюмеров больше, чем партиций, лишние консюмеры будут простаивать (не получат данных).</li>
    </ul>
    <p><b>2. Если консюмеры находятся в РАЗНЫХ Consumer Group:</b></p>
    <ul>
        <li><b>ДА, могут.</b> Каждая группа имеет свой собственный offset. Поэтому данные из одной партиции могут быть параллельно прочитаны разными группами (например, Группа А — для аналитики, Группа Б — для отправки уведомлений).</li>
    </ul>`
},
{
    id: "q206",
    category: "integrations",
    question: "Клиент читает в Kafka два последних сообщения. Как тому же клиенту заново их прочитать?",
    answer: `<h3>Повторное чтение сообщений в Kafka</h3>
    <p>Ключевое свойство Kafka — <b>персистентность сообщений</b> (они не удаляются после прочтения). Поэтому клиент может перечитать сообщения заново двумя способами:</p>
    <p><b>Способ 1: Сброс offset (программно):</b></p>
    <ul>
        <li>Клиент может вызвать метод <code>seek()</code> и указать нужный offset.</li>
        <li><i>Пример:</i> <code>consumer.seek(partition, 100)</code> — начать чтение с offset 100.</li>
        <li><i>Для последних двух:</i> <code>consumer.seek(partition, latestOffset - 2)</code>.</li>
    </ul>
    <p><b>Способ 2: Изменение параметров консюмера:</b></p>
    <ul>
        <li>В настройках консюмера можно выставить параметр <code>auto.offset.reset</code> в значение <code>earliest</code> (прочитать все с начала) или <code>latest</code> (читать только новые).</li>
        <li>Также можно удалить текущий offset из топика <code>__consumer_offsets</code> (сбросить группу).</li>
    </ul>
    <p><b>Важно:</b> Чтобы перечитать сообщения, клиент должен остановить текущую обработку и сбросить offset до нужного значения. Это удобно для дебага или пересчета данных, если в логике консюмера была ошибка.</p>`

    id: "q207",
    category: "integrations",
    question: "Чем Kafka отличается от RabbitMQ?",
    answer: `<h3>Kafka vs RabbitMQ: Детальное сравнение</h3>
    <p>Это два самых популярных брокера, но они решают разные задачи. Я выбираю их в зависимости от сценария использования.</p>
    <p><b>RabbitMQ (Умный брокер):</b></p>
    <ul>
        <li><b>Модель:</b> Очереди (Queue-based). Сообщение доставляется и <b>удаляется</b> после ACK.</li>
        <li><b>Хранение:</b> В основном в RAM (быстро, но ограниченно).</li>
        <li><b>Маршрутизация:</b> Очень гибкая (Exchanges, routing keys, сложные привязки).</li>
        <li><b>Порядок сообщений:</b> Гарантирует порядок в рамках одной очереди.</li>
        <li><b>Когда использовать:</b> Для фоновых задач (отправка писем, генерация отчетов), для слабой связанности микросервисов, когда важна гибкая маршрутизация и быстрая обработка.</li>
    </ul>
    <p><b>Apache Kafka (Умный консюмер):</b></p>
    <ul>
        <li><b>Модель:</b> Лог (Topic-based). Сообщения <b>не удаляются</b> после прочтения, а хранятся по времени (retention).</li>
        <li><b>Хранение:</b> На диске (SSD/HDD). Может хранить терабайты данных.</li>
        <li><b>Маршрутизация:</b> Простая (ключ -> партиция).</li>
        <li><b>Порядок сообщений:</b> Гарантирует порядок только в рамках одной партиции.</li>
        <li><b>Когда использовать:</b> Для потоковой обработки событий в реальном времени (Event Sourcing), для сбора логов и метрик, для систем, требующих высокой пропускной способности и перечитывания данных (Replay).</li>
    </ul>`
},
{
    id: "q208",
    category: "integrations",
    question: "Что такое Webhook (callback)? Когда его применять? Какие плюсы и минусы?",
    answer: `<h3>Webhook (Обратный вызов)</h3>
    <p><b>Определение:</b> Это механизм, при котором одна система (сервер) отправляет HTTP-запрос (обычно POST) на заранее зарегистрированный URL другой системы (клиента) при наступлении какого-либо события. Это обратный вызов по инициативе сервера.</p>
    <p><b>Когда я применяю Webhook (вместо Polling):</b></p>
    <ul>
        <li>Когда нужно получать уведомления в реальном времени, но при этом у вас нет постоянного соединения (как в WebSocket).</li>
        <li><i>Примеры:</i> Платежные системы (Сбербанк, Stripe) уведомляют ваш бэкенд об успешной оплате через Webhook. GitHub уведомляет о новом коммите.</li>
    </ul>
    <p><b>Плюсы Webhook:</b></p>
    <ul>
        <li><b>Реальное время (Real-time):</b> Данные приходят мгновенно, без задержки (как при Polling).</li>
        <li><b>Экономия ресурсов:</b> Не нужно спамить запросами (Polling) каждую секунду, разгружая сервер.</li>
    </ul>
    <p><b>Минусы Webhook (о чем нужно знать):</b></p>
    <ul>
        <li><b>Клиент должен быть доступен (публичный URL):</b> Ваш сервер должен иметь публичный URL, доступный из интернета. Если сервер упал, уведомление может потеряться (если не настроены ретраи).</li>
        <li><b>Безопасность:</b> Нужна валидация, что запрос пришел именно от сервиса, а не от злоумышленника (через подпись запроса HMAC или проверку IP).</li>
    </ul>`
},

    answer: `<h3>Long Polling (Длинный опрос)</h3>
    <p><b>Определение:</b> Это техника, при которой клиент отправляет HTTP-запрос, а сервер <b>не возвращает ответ мгновенно</b>, а 'зависает' (удерживает соединение открытым) до тех пор, пока не появятся новые данные для клиента или не истечет таймаут (например, 30-60 секунд).</p>
    <p><b>Как устроен Long Polling (пошагово):</b></p>
    <ul>
        <li>1. Клиент отправляет запрос к серверу.</li>
        <li>2. Сервер проверяет, есть ли новые данные. Если нет — он не отвечает, а ждет (держит соединение открытым).</li>
        <li>3. Когда новые данные появляются (или таймаут), сервер отдает ответ и закрывает соединение.</li>
        <li>4. Клиент тут же отправляет новый запрос (цикл повторяется).</li>
    </ul>
    <p><b>Отличие от обычного REST:</b></p>
    <ul>
        <li><b>Обычный REST:</b> Сервер отвечает сразу (даже если данных нет). Клиент должен опрашивать сервер раз в секунду.</li>
        <li><b>Long Polling:</b> Сервер задерживает ответ, имитируя 'живое' соединение. Это снижает количество пустых запросов и позволяет получать данные почти в реальном времени.</li>
    </ul>
    <p><b>Где применялся:</b> В старых версиях Facebook Chat и WhatsApp, когда WebSocket еще не был широко поддержан браузерами. Сейчас используется редко, в основном для совместимости со старыми системами.</p>`
}

        let flashcards = [...originalCards];
        let currentIndex = 0;
        let isStressMode = false;
        let currentFilter = 'all';
        let searchQuery = '';

        const cardElement = document.getElementById('card');
        const questionElement = document.getElementById('question-text');
        const answerElement = document.getElementById('answer-text');
        const progressElement = document.getElementById('progress');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stressBtn = document.getElementById('stress-btn');
        const notesTextarea = document.getElementById('card-notes');
        const searchBar = document.getElementById('search-bar');

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-btn').textContent = "☀️ Светлая";
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('theme-btn').textContent = "🌙 Темная";
            }
        }

        function toggleTheme() {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                document.getElementById('theme-btn').textContent = "🌙 Темная";
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-btn').textContent = "☀️ Светлая";
            }
        }

        function applyFilterAndOrder() {
            let filtered = [...originalCards];

            if (currentFilter === 'favorites') {
                filtered = filtered.filter(c => localStorage.getItem(`fav_${c.id}`) === 'true');
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(c => c.category === currentFilter);
            }

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(c => c.question.toLowerCase().includes(q) || c.answer.toLowerCase().includes(q));
            }

            if (isStressMode) {
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
            }

            flashcards = filtered;
            currentIndex = 0;
            updateCard();
        }

        function filterCategory(category, element) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentFilter = category;
            applyFilterAndOrder();
        }

        function handleSearch() {
            searchQuery = searchBar.value;
            applyFilterAndOrder();
        }

        function toggleStressMode() {
            isStressMode = !isStressMode;
            stressBtn.classList.toggle('active', isStressMode);
            applyFilterAndOrder();
        }

        function updateCard() {
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                if (flashcards.length === 0) {
                    questionElement.innerHTML = "Ничего не найдено";
                    answerElement.innerHTML = "<h3>Пусто</h3>";
                    progressElement.textContent = `Карточек: 0`;
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    return;
                }

                questionElement.innerHTML = flashcards[currentIndex].question;
                answerElement.innerHTML = flashcards[currentIndex].answer;
                progressElement.textContent = `Карточка ${currentIndex + 1} из ${flashcards.length}`;

                const currentCardId = flashcards[currentIndex].id;
                const savedNote = localStorage.getItem(`note_${currentCardId}`);
                notesTextarea.value = savedNote || "";

                const isFav = localStorage.getItem(`fav_${currentCardId}`) === 'true';
                const favFront = document.getElementById('fav-icon-front');
                const favBack = document.getElementById('fav-icon-back');
                
                if (isFav) {
                    favFront.classList.add('is-fav');
                    favBack.classList.add('is-fav');
                    favFront.innerHTML = '★';
                    favBack.innerHTML = '★';
                } else {
                    favFront.classList.remove('is-fav');
                    favBack.classList.remove('is-fav');
                    favFront.innerHTML = '☆';
                    favBack.innerHTML = '☆';
                }

                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === flashcards.length - 1);
            }, 150);
        }

        function flipCard() {
            if (flashcards.length > 0) cardElement.classList.toggle('flipped');
        }

        function preventFlip(event) {
            event.stopPropagation();
        }

        function toggleFavorite(event) {
            event.stopPropagation();
            if (flashcards.length === 0) return;

            const currentCardId = flashcards[currentIndex].id;
            const isFav = localStorage.getItem(`fav_${currentCardId}`) === 'true';
            localStorage.setItem(`fav_${currentCardId}`, !isFav);
            updateCard();

            if (currentFilter === 'favorites') {
                setTimeout(applyFilterAndOrder, 300);
            }
        }

        function saveNote() {
            if (flashcards.length === 0) return;
            const currentCardId = flashcards[currentIndex].id;
            localStorage.setItem(`note_${currentCardId}`, notesTextarea.value);
            alert("Заметка сохранена!");
        }

        function nextCard(event) {
            if (event) event.stopPropagation();
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard(event) {
            if (event) event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        window.addEventListener('keydown', function(event) {
            if (document.activeElement === searchBar || document.activeElement === notesTextarea) return;

            if (event.code === 'Space') {
                event.preventDefault();
                flipCard();
            } else if (event.key === 'ArrowRight') {
                nextCard();
            } else if (event.key === 'ArrowLeft') {
                prevCard();
            } else if (event.key.toLowerCase() === 's') {
                toggleStressMode();
            } else if (event.key.toLowerCase() === 'f') {
                toggleFavorite(event);
            }
        });

        initTheme();
        updateCard();
    </script>
