{
    id: "q102",
    category: "architecture",
    question: "8. Какие есть способы декомпозиции на микросервисы? По каким принципам выделяются микросервисы? Какие используешь?",
    answer: `<h3>Способы декомпозиции (Domain-Driven Design)</h3>
    <p>Выделение микросервисов — это искусство. Я использую два основных подхода, часто в комбинации:</p>
    <p><b>1. Декомпозиция по бизнес-способностям (Business Capabilities):</b></p>
    <ul>
        <li>Изучаем структуру компании. Отделы = сервисы. <i>Пример:</i> Есть отдел 'Продажи' и 'Склад' → создаем сервисы 'Продажи' и 'Склад'.</li>
    </ul>
    <p><b>2. Декомпозиция по поддоменам (DDD - Domain-Driven Design):</b></p>
    <ul>
        <li>Это мой основной подход. Мы выделяем <b>Ограниченные контексты (Bounded Contexts)</b> — логические границы, внутри которых термины имеют четкое значение.</li>
        <li><i>Пример:</i> В контексте 'Заказы' термин 'Товар' — это позиция в заказе (с ценой на момент покупки). В контексте 'Склад' термин 'Товар' — это физическая единица с серийным номером. Мы выделяем два сервиса, потому что у них разная бизнес-логика и разная структура данных.</li>
    </ul>
    <p><b>Принципы, которыми я руководствуюсь:</b> Сильная связность внутри сервиса (High Cohesion) и слабая связанность между сервисами (Low Coupling). Сервис должен делать одну вещь и делать ее хорошо (Single Responsibility).</p>`
},
{
    id: "q103",
    category: "architecture",
    question: "9. Какие паттерны микросервисной архитектуры знаешь?",
    answer: `<h3>Паттерны микросервисов</h3>
    <p>В своей работе я регулярно сталкиваюсь и применяю следующие паттерны:</p>
    <ul>
        <li><b>API Gateway (Шлюз):</b> Единая точка входа для всех внешних клиентов (фронтенд, мобилки). Он маршрутизирует запросы, проводит аутентификацию, ограничивает частоту запросов (Rate Limiting).</li>
        <li><b>BFF (Backend for Frontend):</b> Специализированный бэкенд под конкретный клиент. У нас есть BFF для мобильного приложения (агрегирует минимум данных для маленьких экранов) и BFF для веба (агрегирует больше данных).</li>
        <li><b>Circuit Breaker (Предохранитель):</b> Защищает систему от 'каскадных отказов'. Если внешний сервис (например, платежный шлюз) начинает отвечать с ошибками, Circuit Breaker 'размыкает цепь' и отправляет fallback-ответ (заглушку), не дожидаясь таймаута.</li>
        <li><b>Saga (Сага):</b> Паттерн для управления распределенными транзакциями. Вместо двухфазного коммита (2PC), мы делим транзакцию на последовательность локальных транзакций, каждая из которых имеет компенсирующее действие (откат).</li>
        <li><b>Service Discovery (Обнаружение сервисов):</b> Сервисы регистрируются в реестре (Eureka / Consul), а клиенты получают их адреса динамически, чтобы не хардкодить IP-адреса.</li>
    </ul>`
},
{
    id: "q104",
    category: "architecture",
    question: "10. Чем отличается SOA от микросервисной архитектуры (MSA)?",
    answer: `<h3>SOA vs MSA</h3>
    <p>Многие считают микросервисы 'эволюцией' SOA, но у них есть фундаментальные различия в архитектурном подходе:</p>
    <p><b>SOA (Сервис-Ориентированная Архитектура):</b></p>
    <ul>
        <li><b>Связность:</b> Централизованная 'умная' шина данных (ESB), которая занимается маршрутизацией и трансформацией сообщений.</li>
        <li><b>Данные:</b> Часто используют общую базу данных для всех сервисов.</li>
        <li><b>Размер:</b> Сервисы крупные (корпоративного уровня).</li>
        <li><b>Стандарты:</b> Жестко привязаны к SOAP/XML и WS-* стандартам.</li>
    </ul>
    <p><b>MSA (Микросервисная Архитектура):</b></p>
    <ul>
        <li><b>Связность:</b> 'Глупые' каналы связи (REST, Kafka). Микросервисы не зависят от центрального посредника.</li>
        <li><b>Данные:</b> Каждый сервис владеет своей изолированной БД (Database-per-Service).</li>
        <li><b>Размер:</b> Микросервисы максимально гранулярны.</li>
        <li><b>Стандарты:</b> Гибкие (JSON, Protobuf).</li>
    </ul>
    <p><b>Кратко:</b> SOA — это 'большие сервисы через умную шину', MSA — это 'маленькие сервисы через тупые трубы'.</p>`
},
{
    id: "q105",
    category: "architecture",
    question: "11. Расскажи про токен-авторизацию в микросервисах.",
    answer: `<h3>Авторизация в микросервисах (JWT)</h3>
    <p>В микросервисной архитектуре мы используем <b>Stateless</b> аутентификацию, чтобы не хранить сессии на сервере. Самый популярный способ — это <b>JWT (JSON Web Token)</b>.</p>
    <p><b>Как это работает в архитектуре:</b></p>
    <ol>
        <li>Пользователь логинится через сервис 'Auth'. Тот проверяет пароль и генерирует JWT-токен (в котором зашифрованы: ID пользователя, его роли, время истечения).</li>
        <li>Клиент (фронтенд) сохраняет этот токен и при каждом запросе кладет его в заголовок: <code>Authorization: Bearer <токен></code>.</li>
        <li>API Gateway или сами микросервисы <b>не идут в БД за сессией</b>, а просто проверяют криптографическую подпись токена локально (с помощью публичного ключа). Если подпись верна и срок не истек — запрос считается авторизованным.</li>
    </ol>
    <p><b>Почему это круто:</b> Это позволяет масштабировать сервисы горизонтально, не синхронизируя сессии. Любой инстанс может проверить токен сам.</p>`
},
{
    id: "q106",
    category: "architecture",
    question: "12. Что такое Хореография? Для чего используют? Плюсы и минусы.",
    answer: `<h3>Хореография (Choreography) в распределенных системах</h3>
    <p><b>Определение:</b> Это паттерн координации распределенной транзакции (Saga), при котором <b>нет центрального управляющего</b>. Сервисы общаются друг с другом через публикацию событий в брокере (Kafka) и независимо реагируют на них.</p>
    <p><b>Как работает:</b> Сервис 'Заказы' публикует событие 'Заказ создан'. Сервис 'Платежи' слушает это событие и пытается списать деньги, после чего публикует 'Платеж успешен' или 'Платеж отклонен'. Сервис 'Склад' слушает 'Платеж успешен' и резервирует товар. Это похоже на танец (хореографию) — каждый знает свои шаги.</p>
    <p><b>Плюсы:</b> Высокая слабая связанность, нет единой точки отказа.</p>
    <p><b>Минусы:</b> Сложно отслеживать сквозной статус бизнес-процесса (нужен сложный мониторинг). Трудно вносить изменения в логику, так как она 'размазана' по многим сервисам.</p>`
},
{
    id: "q107",
    category: "architecture",
    question: "13. Что такое Оркестрация? Для чего используют? Плюсы и минусы.",
    answer: `<h3>Оркестрация (Orchestration) в распределенных системах</h3>
    <p><b>Определение:</b> Это паттерн координации, при котором <b>есть центральный контроллер (Оркестратор)</b>, который явно управляет последовательностью вызовов сервисов, как дирижер оркестром.</p>
    <p><b>Как работает:</b> Оркестратор получает команду 'Оформить заказ'. Он делает синхронный вызов в Сервис 'Платежи' (списать деньги). Получив успех, он вызывает Сервис 'Склад' (зарезервировать). Если склад вернул ошибку, оркестратор вызывает компенсирующее действие в Платежах (возврат денег).</p>
    <p><b>Плюсы:</b> Вся бизнес-логика процесса собрана в одном месте (легко читать, легко изменять). Легко мониторить статус процесса.</p>
    <p><b>Минусы:</b> Оркестратор становится <b>единой точкой отказа</b> (если он упадет — все процессы встанут). Создает жесткую связанность (синхронные вызовы).</p>`
},
{
    id: "q108",
    category: "architecture",
    question: "14. Что такое API Gateway? Для чего используется?",
    answer: `<h3>API Gateway (Шлюз API)</h3>
    <p><b>Определение:</b> Это сервис, который является <b>единой точкой входа (Single Entry Point)</b> для всех внешних клиентов (веб-приложений, мобильных приложений, партнеров). Все запросы сначала приходят в шлюз, а уже потом маршрутизируются во внутренние микросервисы.</p>
    <p><b>Основные функции шлюза (зачем он нужен):</b></p>
    <ul>
        <li><b>Маршрутизация (Routing):</b> Направляет запросы по правильному пути. <i>Пример:</i> `/api/v1/orders` → сервис 'Заказы', `/api/v1/users` → сервис 'Пользователи'.</li>
        <li><b>Аутентификация и авторизация:</b> Проверяет JWT-токен на входе, чтобы не пускать неавторизованных пользователей внутрь сети.</li>
        <li><b>Ограничение частоты запросов (Rate Limiting):</b> Защищает бэкенд от DDoS-атак, ограничивая количество запросов от одного IP.</li>
        <li><b>Агрегация ответов:</b> Может собрать данные из нескольких сервисов и отдать клиенту один JSON (паттерн BFF).</li>
        <li><b>SSL-терминация и логирование.</b></li>
    </ul>
    <p><b>Примеры технологий:</b> Kong, Nginx, AWS API Gateway, Spring Cloud Gateway.</p>`
},
{
    id: "q109",
    category: "architecture",
    question: "15. Что такое балансировщик? Для чего используется?",
    answer: `<h3>Балансировщик нагрузки (Load Balancer)</h3>
    <p><b>Определение:</b> Это компонент (программный или аппаратный), который распределяет входящий трафик между несколькими серверами (инстансами) для обеспечения отказоустойчивости и горизонтального масштабирования.</p>
    <p><b>Зачем он нужен (на практике):</b></p>
    <ul>
        <li><b>Масштабирование:</b> Если нагрузки становится много, мы запускаем 5 копий (инстансов) нашего бэкенда. Балансировщик распределяет запросы между ними случайным образом (Round Robin).</li>
        <li><b>Отказоустойчивость:</b> Балансировщик периодически проверяет здоровье инстансов (Health Checks). Если один инстанс 'упал', балансировщик перестает направлять на него трафик.</li>
        <li><b>Единая точка входа:</b> Клиенты знают только один IP-адрес (балансировщика), а не IP-адреса 10 серверов.</li>
    </ul>
    <p><b>Примеры:</b> Nginx (как обратный прокси), HAProxy, облачные балансировщики (AWS ELB, Yandex ALB).</p>`
},
{
    id: "q110",
    category: "architecture",
    question: "16. Для чего используется шина данных?",
    answer: `<h3>Шина данных (ESB) в архитектуре</h3>
    <p><b>Определение:</b> Корпоративная шина (ESB) — это централизованный промежуточный слой, который используется для интеграции разнородных систем в корпоративной среде (SOA-архитектура).</p>
    <p><b>Основные функции шины:</b></p>
    <ul>
        <li><b>Трансформация протоколов и форматов:</b> Может принимать REST-запрос (JSON), преобразовывать его в SOAP (XML) и отправлять в старую легаси-систему.</li>
        <li><b>Маршрутизация на основе правил:</b> Сообщение может быть отправлено в разные системы в зависимости от его содержимого (например, если сумма > 1 млн руб. — отправить на согласование начальнику).</li>
        <li><b>Оркестрация процессов:</b> Шина может управлять длительными бизнес-процессами, выполняя шаги последовательно.</li>
    </ul>
    <p><b>Важно:</b> В современных микросервисных проектах шина (ESB) уступает место 'глупым' брокерам (Kafka) и API Gateway, потому что ESB становится 'монолитом-посредником' и точкой отказа.</p>`
},
{
    id: "q111",
    category: "architecture",
    question: "17. Что такое BFF (Backend For Frontend)?",
    answer: `<h3>Паттерн BFF (Backend For Frontend)</h3>
    <p><b>Определение:</b> Это паттерн проектирования, при котором создается отдельный бэкенд-сервис под каждый конкретный тип клиента (фронтенда), который выступает в роли 'агрегатора' данных из общих микросервисов.</p>
    <p><b>Зачем это нужно (на примере):</b></p>
    <ul>
        <li><b>Мобильное приложение (Mobile BFF):</b> Ему нужны только минимальные данные, чтобы экономить трафик и батарею. BFF для мобилок агрегирует только 3 поля (ID, Имя, Фото).</li>
        <li><b>Веб-приложение (Web BFF):</b> Веб-клиент может позволить себе большие экраны и быстрый интернет. BFF для веба агрегирует 10 полей (ID, Имя, Фото, История заказов, Адреса, Скидки).</li>
        <li><b>Партнерское API:</b> Может предоставлять данные в специфическом формате (например, XML) для внешних систем.</li>
    </ul>
    <p><b>Плюс:</b> Избавляет фронтенд-разработчиков от необходимости делать несколько запросов в разные микросервисы и склеивать данные на клиенте.</p>`
},
{
    id: "q112",
    category: "architecture",
    question: "18. Назови все способы снизить нагрузку на веб-сервис.",
    answer: `<h3>Способы снижения нагрузки (Мой чек-лист)</h3>
    <p>Когда мы строим высоконагруженный сервис, я предлагаю следующие решения:</p>
    <ul>
        <li><b>1. Кэширование:</b> Внедряем Redis на уровне бэкенда для частых GET-запросов (каталог товаров). На уровне сети — подключаем CDN для статики (картинки, JS).</li>
        <li><b>2. Асинхронность (Очереди):</b> Тяжелые операции (отправка писем, генерация отчетов) отправляем в RabbitMQ/Kafka, чтобы разгрузить основной поток.</li>
        <li><b>3. Горизонтальное масштабирование:</b> Добавляем новые инстансы (поды) нашего сервиса за балансировщиком (Nginx).</li>
        <li><b>4. Оптимизация SQL-запросов:</b> Добавляем индексы на поля, по которым идет поиск. Избегаем SELECT *. Используем Read-реплики БД (база для чтения отдельно от базы для записи).</li>
        <li><b>5. Rate Limiting (Ограничение запросов):</b> Настраиваем API Gateway так, чтобы один пользователь не мог делать более 100 запросов в минуту.</li>
        <li><b>6. Сжатие ответов:</b> Включаем GZIP на уровне веб-сервера, чтобы уменьшить размер передаваемых JSON-ответов.</li>
    </ul>`
},
{
    id: "q113",
    category: "architecture",
    question: "19. Что такое Event Sourcing?",
    answer: `<h3>Event Sourcing (Хранилище событий)</h3>
    <p><b>Определение:</b> Это архитектурный паттерн, при котором мы храним не текущее состояние объекта, а <b>все события</b>, которые с ним произошли, как неизменяемый лог (журнал).</p>
    <p><b>Как это работает:</b> Вместо того чтобы обновлять запись в БД (UPDATE), мы создаем новую запись в таблице событий. <i>Пример:</i> Вместо того чтобы менять 'Баланс: 1000 -> 900', мы записываем событие 'Списано 100 руб. в 10:00'. Текущий баланс вычисляется путем суммирования всех событий.</p>
    <p><b>Плюсы:</b></p>
    <ul>
        <li><b>Полная история аудита:</b> Можно восстановить состояние системы на любой момент времени.</li>
        <li><b>Отладка:</b> Легко найти, кто и когда изменил данные.</li>
        <li><b>Пересчет:</b> Если бизнес-логика изменилась, можно переиграть события заново.</li>
    </ul>
    <p><b>Минусы:</b> Сложность реализации, хранение огромного объема данных, сложность удаления данных (GDPR).</p>`
},
{
    id: "q114",
    category: "architecture",
    question: "20. Что такое DDD (Domain-Driven Design)?",
    answer: `<h3>Domain-Driven Design (Предметно-ориентированное проектирование)</h3>
    <p><b>Определение:</b> Это подход к разработке сложного программного обеспечения, при котором основной акцент делается на <b>предметную область (бизнес-логику)</b>, а архитектура кода строится вокруг неё, а не вокруг технических деталей.</p>
    <p><b>Ключевые для аналитика паттерны DDD:</b></p>
    <ul>
        <li><b>Единый язык (Ubiquitous Language):</b> Все (бизнес, аналитики, разработчики) говорят на одном языке. Если бизнес говорит 'Сделка', в коде тоже класс называется 'Deal', а не 'Transaction'. Это снижает недопонимание.</li>
        <li><b>Ограниченный контекст (Bounded Context):</b> Четкая граница, внутри которой термины имеют определенный смысл. <i>Пример:</i> Термин 'Клиент' в контексте 'Кредитный скоринг' (возраст, доход) и 'Клиент' в контексте 'Поддержка' (история обращений) — это два разных контекста, которые должны быть разделены на разные сервисы.</li>
    </ul>
    <p><b>На практике:</b> Я использую DDD для того, чтобы правильно нарезать микросервисы. Мы не режем по технологическому признаку (Frontend/Backend), а режем по бизнес-доменам (Продажи, Склад, Финансы).</p>`
},

{
    id: "q115",
    category: "databases",
    question: "1. Что такое БД? Для чего она нужна и кому?",
    answer: `<h3>База данных (БД)</h3>
    <p><b>Определение:</b> Это структурированная совокупность данных, организованных по определенным правилам и хранящихся на цифровых носителях (дисках).</p>
    <p><b>Для чего нужна БД:</b></p>
    <ul>
        <li><b>Персистентность:</b> Сохраняет состояние системы между перезапусками сервера.</li>
        <li><b>Структурированность:</b> Данные организованы в таблицы, документы или графы, что позволяет искать, фильтровать и агрегировать информацию с помощью запросов (SQL).</li>
        <li><b>Целостность:</b> Обеспечивает связи между сущностями и защищает от некорректных данных (например, нельзя удалить пользователя, если у него есть активные заказы).</li>
    </ul>
    <p><b>Кому нужна БД:</b> Любому приложению, которое хранит информацию о пользователях, заказах, товарах, счетах, логах и т.д. Без БД современный бизнес невозможен.</p>`
},
{
    id: "q116",
    category: "databases",
    question: "2. Что такое СУБД?",
    answer: `<h3>СУБД (Система Управления Базами Данных)</h3>
    <p><b>Определение:</b> Это комплекс программных и языковых средств, предназначенных для создания, ведения и совместного использования баз данных многими пользователями.</p>
    <p><b>Что делает СУБД (основные функции):</b></p>
    <ul>
        <li>Обеспечивает доступ к данным (выполнение SQL-запросов).</li>
        <li>Управляет памятью и кэшированием.</li>
        <li>Поддерживает целостность данных (транзакции, ACID).</li>
        <li>Обеспечивает безопасность (разграничение прав доступа).</li>
        <li>Предоставляет инструменты для резервного копирования и восстановления.</li>
    </ul>
    <p><b>Примеры СУБД:</b> PostgreSQL, MySQL (реляционные), MongoDB (документная), Redis (ключ-значение).</p>`
},
{
    id: "q117",
    category: "databases",
    question: "3. Какие есть виды/типы БД? С какими работал на практике?",
    answer: `<h3>Классификация БД и мой опыт</h3>
    <p><b>Типы баз данных:</b></p>
    <ul>
        <li><b>Реляционные (SQL):</b> Данные хранятся в таблицах со строгой схемой, связанных между собой ключами. <i>Примеры:</i> PostgreSQL, Oracle, MySQL.</li>
        <li><b>Документо-ориентированные (NoSQL):</b> Данные хранятся в виде JSON-подобных документов. Схема гибкая. <i>Примеры:</i> MongoDB, CouchDB.</li>
        <li><b>Ключ-значение (Key-Value):</b> Самый быстрый тип, все данные хранятся в оперативной памяти. Используется для кэширования. <i>Примеры:</i> Redis, Memcached.</li>
        <li><b>Колоночные (Columnar):</b> Данные хранятся по столбцам, а не по строкам. Идеально для аналитики (OLAP). <i>Примеры:</i> ClickHouse, Cassandra.</li>
        <li><b>Графовые:</b> Для хранения связей между сущностями. <i>Примеры:</i> Neo4j.</li>
    </ul>
    <p><b>На практике я работал с:</b> <b>PostgreSQL</b> (как основной реляционной БД для транзакционных данных) и <b>Redis</b> (для кэширования часто запрашиваемых данных и хранения сессий).</p>`
},
{
    id: "q118",
    category: "databases",
    question: "4. Почему реляционные БД называют реляционными?",
    answer: `<h3>Происхождение термина 'Реляционная'</h3>
    <p>Термин происходит от английского слова <b>'Relation' (Отношение)</b>.</p>
    <p>В математике (теория множеств) 'отношением' называется набор упорядоченных кортежей. В терминах баз данных, 'отношение' — это просто таблица, а 'кортеж' — это строка в этой таблице.</p>
    <p><b>Таким образом, реляционная БД — это БД, в которой данные организованы в виде таблиц (отношений), а связи между ними строятся на основе логических соответствий (ключей).</b></p>
    <p><i>Пример:</i> У нас есть таблица 'Пользователи' (отношение) и таблица 'Заказы' (отношение). Они связаны через поле user_id (внешний ключ) — это и есть логическая связь (Relation).</p>`
},
{
    id: "q119",
    category: "databases",
    question: "5. В чём отличие реляционных и нереляционных БД? В каком виде хранятся данные в той или иной СУБД?",
    answer: `<h3>SQL vs NoSQL: Сравнение</h3>
    <p><b>Реляционные БД (SQL):</b></p>
    <ul>
        <li><b>Схема:</b> <b>Жесткая (Schema-on-Write).</b> Вы должны определить структуру таблиц (колонки и их типы) до того, как начнете вставлять данные.</li>
        <li><b>Формат хранения:</b> Таблицы (строки и столбцы).</li>
        <li><b>Язык запросов:</b> SQL (структурированный язык).</li>
        <li><b>ACID:</b> Полная поддержка транзакций.</li>
        <li><b>Когда использовать:</b> Для транзакционных систем, где важна целостность данных (банки, ERP).</li>
    </ul>
    <p><b>Нереляционные БД (NoSQL):</b></p>
    <ul>
        <li><b>Схема:</b> <b>Гибкая (Schema-on-Read).</b> Можно хранить документы с разной структурой в одной коллекции.</li>
        <li><b>Формат хранения:</b> JSON-документы (MongoDB), пары ключ-значение (Redis), графы (Neo4j).</li>
        <li><b>Язык запросов:</b> Зависит от СУБД (MongoDB Query Language).</li>
        <li><b>ACID:</b> Ограниченная поддержка (часто жертвуют консистентностью ради скорости).</li>
        <li><b>Когда использовать:</b> Для хранения большого объема неструктурированных данных, кэшей, логов, каталогов товаров с динамическими атрибутами.</li>
    </ul>`
},
{
    id: "q120",
    category: "databases",
    question: "6. Какие задачи решаются с помощью нереляционных СУБД?",
    answer: `<h3>Задачи для NoSQL (Когда я выбираю NoSQL)</h3>
    <p>Я выбираю нереляционную БД в следующих случаях:</p>
    <ul>
        <li><b>Кэширование (Redis):</b> Хранение сессий пользователей, часто запрашиваемых данных (каталог товаров) для ускорения отклика и снижения нагрузки на основную реляционную БД.</li>
        <li><b>Хранение неструктурированных данных (MongoDB):</b> Каталог товаров с тысячами разных характеристик (цвет, размер, материал, вес). Добавление новой характеристики не требует миграции схемы.</li>
        <li><b>Сбор и хранение логов и событий (Elasticsearch):</b> Для полнотекстового поиска по логам.</li>
        <li><b>Графовые связи (Neo4j):</b> Построение рекомендательных систем ('Пользователи, купившие этот товар, также купили...').</li>
        <li><b>Big Data аналитика (ClickHouse):</b> Хранение и агрегация миллиардов событий для построения дашбордов.</li>
    </ul>`
},
{
    id: "q121",
    category: "databases",
    question: "7. Какие свойства у реляционных баз данных?",
    answer: `<h3>Свойства реляционных БД</h3>
    <p>Реляционные БД (такие как PostgreSQL) обладают следующими ключевыми свойствами:</p>
    <ul>
        <li><b>Строгая типизация:</b> Каждая колонка имеет фиксированный тип данных (INTEGER, VARCHAR, DATE). Нельзя записать текст в числовое поле.</li>
        <li><b>Ссылочная целостность (Foreign Keys):</b> Поддержка внешних ключей, которая гарантирует, что не будет 'висящих' записей (например, нельзя добавить заказ с user_id, которого нет в таблице пользователей).</li>
        <li><b>Поддержка транзакций (ACID):</b> Гарантия атомарности и согласованности данных.</li>
        <li><b>Стандартизированный язык (SQL):</b> Единый язык запросов, который поддерживается большинством СУБД.</li>
        <li><b>Нормализация:</b> Возможность избежать дублирования данных за счет разделения таблиц.</li>
    </ul>`
},
{
    id: "q122",
    category: "databases",
    question: "8. Какие виды связей между таблицами существуют в реляционных БД? Какие у них особенности?",
    answer: `<h3>Связи между таблицами (Cardinality)</h3>
    <p>В реляционных БД существует три основных типа связей:</p>
    <ul>
        <li><b>Один к одному (1:1):</b> Одной записи в таблице А соответствует ровно одна запись в таблице Б. <i>Пример:</i> Пользователь -> Паспортные данные. Используется для разделения редко используемых полей или для безопасности.</li>
        <li><b>Один ко многим (1:M):</b> Самая распространенная связь. Одной записи в таблице А соответствует множество записей в таблице Б. Внешний ключ (FK) всегда находится на стороне 'многих'. <i>Пример:</i> Один клиент -> Много заказов. В таблице 'Заказы' хранится client_id.</li>
        <li><b>Многие ко многим (M:M):</b> Множество записей из А связано с множеством записей из Б. Реализуется через <b>промежуточную (связующую) таблицу</b>, которая содержит два внешних ключа. <i>Пример:</i> Студенты и Курсы. Один студент может посещать много курсов, один курс могут посещать много студентов. Связующая таблица 'Записи_на_курс' хранит student_id и course_id.</li>
    </ul>`
},
{
    id: "q123",
    category: "databases",
    question: "9. Каким образом осуществляется связь «многие ко многим»?",
    answer: `<h3>Реализация связи M:M</h3>
    <p>Связь 'Многие ко многим' (M:M) не может быть реализована напрямую в реляционной БД, потому что внешний ключ может быть только в одной таблице.</p>
    <p><b>Решение:</b> Использовать <b>промежуточную (ассоциативную) таблицу</b> (также называемую 'таблицей связей' или 'джойн-таблицей').</p>
    <p><b>Пример (Книги и Авторы):</b></p>
    <ul>
        <li>Таблица <b>Книги</b>: id, title.</li>
        <li>Таблица <b>Авторы</b>: id, name.</li>
        <li>Промежуточная таблица <b>Книги_Авторы</b>: book_id (FK на Книги), author_id (FK на Авторы).</li>
    </ul>
    <p>Чтобы получить всех авторов книги 5, мы делаем JOIN таблиц: `Книги_Авторы` -> `Авторы`.</p>
    <p><b>Дополнительно:</b> В промежуточную таблицу часто добавляют служебные поля, специфичные для этой связи (например, 'порядковый номер автора' или 'год начала сотрудничества').</p>`
},
{
    id: "q124",
    category: "databases",
    question: "10. Какие констрейнты (ограничения) знаешь?",
    answer: `<h3>Констрейнты (Ограничения) в SQL</h3>
    <p>Констрейнты — это правила, которые мы накладываем на колонки таблицы, чтобы защитить данные от некорректного ввода.</p>
    <ul>
        <li><b>PRIMARY KEY (Первичный ключ):</b> Гарантирует уникальность и NOT NULL. Идентифицирует каждую строку. <i>Пример:</i> `id INT PRIMARY KEY`.</li>
        <li><b>FOREIGN KEY (Внешний ключ):</b> Ссылается на PK другой таблицы, обеспечивая ссылочную целостность. <i>Пример:</i> `user_id INT REFERENCES users(id)`.</li>
        <li><b>UNIQUE (Уникальность):</b> Запрещает дублирование значений в колонке (или комбинации колонок). <i>Пример:</i> `email VARCHAR(255) UNIQUE`.</li>
        <li><b>NOT NULL (Не пусто):</b> Запрещает вставку NULL-значений. <i>Пример:</i> `name VARCHAR(100) NOT NULL`.</li>
        <li><b>CHECK (Проверка условия):</b> Убеждается, что значение соответствует логическому условию. <i>Пример:</i> `age INT CHECK (age >= 18)`.</li>
        <li><b>DEFAULT (Значение по умолчанию):</b> Подставляет значение, если оно не указано в INSERT. <i>Пример:</i> `created_at TIMESTAMP DEFAULT NOW()`.</li>
    </ul>`
},
{
    id: "q125",
    category: "databases",
    question: "11. Что такое первичный ключ (PK) и какими свойствами обладает? Что такое внешний ключ (FK)? Чем PK отличается от FK?",
    answer: `<h3>PK vs FK</h3>
    <p><b>Первичный ключ (Primary Key):</b> Это уникальный идентификатор каждой строки в таблице.</p>
    <ul>
        <li><b>Свойства:</b> Уникальность (не может быть двух одинаковых) и NOT NULL (обязателен).</li>
        <li>Может быть как одним полем (`id`), так и составным (комбинацией полей).</li>
        <li><i>Пример:</i> `id` в таблице `users`.</li>
    </ul>
    <p><b>Внешний ключ (Foreign Key):</b> Это поле в одной таблице, которое ссылается на первичный ключ другой таблицы.</p>
    <ul>
        <li><b>Назначение:</b> Обеспечивает связь между таблицами (связь 'один-ко-многим').</li>
        <li>Может принимать значение NULL (если связь необязательна).</li>
        <li><i>Пример:</i> `user_id` в таблице `orders`, который ссылается на `users.id`.</li>
    </ul>
    <p><b>Отличие:</b> PK идентифицирует саму сущность в своей таблице. FK связывает эту сущность с сущностью из другой таблицы.</p>`
},
{
    id: "q126",
    category: "databases",
    question: "12. Что такое нормализация БД?",
    answer: `<h3>Нормализация баз данных</h3>
    <p><b>Определение:</b> Это процесс структурной организации данных (разбиения таблиц) с целью устранения избыточности (дублирования) и предотвращения аномалий при обновлении, вставке и удалении данных.</p>
    <p><b>Зачем нужна нормализация:</b> Чтобы БД была 'чистой'. Если мы храним адрес доставки в каждой строке заказа, то при смене адреса пользователя нам придется обновлять 1000 строк. Если мы вынесем адрес в отдельную таблицу 'Адреса' (нормализуем), нам нужно будет обновить только 1 запись.</p>
    <p><b>Пример аномалии:</b> В таблице 'Заказы' хранится 'Название товара'. Если мы переименуем товар, нам придется обновить все старые заказы (что неправильно, потому что в старых заказах должно сохраняться название на момент покупки). Нормализация требует вынести товары в отдельную таблицу, а в заказах хранить ID товара (и цену на момент покупки).</p>`
},
{
    id: "q127",
    category: "databases",
    question: "13. Назови первые три нормальные формы.",
    answer: `<h3>Первые три нормальные формы (1НФ, 2НФ, 3НФ)</h3>
    <p>Я использую эти правила как чек-лист при проектировании новых таблиц:</p>
    <ul>
        <li><b>Первая нормальная форма (1НФ):</b> Каждая ячейка таблицы должна содержать <b>одно атомарное значение</b> (неделимое). Нельзя хранить список телефонов в одной ячейке. Нужно выносить их в отдельную таблицу.</li>
        <li><b>Вторая нормальная форма (2НФ):</b> Таблица должна быть в 1НФ, и <b>каждый неключевой атрибут должен зависеть от ВСЕГО первичного ключа</b> (актуально для составных ключей). <i>Пример:</i> Если PK составной (Заказ_ID + Товар_ID), а поле 'Название_Товара' зависит только от Товар_ID (а не от всего ключа) — нарушение. Название нужно вынести в таблицу 'Товары'.</li>
        <li><b>Третья нормальная форма (3НФ):</b> Таблица должна быть в 2НФ, и <b>не должно быть транзитивных зависимостей</b>. Неключевые поля не должны зависеть от других неключевых полей. <i>Пример:</i> В заказе есть поля 'Город' и 'Код_Города'. Код зависит от Города, а Город не является ключом. Нужно вынести города в отдельную таблицу.</li>
    </ul>`
},
{
    id: "q128",
    category: "databases",
    question: "14. Что такое денормализация и когда её использовать?",
    answer: `<h3>Денормализация (Denormalization)</h3>
    <p><b>Определение:</b> Это процесс, обратный нормализации — намеренное внесение избыточности (дублирования данных) в базу данных.</p>
    <p><b>Когда я использую денормализацию (на практике):</b></p>
    <ul>
        <li><b>Для ускорения чтения (SELECT):</b> В высоконагруженных системах (Highload) JOIN-ы между несколькими таблицами могут быть очень дорогими. Мы сознательно добавляем в таблицу 'Заказы' поле 'Имя_Клиента', чтобы не делать JOIN с таблицей 'Пользователи' при каждом запросе.</li>
        <li><b>В аналитических БД (DWH, ClickHouse):</b> В хранилищах данных мы часто храним 'плоские' таблицы с уже агрегированными данными, чтобы аналитики могли быстро строить отчеты без сложных JOIN-ов.</li>
    </ul>
    <p><b>Цена денормализации:</b> Мы начинаем тратить больше места на диске, а главное — усложняется логика обновления (при изменении имени пользователя нужно обновить его во всех заказах). Поэтому денормализацию я применяю только там, где скорость чтения критически важна.</p>`
},
{
    id: "q129",
    category: "databases",
    question: "15. Что такое транзакция?",
    answer: `<h3>Транзакция (Transaction)</h3>
    <p><b>Определение:</b> Это логическая единица работы, которая представляет собой последовательность операций с базой данных (INSERT, UPDATE, DELETE), выполняемую как единое целое.</p>
    <p><b>Принцип транзакции:</b> 'Все или ничего'.</p>
    <ul>
        <li>Если все операции в транзакции успешны, мы делаем <b>COMMIT (фиксация)</b> — изменения сохраняются навсегда.</li>
        <li>Если хотя бы одна операция завершилась ошибкой, мы делаем <b>ROLLBACK (откат)</b> — все изменения, сделанные в рамках этой транзакции, отменяются, и БД возвращается в исходное состояние.</li>
    </ul>
    <p><b>Пример (Банковский перевод):</b> Списать 100 руб. со счета А и зачислить 100 руб. на счет Б. Это ДВЕ операции, но они должны быть в ОДНОЙ транзакции. Если списание прошло, а зачисление упало из-за ошибки, ROLLBACK вернет деньги на счет А.</p>`
},
{
    id: "q130",
    category: "databases",
    question: "16. Что такое требования ACID? Какими свойствами должна обладать транзакция?",
    answer: `<h3>ACID: Свойства транзакций</h3>
    <p>Чтобы транзакция была надежной, она должна соответствовать четырем свойствам, известным как акроним <b>ACID</b>:</p>
    <ul>
        <li><b>A — Atomicity (Атомарность):</b> Транзакция выполняется либо полностью, либо не выполняется вообще. Никаких 'половинчатых' состояний.</li>
        <li><b>C — Consistency (Согласованность):</b> Транзакция переводит БД из одного корректного состояния в другое корректное. Все ограничения (констрейнты, триггеры) соблюдены.</li>
        <li><b>I — Isolation (Изоляция):</b> Параллельно выполняющиеся транзакции не должны мешать друг другу. Промежуточные результаты одной транзакции не видны другим до момента COMMIT.</li>
        <li><b>D — Durability (Долговечность):</b> После успешного COMMIT изменения сохраняются физически на диске и не теряются даже при перезагрузке сервера.</li>
    </ul>`
},
{
    id: "q131",
    category: "databases",
    question: "17. Что такое «грязное чтение» в БД?",
    answer: `<h3>Dirty Read (Грязное чтение)</h3>
    <p><b>Определение:</b> Это феномен, возникающий при параллельном выполнении транзакций, когда одна транзакция (А) считывает данные, которые были изменены (но еще не закоммичены) другой транзакцией (Б).</p>
    <p><b>Опасность:</b> Если транзакция Б в итоге сделает <b>ROLLBACK</b> (откат), то данные, которые прочитала транзакция А, окажутся невалидными ('грязными'), и она примет решение на основе несуществующих данных.</p>
    <p><b>Пример:</b></p>
    <ol>
        <li>Транзакция Б: UPDATE счет SET баланс = 1000 (еще не COMMIT).</li>
        <li>Транзакция А: SELECT баланс (читает 1000).</li>
        <li>Транзакция Б: ROLLBACK (баланс вернулся к 900).</li>
        <li>Транзакция А теперь думает, что баланс 1000, а на самом деле 900.</li>
    </ol>
    <p><b>Решение:</b> Установить уровень изоляции транзакции <b>READ COMMITTED</b> (читать только закоммиченные данные).</p>`
},
{
    id: "q132",
    category: "databases",
    question: "18. Зачем нужны индексы в таблицах БД? Встречал ли на практике?",
    answer: `<h3>Индексы в базах данных</h3>
    <p><b>Что это:</b> Это специальные структуры данных (чаще всего B-Tree), которые кардинально <b>ускоряют поиск</b> строк в таблице (SELECT с условием WHERE).</p>
    <p><b>Как это работает:</b> Без индекса СУБД делает полный перебор таблицы (Full Table Scan) — читает все строки с диска, что очень медленно для больших таблиц (миллионы записей). Индекс — это как алфавитный указатель в конце книги. Вместо того чтобы листать всю книгу, вы смотрите на индекс и сразу переходите на нужную страницу.</p>
    <p><b>На практике я сталкиваюсь с индексами постоянно:</b></p>
    <ul>

{

    question: "22. Какие бывают представления (Views) в БД?",
    answer: `<h3>Представления (Views)</h3>
    <p><b>Определение:</b> Это виртуальная таблица, которая не хранит данные на диске, а является сохраненным SQL-запросом. При обращении к View, СУБД выполняет этот запрос и возвращает результат.</p>
    <p><b>Типы Views:</b></p>
    <ul>
        <li><b>Обычное представление (Standard View):</b> Просто сохраненный SELECT. При каждом вызове он перевыполняется. Используется для упрощения сложных запросов (чтобы не писать 5 JOIN каждый раз).</li>
        <li><b>Материализованное представление (Materialized View):</b> Данные сохраняются на диск (кэшируются) и обновляются только по команде (REFRESH MATERIALIZED VIEW). Используется для тяжелых агрегирующих отчетов, чтобы не тормозить систему во время их расчета.</li>
    </ul>
    <p><b>На практике:</b> Я часто создаю Views для аналитики, чтобы отдавать менеджерам отчеты без необходимости писать сложные SQL-запросы каждый раз.</p>`
},
{
    id: "q137",
    category: "databases",
    question: "23. What is replication / Что такое реплицирование?",
    answer: `<h3>Репликация (Replication)</h3>
    <p><b>Определение:</b> Это процесс копирования данных с одного сервера базы данных (мастер/primary) на один или несколько других серверов (реплики/standby).</p>
    <p><b>Цели репликации:</b></p>
    <ul>
        <li><b>Отказоустойчивость (High Availability):</b> Если мастер-сервер упадет, мы можем быстро переключиться на реплику.</li>
        <li><b>Масштабирование чтения (Read Scaling):</b> Вся запись (INSERT/UPDATE) идет на мастер, а все тяжелые SELECT-запросы (для отчетов) мы направляем на реплику, разгружая мастер.</li>
        <li><b>Резервное копирование:</b> С реплики можно делать бэкапы, не нагружая мастер.</li>
    </ul>
    <p><b>Типы:</b> Синхронная (ждет подтверждения реплики) и асинхронная (не ждет, быстрее, но риск потери данных).</p>`
},

    answer: `<h3>Партиционирование (Partitioning)</h3>

        <li><b>По списку (List):</b> По значению. <i>Пример:</i> Разбиваем пользователей по региону: users_moscow, users_spb.</li>
        <li><b>По хэшу (Hash):</b> Равномерное распределение по хэшу ключа. Используется, когда нет естественного диапазона.</li>
    </ul>
    <p><b>Зачем это нужно:</b> Ускорение запросов (секция сканируется вместо всей таблицы) и упрощение архивации (старые партиции можно легко отключать).</p>`

    question: "25. Что такое шардирование?",
    answer: `<h3>Шардирование (Sharding)</h3>
    <p><b>Определение:</b> Это <b>горизонтальное масштабирование</b> (Scale-Out), при котором данные одной таблицы разбиваются по разным серверам базы данных (нодам).</p>
    <p><b>Принцип:</b> Мы выбираем ключ шардирования (например, user_id). По хэшу этого ключа мы определяем, на какой сервер пойдет запрос.</p>
    <p><b>Отличие от партиционирования:</b></p>
    <ul>
        <li><b>Партиционирование:</b> Таблица разбита на части, но все они лежат на ОДНОМ сервере (одна машина).</li>
        <li><b>Шардирование:</b> Таблица разбита на части, и эти части лежат на РАЗНЫХ серверах (разные машины).</li>
    </ul>
    <p><b>Когда использовать:</b> Когда данных становится так много (сотни терабайт), что они не вмещаются в память или на диск одного сервера.</p>`

    question: "26. Чем отличается реплицирование и шардирование? Какие способы масштабирования БД знаешь?",
    answer: `<h3>Масштабирование БД: Репликация vs Шардирование</h3>
    <p><b>Репликация:</b> Копирование одних и тех же данных на несколько серверов (полные копии). Увеличивает отказоустойчивость и скорость чтения.</p>
    <p><b>Шардирование:</b> Разделение данных между серверами (каждый сервер хранит уникальную часть данных). Увеличивает емкость хранения (можно хранить терабайты) и скорость записи.</p>
    <p><b>Способы масштабирования БД:</b></p>
    <ul>
        <li><b>Вертикальное (Scale-Up):</b> Добавляем ресурсы одной машине (больше RAM, быстрее CPU, SSD). Просто, но дорого и имеет физический предел.</li>
        <li><b>Горизонтальное (Scale-Out):</b> Добавляем новые машины. Включает в себя <b>Репликацию</b> (для чтения) и <b>Шардирование</b> (для записи/объема).</li>
    </ul>`
},

    question: "27. Что такое CAP-теорема? Как сделать систему консистентной, доступной и устойчивой к разделению?",
    answer: `<h3>CAP-теорема (Теорема Брюера)</h3>
    <p><b>Суть:</b> В распределенной системе невозможно одновременно обеспечить все три свойства: <b>C</b>onsistency (Консистентность), <b>A</b>vailability (Доступность), <b>P</b>artition Tolerance (Устойчивость к разделению сети).</p>
    <p><b>Что это значит для меня как аналитика:</b> Поскольку сбои сети (P) неизбежны, архитектор всегда выбирает между <b>CP</b> и <b>AP</b>.</p>
    <ul>
        <li><b>CP (Consistency + Partition):</b> Жертвуем доступностью ради точности данных. Если сеть упала и мы не можем гарантировать консистентность, сервер возвращает ошибку (или падает). <i>Пример:</i> Банковские системы (нельзя списать деньги, если есть риск рассинхрона).</li>
        <li><b>AP (Availability + Partition):</b> Жертвуем мгновенной консистентностью ради доступности. Сервер всегда отвечает, но может выдать устаревшие данные, которые синхронизируются позже (Eventual Consistency). <i>Пример:</i> Социальные сети (видели, что статус 'В сети', хотя он уже изменился).</li>
    </ul>`
},

    answer: `<h3>Мои навыки SQL</h3>

{

    question: "29. Для чего нужен оператор LIKE?",
    answer: `<h3>LIKE в SQL</h3>
    <p><b>LIKE</b> — это оператор, который используется в запросах для <b>поиска по шаблону</b> в текстовых полях (WHERE).</p>
    <p><b>Спецсимволы для шаблонов:</b></p>
    <ul>
        <li><b>`%` (процент):</b> Означает <b>любое</b> количество любых символов (включая ноль).</li>
        <li><b>`_` (подчеркивание):</b> Означает ровно <b>один</b> любой символ.</li>

    <p><b>Примеры:</b></p>
    <ul>
        <li><code>WHERE name LIKE 'Алек%'</code> — найдет 'Алексей', 'Александр', 'Алек' (все, что начинается на Алек).</li>
        <li><code>WHERE email LIKE '%@gmail.com'</code> — найдет все gmail-адреса.</li>
        <li><code>WHERE phone LIKE '+7___'</code> — найдет номера, где после +7 идет ровно 3 символа (для коротких номеров).</li>
    </ul>`
},
{
    id: "q144",
    category: "databases",
    question: "30. Для чего нужен GROUP BY?",
    answer: `<h3>GROUP BY в SQL</h3>
    <p><b>GROUP BY</b> — это оператор, который группирует строки с одинаковыми значениями в указанных колонках, чтобы затем применить к ним <b>агрегатные функции</b>.</p>
    <p><b>Агрегатные функции, которые я использую с GROUP BY:</b></p>
    <ul>
        <li><b>COUNT():</b> Количество записей в группе.</li>
        <li><b>SUM():</b> Сумма значений.</li>
        <li><b>AVG():</b> Среднее значение.</li>
        <li><b>MIN() / MAX():</b> Минимальное/максимальное значение.</li>
    </ul>
    <p><b>Пример:</b> Нам нужно посчитать общую сумму заказов по каждому клиенту.<br>
    <code>SELECT client_id, SUM(total_amount) AS total_spent<br>FROM orders<br>GROUP BY client_id;</code><br>
    Здесь группировка идет по client_id, и мы суммируем суммы заказов внутри каждой группы.</p>`

{
    id: "q145",
    category: "databases",
    question: "31. Для чего используется HAVING в SQL? Чем HAVING отличается от WHERE?",
    answer: `<h3>HAVING vs WHERE</h3>
    <p>Оба используются для фильтрации, но на разных этапах выполнения запроса.</p>
    <p><b>WHERE:</b> Фильтрует строки <b>ДО</b> группировки (GROUP BY). Не может использоваться с агрегатными функциями.</p>
    <p><b>HAVING:</b> Фильтрует группы <b>ПОСЛЕ</b> группировки (GROUP BY). <b>Может</b> использовать агрегатные функции.</p>
    <p><b>Пример:</b> Нужно найти клиентов, чья общая сумма покупок превышает 100 000 руб.</p>
    <code>SELECT client_id, SUM(total_amount) AS total_spent<br>FROM orders<br>GROUP BY client_id<br>HAVING SUM(total_amount) > 100000;</code>
    <p>Мы не можем использовать `WHERE SUM(...) > 100000`, потому что агрегация происходит после WHERE.</p>`
},
{

    question: "32. Чем TRUNCATE отличается от DELETE?",
    answer: `<h3>TRUNCATE vs DELETE</h3>
    <p>Обе команды удаляют данные, но делают это принципиально по-разному.</p>
    <p><b>TRUNCATE (DDL команда):</b></p>
    <ul>
        <li>Удаляет <b>ВСЕ</b> строки из таблицы (без WHERE).</li>
        <li>Не логирует каждую строку, удаляет страницы данных целиком.</li>
        <li>Работает <b>очень быстро</b>, но ее нельзя откатить (ROLLBACK) в некоторых СУБД.</li>
        <li>Сбрасывает счетчик автоинкремента (ID начинается с 1).</li>
    </ul>
    <p><b>DELETE (DML команда):</b></p>
    <ul>
        <li>Удаляет строки <b>построчно</b>.</li>
        <li>Можно использовать с <b>WHERE</b> (удалить только часть строк).</li>
        <li>Каждая операция удаления записывается в лог транзакций, поэтому работает медленнее.</li>
        <li>Ее можно откатить (ROLLBACK). Счетчик автоинкремента не сбрасывается.</li>
    </ul>`

{
    id: "q147",
    category: "databases",
    question: "33. Чем отличается UNION от UNION ALL? Чем JOIN отличается от UNION?",
    answer: `<h3>UNION vs UNION ALL vs JOIN</h3>
    <p><b>UNION:</b> Соединяет результаты двух запросов <b>по вертикали</b> (добавляет строки снизу). <b>Удаляет дубликаты</b> (выполняет сортировку и сравнение, что дорого).</p>
    <p><b>UNION ALL:</b> Соединяет результаты <b>по вертикали</b>, но <b>НЕ удаляет дубликаты</b>. Работает быстрее UNION, так как не выполняет сортировку.</p>
    <p><b>JOIN:</b> Соединяет таблицы <b>по горизонтали</b> (присоединяет колонки из другой таблицы на основе ключа).</p>
    <p><b>Пример:</b></p>
    <ul>
        <li><i>UNION:</i> Таблица А (2 колонки) + Таблица Б (2 колонки) = Результат (2 колонки, строки сложились).</li>
        <li><i>JOIN:</i> Таблица А (2 колонки) + Таблица Б (2 колонки) = Результат (4 колонки, строки объединились по ключу).</li>
    </ul>`

    id: "q148",
    category: "databases",
    question: "34. Что такое JOIN-запросы и какие они бывают?",
    answer: `<h3>JOIN-ы в SQL</h3>
    <p><b>JOIN</b> — это оператор, объединяющий строки из двух (или более) таблиц на основе связанного столбца (обычно внешнего ключа).</p>
    <p><b>Типы JOIN:</b></p>
    <ul>
        <li><b>INNER JOIN:</b> Возвращает только те строки, где есть совпадения в обеих таблицах. Самый частый.</li>
        <li><b>LEFT JOIN (или LEFT OUTER JOIN):</b> Возвращает все строки из левой таблицы и совпадающие из правой. Если совпадений нет — вставляет NULL.</li>
        <li><b>RIGHT JOIN (или RIGHT OUTER JOIN):</b> Возвращает все строки из правой таблицы и совпадающие из левой. (Использую редко, обычно можно перевернуть LEFT).</li>
        <li><b>FULL OUTER JOIN:</b> Возвращает все строки из обеих таблиц, заполняя NULL-ы там, где нет совпадений.</li>
        <li><b>CROSS JOIN:</b> Декартово произведение (каждая строка из А соединяется с каждой строкой из Б). Используется редко, только для генерации тестовых данных.</li>
    </ul>`
},
{
    id: "q149",
    category: "databases",
    question: "35. Чем INNER JOIN отличается от LEFT JOIN? Чем LEFT JOIN отличается от FULL JOIN?",
    answer: `<h3>Сравнение JOIN-ов</h3>
    <p><b>INNER vs LEFT:</b></p>
    <ul>
        <li><b>INNER:</b> Отбрасывает строки, если для них нет пары в другой таблице. Например, если у пользователя нет заказов — он НЕ попадет в результат.</li>
        <li><b>LEFT:</b> Сохраняет ВСЕХ пользователей из левой таблицы, даже если у них нет заказов. Для таких пользователей поля из таблицы 'Заказы' будут заполнены NULL.</li>
    </ul>
    <p><b>LEFT vs FULL:</b></p>
    <ul>
        <li><b>LEFT:</b> Сохраняет все строки ТОЛЬКО из левой таблицы. Если в правой таблице есть записи, которым нет пары в левой — они НЕ попадут в результат.</li>
        <li><b>FULL:</b> Сохраняет ВСЕ строки из ОБЕИХ таблиц. И те, у кого нет пары слева, и те, у кого нет пары справа, будут включены (с NULL-ами).</li>
    </ul>`
},
{
    id: "q150",
    category: "databases",
    question: "36. Назови все способы в SQL выбрать данные из первой таблицы, которых нет во второй (NOT IN, NOT EXISTS и др.).",
    answer: `<h3>Поиск записей, отсутствующих в другой таблице</h3>
    <p>Когда мне нужно найти записи, которые есть в таблице А, но нет в таблице Б (например, пользователей без заказов), я использую один из трех способов:</p>
    <ul>
        <li><b>1. LEFT JOIN + IS NULL (Самый оптимальный):</b><br>
            <code>SELECT a.* FROM users a<br>LEFT JOIN orders b ON a.id = b.user_id<br>WHERE b.id IS NULL;</code>
        </li>
        <li><b>2. NOT EXISTS (Коррелированный подзапрос):</b><br>
            <code>SELECT * FROM users a<br>WHERE NOT EXISTS (SELECT 1 FROM orders b WHERE b.user_id = a.id);</code>
        </li>
        <li><b>3. NOT IN (Самый понятный, но осторожно с NULL):</b><br>
            <code>SELECT * FROM users<br>WHERE id NOT IN (SELECT user_id FROM orders);</code>
            <i>Предостережение:</i> Если подзапрос вернет хоть один NULL, NOT IN не вернет ни одной строки.</li>
    </ul>`
},

    question: "19. Что такое протокол? Какие протоколы знаешь? Какие уровни протоколов знаешь (модель OSI)?",
    answer: `<h3>Сетевые протоколы и модель OSI</h3>

{
    id: "q170",
    category: "other",
    question: "20. Чем отличается HTTP от HTTPS? Как работает HTTPS?",
    answer: `<h3>HTTP vs HTTPS</h3>
    <p><b>HTTP:</b> Передает данные в открытом виде (plain text). Любой злоумышленник в вашей сети может перехватить и прочитать пароль или номер карты.</p>
    <p><b>HTTPS (HTTP Secure):</b> Использует шифрование через протоколы SSL/TLS. Все данные между браузером и сервером зашифрованы.</p>
    <p><b>Как работает HTTPS (упрощенно):</b></p>
    <ol>
        <li>Браузер обращается к серверу.</li>
        <li>Сервер присылает свой SSL-сертификат (подтверждение личности).</li>
        <li>Браузер проверяет сертификат (не просрочен ли, подписан ли доверенным центром).</li>
        <li>Стороны договариваются о сеансовом ключе шифрования.</li>
        <li>Все последующие данные передаются в зашифрованном виде.</li>
    </ol>`
},
{
    id: "q171",
    category: "other",
    question: "21. Что происходит, когда ты переходишь по URL (открываешь страницу в браузере)? Как находится нужный сервер? Почему ответ возвращается именно к тебе?",
    answer: `<h3>Путь HTTP-запроса</h3>
    <p><b>1. Поиск сервера (DNS):</b> Браузер видит домен (например, example.com). Он обращается к DNS-серверу, чтобы узнать IP-адрес этого домена (например, 93.184.216.34).</p>
    <p><b>2. Установка соединения (TCP Handshake):</b> Браузер устанавливает TCP-соединение с этим IP-адресом по порту 443 (для HTTPS).</p>
    <p><b>3. Отправка запроса:</b> Браузер формирует HTTP-запрос (метод GET, заголовки) и отправляет его.</p>
    <p><b>4. Почему ответ возвращается именно вам:</b> В каждом сетевом пакете указан <b>IP-адрес отправителя</b> (ваш) и <b>IP-адрес получателя</b> (сервер). Маршрутизаторы в интернете читают эти адреса и направляют пакеты обратно к вам. Ваш браузер также использует порт, чтобы понять, какому именно приложению (вкладке) отдать ответ.</p>`
},
{
    id: "q172",
    category: "other",
    question: "22. Что такое шифрование данных? Какие виды бывают?",
    answer: `<h3>Шифрование данных (Криптография)</h3>
    <p><b>Шифрование</b> — это процесс преобразования открытого текста в нечитаемый код (шифротекст) с использованием ключа, чтобы защитить данные от несанкционированного доступа.</p>
    <p><b>Два основных вида шифрования:</b></p>
    <ul>
        <li><b>Симметричное (AES, DES):</b> Используется <b>один</b> секретный ключ и для шифрования, и для дешифрования. <i>Плюсы:</i> Очень быстро работает. <i>Минусы:</i> Ключ нужно безопасно передать получателю. Используется для шифрования больших объемов данных.</li>
        <li><b>Асимметричное (RSA, ECC):</b> Используется <b>пара</b> ключей: Публичный (шифрует) и Приватный (расшифровывает). <i>Плюсы:</i> Безопасная передача ключей. <i>Минусы:</i> Медленнее симметричного. Используется для цифровых подписей и обмена ключами (например, в SSL).</li>
    </ul>`
},
{
    id: "q173",
    category: "other",
    question: "23. Чем отличаются идентификация, аутентификация и авторизация?",
    answer: `<h3>Идентификация vs Аутентификация vs Авторизация</h3>
    <p><b>Идентификация (Identification):</b> Процесс распознавания пользователя по уникальному признаку. Это просто представление: <i>'Я — пользователь Иван'</i> (логин).</p>
    <p><b>Аутентификация (Authentication):</b> Процесс проверки подлинности пользователя. Это доказательство того, что вы тот, за кого себя выдаете: <i>'Я Иван, и я знаю пароль (или у меня есть отпечаток пальца)'</i>.</p>
    <p><b>Авторизация (Authorization):</b> Процесс проверки прав доступа. Это определение того, что разрешено делать пользователю после того, как он вошел: <i>'Иван может просматривать свои заказы, но не может удалять чужие'</i>.</p>`
},
{
    id: "q174",
    category: "other",
    question: "24. Какие виды/методы аутентификации знаешь?",
    answer: `<h3>Методы аутентификации</h3>
    <p><b>Знаю и использую на практике следующие методы:</b></p>
    <ul>
        <li><b>Basic Auth (Базовая аутентификация):</b> Передача логина и пароля в заголовке в формате Base64 (небезопасно без HTTPS).</li>
        <li><b>Токенная аутентификация (JWT):</b> Стандарт де-факто для микросервисов. Клиент получает токен и передает его в заголовке `Authorization: Bearer`.</li>
        <li><b>Двухфакторная аутентификация (2FA/MFA):</b> Комбинация пароля и одноразового кода из SMS или Google Authenticator (TOTP). Используется для защиты админок.</li>
        <li><b>Биометрическая аутентификация:</b> FaceID, отпечаток пальца.</li>
        <li><b>Сертификатная аутентификация (mTLS):</b> Взаимная аутентификация с помощью SSL-сертификатов (используется для сервис-сервисных интеграций).</li>
    </ul>`
},
{
    id: "q175",
    category: "other",
    question: "25. Что такое токен? Как он устроен?",
    answer: `<h3>Токен и JWT</h3>
    <p><b>Токен</b> — это компактный набор данных (строка), который используется для аутентификации и авторизации. Самый популярный формат — <b>JWT (JSON Web Token)</b>.</p>
    <p><b>Устройство JWT (3 части, разделенные точкой):</b><br>
    <code>xxxxx.yyyyy.zzzzz</code></p>
    <ul>
        <li><b>1. Header (Заголовок):</b> Алгоритм подписи и тип токена. <i>Пример:</i> <code>{"alg": "HS256", "typ": "JWT"}</code></li>
        <li><b>2. Payload (Набор данных):</b> Сама информация о пользователе (ID, роли) и время истечения (exp). <i>Пример:</i> <code>{"user_id": 1, "role": "admin", "exp": 1718000000}</code></li>
        <li><b>3. Signature (Подпись):</b> Криптографическая подпись, которая гарантирует, что токен не был изменен злоумышленником.</li>
    </ul>
    <p><b>Почему JWT удобен:</b> Он Stateless. Серверу не нужно хранить сессию в БД, он просто проверяет подпись токена локально.</p>`
},
{
    id: "q176",
    category: "other",
    question: "26. Что такое Bearer Authentication? Как она работает?",
    answer: `<h3>Bearer Authentication</h3>
    <p><b>Bearer Authentication</b> — это схема авторизации, при которой клиент предъявляет серверу токен (JWT) в HTTP-заголовке.</p>
    <p><b>Как это работает (поток):</b></p>
    <ol>
        <li>Пользователь вводит логин/пароль на фронтенде.</li>
        <li>Бэкенд проверяет их и выдает JWT-токен.</li>
        <li>Фронтенд сохраняет этот токен (обычно в localStorage).</li>
        <li>При каждом запросе к защищенному эндпоинту фронтенд добавляет заголовок:<br>
            <code>Authorization: Bearer <ваш_токен></code>
        </li>
        <li>Сервер читает этот заголовок, валидирует подпись и срок действия токена, и если всё ОК — обрабатывает запрос.</li>
    </ol>`
},
{

    question: "27. Что такое OAuth-аутентификация (OAuth 2.0)? Когда применяется и как устроен поток?",
    answer: `<h3>OAuth 2.0: Делегирование прав</h3>

    </ol>`
},
{
    id: "q178",

    question: "28. Что такое хеш и для чего он нужен?",
    answer: `<h3>Хеш (Hash)</h3>
    <p><b>Определение:</b> Это необратимое математическое преобразование (функция) входных данных любой длины в строку фиксированной длины.</p>
    <p><b>Ключевое свойство:</b> Из хеша невозможно восстановить исходные данные (необратимость).</p>
    <p><b>Где применяется на практике:</b></p>
    <ul>
        <li><b>Хранение паролей в БД:</b> Мы не храним пароли в открытом виде, а храним их хеш (bcrypt, SHA-256). При входе хешируем введенный пароль и сравниваем с хешем в БД.</li>
        <li><b>Контроль целостности данных:</b> Проверяем, не изменился ли файл при передаче (сравниваем хеш-сумму).</li>
        <li><b>Подписи токенов (JWT):</b> Хеширование используется для создания криптографической подписи.</li>
    </ul>`
},

},
{
    id: "q181",
    category: "other",
    question: "31. Что такое MVP и для чего он нужен?",
    answer: `<h3>MVP (Minimum Viable Product)</h3>
    <p><b>Определение:</b> Это версия продукта, которая содержит минимальный набор функций, достаточный для того, чтобы <b>выпустить его на рынок</b> и получить обратную связь от первых пользователей, потратив минимум ресурсов.</p>
    <p><b>Зачем нужен MVP:</b></p>
    <ul>
        <li><b>Проверка гипотез:</b> Вместо того чтобы строить 'замок' 2 года, мы строим 'шалаш' за 3 месяца и смотрим, придет ли кто-то вообще.</li>
        <li><b>Экономия бюджета:</b> Мы не тратим деньги на фичи, которые окажутся невостребованными.</li>
        <li><b>Быстрый выход на рынок (Time to Market):</b> Можно занять нишу раньше конкурентов.</li>
    </ul>
    <p><b>На практике:</b> Когда я пишу ТЗ, я всегда обсуждаю с PO, какие фичи можно отложить до версии 2.0, чтобы ускорить релиз MVP.</p>`
},
{
    id: "q182",
    category: "other",
    question: "32. Что такое регресс (регрессионное тестирование)?",
    answer: `<h3>Регрессионное тестирование (Regression Testing)</h3>
    <p><b>Определение:</b> Это вид тестирования, который проверяет, что <b>новые изменения в коде (фичи или багфиксы) не поломали старый, уже работающий функционал.</b></p>
    <p><b>Почему это важно:</b> Внесение новой фичи может случайно нарушить работу другой, казалось бы, не связанной части системы.</p>
    <p><b>На практике:</b></p>
    <ul>
        <li>Перед каждым релизом QA прогоняет набор автотестов (Smoke + Regression).</li>
        <li>Как аналитик, я помогаю команде определить, какие модули системы наиболее критичны и должны быть обязательно покрыты регрессионными тестами.</li>
    </ul>`
}
];

{
    id: "q183",
    category: "integrations",
    question: "Что такое SOAP API? Встречался ли на практике?",
    answer: `<h3>SOAP (Simple Object Access Protocol)</h3>
    <p><b>Определение:</b> Это строго стандартизированный протокол обмена данными, который использует XML для форматирования сообщений и чаще всего работает поверх HTTP или SMTP.</p>
    <p><b>Ключевые особенности SOAP:</b></p>
    <ul>
        <li><b>Формат:</b> Только XML (в отличие от JSON в REST).</li>
        <li><b>Стандарты:</b> В SOAP встроены стандарты безопасности (WS-Security) и транзакционности (WS-AtomicTransaction), чего нет в REST.</li>
        <li><b>Контракт:</b> Строго описывается в WSDL-файле (XML-схема).</li>
        <li><b>Состояние:</b> Может быть как Stateless, так и Stateful (поддерживает сессии).</li>
    </ul>
    <p><b>Где применяется:</b></p>
    <ul>
        <li>В банковских системах (BIC, SWIFT, межбанковские переводы).</li>
        <li>В государственных системах (СМЭВ в России — межведомственное взаимодействие).</li>
        <li>В корпоративных легаси-системах (SAP, Oracle, 1С).</li>
    </ul>
    <p><b>Мой опыт:</b> Я сталкивался с SOAP при интеграции с системой банка для проверки контрагентов. Мы получали WSDL-файл, генерировали по нему Java-классы (JAX-WS) и вызывали методы, передавая XML-запросы. Главная сложность была в настройке безопасности (подпись XML-сообщений).</p>`
},
{
    id: "q184",
    category: "integrations",
    question: "Из чего состоит сообщение в SOAP?",
    answer: `<h3>Структура SOAP-сообщения</h3>
    <p>SOAP-сообщение — это XML-документ, который имеет жесткую структуру (называется SOAP Envelope):</p>
    <p><b>Обязательные и опциональные элементы:</b></p>
    <ul>
        <li><b>SOAP Envelope (Конверт):</b> Корневой элемент всего сообщения. Обязателен. Содержит пространства имен.</li>
        <li><b>SOAP Header (Заголовок):</b> Необязательный элемент. Содержит метаданные: данные авторизации (токены, подписи), информацию о транзакциях, маршрутизацию. Используется для WS-Security.</li>
        <li><b>SOAP Body (Тело):</b> Обязательный элемент. Содержит сами бизнес-данные — вызываемый метод и его параметры (Request) или результат выполнения (Response).</li>
        <li><b>SOAP Fault (Ошибка):</b> Специальный блок внутри Body, который появляется только в случае ошибки на сервере. Содержит код ошибки (faultcode), текстовое описание (faultstring) и детали (detail).</li>
    </ul>
    <p><b>Пример структуры:</b><br>
    <code>&lt;soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"&gt;<br>
      &lt;soap:Header&gt;&lt;Auth&gt;Token123&lt;/Auth&gt;&lt;/soap:Header&gt;<br>
      &lt;soap:Body&gt;<br>
        &lt;GetUser&gt;&lt;id&gt;1&lt;/id&gt;&lt;/GetUser&gt;<br>
      &lt;/soap:Body&gt;<br>
    &lt;/soap:Envelope&gt;</code></p>`
},
{
    id: "q185",
    category: "integrations",
    question: "Что такое WSDL?",
    answer: `<h3>WSDL (Web Services Description Language)</h3>
    <p><b>Определение:</b> Это XML-файл, который является <b>контрактом</b> SOAP-сервиса. Он описывает, какие методы есть у сервиса, какие параметры они принимают, какие данные возвращают и по какому адресу этот сервис доступен.</p>
    <p><b>Из чего состоит WSDL (основные секции):</b></p>
    <ul>
        <li><b>Types (Типы):</b> Описание структур данных (XSD-схемы). Определяет, как выглядят XML-элементы.</li>
        <li><b>Message (Сообщения):</b> Определение входящих и исходящих XML-сообщений (что передается на вход и что возвращается).</li>
        <li><b>PortType (Интерфейс):</b> Список операций (методов), которые предоставляет сервис (например, GetUser, UpdateOrder).</li>
        <li><b>Binding (Привязка):</b> Как именно вызывать метод (SOAP over HTTP, стиль кодировки).</li>
        <li><b>Service (Сервис):</b> Конкретный URL (адрес) эндпоинта, куда нужно отправлять запросы.</li>
    </ul>
    <p><b>Для аналитика:</b> WSDL — это аналог OpenAPI для REST. Мы получаем WSDL от внешней системы, импортируем его в SoapUI/Postman и используем для тестирования.</p>`
},
{
    id: "q186",
    category: "integrations",
    question: "Чем SOAP отличается от REST?",
    answer: `<h3>SOAP vs REST: Подробное сравнение</h3>
    <p>Это два совершенно разных подхода к построению API, которые я выбираю в зависимости от контекста проекта.</p>
    <p><b>SOAP (Строгий протокол):</b></p>
    <ul>
        <li><b>Формат:</b> Только XML.</li>
        <li><b>Стандарты:</b> Встроенные стандарты безопасности и транзакций (WS-Security, WS-AtomicTransaction).</li>
        <li><b>Состояние:</b> Может быть Stateful (хранить состояние сессии).</li>
        <li><b>Контракт:</b> Строгий, описывается в WSDL. Без WSDL вы не сможете вызвать метод.</li>
        <li><b>Скорость:</b> Медленнее из-за тяжелого XML-оверхеда (больше данных по сети).</li>
        <li><b>Где используется:</b> Банки, госуслуги, корпоративные системы с высокими требованиями к безопасности.</li>
    </ul>
    <p><b>REST (Гибкий архитектурный стиль):</b></p>
    <ul>
        <li><b>Формат:</b> Обычно JSON, но может быть и XML, и другие.</li>
        <li><b>Стандарты:</b> Нет встроенных стандартов безопасности (все решается через OAuth2/JWT на уровне приложения).</li>
        <li><b>Состояние:</b> Всегда Stateless.</li>
        <li><b>Контракт:</b> Рекомендательный (OpenAPI не обязателен, но желателен).</li>
        <li><b>Скорость:</b> Быстрее из-за легкого JSON.</li>
        <li><b>Где используется:</b> Веб-приложения, мобильные приложения, публичные API.</li>
    </ul>
    <p><b>Мой выбор:</b> Для внешних публичных API — REST. Для интеграций с банками и госорганами по их требованию — SOAP.</p>`
},

// --- Интеграции: Очереди, брокеры, шина (дополнительные) ---
{
    id: "q187",
    category: "integrations",
    question: "Что такое брокер сообщений? В каких случаях нужна работа с очередями сообщений? С какими очередями работал?",
    answer: `<h3>Брокеры сообщений (Message Brokers)</h3>
    <p><b>Концепция:</b> Брокер — это промежуточное ПО, которое принимает сообщения от систем-продюсеров (отправителей) и доставляет их системам-консюмерам (получателям), полностью изолируя отправителя от получателя по времени и логике.</p>
    <p><b>Когда я выбираю брокер вместо синхронного API:</b></p>
    <ul>
        <li><b>Долгие операции:</b> Генерация отчета по 100 000 строк. Пользователь не будет ждать 5 минут синхронно.</li>
        <li><b>Сглаживание пиковых нагрузок (Backpressure):</b> Если на систему приходит 1000 заказов в секунду, а БД может записать только 100, брокер выступает буфером.</li>
        <li><b>Развязка систем (Слабая связанность):</b> Если одна система упала, сообщения сохраняются в очереди и будут доставлены, когда она восстановится.</li>
        <li><b>Один источник — много получателей:</b> Событие 'Создан заказ' должно обработать CRM, Биллинг и Склад.</li>
    </ul>
    <p><b>С какими брокерами я работал:</b></p>
    <ul>
        <li><b>RabbitMQ:</b> Для задач фоновой обработки (отправка писем, генерация PDF).</li>
        <li><b>Apache Kafka:</b> Для потоковой обработки событий в реальном времени (сбор логов, стриминг данных).</li>
    </ul>`
},
{
    id: "q188",
    category: "integrations",
    question: "Зачем нужны очереди в асинхронных запросах?",
    answer: `<h3>Роль очередей в асинхронных системах</h3>
    <p>Очереди — это не просто 'трубы' для передачи данных, они выполняют критическую роль <b>буфера и гаранта доставки</b>.</p>
    <p><b>Основные функции очереди:</b></p>
    <ul>
        <li><b>Буферизация (Сглаживание пиков):</b> Если в 10:00 на систему приходит лавина заказов (Black Friday), очередь накапливает их, а консюмер обрабатывает со своей комфортной скоростью (например, 100 заказов в минуту). Это спасает БД от падения.</li>
        <li><b>Гарантия доставки (Reliability):</b> Сообщение лежит в очереди персистентно (на диске), пока консюмер не подтвердит его обработку (ACK). Если консюмер упал, сообщение останется в очереди и будет доставлено другому консюмеру.</li>
        <li><b>Асинхронность (Развязка):</b> Отправитель кладет сообщение и забывает о нем. Ему не нужно ждать, пока медленный получатель обработает данные.</li>
    </ul>
    <p><b>Аналогия:</b> Очередь — это как почтовый ящик. Вы бросаете письмо (сообщение) и идете по своим делам. Почтальон (консюмер) заберет его, когда освободится.</p>`
},
{
    id: "q189",
    category: "integrations",
    question: "В чём отличие очереди от топика?",
    answer: `<h3>Очередь (Queue) vs Топик (Topic)</h3>
    <p>Это два разных паттерна передачи сообщений в брокерах, которые я выбираю в зависимости от того, нужно ли дублировать сообщение для нескольких систем.</p>
    <p><b>Очередь (Point-to-Point):</b></p>
    <ul>
        <li><b>Модель:</b> Один отправитель, один получатель (или группа консюмеров, работающих как пул).</li>
        <li><b>Поведение:</b> Сообщение доставляется только <b>одному</b> консюмеру из группы. Кто первый забрал — тот и обработал.</li>
        <li><b>Удаление:</b> После того как консюмер подтвердил (ACK), сообщение удаляется.</li>
        <li><b>Пример:</b> Задача на генерацию PDF-отчета. Ее должен обработать только один сервер.</li>
    </ul>
    <p><b>Топик (Publish-Subscribe):</b></p>
    <ul>
        <li><b>Модель:</b> Один отправитель, <b>много</b> независимых групп подписчиков.</li>
        <li><b>Поведение:</b> Сообщение дублируется и доставляется <b>каждой</b> группе подписчиков, которая подписана на этот топик.</li>
        <li><b>Удаление:</b> Сообщение хранится, пока каждая группа не прочитает свой offset (особенно в Kafka).</li>
        <li><b>Пример:</b> Событие 'Создан заказ'. На этот топик подписаны: CRM (обновить данные клиента), Склад (зарезервировать товар), Биллинг (выставить счет). Все получают одну и ту же новость о заказе.</li>
    </ul>`
},
{
    id: "q190",
    category: "integrations",
    question: "Как брокер сообщений гарантирует доставку сообщений? Как проверить, что сообщение брокера получено в полном объёме?",
    answer: `<h3>Гарантии доставки в брокерах</h3>
    <p>Доставка в брокерах обеспечивается двумя механизмами, которые я всегда учитываю при проектировании интеграций:</p>
    <p><b>1. Гарантия от Продакшена (Producer ACK):</b></p>
    <ul>
        <li>Продюсер (отправитель) отправляет сообщение и ждет подтверждения от брокера, что сообщение записано на диск.</li>
        <li>В Kafka настраивается параметр <code>acks=all</code> — сообщение считается доставленным, только когда оно записано на все реплики (ISR).</li>
        <li>Это гарантирует, что сообщение не будет потеряно, даже если брокер упадет сразу после записи.</li>
    </ul>
    <p><b>2. Гарантия для Консюмера (Consumer ACK):</b></p>
    <ul>
        <li>Консюмер (получатель) должен явно подтвердить (commit) обработку сообщения.</li>
        <li><b>В RabbitMQ:</b> Если консюмер не отправил ACK, сообщение возвращается в очередь.</li>
        <li><b>В Kafka:</b> Консюмер периодически коммитит offset. Если консюмер упал, он перечитает сообщения с последнего закоммиченного offset.</li>
    </ul>
    <p><b>Как проверить целостность данных:</b> В сообщении можно передавать контрольную сумму (Checksum/CRC) для проверки, что данные не были повреждены при передаче. Брокеры часто имеют встроенные механизмы проверки CRC для защиты от битовых ошибок.</p>`
},
{
    id: "q191",
    category: "integrations",
    question: "В каких случаях стоит выбрать брокер сообщений вместо API-интеграции?",
    answer: `<h3>Когда выбирать брокер вместо синхронного API</h3>
    <p>Я выбираю брокер сообщений (асинхрон) вместо REST API (синхрон) в следующих сценариях:</p>
    <ul>

        <li><b>Высокая нагрузка (пиковые значения):</b> Если на систему приходит 10 000 запросов в секунду, а БД может обработать только 1 000, брокер спасет нас от падения (служит буфером).</li>
        <li><b>Слабая связанность (несколько получателей):</b> Событие 'Создан заказ' нужно передать в 3 разные системы (CRM, Склад, Биллинг). Вместо того чтобы делать 3 синхронных вызова (и если одна система упадет — вся цепочка сломается), мы пишем одно событие в брокер, и каждая система забирает его независимо.</li>
        <li><b>Отказоустойчивость:</b> Если система-получатель лежит на техобслуживании, сообщение не пропадет, а будет ждать в очереди.</li>
    </ul>`
},
{
    id: "q192",
    category: "integrations",
    question: "Что такое корпоративная шина (ESB)? Приходилось ли работать?",
    answer: `<h3>ESB (Enterprise Service Bus) — Корпоративная шина</h3>
    <p><b>Определение:</b> Это централизованная интеграционная платформа (промежуточный слой), которая служит 'шиной' для связи множества приложений внутри крупной компании. Она работает по принципу 'звезда' — все системы подключаются к шине, а не друг к другу напрямую.</p>
    <p><b>Зачем нужна ESB:</b></p>
    <ul>
        <li><b>Трансформация протоколов:</b> Она может принимать REST-запрос, преобразовывать его в SOAP и отправлять в старую легаси-систему.</li>
        <li><b>Маршрутизация:</b> Умная маршрутизация сообщений на основе бизнес-правил (например, если сумма > 1 млн руб., отправить на дополнительное согласование).</li>
        <li><b>Трансформация форматов:</b> Конвертирует JSON в XML и наоборот.</li>
    </ul>
    <p><b>Чем отличается от брокера (RabbitMQ/Kafka):</b> Брокер — это 'глупая труба', он просто перекладывает байты. ESB — 'умная' шина, она содержит бизнес-правила и трансформации.</p>
    <p><b>Мой опыт:</b> Я сталкивался с концепцией ESB на проектах в крупных ритейл-компаниях, где использовался Apache Camel или MuleSoft для интеграции ERP (SAP), CRM (Salesforce) и систем управления складом (WMS).</p>`
},
{
    id: "q193",
    category: "integrations",
    question: "Какая разница между шиной и очередью? Чем брокер сообщений отличается от корпоративной шины?",
    answer: `<h3>Брокер vs ESB: Детальное сравнение</h3>
    <p>Многие путают эти понятия. Вот ключевое различие, которое я всегда объясняю на собеседованиях:</p>
    <p><b>Брокер сообщений (Очередь / Message Broker):</b></p>
    <ul>
        <li><b>Роль:</b> Это 'почтальон' или 'труба'.</li>
        <li><b>Задачи:</b> Хранить сообщения и доставлять их от А к Б с гарантией доставки.</li>
        <li><b>Ум:</b> 'Глупый' — он не знает бизнес-логику, не меняет данные.</li>
        <li><b>Примеры:</b> RabbitMQ, Kafka, ActiveMQ.</li>
    </ul>
    <p><b>Корпоративная шина (ESB):</b></p>
    <ul>
        <li><b>Роль:</b> Это 'интеллектуальный маршрутизатор' и 'переводчик'.</li>
        <li><b>Задачи:</b> Не только доставить, но и преобразовать данные, сменить протокол (REST -> SOAP), применить бизнес-правила, маршрутизировать на основе сложной логики.</li>
        <li><b>Ум:</b> 'Умный' — он содержит бизнес-логику и оркестрацию.</li>
        <li><b>Примеры:</b> MuleSoft, Apache Camel, IBM Integration Bus.</li>
    </ul>
    <p><b>Аналогия:</b> Брокер — это обычный почтовый ящик. ESB — это офис с переводчиками, которые получают письмо на китайском, переводят на русский и отправляют в нужный отдел.</p>`
},
{
    id: "q194",
    category: "integrations",
    question: "Чем корпоративная шина отличается от ETL-инструмента? Что такое концепции ETL и ELT?",
    answer: `<h3>ESB vs ETL / ELT</h3>
    <p>Оба занимаются интеграцией данных, но на разных уровнях и с разной периодичностью.</p>
    <p><b>ESB (Шина):</b></p>
    <ul>
        <li><b>Время:</b> Работает в режиме реального времени (Real-time) или почти реального времени.</li>
        <li><b>Объект:</b> Передает отдельные сообщения (транзакции) между системами.</li>
        <li><b>Пример:</b> Когда клиент оформляет заказ в интернет-магазине, шина мгновенно отправляет это событие в CRM.</li>
    </ul>
    <p><b>ETL (Extract, Transform, Load):</b></p>
    <ul>
        <li><b>Время:</b> Работает по расписанию (Batch). Обычно ночью, когда нагрузка минимальна.</li>
        <li><b>Объект:</b> Перемещает большие объемы данных (миллионы записей) в хранилище данных (DWH) для аналитики.</li>
        <li><b>Пример:</b> В 3:00 ночи ETL-процесс забирает все заказы за день из базы магазина, очищает их, агрегирует и загружает в DWH для построения отчетов.</li>
    </ul>
    <p><b>Концепции ETL и ELT:</b></p>
    <ul>
        <li><b>ETL:</b> Extract (Извлечение) -> Transform (Трансформация на сервере ETL) -> Load (Загрузка в DWH). Классический подход.</li>
        <li><b>ELT:</b> Extract -> Load (Загружаем сырые данные в мощное DWH) -> Transform (Трансформируем внутри DWH с помощью SQL). Новый подход, использующий мощь современных облачных DWH (Snowflake, BigQuery).</li>
    </ul>`
},
{
    id: "q195",
    category: "integrations",
    question: "К корпоративной шине подключены веб-сервисы. В одном веб-сервисе появились два новых обязательных поля. Что изменится в интеграции?",
    answer: `<h3>Изменение контракта при интеграции через ESB</h3>
    <p>Появление двух новых <b>обязательных</b> полей в одном из подключенных веб-сервисов — это <b>Breaking Change (ломающее изменение)</b>, которое потребует изменений на нескольких уровнях.</p>
    <p><b>Что изменится (шаги, которые нужно предпринять):</b></p>
    <ul>
        <li><b>1. Обновление контракта на шине (ESB):</b> Администратор ESB должен обновить WSDL / XSD / JSON Schema, чтобы шина знала, что эти поля теперь обязательны.</li>
        <li><b>2. Изменение систем-источников (клиентов):</b> Все системы, которые отправляют данные в этот веб-сервис через шину, теперь должны начать передавать эти два поля. Если они их не передадут, шина (или сам сервис) вернет ошибку валидации (400 Bad Request), и транзакция не пройдет.</li>
        <li><b>3. Настройка маппинга:</b> Если эти поля нужно брать из других систем, нужно настроить трансформацию на шине.</li>
    </ul>
    <p><b>Решение для избежания Breaking Changes:</b> Если обновить все системы-источники сразу невозможно, лучше сделать поля <b>необязательными</b> (optional) в контракте, а логику обработки их отсутствия зашить в самом веб-сервисе (например, заполнять дефолтными значениями).</p>`
},
