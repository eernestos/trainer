<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер для самопроверки</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg-front: #ffffff;
            --card-bg-back: #eef2f7;
            --text-color: #2c3e50;
            --accent-color: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
        }

        .progress {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        .card-container {
            width: 100%;
            max-width: 650px;
            height: 420px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-radius: 16px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-y: auto;
        }

        .card-front {
            background-color: var(--card-bg-front);
            font-size: 20px;
            font-weight: 600;
            border: 2px solid #e2e8f0;
            line-height: 1.4;
        }

        .card-front::after {
            content: "➔ Нажмите, чтобы узнать ответ";
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            color: #95a5a6;
            font-weight: normal;
        }

        .card-back {
            background-color: var(--card-bg-back);
            transform: rotateY(180deg);
            font-size: 15px;
            line-height: 1.5;
            border: 2px solid var(--accent-color);
            text-align: left;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .card-back h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--accent-color);
            font-size: 16px;
            width: 100%;
            border-bottom: 1px dashed #bdc3c7;
            padding-bottom: 5px;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Тренажер для аналитика</h1>
    <div class="progress" id="progress">Загрузка...</div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front" id="question-text">Загрузка...</div>
            <div class="card-face card-back" id="answer-text">Загрузка...</div>
        </div>
    </div>

    <div class="controls">
        <button id="prev-btn" onclick="prevCard(event)" disabled>Назад</button>
        <button id="next-btn" onclick="nextCard(event)">Вперед</button>
    </div>

    <script>
        const flashcards = [
            {
                question: "1. Кто такие стейкхолдеры? Кто является стейкхолдерами для тебя? С какими группами заинтересованных лиц общался?",
                answer: "<h3>Стейкхолдеры (Заинтересованные лица)</h3><b>Кто это:</b> Лица или группы, которые влияют на проект или на которых влияет сам проект.<br><b>Для меня стейкхолдеры:</b> Заказчики бизнеса, конечные пользователи, разработчики, тестировщики, ИБ-специалисты, менеджер проекта.<br><b>Опыт общения:</b> На практике общался с Бизнес-заказчиками (сбор требований, прояснение болей), Разработчиками/Архитекторами (согласование технической реализуемости) и Тестировщиками (передача требований, разбор тест-кейсов)."
            },
            {
                question: "2. Какие виды требований знаешь? Можешь привести примеры? С какими видами работаешь?",
                answer: "<h3>Виды требований (по BABOK / ISO)</h3><b>1. Бизнес-требования:</b> Глобальные цели бизнеса (Пример: Увеличить прибыль АЗС на 15% за счет автоматизации).<br><b>2. Требования стейкхолдеров (пользовательские):</b> Что нужно пользователю (Пример: Водитель хочет оплачивать бензин картой).<br><b>3. Решения (Решения бывают Функциональные и Нефункциональные):</b> Детали работы системы.<br><b>4. Транзитные (переходные):</b> Нужны временно для запуска.<br><b>С чем работаю на практике:</b> В основном перевожу пользовательские требования на язык системных решений (пишу ФТ и НФТ)."
            },
            {
                question: "3. Что входит в функциональные требования? Приведи примеры.",
                answer: "<h3>Функциональные требования (ФТ)</h3>Описывают поведение системы — что она должна делать в ответ на действия пользователя или события.<br><br><b>What входит:</b> Описание бизнес-логики, сценарии использования, правила валидации данных, структура отчетов, интеграционные вызовы.<br><b>Примеры:</b><br>• Система должна отправлять чек на email пользователя после успешной оплаты.<br>• При вводе невалидного промокода система должна отображать ошибку: 'Промокод не существует'."
            },
            {
                question: "4. Что входит в нефункциональные требования? Приведи примеры.",
                answer: "<h3>Нефункциональные требования (НФТ)</h3>Описывают свойства, характеристики качества и ограничения системы (атрибуты качества).<br><br><b>Что входит:</b> Производительность, надежность, безопасность, юзабилити, масштабируемость, требования к доступности.<br><b>Примеры:</b><br>• <i>Производительность:</i> Время отклика API на запрос авторизации не должно превышать 500 мс под нагрузкой.<br>• <i>Доступность:</i> Система должна быть доступна 99.9% времени в режиме 24/7."
            },
            {
                question: "5. В чём отличие функциональных и нефункциональных требований?",
                answer: "<h3>Отличие ФТ от НФТ</h3><b>ФТ (Что делает):</b> Это конкретные функции и фичи. Если их убрать, система потеряет смысл (например, приложение такси не ищет машину). Напрямую проверяются бинарно (Да/Нет).<br><br><b>НФТ (Как делает):</b> Это ограничения и рамки качества (скорость, безопасность, дизайн под перчатки). Пронизывают всю архитектуру системы. Напрямую измеряются в метриках (секунды, проценты, градусы)."
            },
            {
                question: "6. Какая классификация нефункциональных требований? Какие нефункциональные требования описываешь на практике?",
                answer: "<h3>Классификация НФТ (ISO 25010)</h3>Основные группы: <b>Product Quality</b> (Performance, Usability, Reliability, Security), <b>Maintainability/Portability</b> (как легко развивать и переносить) и <b>External/Legal Constraints</b> (законы, например, ФЗ-152).<br><br><b>Что описываю на практике:</b> Чаще всего фиксирую Performance (время отклика API, нагрузка), Security (ролевая модель, маскирование данных карт) и Usability (адаптивность под мобилки)."
            },
            {
                question: "7. Что такое транзитные (переходные) требования?",
                answer: "<h3>Транзитные требования (Transition Requirements)</h3>...Это <b>временные</b> требования, которые описывают возможности, необходимые для перевода системы из текущего состояния в целевое.<br><br><b>Ключевое свойство:</b> Они теряют актуальность сразу после успешного внедрения новой системы.<br><b>Примеры:</b><br>• Миграция исторических данных клиентов из старой СУБД в новую.<br>• Обучение 20 операторов поддержке пользователей до даты релиза."
            },
            {
                question: "8. Какие есть способы (методы) сбора требований? Какие используешь на практике?",
                answer: "<h3>Способы сбора требований</h3><b>Основные методы:</b> Интервью, Воркшопы (сессии), Мозговой штурм, Опросы/Анкетирование, Наблюдение (Shadowing), Анализ документов, Обратный инжиниринг (изучение старой системы), Прототипирование.<br><br><b>На практике использую:</b> 1) Интервью с бизнес-заказчиком для базовых требований; 2) Анализ документов и API конкурентов для погружения; 3) Прототипирование в Figma, чтобы быстро согласовать логику интерфейса."
            },
            {
                question: "9. В каких документах описываются требования? Какие способы описания требований знаешь?",
                answer: "<h3>Документы и способы описания требований</h3><b>Документы:</b> BRD (Бизнес-требования), PRD (Продуктовые требования), SRS (Техспецификация), ТЗ по ГОСТ (34 или 19), Постановки в Jira/Confluence.<br><br><b>Способы описания:</b> Текстовый (естественный язык), Пользовательские истории (User Story), Сценарии (Use Case), Таблицы принятия решений (Decision Tables), Графические диаграммы (UML Use Case/Sequence/Activity, BPMN)."
            },
            {
                question: "10. Что такое User story? Можешь привести пример? Применяешь ли на практике?",
                answer: "<h3>User Story (Пользовательская история)</h3>Краткое описание фичи на языке пользователя, сфокусированное на ценности.<br><b>Формат:</b> Как [Роль], я хочу [Действие], чтобы [Ценность].<br><br><b>Пример:</b> Как постоянный водитель, я хочу сканировать QR-код на колонке, чтобы оплатить заправку в 1 клик без похода к кассе.<br><b>На практике:</b> Активно применяю в Agile/Scrum командах для декомпозиции бэклога и верхнеуровневого описания задач."
            },
            {
                question: "11. Какие преимущества использования User story?",
                answer: "<h3>Преимущества User Story</h3>• <b>Понятны всем:</b> И бизнесу, и разработчикам, так как написаны простым языком.<br>• <b>Фокус на ценности:</b> Заставляют команду думать не просто о кнопке, а о том, какую проблему пользователя эта кнопка решает (блок 'чтобы').<br>• <b>Гибкость:</b> Не перегружены деталями на старте, их легко обсуждать, оценивать и менять в ходе спринта."
            },
            {
                question: "12. Как понять, что User story написана хорошо? Можешь привести пример?",
                answer: "<h3>Критерии хорошей User Story (INVEST)</h3><b>I</b>ndependent (Независимая), <b>N</b>egotiable (Обсуждаемая), <b>V</b>aluable (Ценная), <b>E</b>stimable (Оцениваемая), <b>S</b>mall (Небольшая), <b>T</b>estable (Тестируемая). Также к ней должны идти <b>Acceptance Criteria (AC)</b>.<br><br><b>Пример хорошей истории:</b> <br><i>Стори:</i> Как гость, я хочу восстановить пароль по email, чтобы вернуть доступ в ЛК.<br><i>AC-1:</i> Если email нет в базе, выдать текст 'Пользователь не найден'.<br><i>AC-2:</i> Ссылка на сброс пароля живет 15 минут."
            },
            {
                question: "13. Что такое Use cases? Как они описываются (с примером)? Применяешь ли на практике?",
                answer: "<h3>Use Cases (Прецеденты использования)</h3>Описывают детальную последовательность шагов взаимодействия Актера (User) и Системы для достижения цели.<br><br><b>Структура:</b> Название, Актеры, Предусловия, Основной сценарий, Альтернативные сценарии, Постусловия.<br><b>Пример (Основной сценарий):</b> 1. Пользователь выбирает колонку. 2. Система запрашивает сумму. 3. Пользователь вводит сумму и прикладывает карту. 4. Система списывает деньги и включает подачу топлива.<br><b>На практике:</b> Использую для сложных фич со множеством ветвлений логики."
            },
            {
                question: "14. В чём отличие User stories от Use cases?",
                answer: "<h3>User Stories vs Use Cases</h3>• <b>Уровень детализации:</b> User Story — краткая и верхнеуровневая (цель бизнеса/пользователя). Use Case — детальный пошаговый алгоритм (кто куда нажал, что ответила система).<br>• <b>Фокус:</b> User Story фокусируется на Ценности (Зачем?). Use Case фокусируется на Процессе взаимодействия (Как?).<br>• <b>Формат:</b> Story — одна строчка + критерии приемки. Use Case — структурированный сценарий (основной шаг, альтернативный шаг, исключения)."
            },
            {
                question: "15. Какие критерии у хороших требований? Как ты понимаешь, что требования хорошие? К тебе пришло требование — по каким критериям будешь его оценивать?",
                answer: "<h3>Критерии качества требований (SMART / ISO)</h3>Оцениваю поступающие требования по чек-листу качества:<br>• <b>Специфичность/Ясность:</b> Нет ли двусмысленности?<br>• <b>Полнота:</b> Описаны ли негативные сценарии?<br>• <b>Непротиворечивость:</b> Не спорит ли оно с другими фичами?<br>• <b>Проверяемость (Тестируемость):</b> Сможет ли QA проверить его?<br>• <b>Реализуемость:</b> Можем ли мы сделать это технически и в срок?"
            },
            {
                question: "16. В чём отличие верификации требований от валидации?",
                answer: "<h3>Верификация vs Валидация требований</h3>Простыми словами: верификация — это проверка на правильность сборки, валидация — проверка на то, собран ли нужный продукт.<br><br>• <b>Верификация (Verification):</b> Проверка требований на соответствие правилам (тестирование ТЗ). Проверяем, структурировано ли оно, нет ли ошибок, все ли критерии качества соблюдены.<br>• <b>Валидация (Validation):</b> Проверка требований на соответствие реальным болям бизнеса. Действительно ли эта фича решит проблему заказчика?"
            },
            {
                question: "17. Что является артефактом работы аналитика? Какие артефакты ты создаёшь? Кто является пользователями этих артефактов?",
                answer: "<h3>Артефакты аналитика</h3><b>Что создаю:</b> Документы требований (SRS, ТЗ), Постановки в Jira (User Story, AC), Диаграммы (UML Sequence, Activity, ERD схемы баз данных), Прототипы экранов, Спецификации API (Swagger/OpenAPI).<br><br><b>Пользователи артефактов:</b><br>• Разработчики: по ним пишут код.<br>• Тестировщики: на их основе пишут тест-кейсы.<br>• Бизнес-заказчики: подтверждают, что мы правильно друг друга поняли."
            },
            {
                question: "18. Что должен включать шаблон постановки? Как выглядит твоя постановка?",
                answer: "<h3>Шаблон постановки задачи (в Jira/Confluence)</h3>Моя стандартная постановка включает следующие разделы:<br>1. Контекст/Цель: Зачем мы это делаем.<br>2. Описание бизнес-логики: Текст, User Story или Use Case.<br>3. Требования к UI: Ссылка на Figma + описание элементов и валидации.<br>4. Технические детали: Изменения в БД (модель), требования к API (контракты/маппинг).<br>5. Нефункциональные требования: Ограничения по нагрузке или безопасности.<br>6. Критерии приемки (Acceptance Criteria): Для тестирования."
            },
            {
                question: "19. Что нужно описать в постановке для пользовательского интерфейса (Frontend)? Приведи пример.",
                answer: "<h3>Постановка для Frontend (UI/UX)</h3>Нужно описать состояния элементов, валидацию полей и переходы.<br><br><b>Что описывать:</b> Ссылка на макет, маски полей, поведение кнопок при клике, состояния (Default, Hover, Active, Disabled), лоадеры загрузки, тексты ошибок.<br><b>Пример:</b> Поле 'Номер телефона'. Маска: +7(999)999-99-99. При фокусе клавиатура на мобильном переключается в цифровой режим. Если введено менее 10 цифр, кнопка 'Далее' задизейблена, под полем горит красный текст: 'Введите номер полностью'."
            },
            {
                question: "20. Что должно включать описание интеграции?",
                answer: "<h3>Описание интеграции (API)</h3>Должно отвечать на вопрос, как системы общаются друг с другом.<br><br><b>Включает:</b> Схему взаимодействия (UML Sequence), Протокол (REST, SOAP, gRPC, Kafka), Метод (GET, POST), URL эндпоинта, Параметры запроса (Request) и ответа (Response) с типами данных (string, int), Маппинг данных (какое поле из нашей системы переходит в чужую), Описание кодов ответов (200 OK, 400 Bad Request, 500 Error)."
            },
            {
                question: "21. Что такое SRS (Software/System Requirements Specification)? Когда применяют? Применяешь ли на практике?",
                answer: "<h3>SRS (Спецификация требований к ПО)</h3>Комплексный технический документ, детально описывающий все требования к продукту (бизнес, функциональные, нефункциональные, интеграционные).<br><br><b>Когда применяют:</b> В крупных Waterfall проектах, аутсорс-разработке (где фиксируется цена и объем), в медицине/банках, где важна строгая документация.<br><b>На практике:</b> В чисто виде книги на 200 страниц пишу редко, чаще веду модульный аналог SRS в Confluence (структурированные статьи)."
            }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('card');
        const questionElement = document.getElementById('question-text');
        const answerElement = document.getElementById('answer-text');
        const progressElement = document.getElementById('progress');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateCard() {
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                questionElement.innerHTML = flashcards[currentIndex].question;
                answerElement.innerHTML = flashcards[currentIndex].answer;
                progressElement.textContent = `Карточка ${currentIndex + 1} из ${flashcards.length}`;
                
                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === flashcards.length - 1);
                
                document.getElementById('answer-text').scrollTop = 0;
            }, 150);
        }

        function flipCard() {
            cardElement.classList.toggle('flipped');
        }

        function nextCard(event) {
            if (event) event.stopPropagation(); 
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard(event) {
            if (event) event.stopPropagation(); 
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        updateCard();
    </script>
</body>
