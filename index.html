<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивные Флэш-карточки: Senior Full Stack / DevOps</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --correct-color: #22c55e;
            --wrong-color: #ef4444;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --correct-color: #16a34a;
            --wrong-color: #dc2626;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, border-color 0.3s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .controls-panel {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        .filter-btn, .action-btn {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            font-weight: 500;
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .main-container {
            width: 100%;
            max-width: 800px;
            perspective: 1000px;
        }

        .card-wrapper {
            width: 100%;
            min-height: 400px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-wrapper.flipped {
            transform: rotateY(180deg);
        }

        .card-side {
            position: absolute;
            width: 100%;
            height: 100%;
            min-height: 400px;
            backface-visibility: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .card-content {
            flex: 1;
            font-size: 1.15rem;
            line-height: 1.6;
        }

        .card-content h3 {
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .card-content p {
            margin-bottom: 12px;
        }

        .card-content code {
            background: rgba(0,0,0,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.95rem;
        }

        [data-theme="light"] .card-content code {
            background: rgba(0,0,0,0.05);
        }

        .nav-panel {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 15px;
        }

        .nav-btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: var(--accent-hover);
        }

        .nav-btn:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .notes-section {
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
        }

        .notes-section textarea {
            width: 100%;
            height: 80px;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            resize: vertical;
            outline: none;
            margin-top: 8px;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stress-active {
            animation: pulse 1.5s infinite alternate;
            background: var(--wrong-color) !important;
            color: white !important;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.5); }
            100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
        }
    </style>
</head>
<body>

    <header>
        <h2>🧠 Senior Core Flashcards</h2>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="controls-panel">
        <div class="search-box">
            <input type="text" id="search-bar" placeholder="Поиск по ключевым словам или ID..." oninput="handleSearch(this.value)">
        </div>
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Все</button>
        <button class="filter-btn" data-filter="javascript" onclick="setFilter('javascript')">JavaScript</button>
        <button class="filter-btn" data-filter="architecture" onclick="setFilter('architecture')">Архитектура</button>
        <button class="filter-btn" data-filter="devops" onclick="setFilter('devops')">DevOps</button>
        <button class="action-btn" id="stress-btn" onclick="toggleStressMode()">⚡ Стресс-тест</button>
    </div>

    <div class="main-container">
        <div class="card-wrapper" id="card" onclick="flipCard()">
            <!-- Лицевая сторона -->
            <div class="card-side card-front">
                <div class="card-meta">
                    <span id="card-id">ID: --</span>
                    <span id="card-category">Категория: --</span>
                </div>
                <div class="card-content">
                    <h3 id="question-text">Загрузка вопросов...</h3>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
            <!-- Обратная сторона -->
            <div class="card-side card-back">
                <div class="card-meta">
                    <span>Ответ</span>
                    <span id="progress-text">0 / 0</span>
                </div>
                <div class="card-content" id="answer-text">
                    Загрузка ответа...
                </div>
            </div>
        </div>
    </div>

    <div class="nav-panel">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1); event.stopPropagation();">⬅ Назад</button>
        <button class="nav-btn" id="next-btn" onclick="navigate(1); event.stopPropagation();">Вперед ➡</button>
    </div>

    <div class="notes-section">
        <label for="card-notes">📝 Личные заметки к этой карточке (сохраняются автоматически):</label>
        <textarea id="card-notes" placeholder="Добавьте важные нюансы, команды или шпаргалки..." oninput="saveNote()"></textarea>
    </div>

    <script>
        // Полная база данных: 145 структурированных карточек (JS, Архитектура, Базы данных, DevOps, Сети)
	const originalCards = [
    {
        id: "req1",
        category: "architecture",
        question: "Кто такие стейкхолдеры? Кто является стейкхолдерами для тебя? С какими группами заинтересованных лиц общался?",
        answer: "<p><b>Стейкхолдеры (Заинтересованные лица)</b> — это люди или организации, которые влияют на проект или на которых влияет сам проект (его результат).</p><p><b>Для меня как Senior/Lead инженера стейкхолдерами являются:</b></p><ul><li><b>Бизнес-заказчики (Product Owners, СЕО, инвесторы):</b> определяют 'зачем' мы это делаем;</li><li><b>Конечные пользователи:</b> для кого пишется продукт;</li><li><b>Смежные команды (Security, DevOps, QA, Data Science):</b> выставляют технические рамки;</li><li><b>Моя команда разработки:</b> исполнители, чей DX (Developer Experience) тоже важен.</li></ul><p><b>Опыт общения:</b> На практике я напрямую взаимодействовал с PM/PO для декомпозиции фич, с ИБ (Security) для согласования архитектуры хранения персональных данных и с CTO для защиты бюджета на рефакторинг или миграцию в облако.</p>"
    },
    {
        id: "req2",
        category: "architecture",
        question: "Какие виды требований знаешь? Можешь привести примеры? С какими видами работаешь?",
        answer: "<p>Согласно классификации (например, по Вигерсу), требования делятся на уровни и виды:</p><ul><li><b>Бизнес-требования (Business):</b> глобальные цели бизнеса ('Увеличить конверсию на 15%').</li><li><b>Пользовательские (User):</b> задачи пользователей ('Пользователь должен иметь возможность оплатить заказ через СБП').</li><li><b>Функциональные (Functional):</b> что система должна делать ('При выборе СБП бэкенд генерирует QR-код').</li><li><b>Нефункциональные (Non-functional/Quality Attributes):</b> как система должна это делать (производительность, надежность, безопасность).</li><li><b>Системные/Транзитные:</b> требования к миграции данных, развертыванию.</li></ul><p><b>С чем работаю:</b> Как Senior разработчик я чаще всего беру пользовательские требования (User Stories), декомпозирую их до функциональных и сам же закладываю нефункциональные требования (архитектура, масштабируемость, CI/CD).</p>"
    },
    {
        id: "req3",
        category: "architecture",
        question: "Что входит в функциональные требования? Приведи примеры.",
        answer: "<p><b>Функциональные требования (ФТ)</b> определяют конкретное поведение системы — ее функции, действия и реакции на определенные входные данные.</p><p><b>Примеры ФТ:</b></p><ul><li>Система должна отправлять email-уведомление с подтверждением регистрации в течение 5 секунд.</li><li>При нажатии кнопки 'Экспорт' генерируется XLSX-отчет со списком транзакций за выбранный период.</li><li>Если баланс пользователя отрицательный, система должна блокировать списание за подписку и переводить аккаунт в статус 'On Hold'.</li></ul>"
    },
    {
        id: "req4",
        category: "architecture",
        question: "Что входит в нефункциональные требования? Приведи примеры.",
        answer: "<p><b>Нефункциональные требования (НФТ)</b> описывают качественные характеристики системы, ограничения среды и атрибуты качества (Quality Attributes).</p><p><b>Примеры НФТ:</b></p><ul><li><b>Производительность (Performance):</b> Время отклика API эндпоинта <code>GET /products</code> не должно превышать 200 мс при 5000 RPS.</li><li><b>Доступность (Availability):</b> Доступность сервиса должна составлять 99.9% (SLA/SLO).</li><li><b>Безопасность (Security):</b> Пароли пользователей должны хешироваться с использованием Argon2 или bcrypt, трафик должен быть зашифрован по TLS 1.3.</li><li><b>Масштабируемость (Scalability):</b> Система должна автоматически поднимать новые поды в Kubernetes при превышении CPU > 70%.</li></ul>"
    },
    {
        id: "req5",
        category: "architecture",
        question: "В чём отличие функциональных и нефункциональных требований?",
        answer: "<p>Разницу проще всего запомнить по формуле: <b>ФТ — это ЧТО делает система, а НФТ — КАК она это делает.</b></p><table style='width:100%; border-collapse: collapse; margin-top:10px;' border='1'><tr style='background:rgba(255,255,255,0.1)'><th>Критерий</th><th>Функциональные (ФТ)</th><th>Нефункциональные (НФТ)</th></tr><tr><td>Фокус</td><td>Поведение и функции</td><td>Свойства и ограничения</td></tr><tr><td>Для кого</td><td>Важны для пользователей и бизнеса</td><td>Важны для архитекторов, DevOps, Security</td></tr><tr><td>Пример</td><td>'Кнопка оплатить карту'</td><td>'Оплата должна проходить по TLS 1.3 за 2 секунды'</td></tr></table>"
    },
    {
        id: "req6",
        category: "architecture",
        question: "Какая классификация нефункциональных требований? Какие нефункциональные требования описываешь на практике?",
        answer: "<p>НФТ делятся на системные атрибуты качества (по ISO 25010):</p><ul><li><b>Надежность</b> (Reliability, Fault-tolerance).</li><li><b>Эффективность/Производительность</b> (Performance, Throughput, Latency).</li><li><b>Безопасность</b> (Security, Compliance).</li><li><b>Удобство сопровождения</b> (Maintainability, Extensibility).</li><li><b>Переносимость</b> (Portability, Развертываемость).</li></ul><p><b>На практике я описываю:</b> Нагрузочные метрики (минимальный RPS, таймауты), требования к логированию и трассировке (OpenTelemetry), лимиты ресурсов в Docker/K8s, а также стратегии деградации функционала (Circuit Breaker) при падении внешних интеграций.</p>"
    },
    {
        id: "req7",
        category: "architecture",
        question: "Что такое транзитные (переходные) требования?",
        answer: "<p><b>Транзитные требования (Transition Requirements)</b> — это временные требования, необходимые для перевода бизнеса или ИТ-системы из текущего состояния (As-Is) в целевое состояние (To-Be).</p><p>Они перестают быть нужными, как только проект запущен.</p><p><b>Примеры:</b></p><ul><li>Разработка скрипта для миграции 10 млн пользователей из старой БД PostgreSQL в новую схему без даунтайма.</li><li>Проведение обучения для сотрудников техподдержки перед релизом новой CRM.</li><li>Поддержание работы старого API параллельно с новым в течение 3 месяцев (период депрекации).</li></ul>"
    },
    {
        id: "req8",
        category: "architecture",
        question: "Какие есть способы (методы) сбора требований? Какие используешь на практике?",
        answer: "<p><b>Основные методы сбора требований:</b> Интервью, анкетирование, воркшопы (Event Storming), анализ конкурентов, изучение нормативной документации, наблюдение за работой пользователей (Shadowing), прототипирование.</p><p><b>На практике я использую:</b></p><ul><li><b>Event Storming сессии</b> — для проектирования микросервисов вместе с бизнесом и аналитиками.</li><li><b>Интервью со стейкхолдерами</b> — чтобы вытащить скрытые технические ограничения.</li><li><b>Быстрое прототипирование (PoC)</b> — когда требования размыты, пишется минимальный код, чтобы показать заказчику и скорректировать вектор.</li></ul>"
    },
    {
        id: "req9",
        category: "architecture",
        question: "В каких документах описываются требования? Какие способы описания требований знаешь?",
        answer: "<p><b>Основные документы:</b> BRD (Business Requirements Document), SRS (Software Requirements Specification), ТЗ (Техническое задание по ГОСТ), Confluence/Notion space.</p><p><b>Способы описания (нотации и подходы):</b></p><ul><li><b>Текстовый (User Stories):</b> Краткое описание фичи на естественном языке.</li><li><b>Сценарии использования (Use Cases):</b> Текстовое описание шагов актора и системы.</li><li><b>Графический (Диаграммы):</b> UML (диаграммы прецедентов, последовательности Sequence), BPMN (для бизнес-процессов), ERD (для баз данных).</li></ul>"
    },
    {
        id: "req10",
        category: "architecture",
        question: "Что такое User story? Можешь привести пример? Применяешь ли на практике?",
        answer: "<p><b>User Story (Пользовательская история)</b> — это краткое описание функционала со стороны конечного пользователя, сформулированное на понятном ему языке.</p><p><b>Шаблон:</b> <i>Как [роль], я хочу [действие], чтобы [ценность].</i></p><p><b>Пример:</b> <i>'Как авторизованный покупатель, я хочу сохранять товары в Избранное, чтобы быстро купить их во время распродажи.'</i></p><p><b>На практике:</b> Да, это основной формат тасок в Jira / Linear в Agile-командах, так как он держит фокус на пользе для бизнеса, а не на технической реализации.</p>"
    },
    {
        id: "req11",
        category: "architecture",
        question: "Какие преимущества использования User story?",
        answer: "<p><b>Преимущества User Stories:</b></p><ul><li><b>Фокус на ценности:</b> Заставляет команду думать о пользователе, а не писать код ради кода.</li><li><b>Гибкость:</b> Не перегружены деталями на ранних этапах, оставляют пространство для инженерного маневра.</li><li><b>Понятность всем:</b> Стирают барьер между разработчиками, QA и бизнесом.</li><li><b>Удобство оценки:</b> Легко оценивать в Story Points и декомпозировать на подзадачи (Sub-tasks).</li></ul>"
    },
    {
        id: "req12",
        category: "architecture",
        question: "Как понять, что User story написана хорошо? Можешь привести пример?",
        answer: "<p>Хорошая User Story соответствует критериям <b>INVEST</b>:</p><ul><li><b>I (Independent):</b> Независима от других историй.</li><li><b>N (Negotiable):</b> Обсуждаема (не жесткий контракт).</li><li><b>V (Valuable):</b> Несет явную ценность.</li><li><b>E (Estimable):</b> Оцениваема разработчиками.</li><li><b>S (Small):</b> Компактная (помещается в один спринт).</li><li><b>T (Testable):</b> Тестируемая (есть понятные Критерии Приемки — Acceptance Criteria).</li></ul><p><b>Пример хорошей истории:</b> Содержит сам шаблон + блок <i>'Acceptance Criteria (Given-When-Then)'</i>. Например: 'Given я нахожусь в корзине, When я нажимаю 'Удалить', Then товар исчезает, а итоговая сумма пересчитывается без перезагрузки страницы'.</p>"
    },
    {
        id: "req13",
        category: "architecture",
        question: "Что такое Use cases? Как они описываются (с примером)? Применяешь ли на практике?",

        answer: "<p><b>BPMN</b> — это графическая нотация, предназначенная для моделирования бизнес-процессов в виде диаграмм. Она стандартизирована организацией OMG.</p><p><b>Основные графические элементы разделены на 4 группы:</b></p><ul><li><b>Объекты потока управления (Flow Objects):</b><ul><li><i>События (Events):</i> Круги, обозначающие старт, промежуточные этапы или финал (например, 'Заказ создан').</li><li><i>Действия/Задачи (Activities/Tasks):</i> Прямоугольники со скругленными углами, обозначающие конкретную работу (например, 'Списать деньги с карты').</li><li><i>Шлюзы (Gateways):</i> Ромбы, управляющие ветвлением и слиянием потоков.</li></ul></li><li><b>Соединяющие объекты (Connecting Objects):</b> Сплошные стрелки (поток управления), штриховые стрелки (поток сообщений между пулами) и ассоциации.</li><li><b>Зоны ответственности (Swimlanes):</b> <i>Пулы (Pools)</i> — представляют целые организации или независимые системы; <i>Дорожки (Lanes)</i> — разделяют роли внутри одного пула (например, Бэкенд, Фронтенд, Бухгалтер).</li><li><b>Артефакты (Artifacts):</b> Данные (Data Objects), текстовые аннотации и группы для визуального порядка.</li></ul>"

        id: "diag4",

        question: "Какие есть типы шлюзов (Gateway) в BPMN?",
        answer: "<p><b>Шлюзы (Gateways)</b> управляют логикой движения процесса. На практике чаще всего используются 4 типа:</p><ul><li><b>Эксклюзивный / Исключающее «ИЛИ» (Exclusive / XOR):</b> <i>Обозначается ромбом пустой или с крестиком 'X'.</i> Поток идет только по <u>одному</u> из возможных направлений, условие которого выполнилось первым (например: Баланс >= Сумме? Да -> Отгрузить товар; Нет -> Выдать ошибку).</li><li><b>Параллельный / «И» (Parallel / AND):</b> <i>Обозначается ромбом со знаком плюс '+'.</i> Разделяет поток на <u>несколько параллельных</u> веток, которые выполняются одновременно. При слиянии он ждет завершения <u>всех</u> входящих параллельных потоков.</li><li><b>Включающее «ИЛИ» (Inclusive / OR):</b> <i>Обозначается ромбом с кругом внутри.</i> Активирует одну или несколько веток в зависимости от условий. Может пойти по одной, по двум или по всем сразу.</li><li><b>Шлюз по событиям (Event-Based):</b> <i>Обозначается ромбом с пятиугольником/двойным кругом внутри.</i> Ветвление зависит не от внутренних данных, а от того, какое внешнее событие наступит раньше (например: Ожидаем оплату в течение 2 часов ИЛИ Ожидаем отмену от пользователя). Какой триггер сработал, туда процесс и пошел.</li></ul>"

        category: "architecture",
        question: "Какие есть элементы синтаксиса в Sequence-диаграмме?",
        answer: "<p>Основные кирпичики Sequence-диаграммы:</p><ul><li><b>Участники (Lifelines):</b> Прямоугольники сверху с вертикальной пунктирной линией («линией жизни»). Обозначают сущности (например, <code>Auth Service</code>, <code>PostgreSQL</code>). Могут быть оформлены как Актор (человечек).</li><li><b>Фокус активности (Activation Bar):</b> Вертикальные узкие прямоугольники на пунктирной линии, показывающие, что в этот момент компонент выполняет вычисления/ждет ответа.</li><li><b>Сообщения (Messages):</b> Горизонтальные стрелки:<ul><li><i>Синхронный вызов:</i> Сплошная линия с закрашенной стрелкой (<code>⟶</code>). Отправитель блокируется и ждет ответ.</li><li><i>Асинхронный вызов:</i> Сплошная линия с открытой стрелкой (<code>→</code>). Отправитель кидает ивент (например, в RabbitMQ) и продолжает работу.</li><li><i>Ответное сообщение (Return):</i> Пунктирная линия с открытой стрелкой (<code>⇠</code>). Возврат данных (HTTP 200 OK с телом ответа).</li></ul></li><li><b>Фрагменты управления (Combined Fragments):</b> Блоки со специальными условиями выполнения:<ul><li><code>alt</code> (Alternative) — конструкция if/else;</li><li><code>loop</code> — цикл выполнения;</li><li><code>opt</code> (Optional) — шаг выполняется только при определенном условии;</li><li><code>par</code> (Parallel) — действия происходят одновременно.</li></ul></li></ul>"
    },
    {
        id: "diag9",
        category: "architecture",
        question: "Что такое Use Case диаграмма? Какие у неё есть элементы?",
        answer: "<p><b>Use Case Diagram (Диаграмма прецедентов)</b> — это высокоуровневая диаграмма UML, показывающая взаимосвязь между Актерами (пользователями/внешними системами) и Прецедентами (вариантами использования/фичами системы).</p><p><b>Основные элементы:</b></p><ul><li><b>Актёр (Actor):</b> <i>Иконка человечка.</i> Любая сущность вне системы, взаимодействующая с ней (Пользователь, Модератор, Система приема платежей Stripe).</li><li><b>Прецедент (Use Case):</b> <i>Овал с текстом внутри.</i> Конкретное действие или функция системы (например, 'Оформить возврат товара').</li><li><b>Граница системы (System Boundary):</b> Прямоугольник, очерчивающий скоуп разрабатываемого приложения. Актеры находятся снаружи, овалы фич — внутри.</li><li><b>Связи (Relationships):</b><ul><li><i>Ассоциация:</i> Простая линия связи Актора и прецедента.</li><li><i><code>&lt;&lt;include&gt;&gt;</code> (Включение):</i> Один шаг обязательно включает в себя другой (например, 'Сделать заказ' обязательно включает 'Авторизоваться').</li><li><i><code>&lt;&lt;extend&gt;&gt;</code> (Расширение):</i> Шаг выполняется только при определенных условиях (например, 'Оформить заказ' расширяется прецедентом 'Применить промокод').</li></ul></li></ul>"
    },
    {
        id: "diag10",
        category: "architecture",
        question: "Что такое ER-диаграмма? Приходилось ли строить?",
        answer: "<p><b>ERD (Entity-Relationship Diagram / Диаграмма «Сущность-Связь»):</b> Модель данных, описывающая структуру базы данных на уровне концептуальных или логических сущностей, их атрибутов и связей между ними.</p><p><b>Основные составляющие:</b> Сущности (таблицы), Атрибуты (колонки БД с типами данных, Primary Keys, Foreign Keys) и Связи (Relationships).</p><p><b>Кардинальность связей (Мощность):</b> Показывает количественное отношение сущностей:</p><ul><li>Один к одному (1:1) — например, Пользователь и Профиль.</li><li>Один ко многим (1:M) — например, Пользователь и Заказы.</li><li>Многие ко многим (M:N) — например, Студенты и Курсы (требует создания промежуточной таблицы-линка на физическом уровне).</li></ul><p><b>Опыт:</b> Да, строю ER-диаграммы постоянно перед написанием SQL-миграций для новых фич в инструментах вроде dbeaver, dbdiagram.io или прямо в Lucidchart/Miro, чтобы согласовать нормализацию (1NF, 2NF, 3NF) таблиц с командой.</p>"
    },
    {
        id: "diag11",
        category: "architecture",
        question: "В чём разница между Class Diagram и ER Diagram?",
        answer: "<p>Несмотря на внешнее сходство (обе состоят из прямоугольников со связями), они служат принципиально разным уровням абстракции приложения:</p><ul><li><b>Class Diagram (Диаграмма классов):</b> Моделирует <u>структуру кода в оперативной памяти</u> (ООП концепции). Описывает классы, интерфейсы, абстракции. Содержит не только переменные (поля), но и <b>методы/функции</b> (поведение). Поддерживает концепции наследования, полиморфизма, композиции и агрегации.</li><li><b>ER Diagram (ER-диаграмма):</b> Моделирует <u>структуру хранения данных на диске</u> (Реляционная модель). Описывает таблицы, внешние ключи (FK), индексы, ограничения (Constraints). Не содержит никаких методов, так как данные в реляционных БД статичны. Отношения описываются строгой кардинальностью (нотация «гусиная лапка» / Crow's Foot).</li></ul><p><b>Пример связи (ORM):</b> В Full Stack разработке сущности ERD проецируются на классы Class Diagram с помощью ORM-библиотек (например, Sequelize в Node.js или Prisma/TypeORM/Hibernate).</p>"
    },
    {
	id: "int1",
    category: "architecture",
    question: "Какие виды/способы интеграций знаешь?",
    answer: "<p>Выделяют 4 основных паттерна интеграции систем:</p><ul><li><b>Файловый обмен (File Transfer):</b> Системы пишут и читают файлы в общем хранилище (FTP, S3). Просто, но медленно (батчинг).</li><li><b>Общая БД (Shared Database):</b> Несколько приложений работают с одной базой. Быстро, но создает жесткую связанность (tight coupling) на уровне схемы данных.</li><li><b>Удаленный вызов процедур (RPC / API):</b> Прямое синхронное или асинхронное взаимодействие через REST (HTTP), gRPC (HTTP/2) или SOAP.</li><li><b>Обмен сообщениями (Messaging / EDA):</b> Асинхронное взаимодействие через брокеры (RabbitMQ, Kafka). Системы максимально развязаны (loose coupling).</li></ul>"
},
{
    id: "int2",
    category: "architecture",
    question: "Что такое API? Для чего применяется?",
    answer: "<p><b>API (Application Programming Interface)</b> — это строго определенный контракт (набор правил, методов и форматов данных), с помощью которого одна программа может взаимодействовать с другой.</p><p><b>Применение:</b></p><ul><li>Интеграция внутренних сервисов (микросервисная архитектура).</li><li>Предоставление доступа к платформе сторонним разработчикам (например, API платежных шлюзов или карт).</li><li>Разделение бэкенда и фронтенда (клиент-серверная архитектура).</li></ul>"
},
{
    id: "int3",
    category: "architecture",
    question: "Что такое синхронное и асинхронное взаимодействие? В чём разница?",
    answer: "<p>Основная разница — в блокировке потока выполнения и ожидании ответа:</p><ul><li><b>Синхронное:</b> Отправитель посылает запрос и <b>блокирует свой поток</b> (ждет), пока получатель не обработает данные и не вернет результат (пример: REST HTTP-запрос).</li><li><b>Асинхронное:</b> Отправитель посылает сообщение/запрос и <b>сразу продолжает работу</b>, не дожидаясь ответа. Ответ (если нужен) обрабатывается позже через callback, событие или опрос (пример: отправка задачи в RabbitMQ).</li></ul>"
},
{
    id: "int4",
    category: "architecture",
    question: "Всегда ли должен быть ответ в синхронном и асинхронном запросе?",
    answer: "<p>Нет, не всегда, но специфика разная:</p><ul><li><b>В синхронном запросе</b> технический ответ (HTTP-статус вроде <code>200 OK</code>, <code>204 No Content</code> или ошибка <code>500</code>) <b>обязан быть всегда</b>, иначе клиент зависнет по таймауту. Но бизнес-данных в ответе может и не быть.</li><li><b>В асинхронном запросе</b> ответа на исходный запрос (Fire-and-Forget) может вообще не предполагаться. Клиенту достаточно подтверждения от брокера, что сообщение принято. Если ответ нужен, он организуется через отдельный канал (например, паттерн RPC над очередями или WebSocket).</li></ul>"
},
{
    id: "int5",
    category: "architecture",
    question: "Приведи пример, в котором использовался только синхронный способ взаимодействия.",
    answer: "<p>Классический пример — <b>процесс авторизации пользователя (вход в личный кабинет)</b>.</p><p>Пользователь вводит логин/пароль и нажимает «Войти». Браузер отправляет запрос, интерфейс блокируется спиннером, и клиент <b>ждет</b>. Сервер проверяет данные в БД, генерирует токен и возвращает ответ. Только после получения ответа (успех/ошибка) клиентское приложение может продолжить работу и пустить пользователя дальше.</p>"
},
{
    id: "int6",
    category: "architecture",
    question: "Работа с БД (вызов хранимой процедуры) — это синхронный или асинхронный способ взаимодействия?",
    answer: "<p>В классическом понимании — это <b>синхронный</b> способ.</p><p>Когда бэкенд вызывает хранимую процедуру, поток приложения блокируется и «спит», ожидая, пока БД выполнит все расчеты и операции на своей стороне. Только после возврата результата или ошибки бэкенд продолжает выполнять следующий код. На уровне самого приложения вызов можно обернуть в асинхронный паттерн (async/await), но суть бизнес-логики «запросил и жду результат» остается последовательной.</p>"
},
{
    id: "int7",
    category: "architecture",
    question: "Что такое JSON? Какие типы данных в нём поддерживаются?",
    answer: "<p><b>JSON (JavaScript Object Notation)</b> — легкий текстовый формат обмена данными, де-факто стандарт для REST API.</p><p>Поддерживает 6 типов данных:</p><ul><li><b>String:</b> Строка в двойных кавычках (<code>\"name\": \"Ivan\"</code>).</li><li><b>Number:</b> Число (<code>25</code>, <code>99.9</code>).</li><li><b>Object:</b> Набор пар ключ-значение <code>{...}</code>.</li><li><b>Array:</b> Список значений в квадратных скобках <code>[...]</code>.</li><li><b>Boolean:</b> Логическое <code>true</code> или <code>false</code>.</li><li><b>Null:</b> Пустое значение <code>null</code>.</li></ul><p>⚠️ JSON <i>не поддерживает</i> функции, даты (передаются строкой) и комментарии.</p>"
},
{
    id: "int8",
    category: "architecture",
    question: "Что такое JSON Schema? Писал на практике?",
    answer: "<p><b>JSON Schema</b> — это спецификация и декларативный язык описания структуры, типов данных и правил валидации для JSON-документов.</p><p><b>На практике:</b> Активно применяется для фиксации контрактов при интеграции между системами. Вместо написания десятков проверок в коде (<i>«является ли поле числом», «заполнено ли имя»</i>), входящий JSON автоматически прогоняется через схему на шлюзе (API Gateway) или бэкенде. Если структура нарушена, запрос отсекается с понятной ошибкой еще на входе.</p>"
},
{
    id: "int9",
    category: "architecture",
    question: "Что такое XML? Что в нём содержится? В чём разница между HTML и XML? Что такое пространство имён в XML? С помощью каких программ можно работать с XML?",
    answer: "<p><b>XML (eXtensible Markup Language)</b> — расширяемый язык разметки для хранения и передачи структурированных данных в виде дерева тегов и атрибутов.</p><ul><li><b>Разница с HTML:</b> HTML имеет предопределенные теги (<code>&lt;div&gt;</code>, <code>&lt;p&gt;</code>) и служит для <i>отображения</i> данных. XML не имеет фиксированных тегов (ты создаешь их сам: <code>&lt;user&gt;</code>, <code>&lt;id&gt;</code>) и служит для <i>переноса и хранения</i> структуры данных.</li><li><b>Пространство имен (xmlns):</b> Механизм избежания конфликта имен тегов. Если две системы используют тег <code>&lt;table&gt;</code> (одна — таблица в БД, другая — мебель), URI пространства имен разделяет их контекст.</li><li><b>Программы:</b> Текстовые редакторы (VS Code, Notepad++), IDE (IntelliJ IDEA), инструменты тестирования (SoapUI, Postman), а также консольные утилиты парсинга (<code>xmllint</code>).</li></ul>"
},
{
    id: "int10",
    category: "architecture",
    question: "Какие форматы данных знаешь? Чем JSON отличается от XML?",
    answer: "<p><b>Форматы данных:</b> JSON, XML, YAML, Protocol Buffers (Protobuf), MessagePack, CSV.</p><p><b>Основные отличия JSON от XML:</b></p><ul><li><b>Читаемость и избыточность:</b> JSON гораздо лаконичнее. XML перегружен закрывающими тегами, из-за чего весит на 30–50% больше при тех же данных.</li><li><b>Типы данных:</b> JSON «из коробки» знает про числа, массивы и boolean. В XML всё является строкой, типы нужно типизировать отдельно (через XSD).</li><li><b>Парсинг:</b> JSON нативно и быстро парсится в JavaScript и большинстве современных языков. Для XML требуются тяжелые DOM/SAX парсеры.</li></ul>"
},
{
    id: "int11",
    category: "architecture",
    question: "Чем YAML отличается от JSON?",
    answer: "<p><b>YAML</b> спроектирован быть максимально читаемым для человека и используется преимущественно для конфигураций (Kubernetes, CI/CD pipelines, Ansible), тогда как JSON — для обмена данными по сети.</p><p><b>Отличия:</b></p><ul><li>YAML использует <b>отступы (пробелы)</b> вместо фигурных скобок и запятых для определения структуры.</li><li>YAML поддерживает комментарии (через <code>#</code>), что критично для конфигов (в JSON комментарии запрещены).</li><li>YAML является надмножеством JSON (любой валидный JSON — это валидный YAML, но не наоборот).</li></ul>"
},
{
    id: "int12",
    category: "architecture",
    question: "Что такое XSD? Приходилось ли писать XSD?",
    answer: "<p><b>XSD (XML Schema Definition)</b> — это язык описания структуры XML-документа. Он определяет правила: какие теги обязательны, в каком порядке они идут, какие типы данных содержат и какие у них ограничения.</p><p><b>На практике:</b> Да, писать и поддерживать приходилось, особенно при работе с legacy-системами или государственными/банковскими интеграциями по протоколу <b>SOAP</b>. На основе XSD-файла (который часто упакован внутрь WSDL) генерируются DTO-классы в строго типизированных языках (Java/C#) с помощью утилит вроде <code>xjc</code>, а также настраивается строгая валидация входящих XML-сообщений.</p>"
},
{
    id: "int13",
    category: "architecture",
    question: "Что такое HTTP? Расскажи устройство HTTP-протокола.",
    answer: "<p><b>HTTP (HyperText Transfer Protocol)</b> — это протокол прикладного уровня передачи данных, работающий по модели «клиент-сервер» поверх надежного транспортного протокола (обычно TCP, а в HTTP/3 — UDP/QUIC).</p><p><b>Ключевые свойства устройства протокола:</b></p><ul><li><b>Stateless:</b> Каждый запрос независим, сервер не обязан сохранять контекст между ними (состояние сессии обычно выносится в JWT/Cookie).</li><li><b>Текстовый формат (до HTTP/2):</b> Запросы и ответы представляют собой читаемый текст ASCII.</li><li><b>Структура сообщения:</b> Состоит из стартовой строки (Start-line), заголовков (Headers), пустой строки-разделителя и опционального тела (Body).</li></ul>"
},
{
    id: "int14",
    category: "architecture",
    question: "Из чего состоят HTTP-запрос и ответ?",
    answer: "<p><b>HTTP-запрос состоит из:</b></p><ul><li><b>Стартовая строка (Request Line):</b> Метод (<code>GET</code>, <code>POST</code>), URI ресурса (<code>/api/v1/users</code>) и версия протокола (<code>HTTP/1.1</code>).</li><li><b>Заголовки (Headers):</b> Метаданные клиента и запроса (например, <code>Host</code>, <code>Content-Type</code>, <code>Authorization</code>).</li><li><b>Тело запроса (Body):</b> Передаваемые данные (payload), чаще всего в формате JSON/XML.</li></ul><p><b>HTTP-ответ состоит из:</b></p><ul><li><b>Стартовая строка (Status Line):</b> Версия протокола, трехзначный статус-код и его текстовое пояснение (например, <code>HTTP/1.1 200 OK</code>).</li><li><b>Заголовки (Headers):</b> Метаданные сервера и ответа (<code>Server</code>, <code>Set-Cookie</code>, <code>Cache-Control</code>).</li><li><b>Тело ответа (Body):</b> Запрошенные клиентом данные или текст ошибки.</li></ul>"
},
{
    id: "int15",
    category: "architecture",
    question: "Что такое REST? Какие у него принципы?",
    answer: "<p><b>REST (Representational State Transfer)</b> — это архитектурный стиль взаимодействия компонентов распределенной системы, использующий существующие механизмы протокола HTTP.</p><p><b>6 фундаментальных принципов REST:</b></p><ul><li><b>Клиент-сервер (Client-Server):</b> Четкое разделение ответственности между интерфейсом (клиент) и данными (сервер).</li><li><b>Отсутствие состояния (Stateless):</b> Сервер не хранит контекст о клиенте; каждый запрос содержит всю информацию для своей обработки.</li><li><b>Кэширование (Cacheable):</b> Ответы должны явно заявлять, можно ли их кэшировать, для снижения нагрузки.</li><li><b>Единообразие интерфейса (Uniform Interface):</b> Идентификация ресурсов через URI, манипуляция ими через представления (JSON/XML) и самоописываемые сообщения.</li><li><b>Слоистая система (Layered System):</b> Клиент не знает, общается он напрямую с сервером или с промежуточным прокси/балансировщиком.</li><li><b>Код по требованию (Code on Demand — опционально):</b> Сервер может расширять логику клиента, передавая исполняемый код (скрипты).</li></ul>"
},
{
    id: "int16",
    category: "architecture",
    question: "Что такое RESTful-приложение?",
    answer: "<p><b>RESTful-приложение</b> — это веб-приложение или API, спроектированное в строгом соответствии со всеми обязательными принципами стиля REST.</p><p>На практике это означает, что система оперирует <b>ресурсами</b> (сущностями), которые доступны по уникальным URL (например, <code>/api/v1/orders</code>), а действия над ними (создание, чтение, обновление, удаление) однозначно маппятся на стандартные HTTP-методы (<code>POST</code>, <code>GET</code>, <code>PUT</code>, <code>DELETE</code>), используя правильные HTTP-статусы ответов.</p>"
},
{
    id: "int17",
    category: "architecture",
    question: "Что такое Stateless? Чем отличается Stateless от Statefull? Почему мы хотим лишить клиента информации о состоянии сервера?",
    answer: "<p><b>Stateless (без состояния)</b> означает, что сервер обрабатывает каждый запрос изолированно, как чистую функцию. <b>Stateful (с состоянием)</b> означает, что сервер помнит историю общения (например, хранит сессию в оперативной памяти инстанса).</p><p><b>Почему современная архитектура стремится к Stateless:</b></p><ul><li><b>Горизонтальное масштабирование (Scaling):</b> Если инстанс сервера stateless, мы можем поставить перед ним балансировщик и развернуть 100 копий приложения. Запрос клиента может уйти на любой инстанс, и всё сработает. При Stateful пришлось бы настраивать сложные механизмы репликации сессий или Sticky Sessions.</li><li><b>Отказоустойчивость:</b> Падение конкретного сервера не приводит к потере данных о сессиях пользователей.</li></ul>"
},
{
    id: "int18",
    category: "architecture",
    question: "Какие методы HTTP знаешь? Для чего их используешь?",
    answer: "<p>Основные методы и их семантика в REST API:</p><ul><li><code>GET</code> — Запрос представления ресурса. Безопасный, не должен изменять данные на сервере.</li><li><code>POST</code> — Создание нового дочернего ресурса или выполнение специфической операции, не укладывающейся в CRUD.</li><li><code>PUT</code> — Полное обновление/замещение существующего ресурса (или создание, если ID задает клиент).</li><li><code>PATCH</code> — Частичное (неполное) обновление свойств ресурса.</li><li><code>DELETE</code> — Удаление указанного ресурса.</li><li><code>HEAD</code> — Аналогичен GET, но возвращает только заголовки без тела (для проверки существования или размера файла).</li><li><code>OPTIONS</code> — Запрос поддерживаемых сервером методов для указанного URI (активно используется в CORS).</li></ul>"
},
{
    id: "int19",
    category: "architecture",
    question: "Что такое HTTP-интеграция (HTTP + JSON без принципов REST)? Чем REST-интеграция отличается от обычной HTTP/JSON-интеграции?",
    answer: "<p>Многие разработчики называют свое API «REST API», хотя на самом деле это обычная <b>HTTP/JSON-интеграция (часто в стиле RPC over HTTP)</b>.</p><p><b>Основные отличия:</b></p><ul><li><b>В HTTP/JSON (RPC-style):</b> Вызовы сфокусированы на <i>действиях (глаголах)</i>. Почти все запросы идут через <code>POST</code> на адреса вида <code>/deleteUser</code>, <code>/updateOrder?id=5</code>. HTTP-статус часто всегда <code>200 OK</code>, а реальная ошибка зашита внутрь JSON (<code>{ \"error\": \"not_found\" }</code>).</li><li><b>В честном REST:</b> Вызовы сфокусированы на <i>ресурсах (существительных)</i>. Адреса выглядят как <code>DELETE /users/5</code> или <code>PATCH /orders/12</code>, а статус-коды (<code>404</code>, <code>204</code>, <code>400</code>) соответствуют спецификации HTTP.</li></ul>"
},
{
    id: "int20",
    category: "architecture",
    question: "Какой HTTP-метод является безопасным?",
    answer: "<p>HTTP-метод называется <b>безопасным (Safe)</b>, если его выполнение на сервере носит исключительно характер чтения и <b>не приводит к изменению состояния данных</b>.</p><p>К безопасным методам относятся: <code>GET</code>, <code>HEAD</code>, <code>OPTIONS</code>.</p><p>⚠️ <i>Нюанс для собеседований:</i> Под безопасностью понимается отсутствие сайд-эффектов на уровне бизнес-логики. При этом сервер технически может писать логи, обновлять счетчики просмотров или собирать метрики при GET-запросе — это не нарушает спецификацию безопасного метода.</p>"
},
{
    id: "int21",
    category: "architecture",
    question: "Как можно передавать параметры в методе?",
    answer: "<p>В HTTP-запросах параметры можно передавать четырьмя основными способами:</p><ul><li><b>Path Variables / URI Parameters:</b> Часть пути к ресурсу (например, <code>5</code> в <code>/api/users/5</code>). Используется для идентификации конкретной сущности.</li><li><b>Query Parameters (Строка запроса):</b> Пары ключ-значение после знака вопроса (<code>/api/users?role=admin&page=2</code>). Применяется для фильтрации, сортировки и пагинации.</li><li><b>HTTP Headers (Заголовки):</b> Метаданные (например, <code>Authorization: Bearer token</code> или <code>X-Correlation-ID</code>). Предназначены для сквозной технической логики.</li><li><b>Request Body (Тело запроса):</b> Payload в формате JSON/XML/Form-Data. Используется в <code>POST</code>, <code>PUT</code>, <code>PATCH</code> для передачи сложных или объемных структур данных.</li></ul>"
},
{
    id: "int22",
    category: "architecture",
    question: "Что содержит URL в HTTP-запросе?",
    answer: "<p><b>URL (Uniform Resource Locator)</b> — это стандартизированный адрес ресурса в сети. Его структура включает:</p><ul><li><b>Протокол / Схема:</b> <code>http://</code> или <code>https://</code>.</li><li><b>Доменное имя или IP-адрес хоста:</b> <code>example.com</code> или <code>192.168.1.10</code>.</li><li><b>Порт (опционально):</b> Например, <code>:8080</code> (если не указан, берутся дефолтные 80 для HTTP и 443 для HTTPS).</li><li><b>Путь к ресурсу (Path):</b> Логический путь на сервере (<code>/api/v1/products</code>).</li><li><b>Параметры запроса (Query string - опционально):</b> Передаются после знака <code>?</code> (<code>?category=shoes</code>).</li><li><b>Якорь / Фрагмент (Anchor - опционально):</b> После знака <code>#</code>, серверу не передается, обрабатывается клиентом (браузером).</li></ul>"
},
{
    id: "int23",
    category: "architecture",
    question: "Что содержит HEADER в ответе HTTP?",
    answer: "<p>Заголовки ответа (Response Headers) содержат важные метаданные, управляющие поведением клиента. Ключевые группы:</p><ul><li><b>Контент:</b> <code>Content-Type</code> (тип данных, например <code>application/json</code>), <code>Content-Length</code> (размер тела в байтах).</li><li><b>Управление кэшем:</b> <code>Cache-Control</code> (инструкции кэширования), <code>ETag</code> (валидатор версии ресурса).</li><li><b>Безопасность и CORS:</b> <code>Access-Control-Allow-Origin</code> (разрешенные домены для запросов), <code>Strict-Transport-Security</code> (HSTS).</li><li><b>Управление сессией:</b> <code>Set-Cookie</code> (передача кук на клиент).</li><li><b>Информация о сервере:</b> <code>Server</code> (название веб-сервера, например <code>nginx/1.25</code>).</li></ul>"
},
{
    id: "int24",
    category: "architecture",
    question: "Какие статус-коды ответов могут быть? Какие виды HTTP-ошибок знаешь?",
    answer: "<p>Статус-коды делятся на 5 классов по первой цифре:</p><ul><li><b>1xx (Информационные):</b> Запрос принят, обработка продолжается (<code>101 Switching Protocols</code>).</li><li><b>2xx (Успешные):</b> Действие успешно выполнено (<code>200 OK</code>, <code>201 Created</code>, <code>204 No Content</code>).</li><li><b>3xx (Перенаправления):</b> Для завершения запроса нужно сделать еще одно действие (<code>301 Moved Permanently</code>, <code>304 Not Modified</code>).</li><li><b>4xx (Ошибки клиента):</b> Некорректный запрос со стороны клиента (<code>400 Bad Request</code> — синтаксис, <code>401 Unauthorized</code> — нет токена, <code>403 Forbidden</code> — нет прав, <code>404 Not Found</code>).</li><li><b>5xx (Ошибки сервера):</b> Сервер не смог обработать валидный запрос (<code>500 Internal Server Error</code>, <code>502 Bad Gateway</code> — прокси не ответил, <code>503 Service Unavailable</code> — перегрузка, <code>504 Gateway Timeout</code>).</li></ul>"
},
{
    id: "int25",
    category: "architecture",
    question: "Чем ошибка 200 отличается от 201?",
    answer: "<p>Оба кода сигнализируют об успешном выполнении запроса, но имеют разную семантику:</p><ul><li><b>200 OK:</b> Стандартный универсальный ответ на успешный запрос. Чаще всего возвращается в ответ на методы <code>GET</code>, <code>PUT</code>, <code>PATCH</code>, когда данные успешно прочитаны или изменены.</li><li><b>201 Created:</b> Специфический ответ, указывающий на то, что в результате выполнения запроса <b>был успешно создан один или несколько новых ресурсов</b>. Чаще всего возвращается в ответ на метод <code>POST</code> и хорошей практикой считается передавать в заголовке <code>Location</code> ссылку на свежесозданный ресурс.</li></ul>"
},
{
    id: "int26",
    category: "architecture",
    question: "Что делать, если получили HTTP-ошибку? Как описывать обработку ошибок в постановке?",
    answer: "<p><b>Действия при ошибке:</b> Логировать подробности (включая Trace ID/Correlation ID), выводить пользователю понятное (не техническое) сообщение, при 5xx — пробовать повторить (Retry с экспоненциальным бэкоффом), если это безопасно.</p><p><b>Как описывать обработку ошибок системному аналитику в постановке:</b></p><ul><li>Описать матрицу маппинга: какая бизнес-ошибка бэкенда/БД соответствует какому HTTP-статусу (например, «Пользователь заблокирован» -> <code>403 Forbidden</code>).</li><li>Утвердить единую структуру тела ошибки (Error Response Schema): например, обязательные поля <code>errorCode</code>, <code>message</code> для пользователя и массив <code>details</code> для фронтенда.</li><li>Указать правила валидации входных данных и поведение системы при их нарушении (<code>400 Bad Request</code> с перечислением невалидных полей).</li></ul>"
},
{
    id: "int27",
    category: "architecture",
    question: "Чем POST отличается от GET?",
    answer: "<p>Это два фундаментально разных метода:</p><ul><li><b>Семантика:</b> <code>GET</code> предназначен исключительно для безопасного получения (чтения) данных. <code>POST</code> — для создания новых ресурсов или обработки данных с сайд-эффектами.</li><li><b>Передача параметров:</b> В <code>GET</code> параметры передаются открыто в URI (Query Params), что накладывает ограничения на объем (обычно до 2-8 Кб) и безопасность (логируются серверами). В <code>POST</code> данные упаковываются в <code>Body</code> (тело запроса), объем практически неограничен.</li><li><b>Идемпотентность и кэширование:</b> <code>GET</code> идемпотентен и кэшируется по умолчанию. <code>POST</code> неидемпотентен и не кэшируется.</li></ul>"
},
{
    id: "int28",
    category: "architecture",
    question: "Чем POST отличается от PUT?",
    answer: "<p>Главное отличие заключается в **идемпотентности** и ответственности за генерацию идентификатора (ID) ресурса:</p><ul><li><b>PUT (Идемпотентен):</b> Используется для обновления существующего ресурса или создания нового, если клиент *точно знает и сам передает* финальный ID сущности (например, <code>PUT /users/uuid-1234</code>). Сколько бы раз мы ни отправили этот запрос с одинаковым телом — состояние сервера будет идентичным.</li><li><b>POST (Неидемпотентен):</b> Используется, когда фабрикацией ID занимается *сам сервер* (например, автоинкремент в БД). Мы отправляем запрос на родительский URI (<code>POST /users</code>). Если отправить один и тот же POST-запрос 5 раз подряд, на сервере создадутся 5 разных записей с разными ID.</li></ul>"
},
{
    id: "int29",
    category: "architecture",
    question: "Чем PUT отличается от PATCH?",
    answer: "<p>Разница заключается в полноте модификации ресурса:</p><ul><li><b>PUT (Полное замещение):</b> Клиент обязан передать в теле запроса **всю сущность целиком**. Если у пользователя были поля <code>name</code>, <code>age</code> и <code>email</code>, а в PUT-запросе передать только <code>name</code>, то поля <code>age</code> и <code>email</code> на сервере будут стерты (установлены в null или дефолтные значения).</li><li><b>PATCH (Частичное обновление):</b> Клиент передает **только те поля, которые нужно изменить** (патч). Остальные свойства ресурса на сервере остаются нетронутыми. Это экономит трафик и снижает риски race-condition.</li></ul>"
},
{
    id: "int30",
    category: "architecture",
    question: "Можно ли использовать метод POST для получения данных? Когда стоит так делать?",
    answer: "<p>Технически — **можно**, спецификация HTTP этого не запрещает. С точки зрения чистого REST — это нарушение семантики, но на практике есть два случая, когда использование `POST` для чтения оправдано и необходимо:</p><ul><li><b>Слишком большой объем параметров фильтрации:</b> Если у вас сложный аналитический отчет с сотнями параметров (массивы ID, гео-полигоны), они просто не влезут в ограничение длины URI для GET-запроса (строка запроса обрежется браузером или прокси).</li><li><b>Безопасность/чувствительные данные:</b> Если для поиска нужно передать персональные данные (паспорт, номер карты, пароль), передавать их в GET-параметрах нельзя — они осядут в логах прокси-серверов, веб-серверов и истории браузера. В POST данные уйдут в шифрованном теле (HTTPS Body).</li></ul>"
},
{
    id: "int31",
    category: "architecture",
    question: "У каких HTTP-методов есть тело запроса (body)? Можно ли реализовать POST-запрос без тела? Можно ли реализовать GET-запрос с телом?",
    answer: "<p><b>Наличие тела по стандарту:</b> Тело запроса легитимно ожидается у методов <code>POST</code>, <code>PUT</code>, <code>PATCH</code>. У методов <code>GET</code>, <code>DELETE</code>, <code>HEAD</code>, <code>OPTIONS</code> тела быть не должно.</p><ul><li><b>POST без тела:</b> Полностью валиден. Например, триггер операции: <code>POST /orders/45/activate</code>. Серверу не нужно передавать данные, важен сам факт вызова.</li><li><b>GET с телом:</b> Технически отправить можно, но **категорически не рекомендуется**. Согласно RFC 7231, серверы, прокси и кэширующие шлюзы имеют полное право проигнорировать или полностью отрезать тело у GET-запроса, из-за чего логика приложения сломается на проде.</li></ul>"
},
{
    id: "int32",
    category: "architecture",
    question: "В каких случаях лучше передавать данные в теле запроса (body), а не в query-параметрах?",
    answer: "<p>Передавать данные в <b>Request Body</b> следует в следующих сценариях:</p><ul><li>Когда структура данных является **иерархической или сложной** (вложенные объекты, массивы объектов), что тяжело и нечитаемо выразить плоской строкой query-параметров.</li><li>Когда объем передаваемых данных превышает **безопасный лимит длины URL** (около 2048 символов для старых клиентов/прокси).</li><li>Когда передаются **конфиденциальные данные** (пароли, сессионные ключи, ПДн), чтобы избежать их утечки через логирование URL веб-серверами (Nginx/Apache).</li></ul>"
},
{
    id: "int33",
    category: "architecture",
    question: "Что такое идемпотентность? Почему это важно?",
    answer: "<p><b>Идемпотентность</b> — это свойство метода (или операции) при повторном вызове с теми же параметрами возвращать тот же результат и оставлять состояние системы неизменным, как и после первого вызова.</p><p><b>Почему это критически важно:</b> В распределенных системах часто происходят сетевые сбои (сетевой таймаут). Клиент отправил запрос на списание денег, но не получил ответ из-за моргнувшей сети. Если метод *идемпотентен*, клиент может безопасно отправить запрос повторно (Retry). Если метод *неидемпотентен*, повторный запрос приведет к двойному списанию денег.</p>"
},
{
    id: "int34",
    category: "architecture",
    question: "DELETE — идемпотентный метод?",
    answer: "<p>Да, согласно спецификации HTTP, метод **DELETE является идемпотентным**.</p><p><b>Нюанс, который часто путают:</b> Идемпотентность означает неизменность *состояния сервера*, а не статус-кода ответа клиента. Первый вызов <code>DELETE /users/5</code> удалит пользователя и вернет <code>200 OK</code> или <code>204 No Content</code>. Второй и последующие вызовы вернут <code>404 Not Found</code>, потому что сущности уже нет. Но состояние базы данных от второго вызова никак не изменилось — пользователя как не было, так и нет. Значит, метод идемпотентен.</p>"
},
{
    id: "int35",
    category: "architecture",
    question: "Как сделать POST идемпотентным?",
    answer: "<p>По умолчанию <code>POST</code> неидемпотентен. Чтобы сделать его идемпотентным (например, при отправке платежей), применяется паттерн <b>Идемпотентного Ключа (Idempotency Key)</b>:</p><ul><li>Клиент перед отправкой запроса генерирует уникальный токен операции (обычно UUID) и передает его в HTTP-заголовке (например, <code>Idempotency-Key: d3b07384...</code>).</li><li>Бэкенд, получив запрос, проверяет наличие ключа в быстром кэше (Redis).</li><li>Если ключа нет, бэкенд блокирует его (выставляет лок), выполняет операцию, сохраняет результат выполнения в Redis и возвращает ответ клиенту.</li><li>Если ключ уже есть, бэкенд не выполняет бизнес-логику повторно, а мгновенно отдает клиенту сохраненный из Redis ответ предыдущего успешного запроса.</li></ul>"
},
{
    id: "int36",
    category: "architecture",
    question: "Что такое ключи идемпотентности (idempotency key)? Как они работают и как их использовать в API?",
    answer: "<p><b>Idempotency Key</b> — это уникальный идентификатор бизнес-операции, позволяющий гарантировать однократную обработку неидемпотентных запросов (типа POST) при повторных отправках (retries).</p><p><b>Как использовать в проектировании API:</b></p><ul><li>Разработчик API фиксирует в контракте обязательный заголовок (например, <code>X-Idempotency-Key</code>).</li><li>На бэкенде организуется Middleware (слой перехвата запросов), который проверяет ключи в хранилище со средним TTL (например, 24 часа).</li><li>Крайне важно обрабатывать состояние <i>«в процессе»</i>: если первый запрос еще выполняется в БД, а клиент прислал дубль с тем же ключом, Middleware должен вернуть статус <code>409 Conflict</code>, а не выполнять параллельную операцию.</li></ul>"
},
{
    id: "int37",
    category: "architecture",
    question: "Что такое кэширование? Зачем это использовать? Где реализуется — на стороне клиента или сервера?",
    answer: "<p><b>Кэширование</b> — это сохранение промежуточных результатов выполнения тяжелых операций во временном быстром хранилище (памяти) для мгновенного обслуживания повторных запросов.</p><p><b>Где реализуется:</b> Везде на пути следования запроса:</p><ul><li><b>На стороне клиента (Браузер):</b> Управляется заголовками сервера (<code>Cache-Control: max-age=3600</code>). Клиент вообще не делает сетевой запрос, беря данные локально.</li><li><b>Промежуточные слои (CDN / Прокси / API Gateway):</b> Кэшируют статику или публичные ответы API близко к пользователям.</li><li><b>На стороне сервера (Бэкенд):</b> Использование Redis/Memcached для сохранения тяжелых выборок из БД или результатов рендеринга страниц, чтобы разгрузить ядро системы.</li></ul>"
},
{
    id: "int38",
    category: "architecture",
    question: "Знаешь ли, что такое проксирование?",
    answer: "<p><b>Проксирование</b> — это механизм, при котором промежуточный сервер (прокси) выступает в роли доверенного посредника между клиентом и целевым сервером, перехватывая и перенаправляя сетевые запросы.</p><p>Различают два основных типа проксирования:</p><ul><li><b>Прямой прокси (Forward Proxy):</b> Стоит со стороны клиента. Скрывает личность клиента от внешнего интернета, позволяет обходить блокировки или фильтровать трафик офиса.</li><li><b>Обратный прокси (Reverse Proxy):</b> Стоит перед бэкенд-серверами (например, Nginx, HAProxy). Он принимает запросы из интернета и распределяет их по внутренним сервисам. Применяется для балансировки нагрузки, SSL-терминации, защиты от DDoS и сокрытия внутренней архитектуры сети.</li></ul>"
},
{
    id: "int39",
    category: "architecture",
    question: "Что такое версионирование? Как обеспечить обратную совместимость? В каком случае создаётся новая версия API?",
    answer: "<p><b>Версионирование API</b> — управление изменениями в контрактах интерфейса, позволяющее старым и новым клиентам одновременно работать с системой.</p><ul><li><b>Способы версионирования:</b> В URI (<code>/api/v1/users</code>), через кастомный заголовок (<code>X-API-Version: 2</code>) или через Accept-заголовок (Content Negotiation).</li><li><b>Обеспечение обратной совместимости (Backward Compatibility):</b> Нельзя удалять существующие поля, изменять их типы данных или делать необязательные параметры обязательными. Можно добавлять новые опциональные поля.</li><li><b>Когда создавать мажорную (новую) версию:</b> Когда происходят **breaking changes (ломающие изменения)** — удаление эндпоинтов, кардинальное изменение бизнес-логики или структуры JSON, которые старые клиенты (например, мобильное приложение, которое пользователь не обновил) не смогут распарсить без падения.</li></ul>"
},
{
    id: "int40",
    category: "architecture",
    question: "Что такое Swagger? Что такое OpenAPI? Работал ли в Swagger и Postman? Приходилось ли проектировать API в нотации OpenAPI/Swagger?",
    answer: "<p>Это стандарты индустрии для документирования и проектирования REST API:</p><ul><li><b>OpenAPI</b> — это аппаратно-независимая, декларативная спецификация (стандарт) для описания REST API в формате YAML или JSON.</li><li><b>Swagger</b> — это набор инструментов от компании SmartBear для работы с этой спецификацией (Swagger UI для визуализации, Swagger Editor, Swagger Codegen).</li><li><b>Из практики (Senior-ответ):</b> <i>«Да, активно работаю с обоими инструментами. В Postman собираю интеграционные коллекции тестов и настраиваю Mock-серверы для параллельной разработки фронта и бэка. Проектирование API веду строго по подходу <b>Design-First</b> в формате OpenAPI (YAML). Пишу контракты, согласовываю структуру со смежниками, а затем с помощью кодогенерации разворачиваю интерфейсы контроллеров на бэкенде. Это гарантирует 100% соответствие кода и документации».</i></li></ul>"
},
{
     id: "int41",
    category: "architecture",
    question: "Что такое SOAP API? Встречался ли на практике?",
    answer: "<p><b>SOAP (Simple Object Access Protocol)</b> — это строго стандартизированный протокол обмена структурированными сообщениями между распределенными приложениями. В отличие от REST, который является свободным архитектурным стилем, SOAP — это жесткий протокол, специфицированный консорциумом W3C, работающий исключительно с форматом XML.</p><p><b>Ключевые особенности SOAP:</b></p><ul><li><b>Независимость от транспорта:</b> Может работать не только поверх HTTP/HTTPS, но и через SMTP, FTP или очереди сообщений (JMS).</li><li><b>Строгая типизация:</b> Контракт жестко зафиксирован схемой XSD.</li><li><b>Встроенные стандарты:</b> Имеет готовые спецификации WS-Security (для шифрования и подписи на уровне самого сообщения) и WS-ReliableMessaging (гарантия доставки).</li></ul><p><b>Из практики (Senior-ответ):</b> <i>«Да, с SOAP приходится сталкиваться регулярно при интеграции с тяжелыми enterprise-системами, имеющими долгую историю: банковскими АБС (ЦФТ, Диасофт), государственными сервисами (СМЭВ, ГИС ЖКХ) или биллинговыми платформами телеком-операторов. Проектировать новые сервисы на SOAP сейчас не станут, но уметь поддерживать и интегрироваться с ними — обязательный навык для синьора».</i></p>"
},
{
    id: "int42",
    category: "architecture",
    question: "Из чего состоит сообщение в SOAP?",
    answer: "<p>Любое SOAP-сообщение представляет собой XML-документ, структура которого строго регламентирована и называется <b>SOAP Envelope (Конверт)</b>. Она включает следующие корневые элементы:</p><ul><li><b>SOAP Envelope:</b> Корневой элемент, который идентифицирует XML-документ как SOAP-сообщение и определяет пространства имен (namespaces).</li><li><b>SOAP Header (Заголовок — опционально):</b> Содержит метаданные и служебную информацию, не связанную напрямую с бизнес-логикой. Сюда выносятся токены авторизации (WS-Security), идентификаторы сквозного логирования (Correlation ID) или инструкции маршрутизации.</li><li><b>SOAP Body (Тело):</b> Обязательный элемент, содержащий непосредственный payload — имя вызываемого метода (операции) и передаваемые бизнес-параметры, либо структуру Fault.</li><li><b>SOAP Fault (Элемент ошибки):</b> Находится внутри SOAP Body и присутствует только в случае сбоя. Содержит стандартизированные коды (faultcode), понятное описание (faultstring) и технические детали (detail) произошедшей ошибки.</li></ul>"
},
{
    id: "int43",
    category: "architecture",
    question: "Что такое WSDL?",
    answer: "<p><b>WSDL (Web Services Description Language)</b> — это основанный на XML язык описания веб-служб и их интерфейсов. Простыми словами, WSDL — это полноценный, машиночитаемый технический контракт SOAP-сервиса (аналог OpenAPI/Swagger для REST API).</p><p><b>Что описывает WSDL-файл:</b></p><ul><li><b>Types (Типы данных):</b> Определяет используемые типы данных с помощью встроенных или кастомных XSD-схем.</li><li><b>Message (Сообщения):</b> Описывает структуру передаваемых данных для каждой операции (какие параметры входят в запрос, какие в ответ).</li><li><b>PortType (Интерфейс):</b> Объединяет набор операций в логические группы (аналог интерфейса в ООП).</li><li><b>Binding (Связывание):</b> Задает конкретный протокол передачи данных (например, HTTP SOAP RPC или Document style).</li><li><b>Service (Сервис):</b> Указывает физический сетевой адрес (URL эндпоинта), по которому доступен веб-сервис.</li></ul><p>На основе WSDL-файла разработчики могут с помощью утилит (например, <code>cxf-codegen-plugin</code> или <code>wsimport</code>) автоматически генерировать готовый код клиентских классов (Stubs/Proxies) на Java, C# или других языках.</p>"
},
{
    id: "int44",
    category: "architecture",
    question: "Чем SOAP отличается от REST?",
    answer: "<p>Сравнение этих подходов — классический вопрос архитектурных секций:</p><table><thead><tr><th>Критерий</th><th>SOAP API</th><th>REST API</th></tr></thead><tbody><tr><td><b>Природа</b></td><td>Жесткий протокол со стандартами</td><td>Архитектурный стиль (набор рекомендаций)</td></tr><tr><td><b>Формат данных</b></td><td>Только XML</td><td>Любой (JSON, XML, YAML, Plain Text)</td></tr><tr><td><b>Контракт</b></td><td>Строгий XML-контракт (WSDL)</td><td>Опциональный (OpenAPI/Swagger)</td></tr><tr><td><b>Транспорт</b></td><td>HTTP, SMTP, JMS, FTP</td><td>Практически всегда только HTTP/HTTPS</td></tr><tr><td><b>Безопасность</b></td><td>WS-Security (на уровне сообщений, Enterprise)</td><td>HTTPS (на уровне транспорта), OAuth2, JWT</td></tr><tr><td><b>Кэширование</b></td><td>Невозможно на уровне HTTP (всегда POST)</td><td>Нативное (через HTTP заголовки GET-запросов)</td></tr></tbody></table><p><b>Резюме:</b> SOAP сложнее в разработке, создает большой оверхед по трафику из-за тяжелого XML, но незаменим там, где требуется транзакционность, повышенная безопасность сообщений и жесткие контракты. REST — гибкий, легкий, быстрый и доминирует в современных веб- и микросервисных архитектурах.</p>"
},
{
    id: "int45",
    category: "architecture",
    question: "В чём концепция брокеров сообщений? В каких случаях нужна работа с очередями сообщений? С какими очередями работал?",
    answer: "<p><b>Концепция брокеров сообщений (Message Brokers):</b> Это промежуточное ПО (мидлвар), реализующее паттерн асинхронного обмена сообщениями. Вместо того чтобы вызывать друг друга напрямую (Point-to-Point синхронно), сервисы-отправители (Producers) публикуют сообщения в брокер, а сервисы-получатели (Consumers) вычитывают их оттуда. Это максимально снижает связанность систем (Loose Coupling).</p><p><b>Когда необходимы очереди сообщений:</b></p><ul><li><b>Асинхронная тяжелая обработка:</b> Когда операцию нельзя сделать мгновенно в рамках HTTP-сессии (генерация тяжелых PDF-отчетов, конвертация видео, отправка пачки писем).</li><li><b>Сглаживание пиковых нагрузок (Throttling / Load Leveling):</b> Брокер выступает буфером. Если на систему налетит миллион запросов в секунду, бэкенд не упадет — сообщения лягут в очередь, а воркеры будут спокойно разбирать их со своей стабильной скоростью.</li><li><b>Повышение надежности (Guaranteed Delivery):</b> Если сервис-приемник «прилег» на обслуживание, сообщения накопятся в брокере и обработаются сразу после его подъема, данные не потеряются.</li></ul><p><b>Из практики (Senior-ответ):</b> <i>«В своей практике я глубоко работал с <b>RabbitMQ</b> (для классического роутинга и AMQP задач) и <b>Apache Kafka</b> (для высоконагруженного стриминга событий и построения Event-Driven архитектуры). Также сталкивался с облачным AWS SQS».</i></p>"
},
{
    id: "int46",
    category: "architecture",
    question: "Зачем нужны очереди в асинхронных запросах?",
    answer: "<p>В асинхронном взаимодействии очереди решают фундаментальную проблему **сохранения состояния и изоляции участников обмена**. Без брокера и его очередей асинхронность превращается в хаос.</p><p><b>Ключевые функции очередей:</b></p><ul><li><b>Гарантия персистентности:</b> Если отправитель выплюнул запрос асинхронно («выстрелил и забыл»), очередь гарантирует, что это сообщение доживет до момента, пока принимающий сервис освободится или поднимется после сбоя.</li><li><b>Организация балансировки (Competing Consumers):</b> Если к одной очереди подключить 5 инстансов одного микросервиса, брокер будет распределять сообщения между ними (например, по кругу — Round Robin). Это позволяет легко масштабировать производительность системы горизонтально.</li><li><b>Разделение ответственности:</b> Продюсеру абсолютно всё равно, сколько консьюмеров читают очередь, на каких технологиях они написаны и живы ли они прямо сейчас.</li></ul>"
},
{
    id: "int47",
    category: "architecture",
    question: "В чём отличие очереди от топика?",
    answer: "<p>Это различие описывает два разных паттерна распределения сообщений:</p><ul><li><b>Очередь (Queue — паттерн Point-to-Point):</b> Сообщение отправляется в очередь, и его может забрать **только один** из подключенных консьюмеров. Как только один воркер обработал и подтвердил сообщение, оно безвозвратно удаляется из очереди. Подходит для распределения однотипных задач (например, отправка SMS).</li><li><b>Топик (Topic — паттерн Publish-Subscribe / Pub-Sub):</b> Сообщение публикуется в топик, и его копию получают **все независимые подписчики**, заинтересованные в этой теме. Например, при событии «Заказ оплачен» топик отправляет копии сообщения в сервис логистики, сервис лояльности и сервис аналитики одновременно. Каждый из них обрабатывает событие независимо в своем контексте.</li></ul>"
},
{
    id: "int48",
    category: "architecture",
    question: "Внутреннее устройство Apache Kafka. Что такое offset в Kafka?",
    answer: "<p><b>Apache Kafka</b> спроектирована не как классический брокер (типа RabbitMQ), а как **распределенный, отказоустойчивый распределенный лог коммитов (Append-only Log)**.</p><p><b>Внутреннее устройство:</b> Данные хранятся в <b>Топиках (Topics)</b>. Каждый топик масштабируется путем деления на <b>Партиции (Partitions / Разделы)</b>. Партиция — это упорядоченный, неизменяемый поток сообщений, куда новые записи только дописываются в конец. Каждая партиция физически сохраняется на диске брокера, что обеспечивает колоссальную производительность за счет последовательного чтения/записи.</p><p><b>Что такое offset (смещение):</b></p><ul><li>Это порядковый номер (64-битное целое число), который автоматически присваивается каждому сообщению внутри конкретной партиции при записи.</li><li>Kafka не удаляет сообщения сразу после прочтения (они хранятся согласно Retention Policy, например, 7 дней).</li><li>Поэтому <b>Offset</b> — это единственный указатель позиции консьюмера. Консьюмер сам хранит информацию о том, какой offset он сейчас читает. Это позволяет консьюмеру в случае падения подняться и продолжить чтение ровно с того места, где он остановился, или при необходимости «перемотать» время назад и перечитать старые сообщения.</li></ul>"
},
{
    id: "int49",
    category: "architecture",
    question: "Может ли несколько consumer-ов читать одну и ту же партицию?",
    answer: "<p>Ответ зависит от того, принадлежат ли консьюмеры к одной **Consumer Group (группе потребителей)**:</p><ul><li><b>Внутри одной Consumer Group — НЕТ, нельзя.</b> В Kafka действует строгое правило: одну партицию в один момент времени может читать **только один** консьюмер из конкретной группы. Это сделано для обеспечения строгого порядка обработки сообщений внутри партиции и исключения гонки за данными между потоками одной группы. Если консьюмеров в группе станет больше, чем партиций в топике, «лишние» консьюмеры будут просто простаивать в режиме ожидания (Idle).</li><li><b>Из разных Consumer Groups — ДА, можно.</b> Если у нас есть группа сервиса Аналитики и группа сервиса Биллинга, они абсолютно независимы. Консьюмер из Аналитики и консьюмер из Биллинга будут параллельно читать одну и ту же партицию, у каждого будет свой независимый offset.</li></ul>"
},
{
    id: "int50",
    category: "architecture",
    question: "Клиент читает в Kafka два последних сообщения. Как тому же клиенту заново их прочитать?",
    answer: "<p>Поскольку Kafka не удаляет сообщения после прочтения, повторное чтение реализуется путем **управления смещением (Offset Management)**. Есть три основных способа сделать это:</p><ul><li><b>Через CLI / API изменение коммита (Seek):</b> Программным путем вызвать метод <code>seek()</code> у инстанса консьюмера, передав туда целевую партицию и точный номер нужного оффсета (текущий оффсет минус 2).</li><li><b>Перемотка на начало/конец (SeekToBeginning / SeekToEnd):</b> Если точные номера неизвестны, можно сбросить оффсет группы на более раннее время с помощью консольной утилиты: <br><code>kafka-consumer-groups.sh --bootstrap-server localhost:9092 --group my-group --reset-offsets --to-earliest --execute</code></li><li><b>Создание новой Consumer Group:</b> Самый простой способ «в лоб» для тестов — запустить консьюмера с совершенно новым, ранее не существовавшим именем группы (<code>group.id</code>) и конфигурацией <code>auto.offset.reset = earliest</code>. Kafka воспримет его как нового клиента и начнет читать партиции с самого начала доступных логов.</li></ul>"
},
{
    id: "int51",
    category: "architecture",
    question: "Чем Kafka отличается от RabbitMQ?",
    answer: "<p>Это принципиально разные инструменты, рожденные для разных задач:</p><table><thead><tr><th>Характеристика</th><th>RabbitMQ (AMQP)</th><th>Apache Kafka</th></tr></thead><tbody><tr><td><b>Архитектура</b></td><td>Умный брокер / глупый консьюмер (брокер следит, кто что прочитал).</td><td>Глупый брокер / умный консьюмер (брокер просто хранит лог, клиент сам рулит смещением).</td></tr><tr><td><b>Удаление данных</b></td><td>Сообщение удаляется сразу после подтверждения (Ack).</td><td>Сообщения хранятся на диске фиксированное время (Retention).</td></tr><tr><td><b>Маршрутизация</b></td><td>Очень гибкая (Exchange: Direct, Topic, Fanout, Headers).</td><td>Простая (строго по Топикам и Ключам партиционирования).</td></tr><tr><td><b>Производительность</b></td><td>Высокая (десятки тысяч сообщений в сек.), упор на гибкую логику.</td><td>Колоссальная (миллионы событий в сек.), упор на пропускную способность.</td></tr><tr><td><b>Повтор чтения</b></td><td>Невозможен (данные стерты).</td><td>Возможен в любой момент (перемотка оффсета).</td></tr></tbody></table><p><b>Правило выбора:</b> RabbitMQ идеален для классических enterprise-задач, транзакционных очередей команд и гибких маршрутов. Kafka нужна для логов, метрик, Big Data, стриминга в реальном времени (Kafka Streams) и Event Sourcing архитектуры.</p>"
},
{
    id: "int52",
    category: "architecture",
    question: "Как брокер сообщений гарантирует доставку сообщений? Как проверить, что сообщение брокера получено в полном объёме?",
    answer: "<p><b>Гарантия доставки обеспечивается на трех уровнях:</b></p><ul><li><b>Продюсер -> Брокер:</b> Использование подтверждений записи (Acks). В Kafka настройка <code>acks=all</code> гарантирует, что брокер ответит продюсеру успехом только тогда, когда сообщение запишется на лидер-партицию и синхронизируется со всеми репликами (ISR). Также важна персистентность (сохранение на диск брокера).</li><li><b>Брокер -> Консьюмер:</b> Механизм ручного подтверждения (Manual Acknowledgements / ACK). Консьюмер забирает сообщение, обрабатывает его в своей БД, и только при успешном завершении бизнес-логики отправляет брокеру сигнал <code>basicAck</code> (в Rabbit) или фиксирует offset (в Kafka). Если воркер упадет в процессе работы, брокер вернет сообщение в очередь для других воркеров.</li></ul><p><b>Как проверить полноту (целостность) данных:</b></p><ul><li><b>Контрольные суммы (Checksum / CRC):</b> На транспортном уровне брокеры автоматически проверяют CRC каждого пакета данных при передаче по сети.</li><li><b>Бизнес-валидация:</b> На уровне приложения входящий payload проверяется по JSON/XSD схеме. Также хорошей практикой является передача хэша сообщения (например, MD5/SHA-256) в заголовке для сверки консьюмером.</li></ul>"
},
{
    id: "int53",
    category: "architecture",
    question: "В каких случаях стоит выбрать брокер сообщений вместо API-интеграции?",
    answer: "<p>Переход от синхронных API (REST/gRPC) к брокеру сообщений оправдан в следующих системных паттернах:</p><ul><li><b>Требуется высокая отказоустойчивость (Loose Coupling):</b> Если система А не должна падать или выдавать ошибки пользователю, когда система Б временно недоступна или перегружена.</li><li><b>Паттерн один ко многим (One-to-Many / Pub-Sub):</b> Когда о наступлении бизнес-события (например, «Пользователь зарегистрировался») нужно уведомить 5 разных независимых систем. Родить 5 синхронных HTTP-вызовов из одного контроллера — антипаттерн (вырастет задержка, посыплется обработка ошибок). Проще кинуть одно событие в топик брокера.</li><li><b>Длительные фоновые процессы:</b> Все задачи, которые длятся дольше 1–2 секунд, должны выноситься из HTTP-потока в очереди, чтобы не держать открытыми сетевые соединения и не утилизировать ресурсы веб-сервера.</li></ul>"
},
{
    id: "int54",
    category: "architecture",
    question: "Что такое корпоративная шина? Приходилось ли работать?",
    answer: "<p><b>ESB (Enterprise Service Bus / Корпоративная сервисная шина)</b> — это централизованный архитектурный паттерн и специализированное ПО, которое выступает в роли единой транзитной зоны для интеграции всех систем в компании.</p><p><b>Философия ESB:</b> Вместо создания хаотичных связей «каждый с каждым» (Spaghetti Architecture), все системы подключаются к единой шине. </p><p><b>Основные обязанности шины:</b></p><ul><li><b>Маршрутизация сообщений:</b> Перенаправление данных на основе контента или правил.</li><li><b>Трансформация (Преобразование форматов):</b> Шина может принять SOAP XML от старой АБС, «на лету» пересобрать его в JSON и вызвать современный REST-сервис.</li><li><b>Оркестрация процессов:</b> Объединение нескольких вызовов атомарных сервисов в один сквозной бизнес-процесс.</li></ul><p><b>Из практики (Senior-ответ):</b> <i>«Да, сталкиваться приходилось. В крупных организациях в качестве ESB чаще всего выступают решения вроде IBM Integration Bus, Oracle Service Bus, MuleSoft или open-source Apache Camel / WSO2. Современный тренд — уход от монолитных тяжелых шин (которые часто становились единой точкой отказа и бутылочным горлышком для команд разработки) в сторону децентрализованных микросервисных интеграций (Smart endpoints, dumb pipes)».</i></p>"
},
{
    id: "int55",
    category: "architecture",
