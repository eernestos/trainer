    "id": 18,
    "question": "Какие методы HTTP знаешь? Для чего их используешь?",
    "answer": "GET — чтение данных; POST — создание ресурса; PUT — полное обновление/замена ресурса; PATCH — частичное изменение полей; DELETE — удаление ресурса; OPTIONS — проверка разрешенных методов для URI; HEAD — получение только заголовков ответа."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 19,
    "question": "Что такое HTTP-интеграция (HTTP + JSON без принципов REST)? Чем REST-интеграция отличается от обычной HTTP/JSON-интеграции?",
    "answer": "HTTP+JSON без REST — это использование HTTP просто как транспорта, где все запросы могут слаться через POST на один URL, а операция зашита в тело JSON (RPC-стиль). REST-интеграция строго разделяет ресурсы по URI и использует семантику HTTP-методов (GET, DELETE, PATCH)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 20,
    "question": "Какой HTTP-метод является безопасным?",
    "answer": "Безопасными называются методы, которые не изменяют состояние данных на сервере. К ним относятся GET, HEAD и OPTIONS."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 21,
    "question": "Как можно передавать параметры в методе?",
    "answer": "1. Query parameters — в строке URL после '?' (/users?id=1). 2. Path parameters — в самом пути ресурса (/users/1). 3. Request Body — в теле запроса (JSON в POST/PUT/PATCH). 4. Headers — в служебных заголовках (токены авторизации)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 22,
    "question": "Что содержит URL в HTTP-запросе?",
    "answer": "Содержит протокол (https://), домен или IP-адрес хоста, порт (опционально), путь к ресурсу (path) и параметры запроса (query string)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 23,
    "question": "Что содержит HEADER в ответе HTTP?",
    "answer": "Содержит метаданные ответа: Content-Type (формат), Content-Length (размер), Cache-Control (правила кэширования), Server (информация о ПО), Set-Cookie и CORS-заголовки безопасности."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 24,
    "question": "Какие статус-коды ответов могут быть? Какие виды HTTP-ошибок знаешь?",
    "answer": "1xx — инфо, 2xx — успех (200 OK, 201 Created), 3xx — редиректы. Ошибки: 4xx — ошибки клиента (400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found); 5xx — ошибки сервера (500 Internal Error, 502 Bad Gateway, 504 Gateway Timeout)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 25,
    "question": "Чем ошибка 200 отличается от 201?",
    "answer": "200 OK — это общий статус успешной обработки любого запроса. 201 Created — это специфичный успешный статус, подтверждающий, что в результате запроса на сервере был успешно создан новый уникальный ресурс."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 26,
    "question": "Что делать, если получили HTTP-ошибку? Как описывать обработку ошибок в постановке?",
    "answer": "Если ошибка 4xx — править логику запроса на клиенте, если 5xx — смотреть логи бэкенда. В постановке аналитик описывает негативные сценарии в виде матрицы или кейсов: 'При получении кода ХХХ, система должна: показать юзеру ошибку Y, записать ошибку в лог со статусом ERROR'."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 27,
    "question": "Чем POST отличается от GET?",
    "answer": "GET запрашивает данные, параметры передает только в URL, лимитирован по объему, безопасен и идемпотентен, кэшируется. POST отправляет данные на обработку или создание, параметры передает в теле (body), объем практически не ограничен, не безопасен и не идемпотентен."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 28,
    "question": "Чем POST отличается от PUT?",
    "answer": "POST используется для создания подчиненного ресурса, когда URI генерирует сам сервер (не идемпотентен). PUT создает или полностью заменяет ресурс по строго указанному клиентом URI (идемпотентен, повторные вызовы не создают дубли)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 29,
    "question": "Чем PUT отличается от PATCH?",
    "answer": "PUT перезаписывает объект целиком (пропущенные поля затрутся или сбросятся в дефолт). PATCH осуществляет частичное обновление, модифицируя исключительно те поля, которые были присланы в теле запроса."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 30,
    "question": "Можно ли использовать метод POST для получения данных? Когда стоит так делать?",
    "answer": "Да, можно. Это делают, когда параметры фильтрации/поиска слишком огромны и не влезают в ограничения длины URL для GET, либо когда параметры содержат конфиденциальные данные, которые нельзя логировать в составе URL (например, поиск по персональным данным)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 31,
    "question": "У каких HTTP-методов есть тело запроса (body)? Можно ли реализовать POST-запрос без тела? Можно ли реализовать GET-запрос с телом?",
    "answer": "Тело есть у POST, PUT, PATCH. POST без тела реализовать можно (например, для триггера операции типа /activate). GET с телом технически возможен, но спецификацией не рекомендован: большинство серверов и прокси его проигнорируют или сбросят."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 32,
    "question": "В каких случаях лучше передавать данные в теле запроса (body), а не в query-параметрах?",
    "answer": "1. Когда объем данных больше 2-8 Кб. 2. Когда данные имеют сложную вложенную иерархическую структуру или массивы. 3. Когда передаются пароли, токены или персональные данные, требующие защиты от логирования."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 33,
    "question": "Что такое идемпотентность? Почему это важно?",
    "answer": "Идемпотентность — свойство метода при многократном повторении давать тот же результат и приводить к тому же состоянию системы, что и при первом вызове. Это важно при сбоях сети: клиент может безопасно повторить запрос (retry), зная, что, например, платеж не спишется дважды."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 34,
    "question": "DELETE — идемпотентный метод?",
    "answer": "Да, DELETE идемпотентен. Первый вызов удаляет объект, последующие вызовы не меняют состояние системы (объекта уже нет), хотя коды ответов могут отличаться (200 при первом, 404 при повторных)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 35,
    "question": "Как сделать POST идемпотентным?",
    "answer": "С помощью механизма Idempotency Key (Ключ идемпотентности). Клиент генерирует UUID операции и шлет в заголовке. Сервер сохраняет ключ в кэш (Redis). При повторе запроса с тем же ключом сервер просто возвращает старый сохраненный ответ без повторного выполнения бизнес-логики."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 36,
    "question": "Что такое ключи идемпотентности (idempotency key)? Как они работают и как их использовать в API?",
    "answer": "Это уникальные маркеры (UUID), передаваемые в заголовках. Сервер проверяет их наличие в БД/кэше перед транзакцией: если ключ новый — выполняет операцию и кэширует ответ, если ключ уже зафиксирован — отдает готовый ответ из кэша, предотвращая дублирование."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 37,
    "question": "Что такое кэширование? Зачем это использовать? Где реализуется — на стороне клиента или сервера?",
    "answer": "Кэширование — сохранение копии данных в быстром хранилище для исключения повторных запросов. Снижает нагрузку на БД и ускоряет отклик. Реализуется и на клиенте (браузер), и на промежуточных узлах (CDN, Nginx), и на сервере (Redis в памяти бэкенда)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 38,
    "question": "Знаешь ли, что такое проксирование?",
    "answer": "Проксирование — перенаправление сетевого запроса от клиента к серверу через промежуточный узел. Бывает Forward Proxy (скрывает клиента) и Reverse Proxy (Nginx перед бэкендами — скрывает архитектуру серверов, балансирует нагрузку, обеспечивает SSL)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 39,
    "question": "Что такое версионирование? Как обеспечить обратную совместимость? В каком случае создаётся новая версия API?",
    "answer": "Версионирование — управление изменениями в API (/v1/, /v2/) для одновременной поддержки старых и новых клиентов. Обратная совместимость обеспечивается добавлением только необязательных полей. Новая версия создается при ломающих (breaking) изменениях: удаление полей, смена типов данных."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.2. HTTP и REST API",
    "id": 40,
    "question": "Что такое Swagger? Что такое OpenAPI? Работал ли в Swagger и Postman? Приходилось ли проектировать API в нотации OpenAPI/Swagger?",
    "answer": "OpenAPI — стандарт и формат (YAML/JSON) описания REST API. Swagger — набор инструментов для работы со стандартом (включая UI для тестов). Аналитики проектируют контракты в YAML/OpenAPI, а через Postman тестируют ручки и создают коллекции запросов."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.3. SOAP API",
    "id": 41,
    "question": "Что такое SOAP API? Встречался ли на практике?",
    "answer": "SOAP — строго стандартизированный протокол обмена данными. В отличие от REST, использует исключительно формат XML, имеет встроенные стандарты безопасности и транзакционности. Применяется в банках, госсистемах (СМЭВ) и легаси-архитектурах."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.3. SOAP API",
    "id": 42,
    "question": "Из чего состоит сообщение в SOAP?",
    "answer": "Состоит из XML-документа SOAP Envelope, внутри которого находятся: <soap:Header> (опциональные метаданные, авторизация, шифрование), <soap:Body> (обязательные бизнес-данные или вызов метода) и <soap:Fault> (информация об ошибках, если они возникли)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.3. SOAP API",
    "id": 43,
    "question": "Что такое WSDL?",
    "answer": "WSDL (Web Services Description Language) — XML-файл, содержащий полное строгое описание контракта SOAP-сервиса. Описывает доступные методы, структуры данных (XSD) и эндпоинты. Позволяет автоматически генерировать код клиента."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.3. SOAP API",
    "id": 44,
    "question": "Чем SOAP отличается от REST?",
    "answer": "SOAP — это жесткий протокол, REST — гибкий архитектурный стиль. SOAP поддерживает только XML, REST — любые форматы (в основном JSON). В SOAP контракт строго зафиксирован в WSDL, в REST — рекомендательный (OpenAPI). SOAP медленнее из-за тяжелого оверхеда XML."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 45,
    "question": "В чём концепция брокеров сообщений? В каких случаях нужна работа с очередями сообщений? С какими очередями работал?",
    "answer": "Брокер — промежуточное ПО, принимающее сообщения от систем-продюсеров и доставляющее их консюмерам, изолируя их друг от друга. Очереди нужны для асинхронных тяжелых задач, сглаживания пиковых нагрузок и гарантии доставки при даунтайме систем. Работал с RabbitMQ, Apache Kafka."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 46,
    "question": "Зачем нужны очереди в асинхронных запросах?",
    "answer": "Очереди выполняют роль буфера. Они хранят сообщения персистентно и позволяют принимающим системам (консюмерам) забирать данные со своей скоростью обработки (Backpressure), исключая падение сервисов от перегрузки."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 47,
    "question": "В чём отличие очереди от топика?",
    "answer": "В классической очереди (Point-to-Point) сообщение доставляется строго одному свободному консюмеру и после ACK удаляется. В топике (Publish-Subscribe) сообщение дублируется и доставляется всем независимым подписчикам (или группам), подписанным на данный топик."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 48,
    "question": "Внутреннее устройство Apache Kafka. Что такое offset в Kafka?",
    "answer": "Kafka состоит из топиков, разбитых на партиции — упорядоченные логи на диске, куда сообщения пишутся в конец (append-only). Offset (смещение) — это инкрементальный порядковый ID сообщения в партиции. Консюмер сам хранит свой offset, отмечая, до какого места он дочитал лог."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 49,
    "question": "Может ли несколько consumer-ов читать одну и ту же партицию?",
    "answer": "В рамках одной Consumer Group — нет, не может (одна партиция закрепляется строго за одним консюмером для сохранения порядка сообщений). Если консюмеры состоят в разных Consumer Group, они могут читать одну партицию параллельно и независимо."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 50,
    "question": "Клиент читает в Kafka два последних сообщения. Как тому же клиенту заново их прочитать?",
    "answer": "Поскольку сообщения в Kafka персистентно хранятся на диске (в рамках настроенного Retention Policy), клиенту достаточно программно сбросить или передвинуть свой указатель offset назад на 2 позиции и запустить чтение заново."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 51,
    "question": "Чем Kafka отличается от RabbitMQ?",
    "answer": "RabbitMQ — это 'умный' брокер, контролирующий доставку и удаляющий сообщения сразу после ACK, данные хранит в RAM, силен гибкой маршрутизацией. Kafka — 'умный консюмер', это распределенный лог, пишущий терабайты сообщений на диск. Сообщения не удаляются после прочтения, что идеально для Big Data и стриминга."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 52,
    "question": "Как брокер сообщений гарантирует доставку сообщений? Как проверить, что сообщение брокера получено в полном объёме?",
    "answer": "Гарантия реализуется через Publisher Confirmations (подтверждение брокером сохранения записи) и Consumer ACK (подтверждение успешной обработки консюмером). Полный объем и целостность данных проверяются контрольными суммами (CRC/Checksum) в заголовках."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 53,
    "question": "В каких случаях стоит выбрать брокер сообщений вместо API-интеграции?",
    "answer": "Когда не нужен мгновенный ответ (отправка писем, аналитика), когда системы-получатели имеют нестабильный аптайм, когда на одну операцию должны среагировать 5 независимых систем, или когда нужно сгладить пики входящей нагрузки."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 54,
    "question": "What is enterprise service bus (ESB) / Что такое корпоративная шина? Приходилось ли работать?",
    "answer": "ESB — централизованная интеграционная шина данных. Она связывает множество систем по принципу 'звезда', забирая на себя маршрутизацию, трансформацию протоколов (например, REST в SOAP) и форматов (JSON в XML). Применял Apache Camel / MuleESB."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 55,
    "question": "Какая разница между шиной и очередью? Чем брокер сообщений отличается от корпоративной шины?",
    "answer": "Брокер сообщений (очередь) — это 'глупая труба', он просто перекладывает сырые байты данных от А к Б без изменения структуры. Корпоративная шина (ESB) — 'умная', она содержит бизнес-правила, трансформирует форматы, меняет протоколы и оркеструет потоки."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 56,
    "question": "Чем корпоративная шина отличается от ETL-инструмента? Что такое концепции ETL и ELT?",
    "answer": "Шина гоняет единичные сообщения в Real-time для бизнес-логики. ETL работает по расписанию пакетами (Batch) больших данных для DWH. ETL: Extract (извлеки) -> Transform (преобразуй на сервере ETL) -> Load (загрузи в DWH). ELT: Extract -> Load (грузи сырыми в мощное DWH) -> Transform (преобразуй внутри DWH через SQL)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.4. Очереди, брокеры и шина",
    "id": 57,
    "question": "К корпоративной шине подключены веб-сервисы. В одном веб-сервисе появились два новых обязательных поля. Что изменится в интеграции?",
    "answer": "Это ломающее изменение. Потребуется обновить контракт интеграции на самой шине (WSDL/XSD/JSON Schema), а также доработать все системы-источники (клиенты), чтобы они начали передавать эти поля, иначе шина или целевой сервис заблокируют запросы."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.5. Другие способы интеграции",
    "id": 58,
    "question": "Что такое webhook (callback)? Когда его применять? Какие плюсы и минусы?",
    "answer": "Webhook — уведомление системы по инициативе сервера. Клиент регистрирует свой URL, и сервер делает HTTP POST на этот URL при наступлении события (например, банк сообщает о статусе платежа). Плюсы: нет спама запросами (Polling), Real-time. Минусы: клиент должен держать открытый URL; если клиент упал, сервер должен настраивать логику повторных попыток."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.5. Другие способы интеграции",
    "id": 59,
    "question": "Что такое long polling? Зачем он нужен, как устроен и чем отличается от обычного REST-запроса?",
    "answer": "При Long Polling клиент делает HTTP-запрос, а сервер не закрывает соединение, пока не появятся новые данные (или не выйдет таймаут). Отличие от обычного REST в том, что обычный запрос возвращает ответ мгновенно (даже если он пустой), заставляя клиента спамить сеть."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.5. Другие способы интеграции",
    "id": 60,
    "question": "Что такое WebSocket? Когда его применять? Чем отличается от long polling?",
    "answer": "WebSocket — полнодуплексный (двунаправленный) протокол связи поверх TCP через одно постоянное соединение. Применяется в чатах, биржах. Отличие от Long Polling в том, что WebSocket не пересоздает HTTP-запросы с тяжелыми заголовками, а гоняет легкие фреймы данных в обе стороны без разрыва связи."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.5. Другие способы интеграции",
    "id": 61,
    "question": "Что такое gRPC? Когда его применять? Что такое Protobuf и HTTP/2 (чем отличается от HTTP/1.1)?",
    "answer": "gRPC — высокопроизводительный RPC-фреймворк от Google для межсервисного взаимодействия микросервисов. Использует Protobuf (компактная бинарная сериализация вместо текстового JSON) и работает на HTTP/2, который отличается мультиплексированием (много запросов в одном TCP) и сжатием заголовков."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.5. Другие способы интеграции",
    "id": 62,
    "question": "Что такое GraphQL? Когда применяют? Плюсы GraphQL относительно REST?",
    "answer": "GraphQL — язык запросов к API, где клиент сам указывает в теле POST-запроса точную схему нужных полей. Плюсы: решает проблему Over-fetching (сервер не шлет лишнего) и Under-fetching (за один запрос собираются связанные данные, например, юзер + его заказы, без лишних сетевых ходов)."
  },
  {
    "block": "Блок 3. Интеграция",
    "section": "3.5. Другие способы интеграции",
    "id": 63,
    "question": "Что такое файловый обмен? Когда применять? Плюсы и минусы файлового обмена?",
    "answer": "Обмен файлами (CSV, XML) через папки/FTP. Применяется для синхронизации справочников раз в сутки. Плюсы: прост в реализации, переносит миллионы строк пакетом, системы изолированы по времени. Минусы: нет Real-time данных, сложно точечно обрабатывать ошибки строк."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 1,
    "question": "Что такое клиент-серверная архитектура?",
    "answer": "Шаблон, разделяющий систему на Клиента (инициатор запросов, отображает интерфейс пользователю) и Сервер (принимает запросы, выполняет бизнес-логику, вычисления и обеспечивает работу с БД)."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 2,
    "question": "Какие есть виды архитектуры / архитектурные паттерны? Какая архитектура у тебя на проекте?",
    "answer": "Виды: Монолитная, Микросервисная, Сервис-ориентированная (SOA), Событийно-ориентированная (EDA). На моем проекте микросервисная архитектура: бэкенды общаются асинхронно через Kafka, а фронтенд ходит к сервисам по синхронному REST API через API Gateway."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 3,
    "question": "Что такое монолит? Что такое распределённый монолит?",
    "answer": "Монолит — архитектура, где весь код, логика и БД разворачиваются как единое целое. Распределенный монолит — антипаттерн, когда систему физически разделили на микросервисы, но связали их жесткими синхронными вызовами: падение одного сервиса рушит всю цепь, требуя совместного релиза."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 4,
    "question": "Что такое микросервисы? В чём заключается независимость микросервисов?",
    "answer": "Микросервисы — стиль деления приложения на автономные слабосвязанные сервисы по бизнес-доменам. Независимость заключается в отдельном деплое, автономном масштабировании, наличии собственной изолированной БД у каждого сервиса и возможности использовать разный стек (Java/Go)."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 5,
    "question": "Чем отличается сервис от микросервиса?",
    "answer": "Граница размыта, но Сервис (в SOA) обычно крупнее, отвечает за масштабную бизнес-функцию компании и делит общую БД. Микросервис максимально гранулярен, сфокусирован на одной задаче (Single Responsibility) и полностью изолирован по данным."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 6,
    "question": "В чём отличие монолита и микросервисов? Плюсы/минусы? Когда лучше выбрать монолит и когда стоит уходить от монолита в микросервисы?",
    "answer": "Монолит прост в старте и отладке, но сложен в масштабировании. Микросервисы отлично масштабируются и отказоустойчивы, но сложны в инфраструктуре. Стартовать проект лучше как монолит (MVP). Уходить в микросервисы стоит, когда кодовая база монолита тормозит релизы, а команда выросла до 30+ человек."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 7,
    "question": "В чём преимущества и недостатки микросервисной архитектуры?",
    "answer": "Преимущества: независимый деплой, изоляция сбоев, масштабирование узких мест, автономность команд. Недостатки: сетевые задержки, сложность поддержки консистентности данных (распределенные транзакции), тяжелый мониторинг и логирование."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 8,
    "question": "Какие есть способы декомпозиции на микросервисы? По каким принципам выделяются микросервисы? Какие используешь?",
    "answer": "1. Декомпозиция по бизнес-способностям (Business Capability) на основе структуры компании. 2. Декомпозиция по поддоменам (DDD) на основе ограниченных контекстов (Bounded Context) — основной способ, который я использую на практике."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 9,
    "question": "Какие паттерны микросервисной архитектуры знаешь?",
    "answer": "Знаю API Gateway (единая точка входа), BFF (бэкенд под конкретный тип фронта), Circuit Breaker (предохранитель сбоев), CQRS (разделение чтения и записи), Saga (распределенные транзакции), Service Discovery (поиск адресов сервисов)."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 10,
    "question": "Чем отличается SOA от микросервисной архитектуры (MSA)?",
    "answer": "SOA интегрирует крупные разнородные приложения компании через централизованную 'умную' шину данных (ESB) с общей БД. MSA строит продукт из мелких автономных сервисов, использующих 'глупые каналы' связи (REST/Kafka) и строго изолированные БД."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 11,
    "question": "Расскажи про токен-авторизацию в микросервисах.",
    "answer": "Используется Stateless JWT. Сервис авторизации выдает клиенту подписанный токен. При запросах клиент шлет его в заголовке Bearer. Микросервисы или API Gateway проверяют криптографическую подпись токена локально, не делая запросов в БД или сервис авторизации, что ускоряет систему."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 12,
    "question": "Что такое Хореография? Для чего используют? Плюсы и минусы.",
    "answer": "Хореография — координация распределенной саги без центрального контроллера. Сервисы сами слушают события в брокере и реагируют на них. Плюсы: нет единой точки отказа, слабая связанность. Минусы: сложно отслеживать сквозной статус длинной цепочки процессов."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 13,
    "question": "Что такое Оркестрация? Для чего используют? Плюсы и минусы.",
    "answer": "Оркестрация — координация саги через выделенный сервис-оркестратор, который явно шлет команды участникам и ждет ответы. Плюсы: логика процесса в одном месте, легко мониторить шаги и делать откаты. Минусы: оркестратор становится единой точкой отказа."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 14,
    "question": "Что такое API Gateway? Для чего используется?",
    "answer": "API Gateway — шлюз, единая точка входа для внешних клиентов. Используется для маршрутизации запросов к внутренним микросервисам, аутентификации, логирования, SSL-терминации и Rate Limiting (ограничения частоты запросов)."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 15,
    "question": "Что такое балансировщик? Для чего используется?",
    "answer": "Балансировщик нагрузки (Nginx, HAProxy) — ПО, распределяющее входящий сетевой трафик между несколькими параллельными инстансами одного сервиса для обеспечения отказоустойчивости и горизонтального масштабирования."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 16,
    "question": "Для чего используется шина данных?",
    "answer": "Шина (ESB) используется для централизованной интеграции множества систем, трансляции различных протоколов, трансформации форматов сообщений на лету и оркестрации сквозных бизнес-процессов."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 17,
    "question": "Что такое BFF (Backend For Frontend)?",
    "answer": "Паттерн создания отдельных облегченных бэкенд-слоев под конкретные типы интерфейсов (один под Web, отдельный под Mobile), которые агрегируют данные из микросервисов и отдают их в оптимальном для данного экрана виде."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 18,
    "question": "Назови все способы снизить нагрузку на веб-сервис.",
    "answer": "1. Внедрить кэширование (Redis, CDN). 2. Использовать асинхронность через брокеры сообщений. 3. Горизонтальное масштабирование (добавить инстансы). 4. Оптимизация SQL и индексов. 5. Внедрение паттерна CQRS (Read-реплики). 6. Настройка Rate Limiting."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 19,
    "question": "Что такое Event Sourcing?",
    "answer": "Архитектурный паттерн, при котором состояние сущности не перезаписывается, а хранится как неизменяемый лог всех произошедших с ней событий (например, история транзакций счета). Текущее состояние вычисляется последовательным воспроизведением всех событий с начала."
  },
  {
    "block": "Блок 4. Архитектура",
    "section": "Архитектурные концепции",
    "id": 20,
    "question": "Что такое DDD (Domain-Driven Design)?",
    "answer": "Проектирование на основе предметной области — подход, адаптирующий архитектуру кода под бизнес-логику. Ключевые паттерны для аналитика: Единый язык (Ubiquitous Language) и Ограниченный контекст (Bounded Context) для правильного выделения границ микросервисов."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 1,
    "question": "Что такое БД? Для чего она нужна и кому?",
    "answer": "База данных — структурированная система персистентного хранения информации на цифровых носителях. Нужна приложениям для сохранения состояния данных, а бизнесу и аналитикам — для поиска, фильтрации и построения отчетности."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 2,
    "question": "Что такое СУБД?",
    "answer": "СУБД (Система управления базами данных) — комплекс ПО для создания баз данных, обеспечения доступа к ним, администрирования, поддержки целостности и выполнения запросов (например, PostgreSQL, MongoDB)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 3,
    "question": "Какие есть виды/типы БД? С какими работал на практике?",
    "answer": "1. Реляционные (SQL): таблицы и связи (PostgreSQL, Oracle). 2. Нереляционные (NoSQL): документо-ориентированные (MongoDB), ключ-значение (Redis), колоночные (ClickHouse), графовые (Neo4j). На практике работал с PostgreSQL и Redis."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 4,
    "question": "Почему реляционные БД называют реляционными?",
    "answer": "Название происходит от 'relation' (отношение), так как реляционная модель основана на математической теории отношений, где отношением является обычная двумерная таблица, а связи строятся по ключевым полям."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 5,
    "question": "В чём отличие реляционных и нереляционных БД? В каком виде хранятся данные в той или иной СУБД?",
    "answer": "Реляционные имеют жесткую схему (строки и столбцы в таблицах) и гарантируют ACID. Нереляционные схемы не имеют (Schema-on-Read), данные хранятся в виде JSON-документов (Mongo), графов или быстрых хэшей в памяти (Redis), легко масштабируясь горизонтально."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 6,
    "question": "Какие задачи решаются с помощью нереляционных СУБД?",
    "answer": "Хранение неструктурированных каталогов товаров с динамическими атрибутами, высокоскоростное кэширование данных сессий в RAM, сбор огромных потоков логов и метрик, а также хранение гибких профилей пользователей."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 7,
    "question": "Какие свойства у реляционных баз данных?",
    "answer": "Строгая типизация данных в колонках, поддержка уникальности, наличие связей через внешние ключи (ссылочная целостность), поддержка языка SQL и полное соответствие транзакционным принципам ACID."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 8,
    "question": "Какие виды связей между таблицами существуют в реляционных БД? Какие у них особенности?",
    "answer": "1. Один к одному (1:1): одной строке в А соответствует одна строка в Б (Пользователь - Паспорт). 2. Один ко многим (1:M): одной строке в А соответствует много строк в Б (Клиент - Заказы), FK вешается на таблицу 'многих'. 3. Многие ко многим (M:M): много строк из А связаны со многими из Б."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 9,
    "question": "Каким образом осуществляется связь «многие ко многим»?",
    "answer": "Связь M:M в реляционных БД реализуется исключительно через введение третьей, промежуточной (связующей) таблицы, которая содержит композитный ключ из двух Foreign Key, ссылающихся на первичные ключи обеих базовых таблиц."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 10,
    "question": "Какие констрейнты (ограничения) знаешь?",
    "answer": "PRIMARY KEY (уникальность + NOT NULL), FOREIGN KEY (ссылочная целостность), UNIQUE (запрет дубликатов), NOT NULL (запрет пустых значений), CHECK (логическая проверка условия, например, цена > 0), DEFAULT (подстановка значения по умолчанию)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 11,
    "question": "Что такое первичный ключ (PK) и какими свойствами обладает? Что такое внешний ключ (FK)? Чем PK отличается от FK?",
    "answer": "Primary Key (PK) — уникальный маркер строки в таблице (не NULL, единственный в таблице). Foreign Key (FK) — колонка, ссылающаяся на PK чужой таблицы для связи. Отличие: PK идентифицирует текущую таблицу, а FK связывает ее со смежной."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 12,
    "question": "Что такое нормализация БД?",
    "answer": "Процесс пошаговой реструктуризации таблиц базы данных путем их декомпозиции с целью ликвидации дублирования данных и исключения аномалий добавления, изменения и удаления информации."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 13,
    "question": "Назови первые три нормальные формы.",
    "answer": "1НФ: все атрибуты атомарны, строки уникальны. 2НФ: находится в 1НФ + каждый неключевой атрибут функционально полно зависит от всего первичного ключа. 3НФ: находится в 2НФ + отсутствуют транзитивные зависимости (неключевые поля зависят только от PK)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 14,
    "question": "Что такое денормализация и когда её использовать?",
    "answer": "Денормализация — намеренное внесение избыточности (дублирование колонок, слияние таблиц). Используется в аналитических БД (DWH) или на Highload-чтение для ускорения SELECT-запросов, избавляя СУБД от тяжелых JOIN-ов."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 15,
    "question": "Что такое транзакция?",
    "answer": "Транзакция — логическая единица работы с данными, представляющая собой неделимую последовательность SQL-операций, которая должна быть выполнена целиком (COMMIT) либо не выполнена вовсе (ROLLBACK)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 16,
    "question": "Что такое требования ACID? Какими свойствами должна обладать транзакция?",
    "answer": "A — Atomicity (Атомарность: всё или ничего). C — Consistency (Согласованность: сохранение валидности правил БД). I — Isolation (Изолированность: параллельные транзакции не видят данные друг друга до коммита). D — Durability (Долговечность: фиксация на диске после коммита)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 17,
    "question": "Что такое «грязное чтение» в БД?",
    "answer": "Dirty Read — феномен, когда Транзакция А считывает промежуточные измененные данные Транзакции Б, которая еще не закоммитилась. Если Транзакция Б сделает ROLLBACK, данные А окажутся неверными."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 18,
    "question": "Зачем нужны индексы в таблицах БД? Встречал ли на практике?",
    "answer": "Индексы (B-Tree) — структуры данных для кардинального ускорения поиска строк (SELECT). Без них СУБД делает Full Scan (читает весь диск). Минус индексов: они замедляют запись (INSERT/UPDATE), так как дерево индекса нужно перестраивать."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 19,
    "question": "Какие способы оптимизации БД можешь назвать?",
    "answer": "Индексация полей фильтрации, оптимизация SQL-кода (избегать SELECT *), денормализация, кэширование тяжелых запросов в Redis, репликация (чтение со Slave), партиционирование и шардирование таблиц."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 20,
    "question": "Что такое маппинг данных?",
    "answer": "Процесс установления логического соответствия между полями данных из разных структур (например, маппинг полей входящего JSON-сообщения на колонки таблицы в реляционной БД)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 21,
    "question": "Как происходит процесс проектирования БД? Какие уровни абстракции/проектирования знаешь? В чём отличия?",
    "answer": "Проектирование идет по 3 уровням. 1. Концептуальный: бизнес-сущности без привязки к ИТ (блок-схема). 2. Логический: таблицы, поля, типы данных, связи, ключи (без привязки к конкретному софту). 3. Физический: реализация логической схемы под синтаксис конкретной СУБД (PostgreSQL) с индексами и партициями."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 22,
    "question": "Какие бывают представления (Views) в БД?",
    "answer": "Представление (Вьюха) — виртуальная таблица, являющаяся сохраненным SQL-запросом. Обычная View не хранит данные на диске и перезапускает запрос при вызове. Материализованная (Materialized View) сохраняет результат на диск, требуя принудительного обновления."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 23,
    "question": "What is replication / Что такое реплицирование?",
    "answer": "Репликация — копирование данных с основного сервера (Master) на вспомогательные (Slaves). Нужна для отказоустойчивости и распределения нагрузки чтения (запись идет на Master, чтение SELECT — со Slaves)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 24,
    "question": "Что такое партиционирование и по какому принципу оно реализовывается?",
    "answer": "Партиционирование — физическое разделение одной огромной таблицы внутри одной СУБД на секции по определенному ключу (Range по датам, List по регионам, Hash). Для пользователя таблица остается единым объектом."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 25,
    "question": "Что такое шардирование?",
    "answer": "Шардирование — горизонтальное масштабирование, при котором строки одной таблицы разделяются по определенному алгоритму (ключу шардирования) и физически раскладываются по разным серверам БД (нодам) на разных машинах."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 26,
    "question": "Чем отличается реплицирование и шардирование? Какие способы масштабирования БД знаешь?",
    "answer": "При репликации все серверы хранят полные идентичные копии БД. При шардировании на разных серверах лежат разные куски (шарды) одной таблицы. Способы масштабирования: Вертикальное (железо), Горизонтальное (Репликация, Шардирование, Партиционирование)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.1. Базы данных",
    "id": 27,
    "question": "Что такое CAP-теорема? Как сделать систему консистентной, доступной и устойчивой к разделению?",
    "answer": "Теорема, утверждающая, что распределенная система может одновременно обладать только 2 из 3 свойств: Consistency (консистентность), Availability (доступность), Partition Tolerance (устойчивость к распаду сети). Поскольку сеть падает всегда (P), архитектор выбирает между CP (строгие данные, но временный отказ в доступе) или AP (доступность с отложенной синхронизацией)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 28,
    "question": "Какие знаешь команды/виды команд SQL? Насколько сложные запросы пишешь?",
    "answer": "Группы: DDL (CREATE, ALTER), DML (SELECT, INSERT, UPDATE, DELETE), DCL (GRANT), TCL (COMMIT). Пишу сложные аналитические запросы: использую фильтры, GROUP BY, HAVING, подзапросы, любые виды JOIN, конструкции CTE (WITH) и оконные функции (ROW_NUMBER, SUM OVER)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 29,
    "question": "Для чего нужен оператор LIKE?",
    "answer": "LIKE используется для фильтрации текстовых полей по маске (шаблону) в блоке WHERE. Поддерживает спецсимволы '%' (любая строка) и '_' (один любой символ). Пример: LIKE 'Алекс%'."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 30,
    "question": "Для чего нужен GROUP BY?",
    "answer": "GROUP BY используется для группировки строк с одинаковыми значениями в указанных колонках, чтобы применить к ним агрегатные функции: COUNT(), SUM(), AVG(), MIN(), MAX()."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 31,
    "question": "Для чего используется HAVING в SQL? Чем HAVING отличается от WHERE?",
    "answer": "HAVING фильтрует данные по результатам агрегатных функций после группировки (HAVING SUM(price) > 100). WHERE выполняет фильтрацию исходных строк до этапа группировки и не может содержать агрегатные функции."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 32,
    "question": "Чем TRUNCATE отличается от DELETE?",
    "answer": "DELETE — это DML-команда, удаляет строки построчно (можно с WHERE), пишет каждую строку в лог транзакций (работает медленнее, но можно откатить). TRUNCATE — DDL-команда, мгновенно очищает всю таблицу на уровне страниц диска, не поддерживает WHERE, сбрасывает счетчики ID."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 33,
    "question": "Чем отличается UNION от UNION ALL? Чем JOIN отличается от UNION?",
    "answer": "UNION ALL соединяет результаты двух запросов по вертикали со всеми дубликатами. UNION делает то же самое, но удаляет дубликаты (вызывает сортировку). JOIN склеивает таблицы по горизонтали (пришивает колонки по ключу), а UNION — по вертикали (добавляет строки)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 34,
    "question": "Что такое JOIN-запросы и какие они бывают?",
    "answer": "JOIN — оператор объединения таблиц по совпадающим колонкам-связям. Бывают: INNER JOIN (только совпадения), LEFT JOIN (всё из левой + совпадения из правой), RIGHT JOIN (всё из правой), FULL JOIN (все строки обеих таблиц), CROSS JOIN (декартово произведение строк)."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 35,
    "question": "Чем INNER JOIN отличается от LEFT JOIN? Чем LEFT JOIN отличается от FULL JOIN?",
    "answer": "INNER JOIN отсекает строки, если для них нет пары в другой таблице. LEFT JOIN сохраняет все строки левой таблицы, подставляя NULL при отсутствии пар справа. FULL JOIN выводит абсолютно все строки обеих таблиц, склеивая их по ключу и заполняя пустоты NULL."
  },
  {
    "block": "Блок 5. Базы данных и SQL",
    "section": "5.2. SQL",
    "id": 36,
    "question": "Назови все способы в SQL выбрать данные из первой таблицы, которых нет во второй (NOT IN, NOT EXISTS и др.).",
    "answer": "1. LEFT JOIN с фильтром WHERE table2.id IS NULL. 2. Использование подзапроса: WHERE id NOT IN (SELECT t1_id FROM table2). 3. Коррелированный подзапрос: WHERE NOT EXISTS (SELECT 1 FROM table2 WHERE table2.t1_id = table1.id). 4. Оператор EXCEPT/MINUS."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 1,
    "question": "Из каких этапов состоит разработка программного обеспечения?",
    "answer": "Этапы SDLC: 1. Сбор и анализ требований. 2. Проектирование архитектуры и системный дизайн. 3. Разработка (кодинг). 4. Тестирование (QA). 5. Внедрение и деплой на прод. 6. Поддержка и сопровождение."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 2,
    "question": "Какие методологии разработки знаешь? По какой методологии работаешь или работал? Какая нравится больше?",
    "answer": "Waterfall (Водопад) и Agile (Scrum, Kanban). Работал по Scrum. Больше нравится Scrum, так как итеративный подход позволяет быстро поставлять ценность инкрементами каждые 2 недели и оперативно реагировать на изменения требований бизнеса."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 3,
    "question": "Какие особенности у водопадной модели? Чем Agile отличается от водопадной модели? ",
    "answer": "Waterfall — линейная модель, где каждый этап строго следует за другим, ТЗ пишется один раз на весь проект, а тесты идут в конце. Изменения стоят дорого. Agile — гибкий итеративный подход, где требования меняются на лету, а рабочий продукт поставляется мелкими частями."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 4,
    "question": "Что такое Scrum? Какие мероприятия (события) существуют в Scrum?",
    "answer": "Scrum — гибкий фреймворк Agile, делящий разработку на Спринты. Мероприятия: Планирование спринта (Sprint Planning), Ежедневный Scrum (Daily Standup), Обзор спринта/Демо (Sprint Review), Ретроспектива (Sprint Retrospective) и сам Спринт."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 5,
    "question": "Где можно применять Scrum и где нельзя?",
    "answer": "Scrum эффективен в коммерческих продуктах, стартапах и сложных проектах с неопределенными, часто меняющимися требованиями. Нельзя применять в госзаказах с фиксированной ценой/сроками (Fixed Price) или сферах с критической ценой ошибки (космос, медицина, строительство)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 6,
    "question": "Что такое Kanban? Какие 3 основных правила в Kanban?",
    "answer": "Kanban — метод управления процессами, нацеленный на непрерывный поток задач. Правила: 1. Визуализировать поток работ (доска задач). 2. Ограничивать незавершенную работу (WIP Limits на этапах). 3. Управлять и оптимизировать время прохождения задачи (Lead Time)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 7,
    "question": "В чём различия Kanban и Scrum?",
    "answer": "В Scrum есть жесткие роли, фиксированные спринты, обязательные встречи и коммит на объем задач в спринте. В Kanban спринтов нет (поток непрерывен), роли опциональны, оценки необязательны, а фокус направлен на ограничение лимита задач в работе (WIP)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 8,
    "question": "Из кого состоит IT-команда?",
    "answer": "Состоит из Product Owner, Системного/Бизнес-аналитика, Архитектора, Разработчиков (Frontend, Backend), Тестировщиков (QA), DevOps-инженера и Scrum-мастера."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 9,
    "question": "Какова роль аналитика на проекте? Чем должен заниматься системный аналитик? Какие у него обязанности?",
    "answer": "Системный аналитик выступает мостом между бизнесом и разработкой. Обязанности: сбор бизнес-требований, трансформация их в технические спецификации, проектирование интеграций (API, очереди), структур БД и написание ТЗ (User Stories) для разработчиков."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 10,
    "question": "Чем отличаются бизнес и системный аналитик?",
    "answer": "Бизнес-аналитик (БА) работает с бизнес-процессами компании, оптимизирует регламенты и описывает логику верхнеуровнево (BPMN). Системный аналитик (СА) переводит эти процессы на ИТ-язык: проектирует контракты API, таблицы баз данных, схемы микросервисов."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 11,
    "question": "На каких этапах разработки аналитик является основным игроком и на каких его участие опционально?",
    "answer": "Основной игрок: сбор требований, анализ, проектирование и написание ТЗ. Опциональный (в роли эксперта/консультанта): этапы кодинга и тестирования, где он отвечает на возникающие вопросы разработчиков и QA."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 12,
    "question": "Как аналитик взаимодействует с тестировщиками?",
    "answer": "Передает им требования для предварительного анализа и выявления логических дыр. СА валидирует тест-кейсы, написанные QA, а в процессе тестирования помогает разбирать сложные дефекты (определяет, баг это или фича по ТЗ)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 13,
    "question": "Как проводится декомпозиция и оценка задач? Какие виды оценки чаще всего применяются? Какие используешь сам?",
    "answer": "Декомпозиция — разбиение крупных фич на понятные задачи длительностью 1-3 дня. Виды оценки: в часах/днях или Story Points (по Фибоначчи). На проекте используем оценку в Story Points через Planning Poker (коллективное обсуждение сложности)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 14,
    "question": "В чём разница между оценкой в часах и стори-поинтах?",
    "answer": "Оценка в часах привязана к конкретному исполнителю и субъективна (мидл кодит быстрее джуна). Story Points оценивают чистую сложность, объем и риски задачи относительно эталона, оставаясь одинаковыми для всей команды."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 15,
    "question": "Как аналитик оценивает сроки реализации задачи?",
    "answer": "Аналитик не оценивает сроки написания кода разработчиками. Он оценивает исключительно свои трудозатраты на этап системного анализа, а также помогает разработчикам декомпозировать сложную задачу для более точной технической оценки."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 16,
    "question": "Что такое DoR, DoD, AC?",
    "answer": "DoR (Definition of Ready) — критерий готовности задачи к разработке (требования ясны, контракт готов). DoD (Definition of Done) — критерий завершенности задачи (код написан, ревью пройдено, тесты зеленые). AC (Acceptance Criteria) — конкретные бизнес-условия приемки фичи."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 17,
    "question": "Кто такой хороший аналитик по твоему мнению? Кто такой плохой аналитик?",
    "answer": "Хороший: имеет сильные софт-скиллы, решает реальную проблему бизнеса, а не пишет под диктовку, продумывает негативные сценарии, технически грамотен. Плохой: пишет двусмысленные ТЗ с 'водой', избегает команды, не думает об ошибках систем."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.1. Методологии и роль аналитика",
    "id": 18,
    "question": "В чём отличие джуна от сеньора?",
    "answer": "Джуниор выполняет локальные, четко описанные задачи под контролем ментора. Сеньор полностью автономен: он берет размытую проблему бизнеса, сам собирает требования, проектирует архитектуру изменений, управляет рисками и доводит фичу до прода."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 19,
    "question": "Что такое протокол? Какие протоколы знаешь? Какие уровни протоколов знаешь (модель OSI)?",
    "answer": "Протокол — стандарт правил обмена данными в сети (HTTP, TCP, DNS). Модель OSI (7 уровней): 1. Физический (кабели). 2. Канальный (MAC, фреймы). 3. Сетевой (IP, пакеты). 4. Транспортный (TCP/UDP, порты). 5. Сеансовый. 6. Представления (JSON/шифрование). 7. Прикладной (HTTP, FTP)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 20,
    "question": "Чем отличается HTTP от HTTPS? Как работает HTTPS?",
    "answer": "HTTP передает данные открытым текстом. HTTPS шифрует трафик с помощью TLS/SSL. При подключении сервер присылает SSL-сертификат, клиент проверяет его подлинность, стороны генерируют общий сессионный ключ шифрования, защищая данные от перехвата."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 21,
    "question": "Что происходит, когда ты переходишь по URL (открываешь страницу в браузере)? Как находится нужный сервер? Почему ответ возвращается именно к тебе?",
    "answer": "Браузер запрашивает IP-адрес домена у DNS. Получив IP, браузер открывает TCP-соединение с сервером по порту 443 и шлет HTTP-запрос. Пакеты идут через маршрутизаторы. В каждом пакете указан IP-адрес получателя и ваш IP-адрес отправителя, поэтому сервер знает, куда вернуть ответ."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 22,
    "question": "Что такое шифрование данных? Какие виды бывают?",
    "answer": "Криптографическое скрытие данных. Виды: Симметричное — используется один и тот же секретный ключ для шифрования и дешифрования (AES, работает быстро). Асимметричное — используется пара ключей: Публичный (только шифрует) и Приватный (только расшифровывает, пример: RSA)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 23,
    "question": "Чем отличаются идентификация, аутентификация и авторизация?",
    "answer": "Идентификация — распознавание по логину (Я — 'user1'). Аутентификация — проверка подлинности по паролю/СМС (Докажи, что ты 'user1'). Авторизация — проверка прав доступа вошедшего юзера на действие (Имеет ли право 'user1' удалить этот файл?)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 24,
    "question": "Какие виды/методы аутентификации знаешь?",
    "answer": "Базовая (Basic Auth: логин/пароль в Base64 заголовка), Токены (Bearer JWT), Двухфакторная (2FA: пароль + СМС/OTP), Биометрия (FaceID), Сертификаты (mTLS)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 25,
    "question": "Что такое токен? Как он устроен?",
    "answer": "Токен — цифровая строка-паспорт юзера. Популярный JWT состоит из 3 частей через точку: Header (алгоритм), Payload (данные юзера, роли, срок действия токена) и Signature (криптографическая подпись сервера, гарантирующая неизменяемость токена)."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 26,
    "question": "Что такое Bearer Authentication? Как она работает?",
    "answer": "Схема авторизации предъявителя токена. Клиент выполняет логин, получает токен и прикладывает его в каждый HTTP-заголовок в формате 'Authorization: Bearer <token_string>'. Сервер валидирует этот токен при каждом запросе."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 27,
    "question": "Что такое OAuth-аутентификация (OAuth 2.0)? Когда применяется и как устроен поток?",
    "answer": "Протокол делегирования прав ('Войти через Google'). Поток (Auth Code Flow): сайт редиректит юзера в Google -> юзер подтверждает доступ -> Google возвращает юзера на сайт с временным кодом -> бэк сайта меняет этот код у Google на Access Token и безопасно читает профиль юзера."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.2. Сеть, протоколы, безопасность",
    "id": 28,
    "question": "Что такое хеш и для чего он нужен?",
    "answer": "Необратимое математическое преобразование данных в строку фиксированной длины. Изменить обратно нельзя. Используется для безопасного хранения паролей в БД (хранятся только хеши) и проверки целостности файлов (MD5, SHA-256)."
  },

    "question": "Что такое frontend and backend? В чём их отличия?",
    "answer": "Frontend — клиентская визуальная часть (браузер, приложение), написанная на JS/React, отвечающая за отображение. Backend — серверная скрытая часть (Java/Go/Python), реализующая бизнес-логику, расчеты и взаимодействие с БД."
  },
  {
    "block": "Блок 6. Остальное",
    "section": "6.3. Общие концепции",
    "id": 30,
    "question": "Что такое UI? Что такое UX? В чём отличие UI от UX?",
    "answer": "UI (User Interface) — то, как интерфейс выглядит (цвета, кнопки, шрифты). UX (User Experience) — то, как пользователь взаимодействует с системой, насколько она логична, удобна и за сколько кликов решается задача. UI — красота, UX — удобство."
  },

  {

    "question": "Что такое регресс (регрессионное тестирование)?",
    "answer": "Тестирование, проверяющее, что после добавления новых фич или багфиксов старый, ранее стабильно работающий функционал системы не сломался и продолжает функционировать корректно."

        let flashcards = [...originalCards];
        let currentIndex = 0;
        let isStressMode = false;
        let currentFilter = 'all';
        let searchQuery = '';

        const cardElement = document.getElementById('card');
        const questionElement = document.getElementById('question-text');
        const answerElement = document.getElementById('answer-text');
        const progressElement = document.getElementById('progress');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stressBtn = document.getElementById('stress-btn');
        const notesTextarea = document.getElementById('card-notes');
        const searchBar = document.getElementById('search-bar');

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-btn').textContent = "☀️ Светлая";
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('theme-btn').textContent = "🌙 Темная";
            }
        }

        function toggleTheme() {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                document.getElementById('theme-btn').textContent = "🌙 Темная";
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-btn').textContent = "☀️ Светлая";
            }
        }

        function applyFilterAndOrder() {
            let filtered = [...originalCards];

            // 1. Фильтр по категории / избранному
            if (currentFilter === 'favorites') {
                filtered = filtered.filter(c => localStorage.getItem(`fav_${c.id}`) === 'true');
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(c => c.category === currentFilter);
            }

            // 2. Фильтр по строке поиска
            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(c => c.question.toLowerCase().includes(q) || c.answer.toLowerCase().includes(q));
            }

            // 3. Стресс-тест (Рандом)
            if (isStressMode) {
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
            }

            flashcards = filtered;
            currentIndex = 0;
            updateCard();
        }

        function filterCategory(category, element) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentFilter = category;
            applyFilterAndOrder();
        }

        function handleSearch() {
            searchQuery = searchBar.value;
            applyFilterAndOrder();
        }

        function toggleStressMode() {
            isStressMode = !isStressMode;
            if (isStressMode) {
                stressBtn.classList.add('active');
            } else {
                stressBtn.classList.remove('active');
            }
            applyFilterAndOrder();
        }

        function updateCard() {
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                if (flashcards.length === 0) {
                    questionElement.innerHTML = "Ничего не найдено по вашему запросу";
                    answerElement.innerHTML = "<h3>Пусто</h3>";
                    progressElement.textContent = `Карточек: 0`;
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    notesTextarea.value = "";
                    document.getElementById('fav-icon-front').style.display = 'none';
                    document.getElementById('fav-icon-back').style.display = 'none';
                    return;
                }

                document.getElementById('fav-icon-front').style.display = 'block';
                document.getElementById('fav-icon-back').style.display = 'block';

                questionElement.innerHTML = flashcards[currentIndex].question;
                answerElement.innerHTML = flashcards[currentIndex].answer;
                progressElement.textContent = `Карточка ${currentIndex + 1} из ${flashcards.length}`;
                
                // Заметки
                const currentCardId = flashcards[currentIndex].id;
                const savedNote = localStorage.getItem(`note_${currentCardId}`);
                notesTextarea.value = savedNote ? savedNote : "";

                // Звёздочки избранного
                const isFav = localStorage.getItem(`fav_${currentCardId}`) === 'true';
                const favFront = document.getElementById('fav-icon-front');
                const favBack = document.getElementById('fav-icon-back');
                
                if (isFav) {
                    favFront.classList.add('is-fav');
                    favBack.classList.add('is-fav');
                    favFront.innerHTML = '★';
                    favBack.innerHTML = '★';
                } else {
                    favFront.classList.remove('is-fav');
                    favBack.classList.remove('is-fav');
                    favFront.innerHTML = '☆';
                    favBack.innerHTML = '☆';
                }

                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === flashcards.length - 1);
                
                document.getElementById('answer-text').scrollTop = 0;
            }, 150);
        }

        function flipCard() {
            if (flashcards.length > 0) {
                cardElement.classList.toggle('flipped');
            }
        }

        function preventFlip(event) {
            event.stopPropagation();
        }

        function toggleFavorite(event) {
            event.stopPropagation(); // Чтобы карточка не переворачивалась при клике на звезду
            if (flashcards.length === 0) return;

            const currentCardId = flashcards[currentIndex].id;
            const isFav = localStorage.getItem(`fav_${currentCardId}`) === 'true';
            
            localStorage.setItem(`fav_${currentCardId}`, !isFav);
            updateCard();

            // Если мы находимся в табе избранного и убрали звезду, нужно обновить список
            if (currentFilter === 'favorites') {
                setTimeout(() => { applyFilterAndOrder(); }, 300);
            }
        }

        function saveNote() {
            if (flashcards.length === 0) return;
            const currentCardId = flashcards[currentIndex].id;
            const noteText = notesTextarea.value;
            localStorage.setItem(`note_${currentCardId}`, noteText);
            alert("Заметка сохранена!");
        }

        function nextCard(event) {
            if (event) event.stopPropagation(); 
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard(event) {
            if (event) event.stopPropagation(); 
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // ОБРАБОТКА ГОРЯЧИХ КЛАВИШ
        window.addEventListener('keydown', function(event) {
            // Если фокус в инпуте поиска или заметок — горячие клавиши не должны срабатывать
            if (document.activeElement === searchBar || document.activeElement === notesTextarea) {
                return;
            }

            if (event.code === 'Space') {
                event.preventDefault(); // Предотвращаем скролл страницы пробелом
                flipCard();
            } else if (event.key === 'ArrowRight') {
                nextCard();
            } else if (event.key === 'ArrowLeft') {
                prevCard();
            } else if (event.key === 's' || event.key === 'ы' || event.key === 'S' || event.key === 'Ы') {
                toggleStressMode();
            } else if (event.key === 'f' || event.key === 'а' || event.key === 'F' || event.key === 'А') {
                toggleFavorite(event);
            }
        });

        initTheme();
        updateCard();
    </script>
