    question: "Какая разница между шиной и очередью? Чем брокер сообщений отличается от корпоративной шины?",
    answer: "<p>Разница лежит на уровне **интеллектуальности и ответственности** систем:</p><ul><li><b>Брокер сообщений (очередь):</b> Это «глупая труба» (Dumb Pipe). Его главная задача — максимально быстро, надежно и производительно принять байты от продюсера и отдать их консьюмеру. Брокер не знает, что лежит внутри сообщения, не умеет менять его структуру и не занимается трансформацией форматов. Он просто гарантирует доставку.</li><li><b>Корпоративная шина (ESB):</b> Это «умный центр» (Smart Hub). Шина обладает развитой внутренней бизнес-логикой. Она умеет парсить сообщения, преобразовывать форматы (XML в JSON), обогащать данные (сходить в сторонний справочник за доп. полями), разруливать сложные композитные сценарии. <br><i>Примечание:</i> Технически ESB внутри себя очень часто использует брокер сообщений или очереди как транспортный уровень.</li></ul>"
},
{
    id: "int56",
    category: "architecture",
    question: "Чем корпоративная шина отличается от ETL-инструмента? Что такое концепции ETL и ELT?",
    answer: "<p>Разница заключается в **режиме обработки данных и их целях**:</p><ul><li><b>ESB (Шина):</b> Работает в режиме **Real-time / Near Real-time**. Обрабатывает транзакционный поток отдельных сообщений прямо здесь и сейчас для обеспечения оперативного взаимодействия систем.</li><li><b>ETL (Extract, Transform, Load):</b> Работает в режиме **Батчинга (Batching / Пакетная обработка)**. Используется для аналитики и построения Хранилищ Данных (DWH). Раз в сутки ETL-инструмент выкачивает терабайты данных из рабочих БД, трансформирует их и заливает в аналитическую базу.</li></ul><p><b>Концепции ETL vs ELT:</b></p><ul><li><b>ETL (Extract -> Transform -> Load):</b> Данные извлекаются из источника, попадают на промежуточный тяжелый ETL-сервер (например, Informatica, Airflow), там очищаются, пересобираются под аналитические схемы и только потом загружаются в финальное DWH.</li><li><b>ELT (Extract -> Load -> Transform):</b> Современный подход, ставший популярным с приходом мощных облачных MPP-баз (Greenplum, ClickHouse, Snowflake). Данные извлекаются и **сырыми «как есть» сразу заливаются** в конечное хранилище. И уже силами самой СУБД (через SQL-скрипты внутри DWH) происходит их трансформация. Это значительно быстрее, так как убирает лишнее звено копирования.</li></ul>"
},
{
    id: "int57",
    category: "architecture",
    question: "К корпоративной шине подключены веб-сервисы. В одном веб-сервисе появились два новых обязательных поля. Что изменится в интеграции?",
    answer: "<p>Это классический сценарий нарушения **обратной совместимости (Breaking Change)**. Появление именно **обязательных** (mandatory) полей полностью ломает существующий контракт. Вот что произойдет и как это нужно решать:</p><p><b>Последствия без подготовки:</b></p><ul><li>Все существующие клиенты шины, которые вызывают этот веб-сервис через старые контракты, не знают про новые поля и пришлют запросы без них.</li><li>Веб-сервис-приемник или сама шина на этапе валидации (по XSD/JSON схеме) выбросит ошибку <code>400 Bad Request</code> или SOAP Fault, так как обязательное условие контракта нарушено. Интеграция упадет на проде для 100% старых клиентов.</li></ul><p><b>Архитектурные пути решения проблемы:</b></p><ul><li><b>Вариант 1 (Идеальный):</b> Изменить требования и сделать эти поля **необязательными** на уровне бэкенда, проставив им дефолтные значения (Default values). Тогда старые клиенты продолжат работать без изменений.</li><li><b>Вариант 2 (Версионирование):</b> Опубликовать новую мажорную версию веб-сервиса (например, <code>v2</code>) с новыми обязательными полями. Старых клиентов оставить на <code>v1</code>, а новых подключать к <code>v2</code>.</li><li><b>Вариант 3 (Трансформация на шине):</b> Если клиентов обновить нельзя, на самой ESB пишется логика-заглушка: шина перехватывает старые запросы, автоматически генерирует и «подмешивает» в XML/JSON дефолтные значения для этих двух обязательных полей, после чего передает корректный запрос обновленному веб-сервису.</li></ul>"
},
{    id: "int58",
    category: "architecture",
    question: "Что такое webhook (callback)? Когда его применять? Какие плюсы и минусы?",
    answer: "<p><b>Webhook (HTTP-callback)</b> — это способ уведомления одной системы о событиях в другой по инициативе сервера (событийно-ориентированный подход). Вместо того чтобы клиент постоянно опрашивал сервер (Polling) на предмет изменений, клиент один раз регистрирует свой URL-эндпоинт на стороне сервера, и сервер сам выполняет HTTP POST запрос на этот URL, как только происходит целевое событие.</p><p><b>Когда применять:</b> Интеграция с платежными шлюзами (уведомление о том, что пользователь успешно оплатил счет через СБП/Stripe), обработка статусов доставки в CRM от курьерских служб, алерты от систем мониторинга (Prometheus -> Slack) или триггеры в CI/CD (GitHub Webhooks при пуше в ветку).</p><p><b>Плюсы:</b></p><ul><li><b>Эффективность утилизации ресурсов:</b> Нет холостых запросов, сеть и CPU не нагружаются бессмысленным опросом.</li><li><b>Мгновенная реакция (Real-time):</b> Клиент узнает о событии в ту же секунду, когда оно произошло на сервере.</li><li><b>Простота реализации:</b> Со стороны клиента это обычный REST-контроллер, принимающий POST.</li></ul><p><b>Минусы и Senior-нюансы:</b></p><ul><li><b>Проблема доступности клиента:</b> Если клиент «прилег», сервер может потерять уведомление. Требуется обязательное проектирование механизма повторов (Retry Policy с экспоненциальной задержкой) на стороне сервера.</li><li><b>Безопасность:</b> Эндпоинт клиента открыт во внешний мир. Необходимо валидировать входящие запросы с помощью проверки подписи в заголовках (например, HMAC-SHA256 по секретному ключу, как это сделано в API GitHub или Stripe).</li><li><b>Проблема дубликатов:</b> Из-за сетевых сбоев и ретраев запрос может прийти дважды. Эндпоинт вебхука обязан быть строго <b>идемпотентным</b>.</li></ul>"
},
{
    id: "int59",
    category: "architecture",
    question: "Что такое long polling? Зачем он нужен, как устроен и чем отличается от обычного REST-запроса?",
    answer: "<p><b>Long Polling (Длинный опрос)</b> — это технология симуляции постоянного двустороннего соединения поверх стандартного протокола HTTP/1.1, разработанная как промежуточный этап эволюции до появления WebSockets.</p><p><b>Как это устроено шаг за шагом:</b></p><ol><li>Клиент отправляет стандартный HTTP-запрос к серверу.</li><li>Сервер <b>НЕ отвечает сразу</b>, если у него нет новых данных. Вместо этого он удерживает соединение открытым (поток «засыпает» или задача висит в асинхронном ожидании).</li><li>Как только на сервере появляются новые данные (или истекает таймаут, например, 30 секунд), сервер отправляет HTTP-ответ и закрывает соединение.</li><li>Клиент мгновенно обрабатывает полученные данные и <b>ту же секунду открывает новый длинный запрос</b>, повторяя цикл.</li></ol><p><b>Чем отличается от обычного REST-запроса:</b> В обычном REST (Short Polling) сервер отвечает мгновенно: либо возвращает данные, либо говорит «данных нет (204 No Content)», заставляя клиента стучаться снова через паузу. В Long Polling сервер держит соединение, пока данные не появятся.</p><p><b>Зачем нужен сейчас:</b> Используется в системах, где WebSockets заблокированы корпоративными брандмауэрами/прокси-серверами, или как fallback-стратегия. Яркий пример из практики — старые чаты, бот-интерфейс Telegram API (метод <code>getUpdates</code> использует именно Long Polling).</p>"
},
{
    id: "int60",
    category: "architecture",
    question: "Что такое WebSocket? Когда его применять? Чем отличается от long polling?",
    answer: "<p><b>WebSocket</b> — это независимый полнодуплексный (двунаправленный) протокол прикладного уровня, работающий поверх TCP-соединения. Он позволяет серверу и клиенту отправлять текстовые или бинарные сообщения друг другу в любой момент времени без накладных расходов на HTTP-заголовки.</p><p><b>Как работает:</b> Клиент отправляет специальный HTTP-запрос с заголовком <code>Upgrade: websocket</code> (процесс Handshake). Если сервер согласен, соединение «прокачивается» до WebSocket, TCP-сокет остается открытым, и обмен идет фреймами с минимальным оверхедом (всего 2-10 байт на фрейм против сотен байт HTTP-заголовков).</p><p><b>Когда применять:</b> Трейдинговые платформы и биржи (мгновенное обновление котировок), многопользовательские онлайн-игры, дашборды мониторинга в реальном времени, многопользовательские чаты и инструменты совместной работы (типа Figma или Google Docs).</p><p><b>Отличия от Long Polling:</b></p><table><thead><tr><th>Критерий</th><th>Long Polling</th><th>WebSocket</th></tr></thead><tbody><tr><td><b>Протокол</b></td><td>Стандартный HTTP / HTTPS</td><td>WS / WSS (отдельный протокол)</td></tr><tr><td><b>Жизненный цикл соединения</b></td><td>Постоянно переоткрывается после каждого ответа</td><td>Устанавливается один раз и живет «вечно»</td></tr><tr><td><b>Направление данных</b></td><td>Полудуплекс (инициатор всегда клиент)</td><td>Полнодуплекс (и клиент, и сервер пишут параллельно)</td></tr><tr><td><b>Накладные расходы</b></td><td>Высокие (HTTP заголовки, куки при каждом запросе)</td><td>Минимальные (микро-фреймы после Handshake)</td></tr></tbody></table>"
},
{
    id: "int61",
    category: "architecture",
    question: "Что такое gRPC? Когда его применять? Что такое Protobuf и HTTP/2 (чем отличается от HTTP/1.1)?",
    answer: "<p><b>gRPC (Google Remote Procedure Call)</b> — это высокопроизводительный, открытый фреймворк для удаленного вызова процедур, изначально разработанный Google. Вместо работы с ресурсами (как в REST), gRPC позволяет коду клиента вызывать методы на удаленном сервере так, будто это локальный объект в памяти приложения.</p><p><b> gRPC держится на двух технологических китах:</b></p><ul><li><b>Protocol Buffers (Protobuf):</b> Это бинарный формат сериализации данных (вместо текстового JSON). Контракт взаимодействия описывается в <code>.proto</code> файлах. Он строго типизирован. Данные сжимаются в компактный бинарный поток, что обеспечивает скорость сериализации/десериализации до 10 раз выше, чем у JSON, и кратно меньший объем трафика.</li><li><b>HTTP/2 в качестве транспорта:</b> Обеспечивает колоссальное преимущество перед HTTP/1.1. <br><i>Главные отличия HTTP/2 от HTTP/1.1:</i> Мультиплексирование (множество запросов и ответов передаются параллельно через <b>одно</b> TCP-соединение, решая проблему Head-of-Line blocking), сжатие заголовков (HPACK) и бинарный формат фреймов вместо текстового.</li></ul><p><b>Когда применять:</b> Идеальное решение для <b>межсервисного взаимодействия (East-West traffic) в микросервисных архитектурах</b>, где критична минимальная задержка (Latency) и высокая пропускная способность. Также незаменим для мобильных клиентов и IoT-устройств из-за экономии трафика и батареи.</p>"
},
{
    id: "int62",
    category: "architecture",
    question: "Что такое GraphQL? Когда применяют? Плюсы GraphQL относительно REST?",
    answer: "<p><b>GraphQL</b> — это язык запросов к API и среда выполнения этих запросов на сервере, разработанная Facebook. В отличие от REST, где под каждый ресурс выделяется свой URL-эндпоинт, в GraphQL есть только <b>один эндпоинт (обычно POST /graphql)</b>, а клиент сам четко описывает в теле запроса структуру тех данных, которые ему нужны.</p><p><b>Плюсы GraphQL относительно REST:</b></p><ul><li><b>Решение проблемы Under-fetching и Over-fetching:</b> В REST для вывода профиля пользователя вам может потребоваться дернуть <code>/users/1</code>, затем <code>/users/1/posts</code>, а затем <code>/users/1/followers</code> (Under-fetching). Или наоборот, метод <code>/users/1</code> возвращает 50 полей, а фронтенду нужны только <code>id</code> и <code>name</code> (Over-fetching). В GraphQL клиент пишет запрос <code>user(id: 1) { name, posts { title } }</code> и получает ровно эти данные за <b>один</b> сетевой запрос.</li><li><b>Строгая типизация контракта (Schema First):</b> Вся схема данных описывается на сервере (типы, запросы Query, мутации Mutation). Фронтенд может автоматически генерировать TypeScript-типы на основе схемы.</li><li><b>Удобная эволюция без версионирования:</b> Поля можно помечать как <code>@deprecated</code>. Старые клиенты продолжают запрашивать старые поля, новые — новые. API не ломается, отпадает необходимость плодить `/v1/`, `/v2/`.</li></ul><p><b>Когда применяют:</b> На слое <b>BFF (Backend-for-Frontend)</b>, когда у вас есть сложные, динамические дашборды, веб- и мобильные приложения, требующие агрегации данных из множества микросервисов на одном экране.</p>"
},
{
    id: "int63",
    category: "architecture",
    question: "Что такое файловый обмен? Когда применять? Плюсы и минусы файлового обмена?",
    answer: "<p><b>Файловый обмен</b> — это один из старейших интеграционных паттернов (Shared File / File Transfer), при котором системы обмениваются данными асинхронно, записывая файлы определенного формата (CSV, XML, JSON, XLS, Parquet) в согласованное общее хранилище.</p><p><b>Где файлы размещаются:</b> На выделенных FTP / SFTP серверах, сетевых папках (NFS / SMB) или в современных объектных облачных хранилищах (AWS S3, MinIO).</p><p><b>Когда применять:</b> Пакетная обработка данных (Batch processing), регулярная выгрузка каталогов товаров от поставщиков (раз в сутки), передача банковских реестров на выплату зарплат, интеграция с легаси-системами (типа старых версий 1С или мэйнфреймов), которые не умеют в API, а также выгрузка сырых логов и аналитики для DWH/Data Lake.</p><p><b>Плюсы:</b></p><ul><li><b>Предельная простота:</b> Не нужно проектировать сложные API, эндпоинты, контролировать конкурентный доступ. Каждая система просто работает с файловой системой.</li><li><b>Изоляция технологий:</b> Системе А на Java абсолютно всё равно, что Система Б написана на COBOL — они общаются текстовыми файлами.</li><li><b>Отлично подходит для гигантских объемов:</b> Передать файл размером в 50 ГБ через SFTP надежнее и проще, чем пытаться пропихнуть эти данные терабайтами через REST или брокер сообщений.</li></ul><p><b>Минусы:</b></p><ul><li><b>Отсутствие Real-time:</b> Интеграция работает по расписанию (Cron). Данные всегда отстают от реальности.</li><li><b>Проблемы синхронизации и блокировок:</b> Что делать, если одна система начала читать файл, пока вторая его еще не до конца записала? (Решается через запись во временный файл и последующий атомарный перенос/rename).</li><li><b>Сложность мониторинга:</b> Трудно оперативно отследить, на чьей стороне сбой, если файл побился или не доехал.</li></ul>"
},
{
     id: "arch1",
    category: "architecture",
    question: "Что такое клиент-серверная архитектура?",
    answer: "<p><b>Клиент-серверная архитектура</b> — это концептуальный паттерн проектирования распределенных систем, в котором вычислительная и логическая нагрузка разделена между поставщиками услуг или ресурсов (<b>Серверами</b>) и их заказчиками (<b>Клиентами</b>). Клиент и сервер взаимодействуют через сеть посредством строго определенного протокола передачи данных.</p><p><b>Основные принципы и компоненты:</b></p><ul><li><b>Клиент (Thin/Thick Client):</b> Инициатор взаимодействия. Формирует запрос (Request) к серверу, ожидает ответ, после чего интерпретирует и визуализирует его для пользователя (например, SPA-приложение на React/Vue или мобильное приложение).</li><li><b>Сервер:</b> Пассивный участник, который постоянно находится в режиме ожидания запросов (Listening). При получении запроса он производит его валидацию, выполняет бизнес-логику, оркестрирует работу с базами данных и возвращает результат (Response).</li><li><b>Слабая связанность (Decoupling):</b> Интерфейс клиента полностью изолирован от деталей реализации хранения данных и бизнес-логики на бэкенде. Мы можем полностью переписать сервер с Node.js на Go, не изменяя фронтенд, пока соблюдается сетевой контракт.</li></ul>"
},
{
    id: "arch2",
    category: "architecture",
    question: "Какие есть виды архитектуры / архитектурные паттерны? Какая архитектура у тебя на проекте?",
    answer: "<p>В современной промышленной разработке выделяют несколько ключевых архитектурных стилей и паттернов:</p><ul><li><b>Монолитная архитектура (Monolithic):</b> Приложение собирается, разворачивается и масштабируется как единое целое.</li><li><b>Микросервисная архитектура (Microservices):</b> Система разбивается на слабосвязанные, автономные сервисы вокруг бизнес-доменов.</li><li><b>Событийно-ориентированная (Event-Driven):</b> Компоненты общаются асинхронно через публикацию и подписку на события (Pub/Sub) в брокерах сообщений.</li><li><b>Серверлесс (Serverless / FaaS):</b> Логика разбивается на отдельные атомарные функции, выполняющиеся в изолированных контейнерах по триггеру (AWS Lambda, Cloud Functions).</li><li><b>Сервис-ориентированная (SOA):</b> Корпоративный стиль интеграции крупных легаси-систем через корпоративную шину данных (ESB).</li></ul><p><b>Из практики (Senior-ответ):</b> <i>«На моем текущем проекте используется <b>микросервисная событийно-ориентированная архитектура</b>. Ядро системы разбито на изолированные сервисы (Биллинг, Каталог, Доставка), взаимодействующие синхронно через REST/gRPC для критически важных операций и асинхронно через Apache Kafka для распределенных бизнес-процессов (например, обработка и сборка заказа). На фронтенде развернут паттерн BFF (Backend-for-Frontend) на Node.js для агрегации данных».</i></p>"
},
{
    id: "arch3",
    category: "architecture",
    question: "Что такое монолит? Что такое распределённый монолит?",
    answer: "<p><b>Монолит (Monolith)</b> — это архитектура, при которой все бизнес-домены, модули, работа с базой данных, пользовательский интерфейс и служебные компоненты объединены в рамках единой кодовой базы и запускаются в одном системном процессе. Монолит — это <b>НЕ</b> антипаттерн. Модульный монолит с чистыми границами внутри кода — отличное решение для старта большинства стартапов.</p><p><b>Распределенный монолит (Distributed Monolith)</b> — это классический <b>антипаттерн</b> проектирования, возникающий при неудачной попытке перейти на микросервисы. Это ситуация, когда систему физически распилили на отдельные сетевые сервисы, но они остались **жестко связанными (Tight Coupling)** между собой.</p><p><b>Признаки распределенного монолита:</b></p><ul><li>Чтобы обновить и задеплоить один сервис, вам приходится одновременно деплоить еще три соседних.</li><li><b>Синхронный «паровозик»:</b> Сервис А вызывает Сервис Б, тот вызывает Сервис В через HTTP. Если падает Сервис В — падает вся цепочка.</li><li>Сервисы делят между собой **одну общую базу данных** на уровне таблиц (нарушение инкапсуляции данных).</li></ul><p><b>Итог:</b> Вы получаете все минусы микросервисов (сложный деплой, сетевые задержки, проблемы с трассировкой) и ни одного их плюса.</p>"
},
{
    id: "arch4",
    category: "architecture",
    question: "Что такое микросервисы? В чём заключается независимость микросервисов?",
    answer: "<p><b>Микросервисы (Microservices Architecture)</b> — это архитектурный стиль, при котором крупное приложение проектируется как коллекция небольших, автономных сервисов, спроектированных вокруг конкретных бизнес-возможностей (Bounded Context в терминах DDD).</p><p><b>В чем заключается истинная независимость микросервисов (Senior-метрики):</b></p><ul><li><b>Независимость данных (Database-per-service):</b> Каждый микросервис владеет своей собственной базой данных (или схемой). Никакой другой сервис не имеет права лезть в эту БД напрямую — только через публичное API этого микросервиса.</li><li><b>Независимость развертывания (Deployment):</b> Изменение кода и деплой микросервиса «Биллинг» никак не должны затрагивать работу и деплой сервиса «Каталог».</li><li><b>Автономия команд и технологий:</b> Команда сервиса вольна выбирать оптимальный стек (например, Go для высокой производительности сетевого ввода-вывода, Python для ML-модулей) и развивать сервис в своем темпе.</li><li><b>Изоляция сбоев (Fault Tolerance):</b> Падение или деградация одного сервиса не должны приводить к полному отказу всей системы (каскадному сбою).</li></ul>"
},
{
    id: "arch5",
    category: "architecture",
    question: "Чем отличается сервис от микросервиса?",
    answer: "<p>Разница между сервисом (в контексте классической SOA архитектуры) и микросервисом заключается не в размере строк кода, а в **степени автономности, связности и способах масштабирования**:</p><ul><li><b>Масштаб и ответственность:</b> Сервис в SOA — это крупный функциональный блок предприятия (например, «Сервис обработки кредитов»). Микросервис — более атомарен, он решает узкую задачу в рамках одного контекста (например, «Микросервис отправки SMS-уведомлений о статусе кредита»).</li><li><b>Связанность и интеграция:</b> Сервисы в SOA часто зависят от централизованной инфраструктуры — корпоративной шины (ESB), которая знает, как трансформировать их данные. Микросервисы исповедуют принцип <i>«Smart endpoints, dumb pipes»</i> (Умные эндпоинты, глупые трубы) — они сами знают бизнес-логику, а сеть используют как простой транспорт (HTTP, gRPC, Kafka).</li><li><b>Общие компоненты:</b> Сервисы SOA могут разделять общие базы данных или тяжелые монолитные хранилища. Микросервисы категорически изолируют свои данные.</li></ul>"
},
{
    id: "arch6",
    category: "architecture",
    question: "В чём отличие монолита и микросервисов? Плюсы/минусы? Когда лучше выбрать монолит и когда стоит уходить от монолита в микросервисы?",
    answer: "<p>Это фундаментальный выбор, требующий трезвой оценки компромиссов (Trade-offs):</p><p><b>Плюсы и минусы монолита:</b><br>➕ Быстрая разработка на старте, простая отладка, отсутствие сетевых задержек между модулями, транзакции на уровне БД (ACID).<br>➖ Сложно масштабировать отдельные части, огромная кодовая база пугает новичков, падение одного модуля роняет всё приложение, жесткая привязка к одному стеку.</p><p><b>Плюсы и минусы микросервисов:</b><br>➕ Отличная горизонтальная масштабируемость, изоляция сбоев, независимый деплой, гибкость выбора технологий.<br>➖ Сложность мониторинга (нужны Jaeger/OpenTelemetry), накладные расходы на сеть, сложность обеспечения согласованности данных (распределенные транзакции / Saga).</p><p><b>Когда выбирать:</b></p><ul><li><b>Выбираем монолит:</b> На этапе MVP, когда бизнес-требования постоянно меняются, доменные границы еще не устоялись, нагрузка небольшая, а команда разработки состоит из 2–5 человек.</li><li><b>Уходим в микросервисы:</b> Когда кодовая база монолита выросла настолько, что команды начинают «толкаться локтями» в одном репозитории; когда разным частям системы требуются разные ресурсы (например, одному модулю нужно много CPU, второму — RAM); когда критически важна изоляция сбоев high-load модулей от остального приложения.</li></ul>"
},
{
    id: "arch7",
    category: "architecture",
    question: "В чём преимущества и недостатки микросервисной архитектуры?",
    answer: "<p>Микросервисы — это не бесплатное серебряное копыто, это **обмен организационных проблем на технические**.</p><p><b>Преимущества:</b></p><ul><li><b>Горизонтальное масштабирование:</b> Если в черную пятницу летит нагрузка на сервис Корзины, мы поднимаем 20 его инстансов, оставляя сервис Отчетов на одном минимальном инстансе.</li><li><b>Быстрый Time-to-Market:</b> Маленькая команда пилит маленькую фичу в своем сервисе и катит ее на прод за 10 минут, не дожидаясь релиза огромного монолита.</li><li><b>Повышенная надежность:</b> Ошибка Out-of-Memory в сервисе рекомендаций не помешает пользователю положить товар в корзину и оплатить его.</li></ul><p><b>Недостатки (Цена, которую мы платим):</b></p><ul><li><b>Операционная сложность (DevOps overhead):</b> Вам необходимы CI/CD, Kubernetes, Service Mesh, централизованный сбор логов (ELK/Loki) и метрик (Prometheus/Grafana).</li><li><b>Проблема консистентности (Eventual Consistency):</b> Забудьте про классический <code>BEGIN TRANSACTION</code>. Приходится жить в мире, где данные согласуются «со временем».</li><li><b>Сложность отладки:</b> Поиск бага, который воспроизводится только при последовательном прохождении запроса через 6 сетевых сервисов — это детективная задача.</li></ul>"
},
{
    id: "arch8",
    category: "architecture",
    question: "Какие есть способы декомпозиции на микросервисы? По каким принципам выделяются микросервисы? Какие используешь?",
    answer: "<p>Правильная нарезка монолита — залог успеха всей архитектуры. Выделяют следующие базовые стратегии декомпозиции:</p><ul><li><b>По бизнес-возможностям (Decomposition by Business Capability):</b> Ориентация на организационную структуру компании. Например: Сервис Продаж, Сервис Склада, Сервис Доставки.</li><li><b>По доменам / поддоменам (Decomposition by Subdomain / DDD):</b> Самый зрелый инженерный подход. Проводится Event Storming сессия, выделяются Core (основные), Supporting (поддерживающие) и Generic (общие) поддомены, определяются границы <b>Bounded Context</b>. Каждый контекст становится микросервисом.</li><li><b>По транзакциям / сущностям (Decomposition by Entity):</b> Выделение вокруг ключевого агрегата данных (например, Сервис Заказов, Сервис Пользователей). Опасен скатыванием в «наносервисы».</li></ul><p><b>Из практики (Senior-ответ):</b> <i>«На практике я всегда комбинирую <b>DDD-подход</b> с анализом транзакционных границ. Главный маркер правильной нарезки: микросервис должен инкапсулировать данные так, чтобы 90% бизнес-сценариев выполнялись внутри его контекста, без необходимости совершать синхронные сетевые запросы в другие сервисы за дополнительными данными».</i></p>"
},
{
    id: "arch9",
    category: "architecture",
    question: "Какие паттерны микросервисной архитектуры знаешь?",
    answer: "<p>Паттерны микросервисов классифицируются по решаемым задачам. На собеседовании важно показать системный кругозор:</p><ul><li><b>Паттерны интеграции и декомпозиции:</b> <b>API Gateway</b> (единая точка входа), <b>BFF (Backend-for-Frontend)</b> (свой бэкенд под каждый тип клиента), <b>Strangler Fig (Фикус-душитель)</b> (паттерн постепенной замены монолита микросервисами).</li><li><b>Паттерны работы с данными:</b> <b>Database-per-service</b> (изолированные БД), <b>CQRS</b> (разделение команд на запись и запросов на чтение), <b>Saga</b> (оркестрация/хореография распределенных транзакций через компенсирующие действия), <b>Event Sourcing</b> (хранение состояния как потока событий).</li><li><b>Паттерны отказоустойчивости:</b> <b>Circuit Breaker (Предохранитель)</b> (разрыв цепи запросов к деградирующему сервису), <b>Bulkhead (Переборка)</b> (изоляция ресурсов потоков под разные задачи), <b>Retry with exponential backoff</b> (умные повторы запросов).</li><li><b>Паттерны наблюдаемости (Observability):</b> <b>Correlation ID</b> (сквозной ID запроса для логов), <b>Distributed Tracing</b> (распределенная трассировка).</li></ul>"
},
{
    id: "arch10",
    category: "architecture",
    question: "Чем отличается SOA от микросервисной архитектуры (MSA)?",
    answer: "<p>Хотя MSA является эволюционным продолжением SOA (Service-Oriented Architecture), между ними есть жесткие различия на уровне философии проектирования:</p><table><thead><tr><th>Критерий</th><th>SOA (Сервис-ориентированная)</th><th>MSA (Микросервисная)</th></tr></thead><tbody><tr><td><b>Интеграция</b></td><td>Централизованная (через умную шину <b>ESB</b>).</td><td>Децентрализованная (простые протоколы gRPC/REST, брокеры Kafka/Rabbit).</td></tr><tr><td><b>Управление данными</b></td><td>Глобальная общая база данных (часто).</td><td>Строго изолированная БД у каждого микросервиса.</td></tr><tr><td><b>Связанность систем</b></td><td>Более высокая. Изменение схемы в ESB может затронуть всех.</td><td>Минимальная. Сервисы общаются по строго версионируемым контрактам.</td></tr><tr><td><b>Управление</b></td><td>Глобальное управление (Governance) на уровне предприятия.</td><td>Self-управление. Каждая продуктовая команда отвечает за свой сервис (You build it, you run it).</td></tr><tr><td><b>Развертывание</b></td><td>Крупные монолитные архивы (EAR/WAR) на тяжелые серверы приложений.</td><td>Легковесные Docker-контейнеры в Kubernetes-кластере.</td></tr></tbody></table>"
},
{
    id: "arch11",
    category: "architecture",
    question: "Расскажи про токен-авторизацию в микросервисах.",
    answer: "<p>В микросервисных архитектурах традиционная сессионная авторизация (Session-based) неэффективна, так как требует централизованного хранилища сессий (например, Redis), что создаёт лишние сетевые задержки и единую точку отказа. Вместо этого применяется <b>Token-based авторизация (преимущественно с использованием JWT — JSON Web Tokens)</b>, работающая по принципу Stateless.</p><p><b>Архитектурный паттерн реализации:</b></p><ul><li><b>Единая точка входа (API Gateway):</b> Клиент отправляет свои учетные данные (логин/пароль) на эндпоинт аутентификации. Сервис аутентификации (Auth Service или внешний Identity Provider вроде Keycloak) валидирует их и генерирует пару токенов: <i>Access Token</i> (короткоживущий, например, 15 минут) и <i>Refresh Token</i> (долгоживущий, хранится в базе данных).</li><li><b>Криптографическая подпись:</b> Access-токен подписывается приватным ключом сервера (алгоритмы RS256 или HS256) и содержит в себе полезную нагрузку (Claims): ID пользователя, его роли, права доступа (scopes) и время истечения (exp).</li><li><b>Stateless-валидация на микросервисах:</b> Когда клиент делает запрос к любому микросервису (например, Биллингу), он прикрепляет токен в заголовок <code>Authorization: Bearer &lt;token&gt;</code>. Микросервису **не нужно** делать сетевой запрос в сервис авторизации, чтобы проверить пользователя. Он валидирует подпись токена локально, используя публичный ключ (Public Key), который он закешировал при старте или периодически обновляет через JWKS (JSON Web Key Sets).</li></ul><p><b>Критические проблемы и их решение (Senior-уровень):</b> Основная проблема JWT — его невозможно отозвать до истечения срока действия, если токен будет украден. Для решения этой проблемы внедряют механизмы <i>Blacklisting</i> (короткоживущий список отозванных токенов в Redis, который проверяется при критических операциях) либо используют API Gateway как единственный узел, который проверяет валидность токена, а внутрь сети между микросервисами пробрасывает очищенный контекст пользователя в виде простых HTTP-заголовков (X-User-Id, X-User-Roles).</p>"
},
{
    id: "arch12",
    category: "architecture",
    question: "Что такое Хореография? Для чего используют? Плюсы и минусы.",
    answer: "<p><b>Хореография (Choreography)</b> — это децентрализованный паттерн реализации распределенных транзакций (Саг) в микросервисной архитектуре, при котором каждый участник системы реагирует на события других участников и знает только свою локальную бизнес-логику, не имея представления о глобальном процессе целиком.</p><p><b>Для чего используют:</b> Хореографию применяют в событийно-ориентированных (Event-Driven) системах с высокой нагрузкой, где критически важна слабая связанность (Loose Coupling) модулей и высокая скорость обработки сообщений (например, обработка лайков, стриминг логов, системы уведомлений или простые цепочки заказов).</p><p><b>Преимущества (Плюсы):</b></p><ul><li><b>Максимальная автономность:</b> Сервисы полностью изолированы. Сервис уведомлений просто слушает брокер (например, Apache Kafka) и отправляет SMS при появлении события <i>OrderPaid</i>. Ему наплевать, кто сгенерировал это событие и что будет дальше.</li><li><b>Отсутствие единой точки отказа (SPOF):</b> Нет центрального контроллера, падение которого заблокирует всю систему. Если один из сервисов-подписчиков упадет, брокер сохранит сообщения в очереди, и сервис догонит поток после восстановления.</li><li><b>Простота масштабирования и эволюции:</b> Чтобы добавить новую функциональность (например, начислять кэшбек при оплате), достаточно написать новый микросервис и подписать его на то же событие <i>OrderPaid</i>. Старые сервисы даже не узнают об этом.</li></ul><p><b>Недостатки (Минусы):</b></p><ul><li><b>Сложность понимания и отладки:</b> Бизнес-логика «размазана» по кодовой базе десятков сервисов. Сложнее составить общую картину процесса без распределенной трассировки (Jaeger/OpenTelemetry).</li><li><b>Циклические зависимости:</b> При неаккуратном проектировании легко создать петлю, когда Сервис А публикует событие для Сервиса Б, а тот в ответ порождает событие, снова триггерящее Сервис А.</li><li><b>Сложность распределенных откатов:</b> Если на 5-м шаге хореографии произошел сбой, каждый предыдущий сервис должен по цепочке поймать событие ошибки и выполнить компенсирующую транзакцию, что требует написания сложного кода обработки исключений в каждом модуле.</li></ul>"
},
{
    id: "arch13",
    category: "architecture",
    question: "Что такое Оркестрация? Для чего используют? Плюсы и минусы.",
    answer: "<p><b>Оркестрация (Orchestration)</b> — это централизованный паттерн управления распределенными транзакциями, при котором выделенный компонент — **Оркестратор** (или дирижер процесса) — полностью контролирует сценарий выполнения бизнес-процесса: явно посылает команды сервисам-исполнителям, дожидается ответов и принимает решения о переходе на следующий шаг или запуске отката.</p><p><b>Для чего используют:</b> Оркестрация незаменима в сложных корпоративных (Enterprise) процессах с большим количеством ветвлений, условий, ручных подтверждений (Human-in-the-loop) и жесткими требованиями к согласованности данных (например, банковские переводы, сложные системы бронирования туров «отель + перелет + страховка»). Реализуется либо кодом, либо с помощью специализированных движков (Temporal.io, Camunda BPMN, AWS Step Functions).</p><p><b>Преимущества (Плюсы):</b></p><ul><li><b>Централизованный контроль:</b> Весь алгоритм бизнес-процесса находится в одном месте (в кодовой базе или схеме оркестратора). Его легко читать, документировать и модифицировать.</li><li><b>Простая обработка ошибок:</b> Если сервис доставки вернул ошибку, оркестратор сразу же прекращает выполнение процесса и централизованно рассылает команды отмены (компенсирующие транзакции) в сервис оплаты и сервис склада.</li><li><b>Управление состоянием (State Management):</b> Оркестратор сохраняет текущий статус выполнения процесса в базу данных. Мы всегда точно знаем, на каком этапе (шаге) находится конкретный заказ пользователя.</li></ul><p><b>Недостатки (Минусы):</b></p><ul><li><b>Риск избыточной централизации (Smart Router, Dumb Endpoints):</b> Есть опасность превратить микросервисы в глупые CRUD-заглушки, перенеся всю бизнес-логику внутрь оркестратора, что превратит систему в распределенный монолит.</li><li><b>Единая точка отказа (SPOF) и узкое место производительности:</b> Если падает база данных оркестратора, останавливаются все бизнес-процессы. Также оркестратор создает дополнительные сетевые оверхеды (запрос-ответ на каждый шаг).</li><li><b>Жесткая связанность:</b> Оркестратор должен знать интерфейсы (API, схемы gRPC/Proto) всех сервисов, которыми он управляет.</li></ul>"
},
{
    id: "arch14",
    category: "architecture",
    question: "Что такое API Gateway? Для чего используется?",
    answer: "<p><b>API Gateway (Шлюз API)</b> — это серверный архитектурный компонент, который выступает в качестве единой точки входа (Reverse Proxy) для всех клиентских запросов к микросервисной экосистеме бэкенда. Он инкапсулирует внутреннюю структуру сети и предоставляет клиентам чистый, унифицированный интерфейс.</p><p><b>Для чего используется (Ключевые функции):</b></p><ul><li><b>Маршрутизация запросов (Routing):</b> Анализирует URL, заголовки и методы входящих запросов и перенаправляет их на соответствующие внутренние микросервисы (например, запрос <code>/api/v1/orders</code> улетает на Order Service, а <code>/api/v1/users</code> — на User Service).</li><li><b>Сквозная функциональность (Cross-Cutting Concerns):</b> Освобождает микросервисы от рутинных задач. На уровне Gateway реализуются: централизованная аутентификация/авторизация (проверка JWT), SSL-терминация (расшифровка HTTPS трафика), логирование и сбор метрик.</li><li><b>Ограничение нагрузки (Rate Limiting &amp; Throttling):</b> Защищает бэкенд от DDoS-атак и перегрузок. Если клиент превышает лимит (например, более 60 запросов в минуту), шлюз мгновенно возвращает ошибку <code>429 Too Many Requests</code>, не нагружая внутренние сервисы.</li><li><b>Трансформация данных и оркестрация:</b> Может преобразовывать протоколы (например, принимать от клиента REST JSON, а внутрь сети отправлять быстрый gRPC/Protobuf) или агрегировать ответы от нескольких сервисов в один JSON.</li></ul><p>Популярные индустриальные решения: <i>KrakenD, Kong, Envoy, Nginx Plus, AWS API Gateway</i>.</p>"
},
{
    id: "arch15",
    category: "architecture",
    question: "Что такое балансировщик? Для чего используется?",
    answer: "<p><b>Балансировщик нагрузки (Load Balancer)</b> — это программный или аппаратный компонент, который распределяет входящий сетевой трафик между пулом вычислительных серверов (инстансов приложения) с целью оптимизации использования ресурсов, максимизации пропускной способности, минимизации времени отклика и обеспечения отказоустойчивости.</p><p><b>Для чего используется и как работает:</b></p><ul><li><b>Горизонтальное масштабирование:</b> Позволяет развернуть 5, 10 или 100 одинаковых копий вашего веб-сервиса. Балансировщик принимает запросы от пользователей на один IP-адрес и распределяет их по внутренним серверам.</li><li><b>Проверка работоспособности (Health Checking):</b> Периодически опрашивает серверы (шлет пинги или дергает эндпоинт <code>/health</code>). Если один из серверов завис или упал, балансировщик мгновенно исключает его из пула маршрутизации, направляя трафик только на здоровые машины (Failover).</li><li><b>Алгоритмы балансировки:</b> Использует различные стратегии распределения трафика: <ul><li><i>Round Robin:</i> Циклический перебор (по очереди каждому серверу).</li><li><i>Least Connections:</i> Запрос направляется серверу с наименьшим числом активных соединений в данный момент.</li><li><i>IP Hash:</i> Хеширует IP-адрес клиента, закрепляя конкретного пользователя за определенным сервером (поддержание сессии).</li></ul></li></ul><p>Балансировка может происходить на разных уровнях модели OSI: на транспортном уровне **L4** (работа со значениями IP и портов без чтения содержимого пакетов, например, HAProxy, AWS NLB) или на прикладном уровне **L7** (с анализом HTTP-заголовков, кук и путей URL, например, Nginx, Traefik, AWS ALB).</p>"
},
{
    id: "arch16",
    category: "architecture",
    question: "Для чего используется шина данных?",
    answer: "<p><b>Шина данных (Enterprise Service Bus — ESB)</b> — это централизованный интеграционный паттерн и программная инфраструктура, предназначенная для обеспечения контролируемого, надежного и стандартизированного взаимодействия между множеством разнородных (гетерогенных) информационных систем в рамках крупного предприятия.</p><p><b>Для чего используется (Ключевые задачи ESB):</b></p><ul><li><b>Трансформация и трансляция форматов (Message Transformation):</b> Связывает системы, говорящие на разных языках. Например, шина может принять XML-сообщение из старой банковской легаси-системы (классический мейнфрейм), трансформировать его с помощью XSLT-шаблона и передать современному микросервису в формате JSON.</li><li><b>Интеллектуальная маршрутизация (Routing):</b> Шина знает бизнес-правила предприятия. Она может проанализировать содержимое сообщения и решить, в какие именно департаменты или системы его нужно перенаправить.</li><li><b>Протокольное посредничество (Protocol Mediation):</b> Позволяет интегрировать системы, работающие по разным сетевым протоколам (например, принимать данные по HTTP REST, а отдавать в очередь IBM MQ или по SOAP/WSDL).</li><li><b>Обеспечение гарантированной доставки:</b> Инкапсулирует механизмы очередей и транзакционности, чтобы гарантировать, что данные не потеряются при отказе одной из интегрируемых платформ.</li></ul><p>⚠️ <i>Различие для Senior:</i> В современной микросервисной архитектуре от тяжелых ESB отказываются в пользу брокеров сообщений (Kafka). ESB считалась «умной трубой с глупыми эндпоинтами» (что приводило к зашиванию бизнес-логики в саму шину), в то время как микросервисы требуют «глупых труб и умных эндпоинтов».</p>"
},
{
    id: "arch17",
    category: "architecture",
    question: "Что такое BFF (Backend For Frontend)?",
    answer: "<p><b>BFF (Backend For Frontend)</b> — это архитектурный паттерн проектирования слоев интеграции, который предполагает создание **отдельных, специализированных бэкенд-сервисов для каждого конкретного типа пользовательского интерфейса (клиента)**.</p><p>Вместо использования одного универсального API Gateway для мобильного приложения, веб-сайта и интеграций со сторонними партнерами, под каждый тип клиента разворачивается свой легковесный промежуточный прокси-сервер (часто пишется на Node.js/TypeScript или Go).</p><p><b>Зачем это нужно и какие задачи решает:</b></p><ul><li><b>Оптимизация сетевого трафика (Data Tailoring):</b> Мобильному приложению на слабом 3G-интернете для экрана профиля нужно всего 3 поля (имя, аватар, баланс). Веб-версии на десктопе нужны 50 полей, включая историю операций и графики активности. BFF для мобилки запрашивает полный доменный микросервис, вырезает всё лишнее и отдает клиенту компактный, оптимизированный JSON.</li><li><b>Агрегация запросов (API Chatting Reduction):</b> Чтобы отрисовать один экран приложения, клиенту может потребоваться вызвать сервис пользователей, сервис скидок и сервис корзины. Вместо 3 тяжелых сетевых запросов от телефона через мобильную сеть, телефон делает **один** запрос к своему BFF. BFF мгновенно собирает данные по быстрой внутренней сети дата-центра от нужных микросервисов, склеивает их и возвращает клиенту готовый слепок экрана.</li><li><b>Разделение ответственности и автономия фронтендеров:</b> Команда фронтенд-разработки сама владеет и управляет своим BFF-слоем. Они могут менять формат API под нужды UI без необходимости просить бэкенд-команду переписать основные доменные микросервисы.</li></ul>"
},
{
    id: "arch18",
    category: "architecture",
    question: "Назови все способы снизить нагрузку на веб-сервис.",
    answer: "<p>Обеспечение стабильности High-Load систем требует комплексного подхода на всех уровнях архитектуры. Ключевые способы снижения нагрузки делятся на следующие группы:</p><ul><li><b>1. Кэширование (наиболее эффективный способ):</b> <ul><li><i>На стороне клиента (Браузер):</i> Настройка заголовков Cache-Control, ETag, Service Workers.</li><li><i>На сетевом уровне:</i> Использование Edge-серверов и CDN (Cloudflare) для отдачи статики (картинки, стили, JS) и кэширования API-ответов ближе к пользователю.</li><li><i>На стороне бэкенда:</i> Внедрение In-memory DB (Redis, Memcached) для хранения результатов тяжелых SQL-запросов, сессий или предрассчитанных данных.</li></ul></li><li><b>2. Оптимизация работы с базами данных:</b> Написание правильных индексов, оптимизация SQL-запросов (избавление от N+1 проблемы), внедрение репликации (чтение с Read-реплик, запись на Master), вертикальное и горизонтальное шардирование / партиционирование таблиц. Предотвращение блокировок.</li><li><b>3. Переход на асинхронную модель (Asynchronous Processing):</b> Перенос тяжелых, не требующих мгновенного ответа задач (генерация PDF-отчетов, отправка писем, обработка видео, аналитика) с основного HTTP-потока бэкенда в фоновые воркеры через брокеры сообщений (RabbitMQ, Kafka, Celery).</li><li><b>4. Оптимизация сетевого взаимодействия и ресурсов приложения:</b> Использование сжатия (Gzip/Brotli), минификация кода, пул соединений (Connection Pooling) к БД, переход на легковесные бинарные протоколы связи (gRPC/Protobuf вместо REST JSON) для внутренней сети.</li><li><b>5. Паттерны отказоустойчивости (Traffic Management):</b> Внедрение <i>Rate Limiting</i> для отсекания паразитного трафика и парсеров, паттерн <i>HTTP HTTP/2 / HTTP/3</i> для мультиплексирования запросов, а также <i>Graceful Degradation</i> (отключение второстепенных тяжелых фич в пиковые нагрузки).</li></ul>"
},
{
    id: "arch19",
    category: "architecture",
    question: "Что такое Event Sourcing?",
    answer: "<p><b>Event Sourcing (Источник событий)</b> — это паттерн проектирования управления данными, при котором текущее состояние бизнес-сущности (агрегата) не перезаписывается в базе данных (в отличие от классической CRUD-модели), а вычисляется как **результат последовательного применения (воспроизведения) цепочки всех исторических событий**, произошедших с этой сущностью с момента её создания.</p><p><b>Как это работает на практике:</b></p><ul><li>Вместо таблицы <code>wallets</code>, где при каждом переводе выполняется операция <code>UPDATE wallets SET balance = balance - 100 WHERE id = 42</code>, мы имеем строго неизменяемую Append-only таблицу (Event Store / Журнал событий).</li><li>При действиях пользователя в нее последовательно дописываются атомарные факты в прошедшем времени: <br>1. <i>WalletCreated</i> (balance: 0)<br>2. <i>MoneyDeposited</i> (amount: 500)<br>3. <i>MoneyWithdrawn</i> (amount: 200)<br>4. <i>BonusAccrued</i> (amount: 50).</li><li>Чтобы узнать текущий баланс пользователя в памяти приложения, мы поднимаем из базы все эти события и последовательно «проигрываем» их (0 + 500 - 200 + 50 = 350).</li></ul><p><b>Зачем это нужно:</b> Паттерн незаменим в системах, где аудит и история изменений критически важны для бизнеса (финтех, банковские транзакции, логистика, медицинские карты). Он дает 100% точный аудит-лог, исключает потерю информации при затирании данных апдейтами и позволяет легко восстановить состояние системы на любую миллисекунду в прошлом (Time Travel).</p><p>⚠️ <i>Важная деталь (Snapshotted State):</i> Чтобы при росте истории нам не приходилось пересчитывать миллионы событий для получения баланса, каждые $N$ событий (например, каждые 100 штук) система делает <b>Снапшот (Snapshot)</b> — сохраняет текущий слепок состояния в базу. При чтении мы берем последний снапшот и накатываем только те события, которые произошли строго после него.</p>"
},
{
    id: "arch20",
    category: "architecture",
    question: "Что такое DDD (Domain-Driven Design)?",
    answer: "<p><b>Domain-Driven Design (DDD / Проектирование на основе предметной области)</b> — это комплексный подход и методология разработки сложного программного обеспечения, который ставит во главу угла глубокое понимание бизнес-процессов (предметной области) и моделирование логики приложения в тесном концептуальном сотрудничестве между разработчиками и профильными бизнес-экспертами (Domain Experts).</p><p>DDD предоставляет два фундаментальных уровня инструментов:</p><ul><li><b>1. Стратегическое проектирование (Strategic DDD) — уровень макроархитектуры:</b> <ul><li><i>Ubiquitous Language (Единый язык):</i> Общий глоссарий терминов, используемый одинаково бизнесом в требованиях и разработчиками прямо в исходном коде (имена классов, методов, полей БД). Убирает трудности перевода.</li><li><i>Bounded Context (Ограниченный контекст):</i> Явная граница внутри системы, в пределах которой доменная модель имеет строго определенный смысл. Например, в контексте «Доставка» объект <code>User</code> — это курьер с машиной, а в контексте «Авторизация» — это просто связка логина и хэша пароля. Ограниченные контексты служат идеальными границами для нарезки независимых микросервисов.</li><li><i>Context Map (Карта контекстов):</i> Графическая схема, отображающая связи, контракты и зависимости между разными контекстами (отношения Upstream/Downstream, Customer-Supplier, Shared Kernel).</li></ul></li><li><b>2. Тактическое проектирование (Tactical DDD) — паттерны реализации кода:</b> <ul><li><i>Entity (Сущность):</i> Объект, обладающий уникальным идентификатором (ID), который определяет его уникальность на протяжении всего жизненного цикла, даже если другие свойства объекта изменятся (например, <code>User</code>, <code>Order</code>).</li><li><i>Value Object (Объект-значение):</i> Объект, не имеющий ID, который полностью описывается исключительно своими текущими атрибутами. Он иммутабелен (неизменяем). Если нужно поменять значение — объект просто заменяется новым. Примеры: <code>Money {amount, currency}</code>, <code>Color {hex}</code>.</li><li><i>Aggregate (Агрегат):</i> Граничная структура, объединяющая группу связанных сущностей и объектов-значений, которая гарантирует инвариантность (согласованность и валидность данных) в рамках транзакции. Любое взаимодействие с внутренностями агрегата возможно исключительно через его корневую сущность — <b>Aggregate Root (Корень агрегата)</b>.</li></ul></li></ul>"
},

        answer: "CAP (Consistency, Availability, Partition Tolerance) гласит: в распределенной системе можно гарантировать только 2 из 3. Полностью сделать систему консистентной, доступной и устойчивой к разделению одновременно — невозможно. При разрыве сети (P) приходится выбирать: либо возвращать ошибку (Consistency), либо старые данные (Availability)."

        answer: "Оператор <code>LIKE</code> используется для поиска строк, соответствующих заданному шаблону. Поддерживает спецсимволы: <code>%</code> (любая последовательность символов) и <code>_</code> (ровно один символ). <br><br><b>Middle+ нюанс:</b> Использование <code>LIKE '%шаблон'</code> делает невозможным использование B-Tree индексов, что ведет к Full Table Scan. Для полнотекстового поиска с использованием индексов следует применять специализированные средства: полнотекстовые индексы (GIN/GIST в PostgreSQL), расширения типа <code>pg_trgm</code> (триграммы) или выносить поиск в специализированные движки вроде <b>Elasticsearch</b>."

        answer: "<code>GROUP BY</code> используется для агрегации строк с одинаковыми значениями в указанных столбцах. Это основной инструмент для выполнения вычислений по группам (через <code>SUM, COUNT, AVG, MAX, MIN</code>). <br><br><b>Важно для архитектуры:</b> Все поля, которые присутствуют в <code>SELECT</code>, но не участвуют в агрегатных функциях, <b>обязательно</b> должны быть указаны в <code>GROUP BY</code>. БД создает хэш-таблицу или сортирует данные для формирования этих групп, что может быть затратным на больших объемах данных."

    {
        id: "sql_mid_31",

        question: "31. Для чего используется HAVING в SQL? Чем HAVING отличается от WHERE?",
        answer: "Оба фильтруют строки, но на разных этапах цикла выполнения запроса:<br><ul><li><b>WHERE:</b> фильтрует исходные строки <b>до</b> группировки. Может использовать индексы.</li><li><b>HAVING:</b> фильтрует результат <b>после</b> группировки и применения агрегатных функций. Не может использовать индексы по обычным полям.</li></ul><br><b>Best Practice:</b> Всегда фильтруйте как можно больше данных через <code>WHERE</code>, чтобы уменьшить объем работы для <code>GROUP BY</code> и последующего <code>HAVING</code>."

        answer: "<ul><li><b>DELETE:</b> DML-операция. Удаляет строки по одной, записывает каждое удаление в лог транзакций (WAL). Можно использовать <code>WHERE</code>. Можно откатить (ROLLBACK).</li><li><b>TRUNCATE:</b> DDL-операция. Физически освобождает страницы данных, обнуляет счетчики (Identity). Гораздо быстрее, так как не создает длинный лог удалений. <b>Риск:</b> в ряде СУБД нельзя откатить в транзакции, нет поддержки <code>WHERE</code>.</li></ul>"

        answer: "Самые эффективные способы:<ul><li><b>NOT EXISTS:</b> (рекомендуемый) <code>SELECT * FROM A WHERE NOT EXISTS (SELECT 1 FROM B WHERE B.id = A.id)</code>. Отлично работает с индексами.</li><li><b>LEFT JOIN ... WHERE B.id IS NULL:</b> Классический подход. Эффективен, если B.id имеет индекс.</li><li><b>NOT IN:</b> <code>SELECT * FROM A WHERE id NOT IN (SELECT id FROM B)</code>. <b>Осторожно:</b> возвращает пустой результат, если в B.id есть хотя бы один NULL.</li><li><b>EXCEPT:</b> <code>SELECT id FROM A EXCEPT SELECT id FROM B</code> (поддерживается не всеми СУБД).</li></ul>"

        // Динамическое состояние приложения
        let flashcards = [...originalCards];
        let currentIndex = 0;
        let isStressMode = false;
        let currentFilter = 'all';
        let searchQuery = '';

        // DOM элементы
        const cardWrapper = document.getElementById('card');
        const questionElement = document.getElementById('question-text');
        const answerElement = document.getElementById('answer-text');
        const cardIdElement = document.getElementById('card-id');
        const cardCategoryElement = document.getElementById('card-category');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const notesTextarea = document.getElementById('card-notes');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stressBtn = document.getElementById('stress-btn');

        // Инициализация темы и данных при старте
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            applyFiltersAndSearch();
        });

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-toggle').innerText = savedTheme === 'dark' ? '🌙' : '☀️';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-toggle').innerText = newTheme === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('theme', newTheme);
        }

        // Переворот карточки
        function flipCard() {
            cardWrapper.classList.toggle('flipped');
        }

        // Рендеринг текущей карточки на основе безопасных проверок
        function renderCard() {
            if (flashcards.length === 0) {
                questionElement.innerHTML = "<span style='color: var(--text-muted);'>Карточки не найдены. Измените параметры фильтра или поиска.</span>";
                answerElement.innerHTML = "Нет данных.";
                cardIdElement.innerText = "ID: --";
                cardCategoryElement.innerText = "Категория: --";
                progressText.innerText = "0 / 0";
                progressFill.style.width = "0%";
                notesTextarea.value = "";
                notesTextarea.disabled = true;
                return;
            }

            notesTextarea.disabled = false;
            
            // Защита от выхода за границы индекса
            if (currentIndex >= flashcards.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = flashcards.length - 1;

            const currentCard = flashcards[currentIndex];
            
            // Анимация сброса переворота на лицевую сторону при смене вопроса
            cardWrapper.classList.remove('flipped');

            // Обновление контента
            questionElement.innerHTML = currentCard.question;
            answerElement.innerHTML = currentCard.answer;
            cardIdElement.innerText = `ID: ${currentCard.id.toUpperCase()}`;
            cardCategoryElement.innerText = `Категория: ${currentCard.category.toUpperCase()}`;
            
            // Обновление прогресс-бара
            const progressPercent = ((currentIndex + 1) / flashcards.length) * 100;
            progressText.innerText = `${currentIndex + 1} / ${flashcards.length}`;
            progressFill.style.width = `${progressPercent}%`;

            // Безопасная загрузка заметок по глобальному ID карточки
            const savedNote = localStorage.getItem(`note_${currentCard.id}`);
            notesTextarea.value = savedNote || "";

            // Управление доступностью кнопок навигации
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === flashcards.length - 1;
        }

        // Навигация (Вперед / Назад)
        function navigate(direction) {
            if (flashcards.length === 0) return;
            currentIndex += direction;
            renderCard();
        }

        // Автосохранение заметок по уникальному ID
        function saveNote() {
            if (flashcards.length === 0) return;
            const currentCard = flashcards[currentIndex];
            localStorage.setItem(`note_${currentCard.id}`, notesTextarea.value);
        }

        // Фильтрация по категориям
        function setFilter(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-filter') === category);
            });
            applyFiltersAndSearch();
        }

        // Живой поиск по строке
        function handleSearch(value) {
            searchQuery = value.toLowerCase().trim();
            applyFiltersAndSearch();
        }

        // Главный метод фильтрации, поиска и рандомизации (Стресс-тест)
        function applyFiltersAndSearch() {
            // 1. Фильтруем по категории
            let result = originalCards.filter(card => {
                const matchCategory = currentFilter === 'all' || card.category === currentFilter;
                
                // 2. Ищем совпадения в тексте или ID
                const matchSearch = card.question.toLowerCase().includes(searchQuery) || 
                                    card.answer.toLowerCase().includes(searchQuery) || 
                                    card.id.toLowerCase().includes(searchQuery);
                
                return matchCategory && matchSearch;
            });

            // 3. Если включен стресс-тест — перемешиваем отфильтрованный результат (Алгоритм Фишера-Йетса)
            if (isStressMode && result.length > 0) {
                for (let i = result.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [result[i], result[j]] = [result[j], result[i]];
                }
            }

            flashcards = result;
            currentIndex = 0; // Сбрасываем указатель на начало новой выборки
            renderCard();
        }

        // Переключение режима «Стресс-тест»
        function toggleStressMode() {
            isStressMode = !isStressMode;
            stressBtn.classList.toggle('stress-active', isStressMode);
            stressBtn.innerText = isStressMode ? "⚡ Активен" : "⚡ Стресс-тест";
            applyFiltersAndSearch();
        }

        // Поддержка горячих клавиш (Стрелки влево/вправо для навигации, пробел для флипа)
        document.addEventListener('keydown', (e) => {
            if (document.activeElement === notesTextarea || document.activeElement === document.getElementById('search-bar')) {
                return; // Игнорируем хоткеи, если пользователь пишет текст
            }
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                flipCard();
            } else if (e.key === 'ArrowLeft') {
                if (currentIndex > 0) navigate(-1);
            } else if (e.key === 'ArrowRight') {
                if (currentIndex < flashcards.length - 1) navigate(1);
            }
        });
    </script>

</html>
