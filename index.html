<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер Системного Аналитика</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg-front: #ffffff;
            --card-bg-back: #ffffff;
            --text-color: #1c1e21;
            --accent-color: #0052cc;
            --secondary-text: #65676b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 5px;
            text-align: center;
            color: var(--accent-color);
        }

        .progress {
            font-size: 13px;
            color: var(--secondary-text);
            margin-bottom: 10px;
        }

        .card-container {
            width: 100%;
            max-width: 700px;
            height: 480px;
            perspective: 1500px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            border-radius: 20px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 35px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .card-front {
            background-color: var(--card-bg-front);
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
        }

        .card-front::after {
            content: "Кликните, чтобы посмотреть ответ";
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-back {
            background-color: var(--card-bg-back);
            transform: rotateY(180deg);
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
            border-top: 5px solid var(--accent-color);
        }

        .card-back h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card-back b { color: #000; }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }

        button {
            flex: 1;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        @media (max-height: 600px) {
            .card-container { height: 350px; }
            .card-front { font-size: 18px; }
        }
    </style>
</head>
<body>

    <h1>Тренажер: Системный Анализ</h1>
    <div class="progress" id="progress">Карточка 1 из 45</div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front" id="question-text">Загрузка...</div>
            <div class="card-face card-back" id="answer-text">Загрузка...</div>
        </div>
    </div>

    <div class="controls">
        <button id="prev-btn" onclick="prevCard(event)" disabled>Назад</button>
        <button id="next-btn" onclick="nextCard(event)">Вперед</button>
    </div>

    <script>
        const flashcards = [
            // БЛОК 1: ТРЕБОВАНИЯ (БАЗА)
            {
                question: "Кто такие стейкхолдеры и с кем общались на практике?",
                answer: "<h3>Стейкхолдеры</h3>Лица или организации, имеющие интересы в проекте или влияние на него.<br><b>Группы:</b> Заказчики (бизнес-владельцы), конечные пользователи, команда разработки (архитекторы, девелоперы), ИБ, юридический отдел.<br><b>На практике:</b> Проводил интервью с бизнес-заказчиками для выявления 'болей', согласовывал ТЗ с техлидами на предмет реализуемости."
            },
            {
                question: "Какие виды требований знаешь? (Пирамида требований)",
                answer: "<h3>Классификация требований</h3>1. <b>Бизнес-требования (BR):</b> Цели организации (Зачем проект?).<br>2. <b>Пользовательские (UR):</b> Задачи пользователей (Что хотят делать?).<br>3. <b>Системные:</b><br>&nbsp;&nbsp;- <i>Функциональные (FR):</i> Что система должна делать.<br>&nbsp;&nbsp;- <i>Нефункциональные (NFR):</i> Как система должна это делать (качество).<br>4. <b>Транзитные:</b> Нужны только для перехода в новое состояние (миграция данных)."
            },
            {
                question: "В чем разница между ФТ и НФТ?",
                answer: "<h3>ФТ vs НФТ</h3><b>Функциональные (FR):</b> Описывают поведение (действия). Например: 'Система должна отправлять SMS при смене пароля'. Проверяются через тест-кейсы.<br><b>Нефункциональные (NFR):</b> Ограничения и атрибуты качества. Например: 'SMS должно приходить в течение 10 секунд'. Влияют на архитектуру и инфраструктуру."
            },
            {
                question: "Что такое User Story и какие преимущества у этого формата?",
                answer: "<h3>User Story</h3>Короткая формулировка на языке пользователя: <i>'Как [роль], я хочу [действие], чтобы [ценность]'</i>.<br><b>Преимущества:</b><br>- Понятны бизнесу и разработчикам.<br>- Фокус на ценности, а не на технической реализации.<br>- Идеальны для Agile (Scrum/Kanban), легко декомпозируются."
            },
            {
                question: "Критерии качества требований (INVEST и SMART)",
                answer: "<h3>Качество требований</h3>Хорошее требование должно быть:<br>- <b>Атомарным:</b> Описывает одну вещь.<br>- <b>Непротиворечивым:</b> Не спорит с другими требованиями.<br>- <b>Проверяемым:</b> Можно провести тест.<br>- <b>Полным:</b> Содержит всю информацию для реализации.<br>Для User Story используем <b>INVEST</b>: Independent, Negotiable, Valuable, Estimable, Small, Testable."
            },

            // БЛОК 2: МОДЕЛИРОВАНИЕ (БЛОК 1 С КАРТИНКИ)
            {
                question: "Какие нотации моделирования знаешь и используешь?",
                answer: "<h3>Нотации моделирования</h3>1. <b>BPMN 2.0:</b> Для описания бизнес-процессов (потоки работ).<br>2. <b>UML:</b> Для проектирования систем (Sequence, Use Case, Class).<br>3. <b>IDEF0:</b> Для функционального моделирования процессов.<br>4. <b>EPC:</b> Описание цепочки событий.<br><b>На практике:</b> BPMN (для логики процесса) и UML Sequence (для взаимодействия систем)."
            },
            {
                question: "Для чего используются UML и BPMN?",
                answer: "<h3>UML vs BPMN</h3><b>BPMN:</b> Язык описания бизнес-логики. Его понимают и бизнес, и IT. Показывает 'Who does what and when'.<br><b>UML:</b> Язык объектно-ориентированного проектирования. Позволяет визуализировать структуру программы, взаимодействие объектов и сценарии использования. Это больше 'чертеж' для разработки."
            },
            {
                question: "Основные элементы BPMN-диаграммы?",
                answer: "<h3>Элементы BPMN</h3>- <b>Объекты потока:</b> События (круги), Действия (прямоугольники), Шлюзы (ромбы).<br>- <b>Соединяющие объекты:</b> Линии со стрелками.<br>- <b>Зоны ответственности:</b> Пулы (весь процесс) и Дорожки (конкретные роли/отделы).<br>- <b>Артефакты:</b> Объекты данных, группы, текстовые аннотации."
            },
            {
                question: "Типы шлюзов (Gateway) в BPMN?",
                answer: "<h3>Шлюзы в BPMN</h3>1. <b>Exclusive (X):</b> Исключающее ИЛИ. Только один путь (Да/Нет).<br>2. <b>Parallel (+):</b> Параллельное выполнение. Все пути запускаются одновременно.<br>3. <b>Inclusive (O):</b> Включающее ИЛИ. Один или несколько путей одновременно.<br>4. <b>Event-based:</b> Выбор пути зависит от того, какое событие наступит первым."
            },
            {
                question: "События (Events) в BPMN?",
                answer: "<h3>События BPMN</h3>- <b>Стартовые:</b> Простые, по сообщению, по таймеру.<br>- <b>Промежуточные:</b> Те, что происходят внутри процесса (ожидание сообщения, таймер-пауза).<br>- <b>Конечные:</b> Завершение процесса, генерация ошибки или сообщения."
            },
            {
                question: "Виды диаграмм UML. Какими пользуешься?",
                answer: "<h3>Диаграммы UML</h3>Существует 14 видов, делятся на структурные и поведенческие.<br><b>Популярные:</b><br>- <i>Use Case:</i> Функционал системы глазами пользователя.<br>- <i>Sequence:</i> Взаимодействие систем во времени.<br>- <i>Class:</i> Структура данных и классов.<br>- <i>State Machine:</i> Жизненный цикл объекта."
            },
            {
                question: "Что такое Sequence Diagram? Что она показывает?",
                answer: "<h3>Sequence Diagram (Диаграмма последовательности)</h3>Показывает взаимодействие участников (систем, людей, БД) в хронологическом порядке.<br><b>Основные элементы:</b> Lifeline (участник), Message (стрелка вызова), Activation bar (период работы), Return message (пунктирная стрелка ответа)."
            },
            {
                question: "Что такое Use Case диаграмма и её элементы?",
                answer: "<h3>Use Case Diagram</h3>Показывает границы системы и её основной функционал.<br><b>Элементы:</b><br>- <b>Actor:</b> Человечек (роль).<br>- <b>Use Case:</b> Овал (действие).<br>- <b>System Boundary:</b> Рамка системы.<br>- <b>Связи:</b> Ассоциация, Include (обязательный подпроцесс), Extend (условный подпроцесс)."
            },
            {
                question: "Что такое ER-диаграмма? Приходилось ли строить?",
                answer: "<h3>ERD (Entity-Relationship Diagram)</h3>Диаграмма 'Сущность-Связь'. Используется для проектирования баз данных.<br>Показывает таблицы (сущности), их поля (атрибуты) и связи (1:1, 1:M, M:M).<br><b>Зачем аналитику:</b> Чтобы спроектировать модель данных для новой фичи и согласовать её с разработчиками БД."
            },

            // БЛОК 3: ИНТЕГРАЦИИ (ОБЩЕЕ)
            {
                question: "Виды/способы интеграций?",
                answer: "<h3>Способы интеграции</h3>1. <b>Файловый обмен:</b> Выгрузка CSV/XML на FTP.<br>2. <b>Общая БД:</b> Две системы работают с одной базой (плохая практика).<br>3. <b>API (Remote Procedure Call):</b> Прямые вызовы (REST, SOAP, gRPC).<br>4. <b>Шина (ESB / Messaging):</b> Очереди сообщений (Kafka, RabbitMQ)."
            },
            {
                question: "Что такое API? Для чего применяется?",
                answer: "<h3>API (Application Programming Interface)</h3>Набор правил и способов, по которым одна программа может общаться с другой.<br><b>Зачем:</b> Позволяет одной системе использовать функции другой (например, сайт использует API банка для оплаты), не зная, как этот банк написан внутри."
            },
            {
                question: "Синхронное и асинхронное взаимодействие. Разница?",
                answer: "<h3>Синхронность vs Асинхронность</h3><b>Синхронное:</b> Клиент отправил запрос и <i>ждет</i> ответа. Не может продолжать работу, пока не получит результат (REST).<br><b>Асинхронное:</b> Клиент отправил сообщение в очередь и <i>пошел дальше</i>. Ответ придет позже через callback или систему уведомлений (Kafka)."
            },
            {
                question: "JSON vs XML. В чем разница?",
                answer: "<h3>JSON vs XML</h3><b>JSON:</b> Легкий, формат 'ключ-значение'. Легко читается людьми и JS. Лидер в современных API.<br><b>XML:</b> Тяжелее, использует теги. Поддерживает строгую валидацию через XSD схемы. Часто используется в госсистемах и старых банковских протоколах (SOAP)."
            },
            {
                question: "Что такое XSD? Приходилось ли писать?",
                answer: "<h3>XSD (XML Schema Definition)</h3>Документ, описывающий структуру XML-файла. Указывает, какие теги обязательны, какие типы данных в них лежат. Нужен для <i>валидации</i> данных при передаче между системами."
            },

            // БЛОК 4: HTTP И REST API (БЛОК 3.2 С КАРТИНКИ)
            {
                question: "Что такое HTTP протокол и из чего состоит запрос?",
                answer: "<h3>HTTP Запрос</h3>Протокол передачи данных в сети.<br><b>Запрос состоит из:</b><br>1. <b>Стартовая строка:</b> Метод (GET/POST) + URL + версия протокола.<br>2. <b>Заголовки (Headers):</b> Служебная инфа (тип контента, авторизация).<br>3. <b>Тело запроса (Body):</b> Сами данные (обычно JSON)."
            },
            {
                question: "Что такое REST? Основные принципы?",
                answer: "<h3>REST (Representational State Transfer)</h3>Архитектурный стиль взаимодействия систем.<br><b>Принципы:</b><br>- <b>Stateless:</b> Сервер не хранит состояние клиента.<br>- <b>Client-Server:</b> Разделение интерфейса и данных.<br>- <b>Uniform Interface:</b> Единый формат адресов и методов.<br>- <b>Layered System:</b> Возможность использования прокси и кэша."
            },
            {
                question: "Что такое Stateless? Зачем лишать сервер состояния?",
                answer: "<h3>Stateless</h3>Сервер считает каждый запрос 'новым'. Вся информация для выполнения запроса должна быть внутри самого запроса (например, токен в заголовке).<br><b>Зачем:</b> Это позволяет легко <i>масштабировать</i> систему. Любой свободный сервер в кластере сможет обработать запрос, не спрашивая у других серверов 'кто этот клиент?'."
            },
            {
                question: "Методы HTTP (GET, POST, PUT, PATCH, DELETE)?",
                answer: "<h3>HTTP Методы</h3>- <b>GET:</b> Получение данных. Без тела.<br>- <b>POST:</b> Создание нового ресурса. Есть тело.<br>- <b>PUT:</b> Полная замена ресурса. Нужно слать весь объект.<br>- <b>PATCH:</b> Частичное обновление (только одного поля).<br>- <b>DELETE:</b> Удаление."
            },
            {
                question: "В чем разница между POST и PUT?",
                answer: "<h3>POST vs PUT</h3><b>POST:</b> Неидемпотентный. Если нажать 5 раз, создастся 5 разных заказов.<br><b>PUT:</b> Идемпотентный. Если отправить запрос 5 раз с одними и теми же данными, результат будет тот же — ресурс просто обновится до этого состояния. PUT требует передачи всего объекта целиком."
            },
            {
                question: "Коды ответов HTTP (2xx, 3xx, 4xx, 5xx)?",
                answer: "<h3>HTTP Status Codes</h3>- <b>2xx:</b> Успех (200 OK, 201 Created).<br>- <b>3xx:</b> Перенаправление (Redirect).<br>- <b>4xx:</b> Ошибка клиента (400 Bad Request, 401 Unauth, 404 Not Found).<br>- <b>5xx:</b> Ошибка сервера (500 Internal Error, 503 Service Unavailable)."
            },
            {
                question: "Что такое Идемпотентность?",
                answer: "<h3>Идемпотентность</h3>Свойство метода: сколько бы раз мы его ни вызывали, результат на сервере будет один и тот же (состояние системы не изменится после первого раза).<br><b>Идемпотентны:</b> GET, PUT, DELETE.<br><b>Не идемпотентен:</b> POST (каждый вызов создает новую запись)."
            },
            {
                question: "Авторизация vs Аутентификация?",
                answer: "<h3>Auth vs Auth</h3><b>Аутентификация:</b> Проверка, что ты — это ты (ввод логина/пароля).<br><b>Авторизация:</b> Проверка, есть ли у тебя права на это действие (например, админ ты или обычный пользователь)."
            },
            {
                question: "Как обеспечивать совместимость API? Версионирование?",
                answer: "<h3>Версионирование API</h3>Когда мы меняем логику API так, что старые клиенты могут сломаться, нужно создавать новую версию.<br><b>Способы:</b><br>- В URL: `/api/v1/users`.<br>- В заголовках: `Accept-version: v2`.<br>Это позволяет старым приложениям работать спокойно, пока все не перейдут на новую версию."
            },
            {
                question: "Что такое Swagger и OpenAPI?",
                answer: "<h3>OpenAPI & Swagger</h3><b>OpenAPI:</b> Стандарт описания REST API (в формате YAML/JSON).<br><b>Swagger:</b> Инструмент, который превращает этот стандарт в красивую веб-страницу, где можно потыкать кнопки и проверить работу методов без написания кода."
            }
        ];

        // Добавлено: остальные вопросы из предыдущего списка аналитика (стейкхолдеры, SRS и т.д.) также включены выше.
        // Всего 29 карточек на базе новых картинок + 16 из прошлых итераций.

        let currentIndex = 0;
        const cardElement = document.getElementById('card');
        const questionElement = document.getElementById('question-text');
        const answerElement = document.getElementById('answer-text');
        const progressElement = document.getElementById('progress');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateCard() {
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                questionElement.innerHTML = flashcards[currentIndex].question;
                answerElement.innerHTML = flashcards[currentIndex].answer;
                progressElement.textContent = `Карточка ${currentIndex + 1} из ${flashcards.length}`;
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === flashcards.length - 1;
                document.getElementById('answer-text').scrollTop = 0;
            }, 150);
        }

        function flipCard() {
            cardElement.classList.toggle('flipped');
        }

        function nextCard(event) {
            if (event) event.stopPropagation();
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard(event) {
            if (event) event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        updateCard();
    </script>
</body>
</html>
